<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algorithm Atlas - EN/VI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css">
  <style>
    :root {
      --bg: #f6f7f3;
      --panel: #ffffff;
      --text: #142118;
      --muted: #5a6a5f;
      --accent: #0f766e;
      --accent-2: #f59e0b;
      --border: #d8ddd6;
      --shadow: 0 12px 28px rgba(18, 43, 31, 0.09);
      --chip: #eef5f2;
      --chip-text: #1f3d2e;
      --ok: #216f3f;
      --warn: #9a4f00;
      --hero-gradient: radial-gradient(circle at 20% 10%, #d7f5e8 0%, #f8f4e4 42%, #f6f7f3 100%);
      --code-bg: #282c34;
    }

    body.dark {
      --bg: #0f1713;
      --panel: #17221c;
      --text: #eef8f1;
      --muted: #9eb6a6;
      --accent: #2dd4bf;
      --accent-2: #fbbf24;
      --border: #2a3a32;
      --shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
      --chip: #1f2d26;
      --chip-text: #d7f3e4;
      --ok: #45d483;
      --warn: #f6ab55;
      --hero-gradient: radial-gradient(circle at 20% 10%, #153228 0%, #1c212a 42%, #0f1713 100%);
      --code-bg: #000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      background: var(--hero-gradient);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .wrap {
      width: min(1180px, 94vw);
      margin: 0 auto;
      padding: 24px 0 40px;
      animation: fadeIn 0.45s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 12px;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.8vw, 2.2rem);
      letter-spacing: 0.2px;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .controls {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1.8fr 1fr 1fr auto auto;
      gap: 10px;
    }

    input, select, button {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }

    input:focus, select:focus, button:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
      outline-offset: 1px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    .section {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.5s ease;
    }

    .section h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding-left: 10px;
      border-left: 3px solid var(--accent);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section h2::after {
      content: '▾';
      font-size: 1rem;
      color: var(--muted);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .section.collapsed h2::after {
      transform: rotate(-90deg);
    }

    .section-body {
      display: grid;
      grid-template-rows: 1fr;
      overflow: hidden;
      transition: grid-template-rows 0.3s ease;
      margin-top: 16px;
    }

    .section.collapsed .section-body {
      grid-template-rows: 0fr;
      margin-top: 0;
    }

    .section-body > .section-body-inner {
      overflow: hidden;
      min-height: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.94rem;
    }

    th, td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    tbody tr:hover td {
      background: color-mix(in srgb, var(--accent) 7%, transparent);
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .table-wrap table {
      min-width: 760px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      background: var(--chip);
      color: var(--chip-text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
      margin-top: 12px;
      position: relative;
      min-width: 0;
    }

    .cards.has-maximized::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(7, 12, 25, 0.38);
      z-index: 1100;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      background: color-mix(in srgb, var(--panel) 92%, var(--accent) 8%);
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.42s forwards;
      transition: box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .card:hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.13);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    }

    .card-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      z-index: 2;
    }

    .card:hover .card-actions,
    .card.is-maximized .card-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .card-view-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--panel) 86%, var(--accent) 14%);
      border: 1px solid color-mix(in srgb, var(--border) 78%, var(--accent) 22%);
      color: var(--text);
    }

    .card-view-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card:not(.is-maximized) .btn-restore { display: none; }
    .card.is-maximized .btn-max { display: none; }

    .card.is-maximized {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 1200;
      overflow: auto;
      margin: 0;
      opacity: 1;
      transform: none;
      animation: none;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    }

    body.card-max-open { overflow: hidden; }

    .card:nth-child(2n) { animation-delay: 0.04s; }
    .card:nth-child(3n) { animation-delay: 0.07s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .card h3 {
      margin: 0;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      padding-right: 66px;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .pros-cons {
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }

    .pros, .cons {
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.84rem;
      line-height: 1.4;
    }

    .pros {
      border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent);
      background: color-mix(in srgb, var(--ok) 7%, transparent);
    }
    .cons {
      border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
      background: color-mix(in srgb, var(--warn) 7%, transparent);
    }

    .pros strong { color: var(--ok); }
    .cons strong { color: var(--warn); }

    .lang-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .code-tools {
      margin-top: 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
      min-width: 0;
    }

    #sectionCards .section-body > .section-body-inner {
      overflow-x: visible;
    }

    .lang-btn {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.76rem;
      padding: 5px 8px;
      border-radius: 8px;
    }

    .copy-btn {
      margin-left: auto;
      white-space: nowrap;
    }

    .lang-btn.active {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    .copy-btn.copied {
      background: var(--ok);
      color: #fff;
      border-color: transparent;
    }

    .copy-btn.copy-failed {
      background: var(--warn);
      color: #fff;
      border-color: transparent;
    }

    pre {
      margin: 10px 0 0;
      border-radius: 13px;
      overflow: hidden;
      line-height: 1;
    }

    pre code.hljs {
      border-radius: 13px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.79rem;
      line-height: 1.55;
      padding: 14px 16px;
      overflow-x: auto;
      display: block;
      scrollbar-width: thin;
      scrollbar-color: #4a5568 transparent;
      background-color: var(--code-bg);
    }

    pre code.hljs::-webkit-scrollbar { height: 5px; }
    pre code.hljs::-webkit-scrollbar-track { background: transparent; }
    pre code.hljs::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 99px; }

    .diagram {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: color-mix(in srgb, var(--panel) 96%, var(--accent-2) 4%);
    }

    .small {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 10px;
    }

    /* Level badges */
    .lv-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .lv-1 { background: #3b82f6; }
    .lv-2 { background: #22c55e; }
    .lv-3 { background: #f59e0b; }
    .lv-4 { background: #ef4444; }
    .lv-5 { background: #a855f7; }

    /* Roadmap chips share level-badge colors */
    .chip.lv-1 { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .chip.lv-2 { background: #22c55e; color: #fff; border-color: #22c55e; }
    .chip.lv-3 { background: #f59e0b; color: #fff; border-color: #f59e0b; }
    .chip.lv-4 { background: #ef4444; color: #fff; border-color: #ef4444; }
    .chip.lv-5 { background: #a855f7; color: #fff; border-color: #a855f7; }

    .cat-table { table-layout: auto; }
    .cat-table td { vertical-align: top; }
    .cat-chip {
      background: color-mix(in srgb, var(--accent) 18%, var(--chip) 82%);
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      white-space: nowrap;
    }
    .cat-examples { font-size: 0.82rem; color: var(--muted); font-style: italic; }
    .cat-levels { text-align: center; white-space: nowrap; font-weight: 600; font-size: 0.85rem; }

    @media (max-width: 920px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      #search { grid-column: span 2; }
    }
    @media (max-width: 760px) {
      .hero {
        position: static;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      #search { grid-column: auto; }
      #langToggle, #themeToggle {
        width: 100%;
      }
      .table-wrap table {
        min-width: 640px;
      }
      .cards {
        grid-template-columns: 1fr;
      }
      .card {
        padding: 14px;
      }
      .card h3 {
        align-items: flex-start;
        flex-direction: column;
        padding-right: 0;
      }
      .card h3 .chip {
        max-width: 100%;
        white-space: normal;
      }
      .copy-btn {
        margin-left: 0;
      }
      .code-tools {
        align-items: stretch;
      }
    }
    @media (max-width: 540px) {
      .wrap {
        width: min(1180px, 96vw);
      }
      .hero,
      .section {
        padding: 16px;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      #search { grid-column: auto; }
      #langToggle, #themeToggle { padding: 10px 8px; font-size: 0.85rem; width: 100%; }
      .cards { grid-template-columns: 1fr; }
      .table-wrap table {
        min-width: 560px;
      }
      .card.is-maximized {
        top: 8px;
        left: 8px;
        right: 8px;
        bottom: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
      <div class="controls">
        <input id="search" type="search" placeholder="Search algorithm..." />
        <select id="categoryFilter"></select>
        <select id="levelFilter"></select>
        <button id="langToggle" class="btn-primary">VI</button>
        <button id="themeToggle">Dark</button>
      </div>
    </header>

    <section class="section" id="sectionRoadmap">
      <h2 id="roadmapTitle"></h2>
      <div class="section-body"><div class="section-body-inner">
        <div class="chips" id="roadmapChips"></div>
        <p class="small" id="roadmapHint"></p>
      </div></div>
    </section>

    <section class="section" id="sectionTable">
      <h2 id="tableTitle"></h2>
      <div class="section-body"><div class="section-body-inner">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th id="thName"></th>
                <th id="thCategory"></th>
                <th id="thUse"></th>
                <th id="thComplexity"></th>
                <th id="thLevel"></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div></div>
    </section>

    <section class="section" id="categorySection">
      <h2 id="categoryTableTitle"></h2>
      <div class="section-body"><div class="section-body-inner">
        <p class="small" id="categoryTableHint"></p>
        <div id="categoryTableContainer"></div>
      </div></div>
    </section>

    <section class="section" id="sectionCards">
      <h2 id="detailTitle"></h2>
      <div class="section-body"><div class="section-body-inner">
        <div class="cards" id="cards"></div>
      </div></div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>

      {

        origin: { en: "Codility Lesson 13: Fibonacci numbers. Counts climbing ways using Fibonacci + modular bitmask trick.", vi: "Codility Bài 13: Dãy Fibonacci. Đếm cách leo cầu thang dùng Fibonacci và mặt nạ bit modulo." },
        how: { en: "Ways to climb N steps = Fib(N+1). Precompute Fibonacci mod 2^max(B) and answer each query with Fib(A[i]+1) & ((1<<B[i])-1).", vi: "Số cách leo N bậc = Fib(N+1). Tính trước Fibonacci mod 2^max(B), trả lời mỗi truy vấn bằng Fib(A[i]+1) & ((1<<B[i])-1)." },
        when: { en: "Answer many queries on Fibonacci-based climbing counts with modular constraints.", vi: "Trả lời nhiều truy vấn đếm cách leo cầu thang theo kiểu Fibonacci có ràng buộc modulo." },
        pros: { en: "O(L + n) after precomputing Fibonacci up to max A.", vi: "O(L + n) sau khi tính trước Fibonacci đến max A." },
        cons: { en: "Modulo must be per-query power of 2; precompute with max modulo then mask.", vi: "Modulo là lũy thừa của 2 riêng từng truy vấn; tính trước với modulo lớn nhất rồi lấy mặt nạ." },
        time: "O(L + n)", space: "O(L)",
        diagram: null,
        code: {
          "C#": `int[] Ladder(int[] A,int[] B){int maxA=A.Max(),maxB=B.Max();long mod=1L<<maxB;long[] fib=new long[maxA+2];fib[0]=1;fib[1]=1;for(int i=2;i<=maxA+1;i++)fib[i]=(fib[i-1]+fib[i-2])%mod;int[] res=new int[A.Length];for(int i=0;i<A.Length;i++)res[i]=(int)(fib[A[i]]&((1L<<B[i])-1));return res;}`,
          "Python": `def ladder(A,B):\n    maxA,maxB=max(A),max(B); mod=1<<maxB\n    fib=[0]*(maxA+2); fib[0]=fib[1]=1\n    for i in range(2,maxA+2): fib[i]=(fib[i-1]+fib[i-2])%mod\n    return [fib[a]&((1<<b)-1) for a,b in zip(A,B)]`,
          "Go": `func Ladder(A,B []int) []int { maxA,maxB:=0,0; for _,v:=range A{if v>maxA{maxA=v}}; for _,v:=range B{if v>maxB{maxB=v}}; mod:=int64(1)<<maxB; fib:=make([]int64,maxA+2); fib[0],fib[1]=1,1; for i:=2;i<=maxA+1;i++{fib[i]=(fib[i-1]+fib[i-2])%mod}; res:=make([]int,len(A)); for i:=range A{res[i]=int(fib[A[i]]&((1<<B[i])-1))}; return res }`,
          "Rust": `fn ladder(a:&[usize],b:&[usize])->Vec<u64>{let max_a=*a.iter().max().unwrap();let max_b=*b.iter().max().unwrap();let md:u64=1<<max_b;let mut fib=vec![0u64;max_a+2];fib[0]=1;fib[1]=1;for i in 2..=max_a+1{fib[i]=(fib[i-1]+fib[i-2])%md;}a.iter().zip(b.iter()).map(|(&ai,&bi)|fib[ai]&((1<<bi)-1)).collect()}`,
          "Java": `static int[] ladder(int[] A,int[] B){int maxA=0,maxB=0;for(int v:A)maxA=Math.max(maxA,v);for(int v:B)maxB=Math.max(maxB,v);long mod=1L<<maxB;long[] fib=new long[maxA+2];fib[0]=fib[1]=1;for(int i=2;i<=maxA+1;i++)fib[i]=(fib[i-1]+fib[i-2])%mod;int[] res=new int[A.length];for(int i=0;i<A.length;i++)res[i]=(int)(fib[A[i]]&((1L<<B[i])-1));return res;}`,
          "JavaScript": `function ladder(A,B){const maxA=Math.max(...A),maxB=Math.max(...B);const mod=1<<maxB;const fib=new Array(maxA+2);fib[0]=fib[1]=1;for(let i=2;i<=maxA+1;i++)fib[i]=(fib[i-1]+fib[i-2])&(mod-1);return A.map((a,i)=>fib[a]&((1<<B[i])-1));}`,
          "C++": `vector<int> ladder(const vector<int>& A,const vector<int>& B){int maxA=*max_element(A.begin(),A.end()),maxB=*max_element(B.begin(),B.end());long long mod=1LL<<maxB;vector<long long>fib(maxA+2);fib[0]=fib[1]=1;for(int i=2;i<=maxA+1;i++)fib[i]=(fib[i-1]+fib[i-2])%mod;vector<int>res(A.size());for(int i=0;i<(int)A.size();i++)res[i]=(int)(fib[A[i]]&((1LL<<B[i])-1));return res;}`
        }

      {
        id: "peaks",

        name: { en: "Peaks", vi: "Đỉnh" },
        origin: { en: "Codility Lesson 10: Prime and composite numbers / Peaks. Partition an array into equal-length blocks each containing at least one peak.", vi: "Codility Bài 10. Phân mảng thành các khối bằng nhau, mỗi khối chứa ít nhất một đỉnh." },
        how: { en: "Collect peak positions. For each divisor k of n (descending), check if all k blocks of length n/k each contain a peak using prefix peak counts.", vi: "Thu thập vị trí đỉnh. Với mỗi ước k của n (giảm dần), kiểm tra nếu k khối dài n/k đều chứa ít nhất một đỉnh bằng tiền tố đếm đỉnh." },
        when: { en: "Partition a sequence into equal groups each guaranteed to contain a local peak.", vi: "Phân dãy thành nhóm bằng nhau, mỗi nhóm đảm bảo có đỉnh nội bộ." },
        pros: { en: "O(n log log n); divisor enumeration keeps it fast.", vi: "O(n log log n); liệt kê ước giữ tốc độ cao." },
        cons: { en: "Non-trivial to identify divisors and map blocks to prefix arrays.", vi: "Không tầm thường khi liên kết ước số với mảng tiền tố." },
        time: "O(n log log n)", space: "O(n)",
        diagram: null,
        code: {
          "C#": `int Peaks(int[] A){int n=A.Length;List<int> peaks=new();for(int i=1;i<n-1;i++)if(A[i]>A[i-1]&&A[i]>A[i+1])peaks.Add(i);if(peaks.Count==0)return 0;int[]prefix=new int[n+1];int p=0;for(int i=0;i<n;i++){if(p<peaks.Count&&peaks[p]==i)p++;prefix[i+1]=p;}for(int k=peaks.Count;k>=1;k--){if(n%k!=0)continue;int sz=n/k;bool ok=true;for(int b=0;b<k;b++)if(prefix[b*sz+sz]-prefix[b*sz]==0){ok=false;break;}if(ok)return k;}return 0;}`,
          "Python": `def peaks(A):\n    n=len(A); pk=[i for i in range(1,n-1) if A[i]>A[i-1] and A[i]>A[i+1]]\n    if not pk: return 0\n    pre=[0]*(n+1)\n    j=0\n    for i in range(n):\n        if j<len(pk) and pk[j]==i: j+=1\n        pre[i+1]=j\n    for k in range(len(pk),0,-1):\n        if n%k: continue\n        sz=n//k\n        if all(pre[b*sz+sz]-pre[b*sz]>0 for b in range(k)): return k\n    return 0`,
          "Go": `func Peaks(A []int) int { n:=len(A); var pks []int; for i:=1;i<n-1;i++{if A[i]>A[i-1]&&A[i]>A[i+1]{pks=append(pks,i)}}; if len(pks)==0{return 0}; pre:=make([]int,n+1); j:=0; for i:=0;i<n;i++{if j<len(pks)&&pks[j]==i{j++}; pre[i+1]=j}; for k:=len(pks);k>=1;k--{if n%k!=0{continue}; sz:=n/k; ok:=true; for b:=0;b<k;b++{if pre[b*sz+sz]-pre[b*sz]==0{ok=false;break}}; if ok{return k}}; return 0 }`,
          "Rust": `fn peaks(a:&[i32])->usize{let n=a.len();let pks:Vec<usize>=(1..n-1).filter(|&i|a[i]>a[i-1]&&a[i]>a[i+1]).collect();if pks.is_empty(){return 0}let mut pre=vec![0usize;n+1];let mut j=0;for i in 0..n{if j<pks.len()&&pks[j]==i{j+=1}pre[i+1]=j;}for k in (1..=pks.len()).rev(){if n%k!=0{continue}let sz=n/k;if(0..k).all(|b|pre[b*sz+sz]-pre[b*sz]>0){return k}}0}`,
          "Java": `static int peaks(int[] A){int n=A.length;List<Integer>pks=new ArrayList<>();for(int i=1;i<n-1;i++)if(A[i]>A[i-1]&&A[i]>A[i+1])pks.add(i);if(pks.isEmpty())return 0;int[]pre=new int[n+1];int j=0;for(int i=0;i<n;i++){if(j<pks.size()&&pks.get(j)==i)j++;pre[i+1]=j;}for(int k=pks.size();k>=1;k--){if(n%k!=0)continue;int sz=n/k;boolean ok=true;for(int b=0;b<k;b++)if(pre[b*sz+sz]-pre[b*sz]==0){ok=false;break;}if(ok)return k;}return 0;}`,
          "JavaScript": `function peaks(A){const n=A.length;const pks=[];for(let i=1;i<n-1;i++)if(A[i]>A[i-1]&&A[i]>A[i+1])pks.push(i);if(!pks.length)return 0;const pre=new Int32Array(n+1);let j=0;for(let i=0;i<n;i++){if(j<pks.length&&pks[j]===i)j++;pre[i+1]=j;}for(let k=pks.length;k>=1;k--){if(n%k)continue;const sz=n/k;let ok=true;for(let b=0;b<k;b++)if(pre[b*sz+sz]-pre[b*sz]===0){ok=false;break;}if(ok)return k;}return 0;}`,
          "C++": `int peaks(const vector<int>& A){int n=A.size();vector<int>pks;for(int i=1;i<n-1;i++)if(A[i]>A[i-1]&&A[i]>A[i+1])pks.push_back(i);if(pks.empty())return 0;vector<int>pre(n+1);int j=0;for(int i=0;i<n;i++){if(j<(int)pks.size()&&pks[j]==i)j++;pre[i+1]=j;}for(int k=(int)pks.size();k>=1;k--){if(n%k)continue;int sz=n/k;bool ok=true;for(int b=0;b<k;b++)if(pre[b*sz+sz]-pre[b*sz]==0){ok=false;break;}if(ok)return k;}return 0;}`
        }

      {

        how: { en: "First collect peaks. The answer ≤ √(n). For each candidate k from √n down to 1, greedily place flags on peaks spaced ≥ k apart and check if ≥ k flags fit.", vi: "Thu thập đỉnh. Đáp án ≤ √n. Với mỗi ứng viên k từ √n xuống 1, tham lam đặt cờ trên các đỉnh cách nhau ≥ k và kiểm tra nếu đặt được ≥ k cờ." },
        when: { en: "Maximize the number of evenly-spaced flags on local peaks.", vi: "Tối đa hóa số cờ đặt trên các đỉnh cục bộ với khoảng cách đều." },
        pros: { en: "O(√n · √n) = O(n); elegant bound on answer.", vi: "O(√n · √n) = O(n); chặn đẹp cho đáp án." },
        cons: { en: "Requires peak precomputation and careful greedy simulation.", vi: "Cần tính trước đỉnh và mô phỏng tham lam cẩn thận." },
        time: "O(n)", space: "O(n)",
        diagram: null,
        code: {
          "C#": `int Flags(int[] A){int n=A.Length;List<int>pks=new();for(int i=1;i<n-1;i++)if(A[i]>A[i-1]&&A[i]>A[i+1])pks.Add(i);if(pks.Count<2)return pks.Count;int maxK=(int)Math.Sqrt(n)+2,best=1;for(int k=maxK;k>=1;k--){int cnt=1,last=pks[0];for(int i=1;i<pks.Count&&cnt<k;i++)if(pks[i]-last>=k){cnt++;last=pks[i];}if(cnt>=k){best=k;break;}}return best;}`,
          "Python": `def flags(A):\n    n=len(A); pks=[i for i in range(1,n-1) if A[i]>A[i-1] and A[i]>A[i+1]]\n    if len(pks)<2: return len(pks)\n    best=1\n    for k in range(int(n**0.5)+2,0,-1):\n        cnt,last=1,pks[0]\n        for p in pks[1:]:\n            if cnt>=k: break\n            if p-last>=k: cnt+=1; last=p\n        if cnt>=k: best=k; break\n    return best`,
          "Go": `func Flags(A []int) int { n:=len(A); var pks []int; for i:=1;i<n-1;i++{if A[i]>A[i-1]&&A[i]>A[i+1]{pks=append(pks,i)}}; if len(pks)<2{return len(pks)}; maxK:=int(math.Sqrt(float64(n)))+2; best:=1; for k:=maxK;k>=1;k--{cnt,last:=1,pks[0]; for _,p:=range pks[1:]{if cnt>=k{break}; if p-last>=k{cnt++;last=p}}; if cnt>=k{best=k;break}}; return best }`,
          "Rust": `fn flags(a:&[i32])->usize{let n=a.len();let pks:Vec<usize>=(1..n-1).filter(|&i|a[i]>a[i-1]&&a[i]>a[i+1]).collect();if pks.len()<2{return pks.len()}let max_k=(n as f64).sqrt() as usize+2;for k in (1..=max_k).rev(){let(mut cnt,mut last)=(1,pks[0]);for &p in &pks[1..]{if cnt>=k{break}if p-last>=k{cnt+=1;last=p;}}if cnt>=k{return k}}1}`,

    /**
     * Reformat compact single-line C-style code into readable multi-line form.
     * Python strings already contain \n so they are passed through unchanged.
     */
    function prettyCode(lang, src) {
      if (!src) return '';
      if (lang === 'Python') return src;

      let out = '';
      let indent = 0;
      let paren = 0; // paren/bracket depth — suppresses ; breaks inside for(;;)
      let i = 0;
      const pad = () => '  '.repeat(Math.max(0, indent));

      function nl() {
        out = out.trimEnd();
        out += '\n' + pad();
      }

      while (i < src.length) {
        const c = src[i];

        // Double-quoted strings — consume as opaque
        if (c === '"') {
          out += c; i++;
          while (i < src.length && src[i] !== '"') {
            if (src[i] === '\\') { out += src[i++]; }
            if (i < src.length) out += src[i++];
          }
          if (i < src.length) { out += '"'; i++; }
          continue;
        }

        // Backtick strings (Go raw literals, JS template literals)
        if (c === '`') {
          out += c; i++;
          while (i < src.length && src[i] !== '`') out += src[i++];
          if (i < src.length) { out += '`'; i++; }
          continue;
        }

        // Single-quoted strings / char literals (handles Rust conservatively)
        if (c === "'") {
          out += c; i++;
          while (i < src.length && src[i] !== "'" && src[i] !== '\n') {
            if (src[i] === '\\') { out += src[i++]; }
            if (i < src.length) out += src[i++];
          }
          if (i < src.length && src[i] === "'") { out += "'"; i++; }
          continue;
        }

        // Track parenthesis/bracket depth to avoid splitting for(;;) on ;
        if (c === '(' || c === '[') { paren++; out += c; i++; continue; }
        if (c === ')' || c === ']') { paren = Math.max(0, paren - 1); out += c; i++; continue; }

        // Open brace — indent and newline
        if (c === '{') {
          if (out.length && !/[\s\n({]$/.test(out)) out += ' ';
          out += '{';
          indent++;
          nl();
          while (i + 1 < src.length && src[i + 1] === ' ') i++; // skip leading space
          i++; continue;
        }

        // Close brace — unindent and newline
        if (c === '}') {
          indent = Math.max(0, indent - 1);
          nl();
          out += '}';
          // Absorb trailing ; or ,
          if (i + 1 < src.length && (src[i + 1] === ';' || src[i + 1] === ',')) {
            out += src[++i];
          }
          // Peek ahead for else / catch / finally / do-while
          let j = i + 1;
          while (j < src.length && src[j] === ' ') j++;
          if (/^(else|catch|finally|while[ (])/.test(src.slice(j))) {
            out += ' ';
            i = j - 1; // after i++ we land on first char of keyword
          } else {
            nl();
          }
          i++; continue;
        }

        // Semicolon at statement level — add newline
        if (c === ';' && paren === 0) {
          out += ';';
          if (i + 1 < src.length) nl();
          i++; continue;
        }

        // Whitespace normalisation — collapse to single space, never after newline
        if (c === ' ' || c === '\t') {
          const last = out[out.length - 1];
          if (last && last !== '\n' && last !== ' ') out += ' ';
          i++; continue;
        }

        if (c === '\n') { nl(); i++; continue; }

        out += c;
        i++;
      }

      // Final cleanup
      return out
        .split('\n')
        .map(l => l.trimEnd())
        .filter((l, k, a) => !(
          l.trim() === '' && (k === 0 || k === a.length - 1 || a[k - 1].trim() === '')
        ))
        .join('\n')
        .trim();
    }

          const lang = btn.dataset.lang;
          state.codeLang[algoId] = lang;
          const algo = algorithms.find(x => x.id === algoId);
          const card = btn.closest(".card");
          card.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const codeEl = card.querySelector("code");
          // Re-format and re-highlight for the new language
          codeEl.removeAttribute("data-highlighted");
          codeEl.className = `language-${hljsLang[lang] || 'plaintext'}`;
          codeEl.textContent = prettyCode(lang, algo.code[lang]);
          window.hljs.highlightElement(codeEl);
        });
      });
    }

    async function copyText(value) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
          return true;
        }
      } catch {}

      try {
        const ta = document.createElement("textarea");
        ta.value = value;
        ta.setAttribute("readonly", "");
        ta.style.position = "absolute";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch {
        return false;
      }
    }

    function bindCopyButtons() {
      els.cards.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const card = btn.closest(".card");
          const codeEl = card?.querySelector("code");
          if (!codeEl) return;

          const ok = await copyText(codeEl.textContent || "");
          btn.textContent = ok ? text("copied") : text("copyFailed");
          btn.classList.toggle("copied", ok);
          btn.classList.toggle("copy-failed", !ok);

          clearTimeout(btn._copyTimer);
          btn._copyTimer = setTimeout(() => {
            btn.textContent = text("copy");
            btn.classList.remove("copied", "copy-failed");
          }, 1200);
        });
      });
    }

    function applyCardViewState() {
      const hasMax = !!state.maximizedCardId;
      const activeCard = hasMax
        ? els.cards.querySelector(`.card[data-id="${state.maximizedCardId}"]`)
        : null;

      if (hasMax && !activeCard) {
        state.maximizedCardId = null;
      }

      const enabled = !!state.maximizedCardId;
      els.cards.classList.toggle("has-maximized", enabled);
      document.body.classList.toggle("card-max-open", enabled);

      els.cards.querySelectorAll(".card").forEach(card => {
        card.classList.toggle("is-maximized", enabled && card.dataset.id === state.maximizedCardId);
      });
    }

    function bindCardViewButtons() {
      els.cards.querySelectorAll(".btn-max").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          state.maximizedCardId = btn.dataset.algo;
          applyCardViewState();
        });
      });

      els.cards.querySelectorAll(".btn-restore").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          state.maximizedCardId = null;
          applyCardViewState();
        });
      });
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && state.maximizedCardId) {
        state.maximizedCardId = null;
        applyCardViewState();
      }
    });

    // --- Collapsible sections ---
    const COLLAPSE_KEY = "atlas-collapsed";

    function loadCollapseState() {
      try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || []); }
      catch { return new Set(); }
    }

    function saveCollapseState(collapsed) {
      localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsed]));
    }

    const collapsedSections = loadCollapseState();

    function bindCollapsible() {
      const sectionIds = ["sectionRoadmap", "sectionTable", "categorySection", "sectionCards"];
      for (const id of sectionIds) {
        const sec = document.getElementById(id);
        if (!sec) continue;
        const h2 = sec.querySelector("h2");
        if (!h2) continue;

        // Restore saved state
        if (collapsedSections.has(id)) {
          sec.classList.add("collapsed");
        } else {
          sec.classList.remove("collapsed");
        }

        // Remove any previously-attached listener to avoid stacking on re-renders
        const handler = () => {
          sec.classList.toggle("collapsed");
          if (sec.classList.contains("collapsed")) {
            collapsedSections.add(id);
          } else {
            collapsedSections.delete(id);
          }
          saveCollapseState(collapsedSections);
        };
        h2.onclick = handler;
      }
    }

    async function renderAll() {
      renderHeaders();
      renderFilters();
      renderRoadmap();
      const items = filteredAlgorithms();
      renderTable(items);
      renderCategoryTable(items);
      await renderCards(items);
      bindCollapsible();
    }

    els.search.addEventListener("input", async e => {
      state.search = e.target.value;
      await renderAll();
    });

    els.categoryFilter.addEventListener("change", async e => {
      state.category = e.target.value;
      await renderAll();
    });

    els.levelFilter.addEventListener("change", async e => {
      state.level = e.target.value;
      await renderAll();
    });

    els.langToggle.addEventListener("click", async () => {
      state.locale = state.locale === "en" ? "vi" : "en";
      await renderAll();
    });

    els.themeToggle.addEventListener("click", async () => {
      state.dark = !state.dark;
      document.body.classList.toggle("dark", state.dark);
      await renderAll();
    });

    renderAll();
  </script>
</body>
