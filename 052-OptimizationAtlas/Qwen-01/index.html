<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPOT Collection | Memory & Performance Optimization</title>
  <style>
    :root {
      --bg: #f8f9fa; --surface: #ffffff; --text: #1a1a1a; --text-muted: #6c757d;
      --primary: #0d6efd; --border: #dee2e6; --code-bg: #f4f4f5;
      --success: #198754; --warning: #ffc107; --danger: #dc3545;
      --shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    [data-theme="dark"] {
      --bg: #0d1117; --surface: #161b22; --text: #e6edf3; --text-muted: #8b949e;
      --primary: #58a6ff; --border: #30363d; --code-bg: #0d1117;
      --shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; transition: background 0.3s, color 0.3s; }
    header { padding: 1rem; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.4rem; }
    .controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    button, input { padding: 0.5rem 0.75rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 0.375rem; cursor: pointer; font-size: 0.9rem; }
    button:hover, input:focus { border-color: var(--primary); outline: none; }
    .search { flex: 1; min-width: 200px; max-width: 400px; }
    nav { display: flex; gap: 0.5rem; padding: 1rem; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
    .tab { padding: 0.5rem 1rem; border: 1px solid transparent; border-radius: 0.375rem; cursor: pointer; background: transparent; font-weight: 500; }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    main { max-width: 1400px; margin: 0 auto; padding: 1rem; }
    .content-panel { display: none; }
    .content-panel.active { display: block; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); box-shadow: var(--shadow); border-radius: 0.5rem; overflow: hidden; font-size: 0.9rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: color-mix(in srgb, var(--primary) 10%, var(--surface)); font-weight: 600; position: sticky; top: 0; }
    tr:hover { background: color-mix(in srgb, var(--primary) 5%, var(--surface)); }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--warning); color: #000; }
    .badge.basic { background: #d1e7dd; color: #0f5132; }
    .badge.intermediate { background: #fff3cd; color: #664d03; }
    .badge.advanced { background: #f8d7da; color: #842029; }
    .mpot-card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .mpot-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
    .code-block { background: var(--code-bg); border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.5rem; margin: 0.5rem 0; font-family: ui-monospace, monospace; font-size: 0.85rem; overflow-x: auto; white-space: pre; }
    .lang-tag { color: var(--primary); font-weight: bold; margin-right: 0.25rem; }
    .hidden { display: none !important; }
    .mermaid-container { margin: 1rem 0; text-align: center; }
    footer { text-align: center; padding: 1rem; color: var(--text-muted); font-size: 0.8rem; margin-top: 2rem; }
    @media (max-width: 768px) { table { display: block; overflow-x: auto; } }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="title">MPOT Collection</h1>
    <div class="controls">
      <input type="text" class="search" id="search" data-i18n-placeholder="search_ph" placeholder="Search techniques, concepts...">
      <button id="lang-toggle">🇬🇧 / 🇻🇳</button>
      <button id="theme-toggle">🌗 Theme</button>
    </div>
  </header>

  <nav id="tabs"></nav>
  <main id="app"></main>
  <footer>MPOT Reference Collection • Data-driven & Extensible Architecture</footer>

  <!-- ================= RENDERING LOGIC ================= -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script id="renderer">
    (function() {
      const state = { lang: 'en', theme: 'light', tab: 0, filter: '' };
      const $ = sel => document.querySelector(sel);
      const $$ = sel => document.querySelectorAll(sel);
      const data = window.MPOT_DATA;

      // I18N & Theme
      function applyLang() {
        const t = data.i18n[state.lang];
        document.documentElement.lang = state.lang;
        $$('#app *').forEach(el => { if(el.dataset.i18n) el.textContent = t[el.dataset.i18n]; if(el.dataset.i18nPh) el.placeholder = t[el.dataset.i18nPh]; });
        renderTabs();
        renderActiveTab();
      }

      function toggleTheme() {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = state.theme;
      }

      function toggleLang() { state.lang = state.lang === 'en' ? 'vi' : 'en'; applyLang(); }

      // Tabs
      function renderTabs() {
        const t = data.i18n[state.lang].tabs;
        $('#tabs').innerHTML = t.map((name, i) => `<button class="tab ${i===state.tab?'active':''}" data-tab="${i}">${name}</button>`).join('');
        $('#tabs').onclick = e => {
          if(!e.target.dataset.tab) return;
          state.tab = +e.target.dataset.tab;
          renderTabs(); renderActiveTab();
        };
      }

      function renderActiveTab() {
        $$('main > section').forEach(s => s.classList.remove('active'));
        const panels = ['overview', 'mpots', 'blocks', 'langcomp', 'toolcomp'];
        let sec = $(`#${panels[state.tab]}`);
        if(!sec) {
          sec = document.createElement('section');
          sec.id = panels[state.tab];
          sec.className = 'content-panel active';
          $('main').appendChild(sec);
        } else {
          sec.classList.add('active');
        }
        renderTabContent(state.tab, sec);
      }

      // Tables & Cards Generator
      function filterRows(arr, term) {
        if(!term) return arr;
        const t = term.toLowerCase();
        return arr.filter(o => JSON.stringify(o).toLowerCase().includes(t));
      }

      function renderTable(container, headers, rows) {
        let h = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
        h += rows.map(r => '<tr>' + r.map(c => `<td>${c || '-'}</td>`).join('') + '</tr>').join('');
        h += '</tbody>';
        container.innerHTML = `<table>${h}</table>`;
      }

      function renderTabContent(idx, container) {
        const t = data.i18n[state.lang].th;
        const th = [t.id, t.name, t.complexity];
        const filter = state.filter;
        let html = '';

        if(idx === 0) { // Overview Comparison
          const mpots = filterRows(data.mpots, filter).sort((a,b)=>a.complexity-b.complexity);
          const rows = mpots.map(m => [
            m.id,
            m.name[state.lang],
            `<span class="badge ${m.complexity===1?'basic':m.complexity===2?'intermediate':'advanced'}">${data.i18n[state.lang].complexity[m.complexity-1]}</span>`
          ]);
          renderTable(container, th, rows);
        }
        else if(idx === 1) { // MPOT Details
          const mpots = filterRows(data.mpots, filter).sort((a,b)=>a.complexity-b.complexity);
          container.innerHTML = '';
          mpots.forEach(m => {
            const div = document.createElement('div'); div.className = 'mpot-card';
            const examplesHtml = ['cs','py','go','rs','java','js','cpp'].map(lang => 
              `<div class="code-block"><span class="lang-tag">[${lang.toUpperCase()}]</span>${m.impl[lang]}</div>`
            ).join('');
            const mermaidId = `mermaid-${m.id}-${idx}`;
            div.innerHTML = `
              <div class="mpot-header"><h2>${m.name[state.lang]}</h2><span class="badge ${m.complexity===1?'basic':m.complexity===2?'intermediate':'advanced'}">${data.i18n[state.lang].complexity[m.complexity-1]}</span></div>
              <p><b>${t.origin}:</b> ${m.origin}</p>
              <p><b>${t.usage}:</b> ${m.usage}</p>
              <p><b>${t.complexity}:</b> ${m.complexity_analysis}</p>
              <p><b>${t.pros}:</b> ${m.pros}</p>
              <p><b>${t.cons}:</b> ${m.cons}</p>
              <div class="mermaid-container" id="${mermaidId}"></div>
              <h3>${t.examples}</h3>${examplesHtml}
            `;
            container.appendChild(div);
            mermaid.render('svg-'+mermaidId, m.mermaid).then(({svg}) => { $(`#${mermaidId}`).innerHTML = svg; }).catch(e => { $(`#${mermaidId}`).innerHTML = `<small>Diagram parse error</small>`; });
          });
        }
        else if(idx === 2) { // Blocks
          const blocks = filterRows(data.blocks, filter);
          const rows = blocks.map(b => [
            b.id, b.name[state.lang], b.origin,
            `${b.how} | ${b.pros} | ${b.cons}`,
            b.complexity
          ]);
          renderTable(container, [t.id, t.name, t.origin, `${t.how} / ${t.pros} / ${t.cons}`, t.complexity], rows);
        }
        else if(idx === 3) { // Lang Comp
          const mpots = filterRows(data.mpots, filter).sort((a,b)=>a.complexity-b.complexity);
          const langs = ['cs','py','go','rs','java','js','cpp'];
          const headers = [t.id, t.name, ...langs.map(l=>l.toUpperCase())];
          const rows = mpots.map(m => [m.id, m.name[state.lang], ...langs.map(l => m.comp[l])]);
          renderTable(container, headers, rows);
        }
        else if(idx === 4) { // Tool Comp
          const blocks = filterRows(data.blocks, filter);
          const headers = [t.id, t.name, "C#", "Python", "Go", "Rust", "Java", "JS", "C++"];
          const impls = { gc_gen:["Generational GC","gc / gc.disable","GOGC","bump/typed-arena (manual)","HotSpot G1/ZGC/Shenandoah","V8 Orinoco/Generational","custom/BDWGC"], cache_line:["Align(64)/Padding","__attribute__((aligned(64)))","runtime/internal/sys.CachelinePad","#[repr(align(64))]","@Contended / JOL","Align(64) padding","alignas(64) std::vector"], jit_pgo:["Tiered JIT/PGO","PyPy JIT / Numba","go build -buildmode=plugin","-C opt-level=3 -C target-cpu=native","-XX:+UseJIT","V8 TurboFan/PGO","clang -flto -fprofile-generate"], mem_align:["struct layout","struct.pack('P',...)", "unsafe.Alignof","#![repr(C, align)]","Unsafe.allocateMemory/align","new ArrayBuffer(n, align)","alignas(16) struct"], lazy_eval:["IEnumerable/Yield","Generators/itertools","Channels/iter","Iterators/Streams","java.util.stream.Stream","Iterators/generators","std::ranges / coroutines"]};
          const rows = blocks.map(b => {
            const key = b.id;
            return [b.id, b.name[state.lang], ...(impls[key] || Array(7).fill(t.none))];
          });
          renderTable(container, headers, rows);
        }
      }

      // Search
      $('#search').addEventListener('input', e => {
        state.filter = e.target.value.trim();
        renderActiveTab();
      });

      // Init
      mermaid.initialize({ startOnLoad: false, theme: state.theme === 'dark' ? 'dark' : 'default' });
      $('#theme-toggle').onclick = toggleTheme;
      $('#lang-toggle').onclick = toggleLang;
      applyLang();
    })();
  </script>
</body>
</html>
