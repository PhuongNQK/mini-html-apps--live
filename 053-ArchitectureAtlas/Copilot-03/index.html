<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Architecture Atlas — AA Reference for C#, Python, Go, Rust, Java, JS, C++</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
:root{
  --bg:#f4f6f2;--panel:#ffffff;--text:#121f16;--muted:#5a6b5e;
  --accent:#0f766e;--accent2:#f59e0b;--accent3:#6366f1;
  --border:#d5dbd2;--shadow:0 10px 28px rgba(10,35,20,.08);
  --chip:#edf3eb;--chip-text:#1e3d28;
  --ok:#166534;--warn:#9a4f00;--danger:#9b1c1c;
  --code-bg:#282c34;--hero-grad:radial-gradient(circle at 18% 8%,#d4f5e4 0%,#f0ede4 42%,#f4f6f2 100%);
  --tag-bg:#e0f2fe;--tag-text:#0369a1;
  --radius:14px;--radius-sm:8px;
}
body.dark{
  --bg:#0e1712;--panel:#162019;--text:#eaf3ec;--muted:#8fad9a;
  --accent:#2dd4bf;--accent2:#fbbf24;--accent3:#818cf8;
  --border:#243229;--shadow:0 12px 32px rgba(0,0,0,.4);
  --chip:#1c2e22;--chip-text:#c9edda;
  --ok:#4ade80;--warn:#f6ab55;--danger:#f87171;
  --code-bg:#0d1117;--hero-grad:radial-gradient(circle at 18% 8%,#132e1e 0%,#1b202b 42%,#0e1712 100%);
  --tag-bg:#1e3a5f;--tag-text:#7dd3fc;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Space Grotesk",sans-serif;background:var(--hero-grad);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
a{color:var(--accent);text-decoration:none}
code,pre{font-family:"IBM Plex Mono",monospace}

/* ── Layout ── */
.wrap{width:min(1220px,95vw);margin:0 auto;padding:20px 0 60px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── Sticky header ── */
.header{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 24px;
  box-shadow:var(--shadow);position:sticky;top:10px;z-index:100;backdrop-filter:blur(8px)}
.header-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:1.25rem;font-weight:700;color:var(--accent);white-space:nowrap}
.logo span{color:var(--accent2)}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:420px}
.search-wrap input{width:100%;padding:8px 36px 8px 14px;border:1.5px solid var(--border);border-radius:40px;
  background:var(--bg);color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;
  color:var(--muted);font-size:1rem;display:none}
.header-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 14px;border:1.5px solid var(--border);border-radius:40px;background:var(--chip);
  color:var(--chip-text);font-size:.83rem;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap}
.btn:hover,.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-icon{padding:7px 10px}

/* ── Filter bar ── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.filter-label{font-size:.8rem;color:var(--muted);align-self:center;white-space:nowrap}
.chip{padding:4px 12px;border-radius:20px;background:var(--chip);color:var(--chip-text);
  font-size:.78rem;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Nav tabs ── */
.nav-tabs{display:flex;gap:4px;margin:18px 0 0;flex-wrap:wrap}
.nav-tab{padding:9px 18px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--panel);
  border:1px solid var(--border);border-bottom:none;cursor:pointer;font-size:.88rem;font-weight:600;
  color:var(--muted);transition:all .18s}
.nav-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-content{display:none;background:var(--panel);border:1px solid var(--border);border-radius:0 var(--radius) var(--radius) var(--radius);
  padding:24px;box-shadow:var(--shadow)}
.tab-content.active{display:block;animation:fadeIn .3s ease}

/* ── Section ── */
.section{margin-bottom:24px}
.section-title{font-size:1.05rem;font-weight:700;color:var(--accent);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.section-title .caret{transition:transform .2s;font-size:.8rem}
.section-title.collapsed .caret{transform:rotate(-90deg)}
.section-body{transition:all .2s}
.section-body.collapsed{display:none}

/* ── Cards ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(0,0,0,.12)}
.card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-icon{width:38px;height:38px;border-radius:10px;background:var(--chip);display:flex;
  align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.card-title{font-size:1rem;font-weight:700;line-height:1.3}
.card-subtitle{font-size:.8rem;color:var(--muted);margin-top:2px}
.card-desc{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:10px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:3px 9px;border-radius:20px;background:var(--tag-bg);color:var(--tag-text);font-size:.72rem;font-weight:600}
.tag.level-foundational{background:#dcfce7;color:#166534}
.tag.level-intermediate{background:#fef9c3;color:#854d0e}
.tag.level-advanced{background:#fee2e2;color:#9b1c1c}
body.dark .tag.level-foundational{background:#14532d;color:#86efac}
body.dark .tag.level-intermediate{background:#431407;color:#fed7aa}
body.dark .tag.level-advanced{background:#450a0a;color:#fca5a5}

/* ── Detail modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;
  align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;animation:fadeIn .2s}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  width:min(900px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;
  background:var(--panel);border-radius:var(--radius) var(--radius) 0 0;z-index:10}
.modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);
  line-height:1;padding:4px;border-radius:6px;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px;max-height:80vh;overflow-y:auto}

/* ── Detail sections ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:640px){.detail-grid{grid-template-columns:1fr}}
.detail-box{background:var(--chip);border-radius:var(--radius-sm);padding:14px}
.detail-box h4{font-size:.82rem;font-weight:700;color:var(--accent);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:8px}
.detail-box p,.detail-box li{font-size:.875rem;color:var(--text);line-height:1.7}
.detail-box ul{padding-left:16px}

/* ── SPAMF bars ── */
.spamf-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
@media(max-width:600px){.spamf-grid{grid-template-columns:1fr 1fr}}
.spamf-item{background:var(--chip);border-radius:var(--radius-sm);padding:12px;text-align:center}
.spamf-label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.spamf-score{font-size:1.4rem;font-weight:700}
.spamf-bar{height:5px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden}
.spamf-bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .5s ease}
.spamf-note{font-size:.73rem;color:var(--muted);margin-top:5px;line-height:1.5}

/* ── Language tabs ── */
.lang-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:0}
.lang-tab{padding:6px 14px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--chip);
  border:1px solid var(--border);border-bottom:none;cursor:pointer;font-size:.82rem;font-weight:600;
  color:var(--muted);transition:all .15s}
.lang-tab.active{background:var(--code-bg);color:#abb2bf;border-color:var(--code-bg)}
.hidden{display:none!important}
.lang-code-block{background:var(--code-bg);border-radius:0 var(--radius-sm) var(--radius-sm) var(--radius-sm);
  padding:16px;overflow-x:auto}
.lang-code-block pre{margin:0;white-space:pre;font-size:.82rem;line-height:1.65}
.lang-code-block code{background:none!important;padding:0!important;font-size:inherit!important}
.code-missing{padding:20px;color:var(--muted);font-style:italic;font-size:.85rem;background:var(--code-bg);
  border-radius:0 var(--radius-sm) var(--radius-sm) var(--radius-sm)}

/* ── Tables ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
thead th{background:var(--chip);color:var(--chip-text);padding:10px 14px;text-align:left;
  font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
thead th:hover{color:var(--accent)}
tbody tr{border-top:1px solid var(--border);transition:background .15s}
tbody tr:hover{background:var(--chip)}
tbody td{padding:10px 14px;vertical-align:top;line-height:1.55}
tbody td.na{color:var(--muted);font-style:italic}
.sort-icon{margin-left:4px;opacity:.5;font-size:.75rem}
thead th.sorted .sort-icon{opacity:1;color:var(--accent)}
.match-highlight{background:var(--accent2);color:#000;border-radius:3px;padding:0 2px}

/* ── Mermaid ── */
.mermaid-wrap{background:var(--chip);border-radius:var(--radius-sm);padding:16px;overflow-x:auto;margin-bottom:16px}
.mermaid-wrap .mermaid{max-width:100%}

/* ── Complexity badge ── */
.complexity-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:500px){.complexity-grid{grid-template-columns:1fr}}
.complexity-item{background:var(--chip);border-radius:var(--radius-sm);padding:12px}
.complexity-item h4{font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.complexity-item p{font-size:.83rem;color:var(--text)}

/* ── Category/complexity table ── */
.cat-level-header{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.cat-level-header .level-badge{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:700}

/* ── No results ── */
.no-results{padding:40px;text-align:center;color:var(--muted);font-size:.9rem}

/* ── Responsive ── */
@media(max-width:700px){
  .header-row{gap:8px}
  .detail-grid{grid-template-columns:1fr}
  .spamf-grid{grid-template-columns:1fr 1fr}
  .lang-tab{padding:5px 10px;font-size:.76rem}
  table{font-size:.76rem}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="header-row">
      <div class="logo">Architecture<span>Atlas</span></div>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search architectures, concepts, languages…" autocomplete="off"/>
        <span class="search-clear" id="searchClear">✕</span>
      </div>
      <div class="header-btns">
        <button class="btn btn-icon" id="themeToggle" title="Toggle theme">🌙</button>
        <button class="btn btn-icon" id="langToggle" title="Toggle language">🇻🇳</button>
      </div>
    </div>
    <div class="filter-bar">
      <span class="filter-label" data-i18n="filter_level">Level:</span>
      <span class="chip active" data-filter="level" data-val="all"    data-i18n="all">All</span>
      <span class="chip" data-filter="level" data-val="foundational"  data-i18n="foundational">Foundational</span>
      <span class="chip" data-filter="level" data-val="intermediate"  data-i18n="intermediate">Intermediate</span>
      <span class="chip" data-filter="level" data-val="advanced"      data-i18n="advanced">Advanced</span>
      <span style="width:1px;background:var(--border);align-self:stretch;margin:0 4px"></span>
      <span class="filter-label" data-i18n="filter_lang">Lang:</span>
      <span class="chip active" data-filter="lang" data-val="all"  data-i18n="all">All</span>
      <span class="chip" data-filter="lang" data-val="csharp">C#</span>
      <span class="chip" data-filter="lang" data-val="python">Python</span>
      <span class="chip" data-filter="lang" data-val="go">Go</span>
      <span class="chip" data-filter="lang" data-val="rust">Rust</span>
      <span class="chip" data-filter="lang" data-val="java">Java</span>
      <span class="chip" data-filter="lang" data-val="javascript">JS</span>
      <span class="chip" data-filter="lang" data-val="cpp">C++</span>
    </div>
  </div>

  <!-- ── NAV TABS ── -->
  <div class="nav-tabs">
    <div class="nav-tab active" data-tab="catalog"    data-i18n="tab_catalog">AA Catalog</div>
    <div class="nav-tab"        data-tab="matrix"     data-i18n="tab_matrix">Cross-Language Matrix</div>
    <div class="nav-tab"        data-tab="blocks"     data-i18n="tab_blocks">Building Blocks</div>
    <div class="nav-tab"        data-tab="langmap"    data-i18n="tab_langmap">Language Mapping</div>
    <div class="nav-tab"        data-tab="tooling"    data-i18n="tab_tooling">Tooling</div>
    <div class="nav-tab"        data-tab="categories" data-i18n="tab_categories">By Category</div>
  </div>

  <!-- ── TAB: CATALOG ── -->
  <div class="tab-content active" id="tab-catalog">
    <div id="catalogGrid" class="card-grid"></div>
    <div class="no-results" id="catalogNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: MATRIX ── -->
  <div class="tab-content" id="tab-matrix">
    <div class="tbl-wrap"><table id="matrixTable"><thead id="matrixHead"></thead><tbody id="matrixBody"></tbody></table></div>
    <div class="no-results" id="matrixNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: BUILDING BLOCKS ── -->
  <div class="tab-content" id="tab-blocks">
    <div class="tbl-wrap"><table id="blocksTable"><thead id="blocksHead"></thead><tbody id="blocksBody"></tbody></table></div>
    <div class="no-results" id="blocksNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: LANGUAGE MAPPING ── -->
  <div class="tab-content" id="tab-langmap">
    <div class="tbl-wrap"><table id="langmapTable"><thead id="langmapHead"></thead><tbody id="langmapBody"></tbody></table></div>
    <div class="no-results" id="langmapNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: TOOLING ── -->
  <div class="tab-content" id="tab-tooling">
    <div class="tbl-wrap"><table id="toolingTable"><thead id="toolingHead"></thead><tbody id="toolingBody"></tbody></table></div>
    <div class="no-results" id="toolingNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: BY CATEGORY ── -->
  <div class="tab-content" id="tab-categories">
    <div class="no-results" id="categoryNoResults" style="display:none" data-i18n="no_results">No results found.</div>
    <div id="categoryView"></div>
  </div>

</div><!-- /wrap -->

<!-- ── DETAIL MODAL ── -->
<div class="modal-overlay" id="modalOverlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div>
        <div class="card-title" id="modalTitle"></div>
        <div class="card-subtitle" id="modalSubtitle"></div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ── 02-data-arch-1.js : Foundational Architectures ──────────────────────────
// Covers: Monolithic, Layered/N-Tier, MVC, Client-Server, Repository Pattern

const ARCH_FOUNDATIONAL = [
  // ────────────────────────────────────────────────────────
  {
    id: "monolithic",
    level: "foundational",
    icon: "🧱",
    category: ["web", "desktop", "mobile"],
    businessModel: ["startup", "saas", "enterprise"],
    name: { en: "Monolithic Architecture", vi: "Kiến trúc Nguyên khối" },
    origin: {
      en: "Dominant paradigm from the 1960s–2000s. All application layers (UI, business logic, data access) compiled and deployed as a single executable or process.",
      vi: "Mô hình phổ biến từ những năm 1960–2000. Tất cả các lớp ứng dụng (UI, logic nghiệp vụ, truy cập dữ liệu) được biên dịch và triển khai dưới dạng một tiến trình/tệp thực thi duy nhất."
    },
    description: {
      en: "A single deployable unit containing all application functionality. Components share the same process, memory, and database. Simple to develop initially but becomes a 'big ball of mud' as the system grows.",
      vi: "Một đơn vị triển khai duy nhất chứa toàn bộ chức năng ứng dụng. Các thành phần chia sẻ cùng tiến trình, bộ nhớ và cơ sở dữ liệu. Đơn giản khi phát triển ban đầu nhưng trở thành 'mớ hỗn độn' khi hệ thống tăng trưởng."
    },
    coreConceptsTools: {
      en: "Single process, shared memory, monorepo, ORM (Entity Framework, SQLAlchemy, GORM, Diesel, Hibernate, Sequelize), MVC/MVT framework (Spring MVC, Django, Rails, ASP.NET MVC), single database.",
      vi: "Tiến trình đơn, bộ nhớ dùng chung, monorepo, ORM (Entity Framework, SQLAlchemy, GORM, Diesel, Hibernate, Sequelize), framework MVC/MVT (Spring MVC, Django, Rails, ASP.NET MVC), cơ sở dữ liệu đơn."
    },
    whenToUse: {
      en: "Small-to-medium teams; early-stage startups validating an MVP; simple domain with low traffic; when deployment simplicity outweighs future scalability needs.",
      vi: "Nhóm nhỏ đến trung bình; khởi nghiệp giai đoạn đầu xác nhận MVP; miền nghiệp vụ đơn giản, lưu lượng thấp; khi sự đơn giản trong triển khai quan trọng hơn nhu cầu mở rộng tương lai."
    },
    pros: {
      en: ["Simple local development & debugging", "Easy end-to-end testing", "Low operational overhead", "No network latency between components", "Straightforward transaction management"],
      vi: ["Phát triển và gỡ lỗi cục bộ đơn giản", "Kiểm thử đầu cuối dễ dàng", "Chi phí vận hành thấp", "Không có độ trễ mạng giữa các thành phần", "Quản lý giao dịch đơn giản"]
    },
    cons: {
      en: ["Poor scalability (scale all-or-nothing)", "Long build/deploy cycles as codebase grows", "Technology lock-in", "Single point of failure", "High coupling hinders independent team work"],
      vi: ["Khả năng mở rộng kém (phải mở rộng toàn bộ)", "Chu kỳ build/deploy dài khi codebase tăng", "Bị ràng buộc công nghệ", "Điểm thất bại đơn lẻ", "Khớp nối cao cản trở làm việc nhóm độc lập"]
    },
    spamf: {
      security:        { score: 3, note: { en: "Single codebase can be audited easily, but a breach affects everything.", vi: "Codebase đơn dễ kiểm tra bảo mật nhưng một lỗ hổng ảnh hưởng toàn bộ." } },
      performance:     { score: 4, note: { en: "No inter-service network calls; in-process communication is fast.", vi: "Không có gọi mạng giữa dịch vụ; giao tiếp trong tiến trình rất nhanh." } },
      availability:    { score: 2, note: { en: "One crash brings the whole application down.", vi: "Một lỗi sập toàn bộ ứng dụng." } },
      maintainability: { score: 2, note: { en: "Grows into spaghetti code without discipline; tight coupling.", vi: "Dễ trở thành mã nguồn rối nếu thiếu kỷ luật; khớp nối chặt." } },
      flexibility:     { score: 2, note: { en: "Hard to adopt new tech stacks for parts of the app.", vi: "Khó áp dụng stack công nghệ mới cho từng phần của ứng dụng." } }

func listProducts(w http.ResponseWriter, r *http.Request) {
    rows, _ := db.Query("SELECT id, name FROM products")

    var out []map[string]any

        var id int; var name string

use actix_web::{get, web, App, HttpServer, Responder, HttpResponse};
use rusqlite::{Connection, params};
use serde::Serialize;
use std::sync::Mutex;

#[derive(Serialize)]
struct Product { id: i64, name: String }

struct AppState { db: Mutex<Connection> }

#[get("/products")]
async fn list_products(data: web::Data<AppState>) -> impl Responder {
    let conn = data.db.lock().unwrap();
    let mut stmt = conn.prepare("SELECT id, name FROM products").unwrap();
    let products: Vec<Product> = stmt
        .query_map([], |r| Ok(Product { id: r.get(0)?, name: r.get(1)? }))
        .unwrap().filter_map(|r| r.ok()).collect();

}

public interface IProductRepository

public class EfProductRepository(AppDbContext db) : IProductRepository
{
    public Task<Product?> FindByIdAsync(int id) => db.Products.FindAsync(id).AsTask();
    public Task<IReadOnlyList<Product>> GetAllAsync() =>
        db.Products.ToListAsync().ContinueWith(t => (IReadOnlyList<Product>)t.Result);
    public async Task AddAsync(Product product) { db.Products.Add(product); await db.SaveChangesAsync(); }
    public async Task UpdateAsync(Product product) { db.Products.Update(product); await db.SaveChangesAsync(); }
    public async Task DeleteAsync(int id) {

    }
}

from typing import Protocol, List, Optional
from dataclasses import dataclass, field

@dataclass
class Product: id: int; name: str; price: float

class ProductRepository(Protocol):
    def find_by_id(self, id: int) -> Optional[Product]: ...
    def find_all(self) -> List[Product]: ...
    def save(self, product: Product) -> None: ...
    def delete(self, id: int) -> None: ...

# SQLAlchemy concrete implementation
class SqlProductRepository:
    def __init__(self, session): self._s = session
    def find_by_id(self, id): return self._s.get(ProductModel, id)

    virtual std::vector<Product> findAll() = 0;
    virtual void save(const Product& p) = 0;
    virtual void remove(int id) = 0;

class InMemoryProductRepository : public IProductRepository {
    std::vector<Product> data_;
public:
    std::optional<Product> findById(int id) override {
        for (auto& p : data_) if (p.id == id) return p;
        return std::nullopt;
    }
    std::vector<Product> findAll() override { return data_; }
    void save(const Product& p) override {
        for (auto& x : data_) if (x.id == p.id) { x = p; return; }
        data_.push_back(p);
    }
    void remove(int id) override {

      csharp: `// Pipe-and-Filter with IEnumerable<T> composition
public interface IFilter<T>
{
    IEnumerable<T> Process(IEnumerable<T> input);
}

public class TrimFilter : IFilter<string>
{
    public IEnumerable<string> Process(IEnumerable<string> input)
        => input.Select(s => s.Trim()).Where(s => s.Length > 0);
}

public class LowercaseFilter : IFilter<string>
{
    public IEnumerable<string> Process(IEnumerable<string> input)
        => input.Select(s => s.ToLowerInvariant());
}

public class Pipeline<T>(IEnumerable<IFilter<T>> filters)
{
    public IEnumerable<T> Execute(IEnumerable<T> source)
        => filters.Aggregate(source, (data, f) => f.Process(data));
}

// Usage
var pipeline = new Pipeline<string>([new TrimFilter(), new LowercaseFilter()]);
var result = pipeline.Execute([" Hello ", "  WORLD  ", ""]).ToList();
// → ["hello", "world"]`,

    name: str
    def execute(self, context: dict) -> None: ...

#include <unordered_map>
#include <functional>
#include <string>
#include <stdexcept>
#include <iostream>

using Context = std::unordered_map<std::string, std::string>;
using PluginFn = std::function<void(const Context&)>;

class PluginRegistry {
    std::unordered_map<std::string, PluginFn> plugins_;
public:
    void register_plugin(const std::string& name, PluginFn fn) {
        plugins_[name] = std::move(fn);
    }
    void execute(const std::string& name, const Context& ctx) const {
        auto it = plugins_.find(name);
        if (it == plugins_.end())
            throw std::runtime_error("Plugin not found: " + name);
        it->second(ctx);
    }
};

    PluginRegistry& registry_;

    explicit CoreSystem(PluginRegistry& r) : registry_(r) {}
    void process(const std::string& op, const Context& ctx) {

using namespace boost::asio;
using tcp = ip::tcp;

class P2PNode {
    io_context& ioc_;
    tcp::acceptor acceptor_;
public:
    P2PNode(io_context& ioc, uint16_t port)
        : ioc_(ioc), acceptor_(ioc, tcp::endpoint(tcp::v4(), port)) {}

    void listen() {
        do_accept();
        std::cout << "Listening on " << acceptor_.local_endpoint().port() << "\n";
    }

    void send(const std::string& host, uint16_t port, const std::string& msg) {
        tcp::socket sock(ioc_);
        tcp::resolver resolver(ioc_);
        auto eps = resolver.resolve(host, std::to_string(port));
        connect(sock, eps);
        write(sock, buffer(msg));
    }

private:
    void do_accept() {
        acceptor_.async_accept([this](auto ec, tcp::socket sock) {
            if (!ec) {
                auto buf = std::make_shared<std::array<char,4096>>();
                sock.async_read_some(buffer(*buf), [buf](auto, size_t n){
                    std::cout << "Peer: " << std::string(buf->data(), n) << "\n";
                });
            }
            do_accept();
        });
    }
};

public class Blackboard
{
    private readonly ConcurrentDictionary<string, object> _state = new();
    public void Write(string key, object value) => _state[key] = value;
    public bool TryRead<T>(string key, out T? value)
    {
        if (_state.TryGetValue(key, out var v) && v is T t) { value = t; return true; }
        value = default; return false;
    }
}

public interface IKnowledgeSource
{
    bool CanActivate(Blackboard bb);
    void Activate(Blackboard bb);
}

public class ValidationKS : IKnowledgeSource
{
    public bool CanActivate(Blackboard bb)
        => bb.TryRead<string>("raw_input", out _);
    public void Activate(Blackboard bb)
    {
        bb.TryRead<string>("raw_input", out var input);
        bb.Write("validated", input?.Trim().Length > 0);
    }
}

public class Scheduler(Blackboard bb, IEnumerable<IKnowledgeSource> sources)
{
    public void RunCycle()
    {
        foreach (var ks in sources)
            if (ks.CanActivate(bb)) ks.Activate(bb);
    }
}

var bb = new Blackboard();
bb.Write("raw_input", "  hello world  ");

      python: `# Blackboard pattern with typed state
from typing import Any
from dataclasses import dataclass, field

@dataclass
class Blackboard:
    state: dict[str, Any] = field(default_factory=dict)
    def write(self, key: str, value: Any) -> None: self.state[key] = value
    def read(self, key: str, default=None): return self.state.get(key, default)
    def has(self, key: str) -> bool: return key in self.state

class KnowledgeSource:
    def can_activate(self, bb: Blackboard) -> bool: ...
    def activate(self, bb: Blackboard) -> None: ...

class TokenizerKS(KnowledgeSource):
    def can_activate(self, bb): return bb.has("raw_input")
    def activate(self, bb):
        tokens = bb.read("raw_input").split()
        bb.write("tokens", tokens)

class SentimentKS(KnowledgeSource):
    def can_activate(self, bb): return bb.has("tokens")
    def activate(self, bb):
        tokens = bb.read("tokens")
        score = sum(1 for t in tokens if t in ("good","great","excellent")) - \
                sum(1 for t in tokens if t in ("bad","poor","terrible"))
        bb.write("sentiment", "positive" if score > 0 else "negative" if score < 0 else "neutral")

class Controller:
    def __init__(self, bb, sources): self.bb, self.sources = bb, sources
    def run(self):
        for ks in self.sources:
            if ks.can_activate(self.bb): ks.activate(self.bb)

bb = Blackboard()
bb.write("raw_input", "great product excellent service")
ctrl = Controller(bb, [TokenizerKS(), SentimentKS()])
ctrl.run()
print(bb.read("sentiment"))  # → positive`,

    "fmt"

type Blackboard struct{ state sync.Map }

func (b *Blackboard) Write(key string, val any) { b.state.Store(key, val) }

    Activate(*Blackboard)

    sources []KnowledgeSource

use std::collections::HashMap;
use std::any::Any;

struct Blackboard { state: HashMap<String, Box<dyn Any + Send>> }

impl Blackboard {
    fn new() -> Self { Self { state: HashMap::new() } }
    fn write<T: Any + Send>(&mut self, key: &str, val: T) {
        self.state.insert(key.to_string(), Box::new(val));
    }
    fn read<T: Any + Clone>(&self, key: &str) -> Option<&T> {
        self.state.get(key)?.downcast_ref::<T>()
    }
    fn has(&self, key: &str) -> bool { self.state.contains_key(key) }
}

trait KnowledgeSource {
    fn can_activate(&self, bb: &Blackboard) -> bool;
    fn activate(&self, bb: &mut Blackboard);
}

    fn can_activate(&self, bb: &Blackboard) -> bool { bb.has("raw_input") }

            .unwrap_or_default();
        bb.write("tokens", tokens);
    }
}

// Write always goes to master; reads go to replica
public class MasterSlaveDbContext
{
    private readonly string _masterConn;
    private readonly string[] _slaveConns;
    private int _roundRobin;

    public MasterSlaveDbContext(string master, string[] slaves)
        => (_masterConn, _slaveConns) = (master, slaves);

    public AppDbContext GetWriteContext()
    {
        var opts = new DbContextOptionsBuilder<AppDbContext>()
            .UseSqlServer(_masterConn).Options;
        return new AppDbContext(opts);
    }

    public AppDbContext GetReadContext()
    {
        // Round-robin across replicas
        var idx = Interlocked.Increment(ref _roundRobin) % _slaveConns.Length;
        var opts = new DbContextOptionsBuilder<AppDbContext>()
            .UseSqlServer(_slaveConns[idx]).Options;
        return new AppDbContext(opts);
    }
}

from sqlalchemy import create_engine
from sqlalchemy.orm import Session
import itertools

class MasterSlaveRouter:
    def __init__(self, master_url: str, slave_urls: list[str]):
        self.master = create_engine(master_url, pool_pre_ping=True)
        self.slaves = [create_engine(u, pool_pre_ping=True) for u in slave_urls]
        self._cycle = itertools.cycle(self.slaves)

    def write_session(self) -> Session:
        return Session(self.master)

    def read_session(self) -> Session:
        return Session(next(self._cycle))

      go: `// Master-slave routing with database/sql
package main

import (
    "database/sql"
    "fmt"
    "sync/atomic"
    _ "github.com/lib/pq"
)

type MasterSlaveDB struct {
    master  *sql.DB
    slaves  []*sql.DB
    counter atomic.Uint64
}

func NewMasterSlaveDB(masterDSN string, slaveDSNs []string) (*MasterSlaveDB, error) {
    m, err := sql.Open("postgres", masterDSN)
    if err != nil { return nil, err }
    var slaves []*sql.DB
    for _, dsn := range slaveDSNs {
        s, err := sql.Open("postgres", dsn)
        if err != nil { return nil, err }
        slaves = append(slaves, s)
    }
    return &MasterSlaveDB{master: m, slaves: slaves}, nil
}

// Master for writes
func (db *MasterSlaveDB) Master() *sql.DB { return db.master }

// Round-robin replica for reads
func (db *MasterSlaveDB) Replica() *sql.DB {
    idx := db.counter.Add(1) % uint64(len(db.slaves))
    return db.slaves[idx]
}

func main() {
    db, _ := NewMasterSlaveDB(
        "postgres://master/app",
        []string{"postgres://replica1/app", "postgres://replica2/app"},
    )
    // Write
    db.Master().Exec("INSERT INTO orders(total) VALUES($1)", 99.99)
    // Read from replica
    rows, _ := db.Replica().Query("SELECT id, total FROM orders")
    defer rows.Close()
    for rows.Next() {
        var id int; var total float64
        rows.Scan(&id, &total)
        fmt.Printf("Order %d: %.2f\n", id, total)
    }
}`,
      rust: `// Master-slave routing with sqlx
use sqlx::{PgPool, postgres::PgPoolOptions};
use std::sync::atomic::{AtomicUsize, Ordering};
use std::sync::Arc;

struct MasterSlavePool {
    master:  PgPool,
    slaves:  Vec<PgPool>,
    counter: AtomicUsize,
}

impl MasterSlavePool {
    async fn new(master_url: &str, slave_urls: &[&str]) -> Self {
        let master = PgPoolOptions::new().connect(master_url).await.unwrap();
        let mut slaves = Vec::new();
        for url in slave_urls {
            slaves.push(PgPoolOptions::new().connect(url).await.unwrap());
        }
        Self { master, slaves, counter: AtomicUsize::new(0) }
    }

    fn write(&self) -> &PgPool { &self.master }

    fn read(&self) -> &PgPool {
        let idx = self.counter.fetch_add(1, Ordering::Relaxed) % self.slaves.len();
        &self.slaves[idx]
    }
}

#[tokio::main]

        "postgres://master/app",

#include <pqxx/pqxx>
#include <vector>
#include <atomic>
#include <iostream>

class MasterSlavePool {
    pqxx::connection master_;
    std::vector<pqxx::connection> slaves_;
    std::atomic<size_t> counter_{0};
public:
    MasterSlavePool(const std::string& masterDSN,
                    const std::vector<std::string>& slaveDSNs)
        : master_(masterDSN)
    {
        for (auto& dsn : slaveDSNs) slaves_.emplace_back(dsn);
    }

    pqxx::connection& write() { return master_; }

    pqxx::connection& read() {
        return slaves_[counter_.fetch_add(1) % slaves_.size()];
    }

use rdkafka::{
    consumer::{Consumer, StreamConsumer},
    producer::{FutureProducer, FutureRecord},
    ClientConfig, Message,
};
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
struct OrderCreatedEvent { order_id: String, total: f64 }

async fn produce(producer: &FutureProducer, event: &OrderCreatedEvent) {
    let payload = serde_json::to_string(event).unwrap();
    producer.send(FutureRecord::to("order.created").payload(&payload).key(&event.order_id),
        std::time::Duration::from_secs(5)).await.unwrap();
    println!("[Producer] Published order {}", event.order_id);
}

async fn consume() {
    let consumer: StreamConsumer = ClientConfig::new()
        .set("bootstrap.servers", "localhost:9092")
        .set("group.id", "email-service")
        .set("auto.offset.reset", "earliest")
        .create().unwrap();
    consumer.subscribe(&["order.created"]).unwrap();
    loop {
        let msg = consumer.recv().await.unwrap();
        if let Some(payload) = msg.payload() {
            let evt: OrderCreatedEvent = serde_json::from_slice(payload).unwrap();
            println!("[Consumer] Sending email for order {}", evt.order_id);
        }
    }
}`,

      cpp: `// CQRS C++ with template-based handler registry
#include <functional>
#include <unordered_map>
#include <typeindex>
#include <any>
#include <stdexcept>

struct CreateProductCommand { std::string name; double price; };
struct GetProductQuery      { int id; };
struct ProductView          { int id; std::string name; double price; };

class Mediator {
    std::unordered_map<std::type_index, std::function<std::any(std::any)>> handlers_;
public:
    template<typename Cmd, typename Result>
    void registerHandler(std::function<Result(Cmd)> fn) {
        handlers_[typeid(Cmd)] = [fn](std::any cmd) -> std::any {
            return fn(std::any_cast<Cmd>(cmd));
        };
    }
    template<typename Result, typename Cmd>
    Result send(Cmd cmd) {
        auto it = handlers_.find(typeid(Cmd));
        if (it == handlers_.end()) throw std::runtime_error("No handler");
        return std::any_cast<Result>(it->second(cmd));
    }
};

int main() {
    Mediator m;
    std::map<int,ProductView> store;
    m.registerHandler<int, CreateProductCommand>([&](CreateProductCommand cmd) -> int {
        int id = store.size() + 1;
        store[id] = {id, cmd.name, cmd.price};
        return id;
    });
    m.registerHandler<ProductView, GetProductQuery>([&](GetProductQuery q) -> ProductView {
        return store.at(q.id);
    });
    int id = m.send<int>(CreateProductCommand{"Widget", 9.99});
    auto pv = m.send<ProductView>(GetProductQuery{id});
    printf("Product: %s @ %.2f\n", pv.name.c_str(), pv.price);

public interface IOrderRepository   { Task<Order?> FindByIdAsync(Guid id); Task SaveAsync(Order order); }
public interface IPaymentGateway    { Task<bool> ChargeAsync(Guid customerId, decimal amount); }

public class PlaceOrderUseCase(IOrderRepository orders, IPaymentGateway payments)
{
    public async Task<Guid> ExecuteAsync(Guid customerId, decimal total)
    {
        bool charged = await payments.ChargeAsync(customerId, total);
        if (!charged) throw new InvalidOperationException("Payment failed");
        var order = Order.Create(customerId, total);
        await orders.SaveAsync(order);
        return order.Id;
    }
}

      python: `# Hexagonal Architecture in Python
from abc import ABC, abstractmethod
from dataclasses import dataclass
import uuid

# ── Secondary Ports (outbound) ──
class OrderRepository(ABC):
    @abstractmethod
    def save(self, order: "Order") -> None: ...
    @abstractmethod
    def find_by_id(self, order_id: str) -> "Order | None": ...

class PaymentGateway(ABC):
    @abstractmethod
    def charge(self, customer_id: str, amount: float) -> bool: ...

# ── Domain Model ──
@dataclass
class Order:
    id: str; customer_id: str; total: float; status: str = "pending"
    @classmethod
    def create(cls, customer_id: str, total: float) -> "Order":
        return cls(id=str(uuid.uuid4()), customer_id=customer_id, total=total)

# ── Use Case (Application Core) ──
class PlaceOrderUseCase:
    def __init__(self, orders: OrderRepository, payments: PaymentGateway):
        self._orders = orders; self._payments = payments
    def execute(self, customer_id: str, total: float) -> str:
        if not self._payments.charge(customer_id, total):
            raise ValueError("Payment failed")
        order = Order.create(customer_id, total)
        order.status = "confirmed"
        self._orders.save(order)
        return order.id

# ── Secondary Adapters ──
class InMemoryOrderRepository(OrderRepository):
    def __init__(self): self._store: dict = {}
    def save(self, order): self._store[order.id] = order
    def find_by_id(self, oid): return self._store.get(oid)

class FakePaymentGateway(PaymentGateway):
    def charge(self, customer_id, amount): return True

# ── Primary Adapter — FastAPI ──
from fastapi import FastAPI
app = FastAPI()
uc = PlaceOrderUseCase(InMemoryOrderRepository(), FakePaymentGateway())

@app.post("/orders", status_code=201)
def place_order(body: dict):
    order_id = uc.execute(body["customer_id"], body["total"])
    return {"id": order_id}`,
      go: `// Hexagonal Go — Ports & Adapters
package main

// ── Secondary Ports ──
type OrderRepository interface {
    Save(order Order) error
    FindByID(id string) (*Order, error)
}
type PaymentGateway interface {
    Charge(customerID string, amount float64) (bool, error)
}

// ── Domain ──
type Order struct { ID string; CustomerID string; Total float64; Status string }

// ── Use Case ──
type PlaceOrderUseCase struct {
    orders   OrderRepository
    payments PaymentGateway
}
func (uc *PlaceOrderUseCase) Execute(customerID string, total float64) (string, error) {
    ok, err := uc.payments.Charge(customerID, total)
    if err != nil || !ok { return "", fmt.Errorf("payment failed") }
    order := Order{ID: newUUID(), CustomerID: customerID, Total: total, Status: "confirmed"}
    return order.ID, uc.orders.Save(order)
}

// ── Secondary Adapters ──
type InMemoryOrderRepo struct{ data map[string]Order }
func (r *InMemoryOrderRepo) Save(o Order) error { r.data[o.ID] = o; return nil }
func (r *InMemoryOrderRepo) FindByID(id string) (*Order, error) {
    if o, ok := r.data[id]; ok { return &o, nil }
    return nil, fmt.Errorf("not found")
}
type FakePaymentGateway struct{}
func (f *FakePaymentGateway) Charge(_, _ string, _ float64) (bool, error) { return true, nil }`,

    async fn save(&self, order: &Order) -> anyhow::Result<()>;

    async fn charge(&self, customer_id: &str, amount: f64) -> anyhow::Result<bool>;

    orders: R, payments: P,
}
impl<R: OrderRepository, P: PaymentGateway> PlaceOrderUseCase<R, P> {
    pub async fn execute(&self, customer_id: &str, total: f64) -> anyhow::Result<Uuid> {
        let ok = self.payments.charge(customer_id, total).await?;
        anyhow::ensure!(ok, "Payment failed");
        let order = Order { id: Uuid::new_v4(), customer_id: customer_id.into(), total };
        self.orders.save(&order).await?;
        Ok(order.id)
    }
}

    }

public class Order   // pure domain entity, no framework deps

    public Guid Id { get; private set; } = Guid.NewGuid();

    public async Task ExecuteAsync(Guid orderId)

        var order = await repo.FindByIdAsync(orderId) ?? throw new NotFoundException();
        order.Confirm();
        await repo.SaveAsync(order);
        output.Present(new OrderDto(order.Id, order.Total, order.IsConfirmed));
    }
}

// Each module lives in its own package with a public facade.

type Module interface {
    PlaceOrder(customerID string, items []string) (string, error)
    GetOrder(id string) (*OrderDTO, error)
}

type module struct {
    repo repository
    bus  eventBus
}

func New(bus eventBus) Module {
    return &module{repo: newRepo(), bus: bus}
}

    m.bus.publish("order.placed", id)
    return id, nil

    return &OrderDTO{ID: o.ID, CustomerID: o.CustomerID}, nil
}

// Features/Orders/PlaceOrder/PlaceOrderCommand.cs
public record PlaceOrderCommand(decimal Total) : IRequest<Guid>;

public class PlaceOrderValidator : AbstractValidator<PlaceOrderCommand>
{
    public PlaceOrderValidator()
        => RuleFor(x => x.Total).GreaterThan(0);
}

public class PlaceOrderHandler(AppDbContext db)
    : IRequestHandler<PlaceOrderCommand, Guid>
{
    public async Task<Guid> Handle(
        PlaceOrderCommand cmd, CancellationToken ct)
    {
        var order = new Order { Id = Guid.NewGuid(), Total = cmd.Total };
        db.Orders.Add(order);
        await db.SaveChangesAsync(ct);
        return order.Id;
    }
}

package placeorder

import (
    "encoding/json"
    "net/http"
    "github.com/google/uuid"
)

type Request  struct { Total float64 \`json:"total"\` }
type Response struct { ID    string   \`json:"id"\`    }

func Handler(db DB) http.HandlerFunc {
    return func(w http.ResponseWriter, r *http.Request) {
        var req Request
        if err := json.NewDecoder(r.Body).Decode(&req); err != nil || req.Total <= 0 {
            http.Error(w, "invalid request", http.StatusBadRequest); return
        }
        id := uuid.NewString()
        if err := db.Save(r.Context(), id, req.Total); err != nil {
            http.Error(w, err.Error(), 500); return
        }
        json.NewEncoder(w).Encode(Response{ID: id})
    }
}

use serde::{Deserialize, Serialize};
use uuid::Uuid;
use crate::db::DbPool;

#[derive(Deserialize)]
pub struct PlaceOrderRequest { pub total: f64 }
#[derive(Serialize)]
pub struct PlaceOrderResponse { pub id: Uuid }

pub async fn handler(
    State(pool): State<DbPool>,
    Json(req): Json<PlaceOrderRequest>,
) -> Result<Json<PlaceOrderResponse>, StatusCode> {
    if req.total <= 0.0 { return Err(StatusCode::BAD_REQUEST); }
    let id = Uuid::new_v4();
    sqlx::query("INSERT INTO orders(id, total) VALUES($1, $2)")
        .bind(id).bind(req.total)
        .execute(&pool).await.map_err(|_| StatusCode::INTERNAL_SERVER_ERROR)?;
    Ok(Json(PlaceOrderResponse { id }))
}

            [cb](const drogon::orm::DrogonDbException& e) {

// Add package: Yarp.ReverseProxy
// Program.cs
var builder = WebApplication.CreateBuilder(args);
builder.Services.AddReverseProxy()
    .LoadFromConfig(builder.Configuration.GetSection("ReverseProxy"));
builder.Services.AddSingleton<IFeatureFlagService, FeatureFlagService>();

var app = builder.Build();

// Middleware intercepts and decides: new service or legacy fallback
app.Use(async (ctx, next) =>
{
    var flags = ctx.RequestServices.GetRequiredService<IFeatureFlagService>();
    if (ctx.Request.Path.StartsWithSegments("/orders") &&
        await flags.IsEnabledAsync("new-orders-service"))
    {
        // let YARP route to new service (configured in appsettings.json)
        await next(ctx);
    }
    else
    {
        // proxy to legacy monolith
        ctx.Request.Path = "/legacy" + ctx.Request.Path;
        await next(ctx);
    }
});

app.MapReverseProxy();

    python: `# FastAPI — Strangler Fig façade using httpx as reverse proxy
import httpx
from fastapi import FastAPI, Request, Response

app = FastAPI()

NEW_SERVICE = "http://new-orders-service:8001"
LEGACY_SERVICE = "http://legacy-monolith:8080"

MIGRATED_PREFIXES = {"/orders", "/products"}  # growing list

@app.middleware("http")
async def strangler_router(request: Request, call_next):
    for prefix in MIGRATED_PREFIXES:
        if request.url.path.startswith(prefix):
            target = NEW_SERVICE
            break
    else:
        target = LEGACY_SERVICE

    url = target + request.url.path
    async with httpx.AsyncClient() as client:
        resp = await client.request(
            method=request.method,
            url=url,
            headers=dict(request.headers),
            content=await request.body(),
        )
    return Response(
        content=resp.content,
        status_code=resp.status_code,
        headers=dict(resp.headers),
    )`,

use axum::{Router, extract::Request, response::Response, middleware};
use reqwest::Client;
use std::sync::Arc;

#[derive(Clone)]
struct AppState {
    client: Arc<Client>,
    migrated: Arc<Vec<String>>,
}

async fn strangler_proxy(
    axum::extract::State(state): axum::extract::State<AppState>,
    req: Request,
) -> Response {
    let path = req.uri().path();
    let is_migrated = state.migrated.iter().any(|p| path.starts_with(p.as_str()));
    let base = if is_migrated {
        "http://new-orders-service:8001"
    } else {
        "http://legacy-monolith:8080"
    };
    let url = format!("{base}{path}");
    let resp = state.client.get(&url).send().await.unwrap();
    let status = axum::http::StatusCode::from_u16(resp.status().as_u16()).unwrap();
    let body = resp.bytes().await.unwrap();
    (status, body).into_response()
}

#[tokio::main]
async fn main() {
    let state = AppState {
        client: Arc::new(Client::new()),
        migrated: Arc::new(vec!["/orders".into(), "/products".into()]),
    };
    let app = Router::new()
        .fallback(strangler_proxy)
        .with_state(state);
    let listener = tokio::net::TcpListener::bind("0.0.0.0:8080").await.unwrap();
    axum::serve(listener, app).await.unwrap();
}`,

from __future__ import annotations
from dataclasses import dataclass, field
from abc import ABC, abstractmethod
from uuid import uuid4, UUID
from typing import Optional

# ── Domain Ring ──────────────────────────────────────────────────────
@dataclass
class Order:                     # pure domain entity
    id: UUID = field(default_factory=uuid4)
    total: float = 0.0

    @classmethod
    def create(cls, total: float) -> "Order":
        if total <= 0:
            raise ValueError("Total must be positive")
        return cls(total=total)

class IOrderRepository(ABC):    # interface defined in domain layer
    @abstractmethod
    def add(self, order: Order) -> None: ...
    @abstractmethod
    def get(self, order_id: UUID) -> Optional[Order]: ...

# ── Application Ring ──────────────────────────────────────────────────
class PlaceOrderUseCase:
    def __init__(self, repo: IOrderRepository):
        self._repo = repo

    def execute(self, total: float) -> UUID:
        order = Order.create(total)
        self._repo.add(order)
        return order.id

# ── Infrastructure Ring ───────────────────────────────────────────────
class InMemoryOrderRepository(IOrderRepository):   # swappable infra impl
    def __init__(self):
        self._store: dict[UUID, Order] = {}
    def add(self, order: Order) -> None:
        self._store[order.id] = order
    def get(self, order_id: UUID) -> Optional[Order]:
        return self._store.get(order_id)

# Composition root (e.g., FastAPI startup)
repo    = InMemoryOrderRepository()   # swap with SQLAlchemyOrderRepository

package main

import (
    "errors"
    "fmt"
    "github.com/google/uuid"

// ── Domain Ring ──────────────────────────────────────────────────────
type Order struct {
    ID    string
    Total float64
}

func NewOrder(total float64) (Order, error) {
    if total <= 0 {
        return Order{}, errors.New("total must be positive")
    }
    return Order{ID: uuid.NewString(), Total: total}, nil
}

// Repository interface lives in the domain package
type OrderRepository interface {
    Add(o Order) error
    Get(id string) (Order, error)
}

// ── Application Ring ──────────────────────────────────────────────────
type PlaceOrderUseCase struct{ repo OrderRepository }

func (uc *PlaceOrderUseCase) Execute(total float64) (string, error) {
    o, err := NewOrder(total)
    if err != nil { return "", err }
    if err := uc.repo.Add(o); err != nil { return "", err }
    return o.ID, nil
}

// ── Infrastructure Ring ───────────────────────────────────────────────
type InMemoryOrderRepo struct{ store map[string]Order }

func NewInMemoryOrderRepo() *InMemoryOrderRepo {
    return &InMemoryOrderRepo{store: make(map[string]Order)}
}
func (r *InMemoryOrderRepo) Add(o Order) error {
    r.store[o.ID] = o; return nil
}
func (r *InMemoryOrderRepo) Get(id string) (Order, error) {
    if o, ok := r.store[id]; ok { return o, nil }
    return Order{}, errors.New("not found")
}

func main() {
    repo := NewInMemoryOrderRepo()           // swap: NewPostgresOrderRepo()
    uc   := &PlaceOrderUseCase{repo: repo}
    id, _ := uc.Execute(99.99)
    fmt.Println("Order created:", id)
}`,

// ── Domain Ring ──────────────────────────────────────────────────────
#[derive(Clone)]
pub struct Order {
    pub id: Uuid,
    pub total: f64,
}
impl Order {
    pub fn create(total: f64) -> Result<Self, &'static str> {
        if total <= 0.0 { return Err("Total must be positive"); }
        Ok(Self { id: Uuid::new_v4(), total })
    }
}

// Repository trait defined in domain crate
pub trait OrderRepository {
    fn add(&mut self, order: Order);
    fn get(&self, id: &Uuid) -> Option<&Order>;
}

// ── Application Ring ──────────────────────────────────────────────────
pub struct PlaceOrderUseCase<R: OrderRepository> {
    repo: R,
}
impl<R: OrderRepository> PlaceOrderUseCase<R> {
    pub fn new(repo: R) -> Self { Self { repo } }
    pub fn execute(&mut self, total: f64) -> Result<Uuid, &'static str> {
        let order = Order::create(total)?;
        let id = order.id;
        self.repo.add(order);
        Ok(id)
    }
}

    pub fn new() -> Self { Self(HashMap::new()) }

    fn get(&self, id: &Uuid) -> Option<&Order> { self.0.get(id) }
}

from dataclasses import dataclass, field
from typing import List
import uuid

# Value Object (immutable, equality by value)
@dataclass(frozen=True)
class Money:
    amount: float; currency: str
    def add(self, other: "Money") -> "Money":
        assert self.currency == other.currency, "Currency mismatch"
        return Money(self.amount + other.amount, self.currency)

# Entity (mutable, has identity)
@dataclass
class OrderLine:
    id: str = field(default_factory=lambda: str(uuid.uuid4()))
    product_id: str = ""
    quantity: int = 0
    unit_price: Money = field(default_factory=lambda: Money(0, "USD"))
    @property
    def total(self): return Money(self.unit_price.amount * self.quantity, self.unit_price.currency)

# Aggregate Root
class Order:
    def __init__(self):
        self.id = str(uuid.uuid4())
        self._lines: List[OrderLine] = []
        self._events: list = []
    def add_line(self, product_id: str, qty: int, price: Money):
        if qty <= 0: raise ValueError("Quantity must be positive")
        self._lines.append(OrderLine(product_id=product_id, quantity=qty, unit_price=price))
    def submit(self):
        if not self._lines: raise ValueError("Empty order")
        total = sum(l.total.amount for l in self._lines)
        self._events.append({"type": "OrderSubmitted", "order_id": self.id, "total": total})
    def pop_events(self): events = self._events[:]; self._events.clear(); return events`,

use std::collections::VecDeque;

// Value Object (Copy, PartialEq, no identity)
#[derive(Clone, Copy, PartialEq, Debug)]
pub struct Money { pub amount: f64, pub currency: &'static str }
impl Money {
    pub fn add(self, other: Money) -> Result<Money, &'static str> {
        if self.currency != other.currency { return Err("Currency mismatch"); }
        Ok(Money { amount: self.amount + other.amount, ..self })
    }
}

// Entity (has identity, mutable)
pub struct OrderLine { pub id: uuid::Uuid, pub product_id: String, pub quantity: u32, pub unit_price: Money }
impl OrderLine { pub fn total(&self) -> Money { Money { amount: self.unit_price.amount * self.quantity as f64, ..self.unit_price } } }

// Aggregate Root
pub struct Order { pub id: uuid::Uuid, lines: Vec<OrderLine>, events: VecDeque<DomainEvent> }
impl Order {
    pub fn new() -> Self { Self { id: uuid::Uuid::new_v4(), lines: vec![], events: VecDeque::new() } }
    pub fn add_line(&mut self, pid: &str, qty: u32, price: Money) -> Result<(), &str> {
        if qty == 0 { return Err("Quantity must be positive"); }
        self.lines.push(OrderLine { id: uuid::Uuid::new_v4(), product_id: pid.into(), quantity: qty, unit_price: price });
        Ok(())
    }
    pub fn submit(&mut self) -> Result<(), &str> {
        if self.lines.is_empty() { return Err("Empty order"); }
        let total = self.lines.iter().map(|l| l.total().amount).sum();
        self.events.push_back(DomainEvent::OrderSubmitted { order_id: self.id, total });
        Ok(())
    }
    pub fn pop_events(&mut self) -> Vec<DomainEvent> { self.events.drain(..).collect() }
}`,

#include <stdexcept>

// Value Object
struct Money {
    double amount; std::string currency;
    bool operator==(const Money& o) const { return amount == o.amount && currency == o.currency; }
    Money add(const Money& o) const {
        if (currency != o.currency) throw std::runtime_error("Currency mismatch");
        return {amount + o.amount, currency};
    }
};

// Entity
struct OrderLine {
    std::string id, productId; int quantity; Money unitPrice;
    Money total() const { return {unitPrice.amount * quantity, unitPrice.currency}; }
};

// Domain Event
struct OrderSubmittedEvent { std::string orderId; double total; };

// Aggregate Root
class Order {
    std::string id_; std::vector<OrderLine> lines_;
    std::vector<OrderSubmittedEvent> events_;
public:
    explicit Order(std::string id) : id_(std::move(id)) {}
    void addLine(const std::string& pid, int qty, Money price) {
        if (qty <= 0) throw std::invalid_argument("Quantity must be positive");
        lines_.push_back({"line-" + std::to_string(lines_.size()), pid, qty, price});
    }
    void submit() {
        if (lines_.empty()) throw std::runtime_error("Empty order");
        double total = 0;
        for (auto& l : lines_) total += l.total().amount;
        events_.push_back({id_, total});
    }
    std::vector<OrderSubmittedEvent> popEvents() {
        auto e = events_; events_.clear(); return e;
    }

      csharp: `// Orchestration SAGA with MassTransit + State Machine
public class OrderSagaState : SagaStateMachineInstance
{
    public Guid CorrelationId { get; set; }
    public string CurrentState { get; set; } = "";
    public decimal Total { get; set; }
    public Guid CustomerId { get; set; }
}

public class OrderSaga : MassTransitStateMachine<OrderSagaState>
{
    public State PaymentPending { get; private set; } = default!;
    public State InventoryPending { get; private set; } = default!;
    public State Completed { get; private set; } = default!;
    public State Compensating { get; private set; } = default!;

    public Event<OrderCreated> OrderCreated { get; private set; } = default!;
    public Event<PaymentCharged> PaymentCharged { get; private set; } = default!;
    public Event<PaymentFailed> PaymentFailed { get; private set; } = default!;
    public Event<StockReserved> StockReserved { get; private set; } = default!;
    public Event<StockUnavailable> StockUnavailable { get; private set; } = default!;

    public OrderSaga()
    {
        InstanceState(x => x.CurrentState);
        Event(() => OrderCreated,   cfg => cfg.CorrelateById(m => m.Message.OrderId));
        Event(() => PaymentCharged, cfg => cfg.CorrelateById(m => m.Message.OrderId));
        Event(() => StockReserved,  cfg => cfg.CorrelateById(m => m.Message.OrderId));

        Initially(
            When(OrderCreated)
                .Then(ctx => ctx.Saga.Total = ctx.Message.Total)
                .Publish(ctx => new ChargePayment(ctx.Saga.CorrelationId, ctx.Saga.Total))
                .TransitionTo(PaymentPending));

        During(PaymentPending,
            When(PaymentCharged)
                .Publish(ctx => new ReserveStock(ctx.Saga.CorrelationId))
                .TransitionTo(InventoryPending),
            When(PaymentFailed)
                .TransitionTo(Compensating)
                .Finalize());

        During(InventoryPending,
            When(StockReserved).TransitionTo(Completed).Finalize(),
            When(StockUnavailable)
                .Publish(ctx => new RefundPayment(ctx.Saga.CorrelationId, ctx.Saga.Total))
                .TransitionTo(Compensating).Finalize());
    }
}`,

      go: `// SAGA orchestrator with Go state machine
package saga

type SagaState int
const (
    Pending SagaState = iota
    PaymentCharged
    StockReserved
    Completed
    Compensating
    Failed
)

type OrderSaga struct {
    OrderID   string
    State     SagaState
    Total     float64
    Commands  chan SagaCommand
}

type SagaCommand struct { Type string; OrderID string; Payload any }

func (s *OrderSaga) Run(paymentSvc PaymentService, stockSvc StockService) {
    // Step 1: charge payment
    if err := paymentSvc.Charge(s.OrderID, s.Total); err != nil {
        s.State = Failed; return
    }
    s.State = PaymentCharged

    // Step 2: reserve stock
    if err := stockSvc.Reserve(s.OrderID); err != nil {
        // Compensate: refund payment
        s.State = Compensating
        paymentSvc.Refund(s.OrderID, s.Total)
        s.State = Failed
        return
    }
    s.State = StockReserved
    s.State = Completed
}`,
      rust: `// SAGA state machine in Rust
#[derive(Debug, PartialEq, Clone)]
enum SagaState { Pending, PaymentCharged, StockReserved, Completed, Compensating, Failed }

struct OrderSaga { order_id: String, total: f64, state: SagaState }

impl OrderSaga {
    fn new(order_id: &str, total: f64) -> Self {
        Self { order_id: order_id.into(), total, state: SagaState::Pending }
    }

    async fn execute<P: PaymentService, S: StockService>(
        &mut self, payment: &P, stock: &S
    ) -> anyhow::Result<()> {
        // Step 1
        if payment.charge(&self.order_id, self.total).await.is_err() {
            self.state = SagaState::Failed;
            return Err(anyhow::anyhow!("Payment failed"));
        }
        self.state = SagaState::PaymentCharged;

        // Step 2
        if stock.reserve(&self.order_id).await.is_err() {
            self.state = SagaState::Compensating;
            payment.refund(&self.order_id, self.total).await.ok();
            self.state = SagaState::Failed;
            return Err(anyhow::anyhow!("Stock failed, compensated"));
        }
        self.state = SagaState::Completed;
        Ok(())
    }
}`,

enum class SagaState { Pending, PaymentCharged, StockReserved, Completed, Failed };

    std::string name;
    std::function<bool()> execute;
    std::function<void()> compensate;
};

class OrderSaga {
    std::string orderId_; double total_;
    SagaState state_ = SagaState::Pending;
    std::vector<SagaStep> executed_;
public:
    OrderSaga(std::string id, double total) : orderId_(std::move(id)), total_(total) {}
    void run(std::vector<SagaStep> steps) {
        for (auto& step : steps) {
            std::cout << "[Saga] Executing: " << step.name << "\n";
            if (!step.execute()) {
                std::cout << "[Saga] Failed at: " << step.name << ", compensating…\n";
                for (auto it = executed_.rbegin(); it != executed_.rend(); ++it)
                    it->compensate();
                state_ = SagaState::Failed; return;
            }
            executed_.push_back(step);
        }
        state_ = SagaState::Completed;
        std::cout << "[Saga] Completed for " << orderId_ << "\n";

        return err
    })
    g.Go(func() error {
        o, err := fetchOrders(ctx, userID, 5)

        return err
    })

    })

    json.NewEncoder(w).Encode(resp)

from thespian.actors import Actor, ActorSystem

class OrderActor(Actor):
    def receiveMessage(self, msg, sender):
        if isinstance(msg, dict) and msg.get("type") == "place_order":
            total = msg["total"]
            if total <= 0:
                self.send(sender, {"error": "Total must be positive"})
                return
            order_id = f"ord-{id(self)}"
            # Forward to payment actor
            payment_ref = self.createActor(PaymentActor)
            self.send(payment_ref, {"type": "charge", "order_id": order_id, "amount": total})
            self.send(sender, {"order_id": order_id, "status": "processing"})

    def receiveMessage(self, msg, sender):

    go: `// Go Actor Model — Proto.Actor
package main

import (
    "fmt"
    "github.com/asynkron/protoactor-go/actor"
)

// Messages (immutable structs)
type PlaceOrder struct{ Total float64 }
type OrderPlaced struct{ ID string }

// Actor behaviour
type OrderActor struct{ notifyPID *actor.PID }

func (a *OrderActor) Receive(ctx actor.Context) {
    switch msg := ctx.Message().(type) {
    case *PlaceOrder:
        if msg.Total <= 0 {
            ctx.Respond(fmt.Errorf("total must be positive"))
            return
        }
        id := fmt.Sprintf("ord-%p", ctx.Self())
        // Send to another actor
        if a.notifyPID != nil {
            ctx.Send(a.notifyPID, &OrderPlaced{ID: id})
        }
        ctx.Respond(&OrderPlaced{ID: id})
    }
}

func main() {
    system := actor.NewActorSystem()
    props  := actor.PropsFromProducer(func() actor.Actor { return &OrderActor{} })
    pid    := system.Root.Spawn(props)
    future := system.Root.RequestFuture(pid, &PlaceOrder{Total: 99.99}, -1)
    result, _ := future.Result()
    fmt.Println("Order:", result.(*OrderPlaced).ID)
}`,

use actix::prelude::*;

// Message types
#[derive(Message)] #[rtype(result = "Result<String, String>")]
struct PlaceOrder { total: f64 }

#[derive(Message)] #[rtype(result = "()")]
struct OrderPlaced { id: String }

// Actor
struct OrderActor {
    notify: Option<Addr<NotifyActor>>,
}

impl Actor for OrderActor {
    type Context = Context<Self>;
}

impl Handler<PlaceOrder> for OrderActor {
    type Result = Result<String, String>;

    fn handle(&mut self, msg: PlaceOrder, _: &mut Context<Self>) -> Self::Result {
        if msg.total <= 0.0 { return Err("Total must be positive".into()); }
        let id = format!("ord-{}", uuid::Uuid::new_v4());
        if let Some(ref notify) = self.notify {
            notify.do_send(OrderPlaced { id: id.clone() });
        }
        Ok(id)
    }
}

            auto notifier = self->spawn([](event_based_actor* a) -> behavior {
                return {
                    [](notify_atom, const std::string& id) {
                        aout(a) << "Notification: order " << id << " placed\\n";
                    }
                };
            });
            self->send(notifier, notify_atom_v, order_id);
            return order_id;
        }
    };
}

void caf_main(actor_system& sys) {
    auto actor = sys.spawn(order_actor);
    scoped_actor self{sys};
    self->request(actor, infinite, place_order_atom_v, 99.99)
        .receive(
            [](const std::string& id) { std::cout << "Order: " << id << "\\n"; },
            [](const error& e)        { std::cerr << "Error: " << to_string(e) << "\\n"; }
        );
}
CAF_MAIN(id_block::orders)`
  }

  origin: {

  },
  description: {
    en: "JAMstack decouples the frontend from the backend by pre-building all pages as static HTML/CSS/JS at build time (SSG) or at request time at the CDN edge (ISR/DSG). Dynamic behavior is added via client-side JavaScript calling headless APIs. Pages are served from a global CDN with no origin server needed for most requests. Modern JAMstack extends to SSR-at-edge with frameworks like Next.js, Astro, and Remix.",
