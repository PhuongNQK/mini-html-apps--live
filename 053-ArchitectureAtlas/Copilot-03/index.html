<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Architecture Atlas — AA Reference for C#, Python, Go, Rust, Java, JS, C++</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
:root{
  --bg:#f4f6f2;--panel:#ffffff;--text:#121f16;--muted:#5a6b5e;
  --accent:#0f766e;--accent2:#f59e0b;--accent3:#6366f1;
  --border:#d5dbd2;--shadow:0 10px 28px rgba(10,35,20,.08);
  --chip:#edf3eb;--chip-text:#1e3d28;
  --ok:#166534;--warn:#9a4f00;--danger:#9b1c1c;
  --code-bg:#282c34;--hero-grad:radial-gradient(circle at 18% 8%,#d4f5e4 0%,#f0ede4 42%,#f4f6f2 100%);
  --tag-bg:#e0f2fe;--tag-text:#0369a1;
  --radius:14px;--radius-sm:8px;
}
body.dark{
  --bg:#0e1712;--panel:#162019;--text:#eaf3ec;--muted:#8fad9a;
  --accent:#2dd4bf;--accent2:#fbbf24;--accent3:#818cf8;
  --border:#243229;--shadow:0 12px 32px rgba(0,0,0,.4);
  --chip:#1c2e22;--chip-text:#c9edda;
  --ok:#4ade80;--warn:#f6ab55;--danger:#f87171;
  --code-bg:#0d1117;--hero-grad:radial-gradient(circle at 18% 8%,#132e1e 0%,#1b202b 42%,#0e1712 100%);
  --tag-bg:#1e3a5f;--tag-text:#7dd3fc;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Space Grotesk",sans-serif;background:var(--hero-grad);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
a{color:var(--accent);text-decoration:none}
code,pre{font-family:"IBM Plex Mono",monospace}

/* ── Layout ── */
.wrap{width:min(1220px,95vw);margin:0 auto;padding:20px 0 60px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── Sticky header ── */
.header{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 24px;
  box-shadow:var(--shadow);position:sticky;top:10px;z-index:100;backdrop-filter:blur(8px)}
.header-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:1.25rem;font-weight:700;color:var(--accent);white-space:nowrap}
.logo span{color:var(--accent2)}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:420px}
.search-wrap input{width:100%;padding:8px 36px 8px 14px;border:1.5px solid var(--border);border-radius:40px;
  background:var(--bg);color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;
  color:var(--muted);font-size:1rem;display:none}
.header-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 14px;border:1.5px solid var(--border);border-radius:40px;background:var(--chip);
  color:var(--chip-text);font-size:.83rem;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap}
.btn:hover,.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-icon{padding:7px 10px}

/* ── Filter bar ── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.filter-label{font-size:.8rem;color:var(--muted);align-self:center;white-space:nowrap}
.chip{padding:4px 12px;border-radius:20px;background:var(--chip);color:var(--chip-text);
  font-size:.78rem;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Nav tabs ── */
.nav-tabs{display:flex;gap:4px;margin:18px 0 0;flex-wrap:wrap}
.nav-tab{padding:9px 18px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--panel);
  border:1px solid var(--border);border-bottom:none;cursor:pointer;font-size:.88rem;font-weight:600;
  color:var(--muted);transition:all .18s}
.nav-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-content{display:none;background:var(--panel);border:1px solid var(--border);border-radius:0 var(--radius) var(--radius) var(--radius);
  padding:24px;box-shadow:var(--shadow)}
.tab-content.active{display:block;animation:fadeIn .3s ease}

/* ── Section ── */
.section{margin-bottom:24px}
.section-title{font-size:1.05rem;font-weight:700;color:var(--accent);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.section-title .caret{transition:transform .2s;font-size:.8rem}
.section-title.collapsed .caret{transform:rotate(-90deg)}
.section-body{transition:all .2s}
.section-body.collapsed{display:none}

/* ── Cards ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(0,0,0,.12)}
.card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-icon{width:38px;height:38px;border-radius:10px;background:var(--chip);display:flex;
  align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.card-title{font-size:1rem;font-weight:700;line-height:1.3}
.card-subtitle{font-size:.8rem;color:var(--muted);margin-top:2px}
.card-desc{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:10px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:3px 9px;border-radius:20px;background:var(--tag-bg);color:var(--tag-text);font-size:.72rem;font-weight:600}
.tag.level-foundational{background:#dcfce7;color:#166534}
.tag.level-intermediate{background:#fef9c3;color:#854d0e}
.tag.level-advanced{background:#fee2e2;color:#9b1c1c}
body.dark .tag.level-foundational{background:#14532d;color:#86efac}
body.dark .tag.level-intermediate{background:#431407;color:#fed7aa}
body.dark .tag.level-advanced{background:#450a0a;color:#fca5a5}

/* ── Detail modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;
  align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;animation:fadeIn .2s}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  width:min(900px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;
  background:var(--panel);border-radius:var(--radius) var(--radius) 0 0;z-index:10}
.modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);
  line-height:1;padding:4px;border-radius:6px;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px;max-height:80vh;overflow-y:auto}

/* ── Detail sections ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:640px){.detail-grid{grid-template-columns:1fr}}
.detail-box{background:var(--chip);border-radius:var(--radius-sm);padding:14px}
.detail-box h4{font-size:.82rem;font-weight:700;color:var(--accent);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:8px}
.detail-box p,.detail-box li{font-size:.875rem;color:var(--text);line-height:1.7}
.detail-box ul{padding-left:16px}

/* ── SPAMF bars ── */
.spamf-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
@media(max-width:600px){.spamf-grid{grid-template-columns:1fr 1fr}}
.spamf-item{background:var(--chip);border-radius:var(--radius-sm);padding:12px;text-align:center}
.spamf-label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.spamf-score{font-size:1.4rem;font-weight:700}
.spamf-bar{height:5px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden}
.spamf-bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .5s ease}
.spamf-note{font-size:.73rem;color:var(--muted);margin-top:5px;line-height:1.5}

/* ── Language tabs ── */
.lang-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:0}
.lang-tab{padding:6px 14px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--chip);
  border:1px solid var(--border);border-bottom:none;cursor:pointer;font-size:.82rem;font-weight:600;
  color:var(--muted);transition:all .15s}
.lang-tab.active{background:var(--code-bg);color:#abb2bf;border-color:var(--code-bg)}
.hidden{display:none!important}
.lang-code-block{background:var(--code-bg);border-radius:0 var(--radius-sm) var(--radius-sm) var(--radius-sm);
  padding:16px;overflow-x:auto}
.lang-code-block pre{margin:0;white-space:pre;font-size:.82rem;line-height:1.65}
.lang-code-block code{background:none!important;padding:0!important;font-size:inherit!important}
.code-missing{padding:20px;color:var(--muted);font-style:italic;font-size:.85rem;background:var(--code-bg);
  border-radius:0 var(--radius-sm) var(--radius-sm) var(--radius-sm)}

/* ── Tables ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
thead th{background:var(--chip);color:var(--chip-text);padding:10px 14px;text-align:left;
  font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
thead th:hover{color:var(--accent)}
tbody tr{border-top:1px solid var(--border);transition:background .15s}
tbody tr:hover{background:var(--chip)}
tbody td{padding:10px 14px;vertical-align:top;line-height:1.55}
tbody td.na{color:var(--muted);font-style:italic}
.sort-icon{margin-left:4px;opacity:.5;font-size:.75rem}
thead th.sorted .sort-icon{opacity:1;color:var(--accent)}
.match-highlight{background:var(--accent2);color:#000;border-radius:3px;padding:0 2px}

/* ── Mermaid ── */
.mermaid-wrap{background:var(--chip);border-radius:var(--radius-sm);padding:16px;overflow-x:auto;margin-bottom:16px}
.mermaid-wrap .mermaid{max-width:100%}

/* ── Complexity badge ── */
.complexity-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:500px){.complexity-grid{grid-template-columns:1fr}}
.complexity-item{background:var(--chip);border-radius:var(--radius-sm);padding:12px}
.complexity-item h4{font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.complexity-item p{font-size:.83rem;color:var(--text)}

/* ── Category/complexity table ── */
.cat-level-header{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.cat-level-header .level-badge{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:700}

/* ── No results ── */
.no-results{padding:40px;text-align:center;color:var(--muted);font-size:.9rem}

/* ── Responsive ── */
@media(max-width:700px){
  .header-row{gap:8px}
  .detail-grid{grid-template-columns:1fr}
  .spamf-grid{grid-template-columns:1fr 1fr}
  .lang-tab{padding:5px 10px;font-size:.76rem}
  table{font-size:.76rem}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="header-row">
      <div class="logo">Architecture<span>Atlas</span></div>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search architectures, concepts, languages…" autocomplete="off"/>
        <span class="search-clear" id="searchClear">✕</span>
      </div>
      <div class="header-btns">
        <button class="btn btn-icon" id="themeToggle" title="Toggle theme">🌙</button>
        <button class="btn btn-icon" id="langToggle" title="Toggle language">🇻🇳</button>
      </div>
    </div>
    <div class="filter-bar">
      <span class="filter-label" data-i18n="filter_level">Level:</span>
      <span class="chip active" data-filter="level" data-val="all"    data-i18n="all">All</span>
      <span class="chip" data-filter="level" data-val="foundational"  data-i18n="foundational">Foundational</span>
      <span class="chip" data-filter="level" data-val="intermediate"  data-i18n="intermediate">Intermediate</span>
      <span class="chip" data-filter="level" data-val="advanced"      data-i18n="advanced">Advanced</span>
      <span style="width:1px;background:var(--border);align-self:stretch;margin:0 4px"></span>
      <span class="filter-label" data-i18n="filter_lang">Lang:</span>
      <span class="chip active" data-filter="lang" data-val="all"  data-i18n="all">All</span>
      <span class="chip" data-filter="lang" data-val="csharp">C#</span>
      <span class="chip" data-filter="lang" data-val="python">Python</span>
      <span class="chip" data-filter="lang" data-val="go">Go</span>
      <span class="chip" data-filter="lang" data-val="rust">Rust</span>
      <span class="chip" data-filter="lang" data-val="java">Java</span>
      <span class="chip" data-filter="lang" data-val="javascript">JS</span>
      <span class="chip" data-filter="lang" data-val="cpp">C++</span>
    </div>
  </div>

  <!-- ── NAV TABS ── -->
  <div class="nav-tabs">
    <div class="nav-tab active" data-tab="catalog"    data-i18n="tab_catalog">AA Catalog</div>
    <div class="nav-tab"        data-tab="matrix"     data-i18n="tab_matrix">Cross-Language Matrix</div>
    <div class="nav-tab"        data-tab="blocks"     data-i18n="tab_blocks">Building Blocks</div>
    <div class="nav-tab"        data-tab="langmap"    data-i18n="tab_langmap">Language Mapping</div>
    <div class="nav-tab"        data-tab="tooling"    data-i18n="tab_tooling">Tooling</div>
    <div class="nav-tab"        data-tab="categories" data-i18n="tab_categories">By Category</div>
  </div>

  <!-- ── TAB: CATALOG ── -->
  <div class="tab-content active" id="tab-catalog">
    <div id="catalogGrid" class="card-grid"></div>
    <div class="no-results" id="catalogNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: MATRIX ── -->
  <div class="tab-content" id="tab-matrix">
    <div class="tbl-wrap"><table id="matrixTable"><thead id="matrixHead"></thead><tbody id="matrixBody"></tbody></table></div>
    <div class="no-results" id="matrixNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: BUILDING BLOCKS ── -->
  <div class="tab-content" id="tab-blocks">
    <div class="tbl-wrap"><table id="blocksTable"><thead id="blocksHead"></thead><tbody id="blocksBody"></tbody></table></div>
    <div class="no-results" id="blocksNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: LANGUAGE MAPPING ── -->
  <div class="tab-content" id="tab-langmap">
    <div class="tbl-wrap"><table id="langmapTable"><thead id="langmapHead"></thead><tbody id="langmapBody"></tbody></table></div>
    <div class="no-results" id="langmapNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: TOOLING ── -->
  <div class="tab-content" id="tab-tooling">
    <div class="tbl-wrap"><table id="toolingTable"><thead id="toolingHead"></thead><tbody id="toolingBody"></tbody></table></div>
    <div class="no-results" id="toolingNoResults" style="display:none" data-i18n="no_results">No results found.</div>
  </div>

  <!-- ── TAB: BY CATEGORY ── -->
  <div class="tab-content" id="tab-categories">
    <div class="no-results" id="categoryNoResults" style="display:none" data-i18n="no_results">No results found.</div>
    <div id="categoryView"></div>
  </div>

</div><!-- /wrap -->

<!-- ── DETAIL MODAL ── -->
<div class="modal-overlay" id="modalOverlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div>
        <div class="card-title" id="modalTitle"></div>
        <div class="card-subtitle" id="modalSubtitle"></div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ── 02-data-arch-1.js : Foundational Architectures ──────────────────────────
// Covers: Monolithic, Layered/N-Tier, MVC, Client-Server, Repository Pattern

const ARCH_FOUNDATIONAL = [
  // ────────────────────────────────────────────────────────
  {
    id: "monolithic",
    level: "foundational",
    icon: "🧱",
    category: ["web", "desktop", "mobile"],
    businessModel: ["startup", "saas", "enterprise"],
    name: { en: "Monolithic Architecture", vi: "Kiến trúc Nguyên khối" },
    origin: {
      en: "Dominant paradigm from the 1960s–2000s. All application layers (UI, business logic, data access) compiled and deployed as a single executable or process.",
      vi: "Mô hình phổ biến từ những năm 1960–2000. Tất cả các lớp ứng dụng (UI, logic nghiệp vụ, truy cập dữ liệu) được biên dịch và triển khai dưới dạng một tiến trình/tệp thực thi duy nhất."
    },
    description: {
      en: "A single deployable unit containing all application functionality. Components share the same process, memory, and database. Simple to develop initially but becomes a 'big ball of mud' as the system grows.",
      vi: "Một đơn vị triển khai duy nhất chứa toàn bộ chức năng ứng dụng. Các thành phần chia sẻ cùng tiến trình, bộ nhớ và cơ sở dữ liệu. Đơn giản khi phát triển ban đầu nhưng trở thành 'mớ hỗn độn' khi hệ thống tăng trưởng."
    },
    coreConceptsTools: {
      en: "Single process, shared memory, monorepo, ORM (Entity Framework, SQLAlchemy, GORM, Diesel, Hibernate, Sequelize), MVC/MVT framework (Spring MVC, Django, Rails, ASP.NET MVC), single database.",
      vi: "Tiến trình đơn, bộ nhớ dùng chung, monorepo, ORM (Entity Framework, SQLAlchemy, GORM, Diesel, Hibernate, Sequelize), framework MVC/MVT (Spring MVC, Django, Rails, ASP.NET MVC), cơ sở dữ liệu đơn."
    },
    whenToUse: {
      en: "Small-to-medium teams; early-stage startups validating an MVP; simple domain with low traffic; when deployment simplicity outweighs future scalability needs.",
      vi: "Nhóm nhỏ đến trung bình; khởi nghiệp giai đoạn đầu xác nhận MVP; miền nghiệp vụ đơn giản, lưu lượng thấp; khi sự đơn giản trong triển khai quan trọng hơn nhu cầu mở rộng tương lai."
    },
    pros: {
      en: ["Simple local development & debugging", "Easy end-to-end testing", "Low operational overhead", "No network latency between components", "Straightforward transaction management"],
      vi: ["Phát triển và gỡ lỗi cục bộ đơn giản", "Kiểm thử đầu cuối dễ dàng", "Chi phí vận hành thấp", "Không có độ trễ mạng giữa các thành phần", "Quản lý giao dịch đơn giản"]
    },
    cons: {
      en: ["Poor scalability (scale all-or-nothing)", "Long build/deploy cycles as codebase grows", "Technology lock-in", "Single point of failure", "High coupling hinders independent team work"],
      vi: ["Khả năng mở rộng kém (phải mở rộng toàn bộ)", "Chu kỳ build/deploy dài khi codebase tăng", "Bị ràng buộc công nghệ", "Điểm thất bại đơn lẻ", "Khớp nối cao cản trở làm việc nhóm độc lập"]
    },
    spamf: {
      security:        { score: 3, note: { en: "Single codebase can be audited easily, but a breach affects everything.", vi: "Codebase đơn dễ kiểm tra bảo mật nhưng một lỗ hổng ảnh hưởng toàn bộ." } },
      performance:     { score: 4, note: { en: "No inter-service network calls; in-process communication is fast.", vi: "Không có gọi mạng giữa dịch vụ; giao tiếp trong tiến trình rất nhanh." } },
      availability:    { score: 2, note: { en: "One crash brings the whole application down.", vi: "Một lỗi sập toàn bộ ứng dụng." } },
      maintainability: { score: 2, note: { en: "Grows into spaghetti code without discipline; tight coupling.", vi: "Dễ trở thành mã nguồn rối nếu thiếu kỷ luật; khớp nối chặt." } },
      flexibility:     { score: 2, note: { en: "Hard to adopt new tech stacks for parts of the app.", vi: "Khó áp dụng stack công nghệ mới cho từng phần của ứng dụng." } }

func listProducts(w http.ResponseWriter, r *http.Request) {
    rows, _ := db.Query("SELECT id, name FROM products")

    var out []map[string]any

        var id int; var name string

use actix_web::{get, web, App, HttpServer, Responder, HttpResponse};
use rusqlite::{Connection, params};
use serde::Serialize;
use std::sync::Mutex;

#[derive(Serialize)]
struct Product { id: i64, name: String }

struct AppState { db: Mutex<Connection> }

#[get("/products")]
async fn list_products(data: web::Data<AppState>) -> impl Responder {
    let conn = data.db.lock().unwrap();
    let mut stmt = conn.prepare("SELECT id, name FROM products").unwrap();
    let products: Vec<Product> = stmt
        .query_map([], |r| Ok(Product { id: r.get(0)?, name: r.get(1)? }))
        .unwrap().filter_map(|r| r.ok()).collect();

}

public interface IProductRepository

public class EfProductRepository(AppDbContext db) : IProductRepository
{
    public Task<Product?> FindByIdAsync(int id) => db.Products.FindAsync(id).AsTask();
    public Task<IReadOnlyList<Product>> GetAllAsync() =>
        db.Products.ToListAsync().ContinueWith(t => (IReadOnlyList<Product>)t.Result);
    public async Task AddAsync(Product product) { db.Products.Add(product); await db.SaveChangesAsync(); }
    public async Task UpdateAsync(Product product) { db.Products.Update(product); await db.SaveChangesAsync(); }
    public async Task DeleteAsync(int id) {

    }
}

from typing import Protocol, List, Optional
from dataclasses import dataclass, field

@dataclass
class Product: id: int; name: str; price: float

class ProductRepository(Protocol):
    def find_by_id(self, id: int) -> Optional[Product]: ...
    def find_all(self) -> List[Product]: ...
    def save(self, product: Product) -> None: ...
    def delete(self, id: int) -> None: ...

# SQLAlchemy concrete implementation
class SqlProductRepository:
    def __init__(self, session): self._s = session
    def find_by_id(self, id): return self._s.get(ProductModel, id)

#include <optional>
#include <vector>
#include <memory>

struct Product { int id; std::string name; double price; };

class IProductRepository {
public:
    virtual ~IProductRepository() = default;
    virtual std::optional<Product> findById(int id) = 0;
    virtual std::vector<Product> findAll() = 0;
    virtual void save(const Product& p) = 0;
    virtual void remove(int id) = 0;
};

// In-memory implementation
class InMemoryProductRepository : public IProductRepository {
    std::vector<Product> data_;
public:
    std::optional<Product> findById(int id) override {
        for (auto& p : data_) if (p.id == id) return p;
        return std::nullopt;
    }
    std::vector<Product> findAll() override { return data_; }
    void save(const Product& p) override {
        for (auto& x : data_) if (x.id == p.id) { x = p; return; }
        data_.push_back(p);
    }
    void remove(int id) override {
        data_.erase(std::remove_if(data_.begin(), data_.end(),
            [id](auto& p){ return p.id == id; }), data_.end());
    }

use rdkafka::{
    consumer::{Consumer, StreamConsumer},
    producer::{FutureProducer, FutureRecord},

use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
struct OrderCreatedEvent { order_id: String, total: f64 }

async fn produce(producer: &FutureProducer, event: &OrderCreatedEvent) {
    let payload = serde_json::to_string(event).unwrap();
    producer.send(FutureRecord::to("order.created").payload(&payload).key(&event.order_id),
        std::time::Duration::from_secs(5)).await.unwrap();
    println!("[Producer] Published order {}", event.order_id);
}

async fn consume() {
    let consumer: StreamConsumer = ClientConfig::new()
        .set("bootstrap.servers", "localhost:9092")
        .set("group.id", "email-service")
        .set("auto.offset.reset", "earliest")
        .create().unwrap();
    consumer.subscribe(&["order.created"]).unwrap();
    loop {
        let msg = consumer.recv().await.unwrap();
        if let Some(payload) = msg.payload() {
            let evt: OrderCreatedEvent = serde_json::from_slice(payload).unwrap();
            println!("[Consumer] Sending email for order {}", evt.order_id);
        }
    }
}`,

void produceOrderCreated(const std::string& orderId, double total) {
    std::string errstr;
    auto* conf = RdKafka::Conf::create(RdKafka::Conf::CONF_GLOBAL);
    conf->set("bootstrap.servers", "localhost:9092", errstr);
    auto* producer = RdKafka::Producer::create(conf, errstr);
    json event = {{"order_id", orderId}, {"total", total}};
    std::string payload = event.dump();
    producer->produce("order.created", RdKafka::Topic::PARTITION_UA,
        RdKafka::Producer::RK_MSG_COPY, payload.data(), payload.size(), nullptr, nullptr);
    producer->flush(5000);
    std::cout << "[Producer] Published: " << orderId << "\n";
    delete producer;
}

// Consumer (simplified polling loop)

class CommandBus {

  register(CommandClass, handler) { this.handlers[CommandClass.name] = handler; }

      cpp: `// CQRS C++ with template-based handler registry
#include <functional>
#include <unordered_map>
#include <typeindex>
#include <any>
#include <stdexcept>

struct CreateProductCommand { std::string name; double price; };
struct GetProductQuery      { int id; };
struct ProductView          { int id; std::string name; double price; };

class Mediator {
    std::unordered_map<std::type_index, std::function<std::any(std::any)>> handlers_;
public:
    template<typename Cmd, typename Result>
    void registerHandler(std::function<Result(Cmd)> fn) {
        handlers_[typeid(Cmd)] = [fn](std::any cmd) -> std::any {
            return fn(std::any_cast<Cmd>(cmd));
        };
    }
    template<typename Result, typename Cmd>
    Result send(Cmd cmd) {
        auto it = handlers_.find(typeid(Cmd));
        if (it == handlers_.end()) throw std::runtime_error("No handler");
        return std::any_cast<Result>(it->second(cmd));
    }
};

int main() {
    Mediator m;
    std::map<int,ProductView> store;
    m.registerHandler<int, CreateProductCommand>([&](CreateProductCommand cmd) -> int {
        int id = store.size() + 1;
        store[id] = {id, cmd.name, cmd.price};
        return id;
    });
    m.registerHandler<ProductView, GetProductQuery>([&](GetProductQuery q) -> ProductView {
        return store.at(q.id);
    });
    int id = m.send<int>(CreateProductCommand{"Widget", 9.99});
    auto pv = m.send<ProductView>(GetProductQuery{id});
    printf("Product: %s @ %.2f\n", pv.name.c_str(), pv.price);
}`

public interface IOrderRepository   { Task<Order?> FindByIdAsync(Guid id); Task SaveAsync(Order order); }
public interface IPaymentGateway    { Task<bool> ChargeAsync(Guid customerId, decimal amount); }

public class PlaceOrderUseCase(IOrderRepository orders, IPaymentGateway payments)
{
    public async Task<Guid> ExecuteAsync(Guid customerId, decimal total)
    {
        bool charged = await payments.ChargeAsync(customerId, total);
        if (!charged) throw new InvalidOperationException("Payment failed");
        var order = Order.Create(customerId, total);
        await orders.SaveAsync(order);
        return order.Id;
    }
}

# ── Secondary Ports (outbound) ──
class OrderRepository(ABC):
    @abstractmethod
    def save(self, order: "Order") -> None: ...
    @abstractmethod
    def find_by_id(self, order_id: str) -> "Order | None": ...

class PaymentGateway(ABC):
    @abstractmethod
    def charge(self, customer_id: str, amount: float) -> bool: ...

# ── Domain Model ──
@dataclass
class Order:
    id: str; customer_id: str; total: float; status: str = "pending"
    @classmethod
    def create(cls, customer_id: str, total: float) -> "Order":
        return cls(id=str(uuid.uuid4()), customer_id=customer_id, total=total)

# ── Use Case (Application Core) ──
class PlaceOrderUseCase:
    def __init__(self, orders: OrderRepository, payments: PaymentGateway):
        self._orders = orders; self._payments = payments
    def execute(self, customer_id: str, total: float) -> str:
        if not self._payments.charge(customer_id, total):
            raise ValueError("Payment failed")
        order = Order.create(customer_id, total)
        order.status = "confirmed"
        self._orders.save(order)
        return order.id

# ── Secondary Adapters ──
class InMemoryOrderRepository(OrderRepository):
    def __init__(self): self._store: dict = {}
    def save(self, order): self._store[order.id] = order
    def find_by_id(self, oid): return self._store.get(oid)

    def charge(self, customer_id, amount): return True

    Order execute(const std::string& id) {

        opt->confirm();
        repo_.save(*opt);
        return *opt;

      csharp: `// Orchestration SAGA with MassTransit + State Machine
public class OrderSagaState : SagaStateMachineInstance
{
    public Guid CorrelationId { get; set; }
    public string CurrentState { get; set; } = "";
    public decimal Total { get; set; }
    public Guid CustomerId { get; set; }
}

public class OrderSaga : MassTransitStateMachine<OrderSagaState>
{
    public State PaymentPending { get; private set; } = default!;
    public State InventoryPending { get; private set; } = default!;
    public State Completed { get; private set; } = default!;
    public State Compensating { get; private set; } = default!;

    public Event<OrderCreated> OrderCreated { get; private set; } = default!;
    public Event<PaymentCharged> PaymentCharged { get; private set; } = default!;
    public Event<PaymentFailed> PaymentFailed { get; private set; } = default!;
    public Event<StockReserved> StockReserved { get; private set; } = default!;
    public Event<StockUnavailable> StockUnavailable { get; private set; } = default!;

    public OrderSaga()
    {
        InstanceState(x => x.CurrentState);
        Event(() => OrderCreated,   cfg => cfg.CorrelateById(m => m.Message.OrderId));
        Event(() => PaymentCharged, cfg => cfg.CorrelateById(m => m.Message.OrderId));
        Event(() => StockReserved,  cfg => cfg.CorrelateById(m => m.Message.OrderId));

        Initially(
            When(OrderCreated)
                .Then(ctx => ctx.Saga.Total = ctx.Message.Total)
                .Publish(ctx => new ChargePayment(ctx.Saga.CorrelationId, ctx.Saga.Total))
                .TransitionTo(PaymentPending));

        During(PaymentPending,
            When(PaymentCharged)
                .Publish(ctx => new ReserveStock(ctx.Saga.CorrelationId))
                .TransitionTo(InventoryPending),
            When(PaymentFailed)
                .TransitionTo(Compensating)
                .Finalize());

        During(InventoryPending,
            When(StockReserved).TransitionTo(Completed).Finalize(),
            When(StockUnavailable)
                .Publish(ctx => new RefundPayment(ctx.Saga.CorrelationId, ctx.Saga.Total))
                .TransitionTo(Compensating).Finalize());
    }
}`,

      go: `// SAGA orchestrator with Go state machine
package saga

type SagaState int
const (
    Pending SagaState = iota
    PaymentCharged
    StockReserved
    Completed
    Compensating
    Failed
)

type OrderSaga struct {
    OrderID   string
    State     SagaState
    Total     float64
    Commands  chan SagaCommand
}

type SagaCommand struct { Type string; OrderID string; Payload any }

func (s *OrderSaga) Run(paymentSvc PaymentService, stockSvc StockService) {
    // Step 1: charge payment
    if err := paymentSvc.Charge(s.OrderID, s.Total); err != nil {
        s.State = Failed; return
    }
    s.State = PaymentCharged

    // Step 2: reserve stock
    if err := stockSvc.Reserve(s.OrderID); err != nil {
        // Compensate: refund payment
        s.State = Compensating
        paymentSvc.Refund(s.OrderID, s.Total)
        s.State = Failed
        return
    }
    s.State = StockReserved
    s.State = Completed
}`,
      rust: `// SAGA state machine in Rust
#[derive(Debug, PartialEq, Clone)]
enum SagaState { Pending, PaymentCharged, StockReserved, Completed, Compensating, Failed }

struct OrderSaga { order_id: String, total: f64, state: SagaState }

impl OrderSaga {
    fn new(order_id: &str, total: f64) -> Self {
        Self { order_id: order_id.into(), total, state: SagaState::Pending }
    }

    async fn execute<P: PaymentService, S: StockService>(
        &mut self, payment: &P, stock: &S
    ) -> anyhow::Result<()> {
        // Step 1
        if payment.charge(&self.order_id, self.total).await.is_err() {
            self.state = SagaState::Failed;
            return Err(anyhow::anyhow!("Payment failed"));
        }
        self.state = SagaState::PaymentCharged;

        // Step 2
        if stock.reserve(&self.order_id).await.is_err() {
            self.state = SagaState::Compensating;
            payment.refund(&self.order_id, self.total).await.ok();
            self.state = SagaState::Failed;
            return Err(anyhow::anyhow!("Stock failed, compensated"));
        }
        self.state = SagaState::Completed;
        Ok(())
    }
}`,

enum class SagaState { Pending, PaymentCharged, StockReserved, Completed, Failed };

    std::string name;
    std::function<bool()> execute;
    std::function<void()> compensate;
};

    SagaState state_ = SagaState::Pending;
    std::vector<SagaStep> executed_;
public:
    OrderSaga(std::string id, double total) : orderId_(std::move(id)), total_(total) {}
    void run(std::vector<SagaStep> steps) {
        for (auto& step : steps) {
            std::cout << "[Saga] Executing: " << step.name << "\n";
            if (!step.execute()) {
                std::cout << "[Saga] Failed at: " << step.name << ", compensating…\n";
                for (auto it = executed_.rbegin(); it != executed_.rend(); ++it)
                    it->compensate();
                state_ = SagaState::Failed; return;
            }
            executed_.push_back(step);
        }
        state_ = SagaState::Completed;
        std::cout << "[Saga] Completed for " << orderId_ << "\n";

      go: `// Go BFF with parallel goroutines
package bff

import (
    "encoding/json"; "net/http"; "sync"
    "golang.org/x/sync/errgroup"
)

type DashboardResponse struct {
    User   UserDto   \`json:"user"\`
    Orders []OrderDto \`json:"orders"\`
    Recs   []RecDto   \`json:"recs"\`
}

func DashboardHandler(w http.ResponseWriter, r *http.Request) {
    userID := r.Header.Get("X-User-ID")
    var (resp DashboardResponse; mu sync.Mutex)
    g, ctx := errgroup.WithContext(r.Context())

    g.Go(func() error {
        u, err := fetchUser(ctx, userID)
        mu.Lock(); resp.User = u; mu.Unlock()
        return err
    })
    g.Go(func() error {
        o, err := fetchOrders(ctx, userID, 5)
        mu.Lock(); resp.Orders = o; mu.Unlock()
        return err
    })
    g.Go(func() error {
        rec, err := fetchRecs(ctx, userID)
        mu.Lock(); resp.Recs = rec; mu.Unlock()
        return err
    })
    if err := g.Wait(); err != nil { http.Error(w, err.Error(), 502); return }
    json.NewEncoder(w).Encode(resp)
}`,

struct DashboardResponse { user: serde_json::Value, orders: Vec<serde_json::Value>, recs: Vec<serde_json::Value> }

    Extension(client): Extension<Arc<Client>>,
    axum::extract::Path(user_id): axum::extract::Path<String>,

        user:   user.json().await.unwrap_or_default(),
        orders: orders.json().await.unwrap_or_default(),

    })

@RestController @RequestMapping("/bff")
public class WebBffController {
    @Autowired WebClient.Builder webClientBuilder;

    @GetMapping("/dashboard")
    public Mono<DashboardResponse> dashboard(@RequestHeader("X-User-ID") String userId) {
        WebClient client = webClientBuilder.build();
        Mono<UserDto>       userMono   = client.get().uri("http://user-svc/users/{id}", userId).retrieve().bodyToMono(UserDto.class);
        Mono<List<OrderDto>> ordersMono = client.get().uri("http://order-svc/orders?userId={id}&limit=5", userId).retrieve().bodyToFlux(OrderDto.class).collectList();
        Mono<List<RecDto>>  recsMono   = client.get().uri("http://recs-svc/recs/{id}", userId).retrieve().bodyToFlux(RecDto.class).collectList();

        return Mono.zip(userMono, ordersMono, recsMono)
                   .map(tuple -> new DashboardResponse(tuple.getT1(), tuple.getT2(), tuple.getT3()));
    }
}`,

function t(key) { return (I18N[CURRENT_LANG] || I18N.en)[key] || key; }

  if (key) node.textContent = t(key);

</script>
<script>
// ── 08-app-logic.js : Rendering Engine ───────────────────────────────────────
// Handles: catalog cards, detail modal, cross-language matrix, building blocks,
//          language mapping, tooling, category view, search, filters, dark mode,
//          i18n toggle, code highlighting, Mermaid diagrams.

(function () {
  "use strict";

  // ── Combine all arch data ──────────────────────────────────────────────────
  const ALL_ARCHS = [
    ...(typeof ARCH_FOUNDATIONAL !== "undefined" ? ARCH_FOUNDATIONAL : []),
    ...(typeof ARCH_INTERMEDIATE !== "undefined" ? ARCH_INTERMEDIATE : []),
    ...(typeof ARCH_ADVANCED     !== "undefined" ? ARCH_ADVANCED     : []),
  ];

  // ── State ──────────────────────────────────────────────────────────────────
  let activeTab    = "catalog";
  let searchQuery  = "";
  let levelFilter  = "all";
  let langFilter   = "all";
  let sortCol      = null;
  let sortDir      = 1;  // 1=asc, -1=desc
  let mermaidReady = false;
  let searchTimer  = null;
  const SEARCH_DEBOUNCE_MS = 180;

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const $  = id => document.getElementById(id);
  const $$ = sel => [...document.querySelectorAll(sel)];

  // ── Mermaid init ───────────────────────────────────────────────────────────
  if (typeof mermaid !== "undefined") {
    mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "loose" });
    mermaidReady = true;
  }

  // ── Utility ────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function highlight(text, query) {
    if (!query) return esc(text);
    const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
    return esc(text).replace(re, '<mark class="match-highlight">$1</mark>');
  }

  function archName(arch) {
    return (arch.name[CURRENT_LANG] || arch.name.en);
  }

  function archMatches(arch, q) {
    if (!q) return true;
    const ql = q.toLowerCase();
    const fields = [
      archName(arch),
      arch.description?.[CURRENT_LANG] || arch.description?.en || "",
      arch.coreConceptsTools?.[CURRENT_LANG] || arch.coreConceptsTools?.en || "",
      arch.id,
      arch.level,
      ...(arch.category || []),
    ];
    return fields.some(f => f.toLowerCase().includes(ql));
  }

  function filteredArchs() {
    return ALL_ARCHS.filter(a => {
      if (levelFilter !== "all" && a.level !== levelFilter) return false;
      if (langFilter  !== "all" && !(a.codeExamples && a.codeExamples[langFilter])) return false;
      if (searchQuery && !archMatches(a, searchQuery)) return false;
      return true;
    });
  }

  // ── SPAMF score color ─────────────────────────────────────────────────────
  function scoreColor(s) {
    if (s >= 4) return "var(--ok)";
    if (s >= 3) return "var(--accent2)";
    return "var(--danger)";
  }

  // ── Render catalog cards ───────────────────────────────────────────────────
  function renderCatalog() {
    const grid   = $("catalogGrid");
    const noRes  = $("catalogNoResults");
    const archs  = filteredArchs();
    if (!grid) return;

    if (archs.length === 0) {
      grid.innerHTML = "";
      noRes.style.display = "";
      return;
    }
    noRes.style.display = "none";

    grid.innerHTML = archs.map(arch => {
      const name  = archName(arch);
      const desc  = (arch.description?.[CURRENT_LANG] || arch.description?.en || "").slice(0, 140) + "…";
      const langs = arch.codeExamples ? Object.keys(arch.codeExamples).join(", ") : "";
      const spamfAvg = arch.spamf
        ? (Object.values(arch.spamf).reduce((s, v) => s + v.score, 0) / 5).toFixed(1)
        : "—";
      return `
        <div class="card" data-id="${esc(arch.id)}" tabindex="0" role="button" aria-label="${esc(name)}">
          <div class="card-header">
            <div class="card-icon">${arch.icon || "📐"}</div>
            <div>
              <div class="card-title">${highlight(name, searchQuery)}</div>
              <div class="card-subtitle">${esc(arch.level)}</div>
            </div>
          </div>
          <div class="card-desc">${highlight(desc, searchQuery)}</div>
          <div class="card-tags">
            <span class="tag level-${esc(arch.level)}">${esc(arch.level)}</span>
            ${(arch.category || []).slice(0, 2).map(c => `<span class="tag">${esc(c)}</span>`).join("")}
            ${spamfAvg !== "—" ? `<span class="tag" style="background:var(--chip);color:var(--accent)">SPAMF ${spamfAvg}</span>` : ""}
          </div>
        </div>`;
    }).join("");

    // click to open modal
    grid.querySelectorAll(".card").forEach(card => {
      const open = () => openModal(card.dataset.id);
      card.addEventListener("click", open);
      card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") open(); });
    });
  }

  // ── Detail Modal ───────────────────────────────────────────────────────────
  function openModal(id) {
    const arch = ALL_ARCHS.find(a => a.id === id);
    if (!arch) return;

    const overlay = $("modalOverlay");
    const body    = $("modalBody");
    const title   = $("modalTitle");
    const sub     = $("modalSubtitle");
    if (!overlay || !body) return;

    title.textContent = archName(arch);
    sub.textContent   = arch.level;

    const lang = CURRENT_LANG;
    const L    = key => arch[key]?.[lang] || arch[key]?.en || "";

    // Build SPAMF bars
    const spamfKeys = ["security","performance","availability","maintainability","flexibility"];
    const spamfHtml = arch.spamf ? `
      <div class="section">
        <div class="section-title" data-sec="spamf">${t("sec_spamf")} <span class="caret">▾</span></div>
        <div class="section-body" id="sec-spamf">
          <div class="spamf-grid">
            ${spamfKeys.map(k => {
              const item = arch.spamf[k];
              if (!item) return "";
              const note = item.note?.[lang] || item.note?.en || "";
              return `
                <div class="spamf-item">
                  <div class="spamf-label">${t(k)}</div>
                  <div class="spamf-score" style="color:${scoreColor(item.score)}">${item.score}/5</div>
                  <div class="spamf-bar"><div class="spamf-bar-fill" style="width:${item.score*20}%;background:${scoreColor(item.score)}"></div></div>
                  <div class="spamf-note">${esc(note)}</div>
                </div>`;
            }).join("")}
          </div>
        </div>
      </div>` : "";

    // Complexity
    const cplx = arch.complexity;
    const complexityHtml = cplx ? `
      <div class="section">
        <div class="section-title" data-sec="complexity">${t("sec_complexity")} <span class="caret">▾</span></div>
        <div class="section-body" id="sec-complexity">
          <div class="complexity-grid">
            <div class="complexity-item"><h4>${t("time_complexity")}</h4><p>${esc(cplx.time?.[lang] || cplx.time?.en || "")}</p></div>
            <div class="complexity-item"><h4>${t("space_complexity")}</h4><p>${esc(cplx.space?.[lang] || cplx.space?.en || "")}</p></div>
            <div class="complexity-item"><h4>${t("cost_complexity")}</h4><p>${esc(cplx.cost?.[lang] || cplx.cost?.en || "")}</p></div>
          </div>
        </div>
      </div>` : "";

    // Mermaid diagram
    const diagHtml = arch.mermaid ? `
      <div class="section">
        <div class="section-title" data-sec="diagram">${t("sec_diagram")} <span class="caret">▾</span></div>
        <div class="section-body" id="sec-diagram">
          <div class="mermaid-wrap">
            <div class="mermaid" id="mermaid-${arch.id}">${arch.mermaid}</div>
          </div>
        </div>
      </div>` : "";

    // Code examples — language tabs (respect langFilter)
    const allLangs = arch.codeExamples ? Object.keys(arch.codeExamples) : [];
    const langs = (langFilter === "all")
      ? allLangs
      : allLangs.filter(lg => lg === langFilter);
    const codeHtml = langs.length ? `
      <div class="section">
        <div class="section-title" data-sec="code">${t("sec_code")} <span class="caret">▾</span></div>
        <div class="section-body" id="sec-code">
          <div class="lang-tabs" id="langTabs-${arch.id}">
            ${langs.map((lg, i) => `
              <div class="lang-tab ${i === 0 ? "active" : ""}" data-lang="${lg}" data-arch="${arch.id}">
                ${LANG_LABELS?.[lg] || lg}
              </div>`).join("")}
          </div>
          ${langs.map((lg, i) => `
            <div class="lang-code-block ${i === 0 ? "" : "hidden"}" id="code-${arch.id}-${lg}">
              <div style="display:flex;justify-content:flex-end;padding:4px 4px 0">
                <button class="btn" style="font-size:.72rem;padding:3px 10px"
                  onclick="copyCode('${arch.id}','${lg}')">📋 ${t("copy_code")}</button>
              </div>
              <pre><code class="language-${langToHljs(lg)}">${esc(arch.codeExamples[lg])}</code></pre>
            </div>`).join("")}
        </div>
      </div>` : "";

    // Pros / Cons
    const prosArr  = arch.pros?.[lang] || arch.pros?.en || [];
    const consArr  = arch.cons?.[lang] || arch.cons?.en || [];
    const prosHtml = prosArr.length ? `<ul>${prosArr.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
    const consHtml = consArr.length ? `<ul>${consArr.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "";

    body.innerHTML = `
      <!-- Origin + Description -->
      <div class="detail-grid">
        <div class="detail-box">
          <h4>${t("sec_origin")}</h4>
          <p>${esc(L("origin"))}</p>
        </div>
        <div class="detail-box">
          <h4>${t("sec_description")}</h4>
          <p>${esc(L("description"))}</p>
        </div>
      </div>

      <!-- Core Concepts + When to Use -->
      <div class="detail-grid">
        <div class="detail-box">
          <h4>${t("sec_concepts")}</h4>
          <p>${esc(L("coreConceptsTools"))}</p>
        </div>
        <div class="detail-box">
          <h4>${t("sec_when")}</h4>
          <p>${esc(L("whenToUse"))}</p>
        </div>
      </div>

      <!-- Pros + Cons -->
      <div class="detail-grid">
        <div class="detail-box">
          <h4>${t("sec_pros")}</h4>
          ${prosHtml}
        </div>
        <div class="detail-box">
          <h4>${t("sec_cons")}</h4>
          ${consHtml}
        </div>
      </div>

      ${spamfHtml}
      ${complexityHtml}
      ${diagHtml}
      ${codeHtml}
    `;

    overlay.style.display = "flex";
    document.body.style.overflow = "hidden";

    // Highlight code
    body.querySelectorAll("pre code").forEach(el => {
      if (typeof hljs !== "undefined") hljs.highlightElement(el);
    });

    // Render mermaid if available
    if (mermaidReady && arch.mermaid) {
      const el = document.getElementById(`mermaid-${arch.id}`);
      if (el && !el.dataset.rendered) {
        mermaid.run({ nodes: [el] }).then(() => { el.dataset.rendered = "1"; }).catch(() => {});
      }
    }

    // Apply dark theme to mermaid
    syncMermaidTheme();

    // Language tab switching
    body.querySelectorAll(".lang-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        const archId = tab.dataset.arch;
        const lg     = tab.dataset.lang;
        body.querySelectorAll(`[data-arch="${archId}"].lang-tab`).forEach(t2 => t2.classList.remove("active"));
        tab.classList.add("active");
        body.querySelectorAll(`[id^="code-${archId}-"]`).forEach(b => b.classList.add("hidden"));
        const block = document.getElementById(`code-${archId}-${lg}`);
        if (block) block.classList.remove("hidden");
      });
    });

    // Collapsible sections
    body.querySelectorAll(".section-title").forEach(h => {
      h.addEventListener("click", () => {
        h.classList.toggle("collapsed");
        const caret = h.querySelector(".caret");
        const secId = "sec-" + h.dataset.sec;
        const sec   = document.getElementById(secId);
        if (!sec) return;
        sec.classList.toggle("collapsed");
        if (caret) caret.textContent = sec.classList.contains("collapsed") ? "▸" : "▾";
      });
    });
  }

  window.copyCode = function(archId, lang) {
    const block = document.getElementById(`code-${archId}-${lang}`);
    if (!block) return;
    const code = block.querySelector("pre code");
    if (!code) return;
    navigator.clipboard.writeText(code.textContent).then(() => {
      const btn = block.querySelector("button");
      if (btn) { const orig = btn.textContent; btn.textContent = "✓ " + t("copied"); setTimeout(() => btn.textContent = orig, 1500); }
    }).catch(() => {});
  };

  function closeModal() {
    const overlay = $("modalOverlay");
    if (overlay) overlay.style.display = "none";
    document.body.style.overflow = "";
  }

  // ── Cross-Language Matrix ──────────────────────────────────────────────────
  function renderMatrix() {
    const head = $("matrixHead");
    const body = $("matrixBody");
    const noRes = $("matrixNoResults");
    if (!head || !body || typeof MATRIX === "undefined") return;

    const langCols = langFilter === "all" ? LANG_LIST : [langFilter];

    head.innerHTML = `<tr>
      <th data-col="arch" class="${sortCol==="arch"?"sorted":""}">${t("col_arch")} <span class="sort-icon">${sortIcon("arch")}</span></th>
      ${langCols.map(lg => `<th>${LANG_LABELS?.[lg] || lg}</th>`).join("")}
    </tr>`;

    let rows = MATRIX;
    if (searchQuery) {
      rows = rows.filter(row => {
        const arch = ALL_ARCHS.find(a => a.id === row.archId);
        if (!arch) return false;
        return archMatches(arch, searchQuery);
      });
    }
    if (levelFilter !== "all") {
      rows = rows.filter(row => {
        const arch = ALL_ARCHS.find(a => a.id === row.archId);
        return arch && arch.level === levelFilter;
      });
    }

    if (sortCol === "arch") {
      rows = [...rows].sort((a, b) => {
        const aa = ALL_ARCHS.find(x => x.id === a.archId);
        const bb = ALL_ARCHS.find(x => x.id === b.archId);
        const an = aa ? archName(aa).toLowerCase() : a.archId.toLowerCase();
        const bn = bb ? archName(bb).toLowerCase() : b.archId.toLowerCase();
        if (an < bn) return -1 * sortDir;
        if (an > bn) return 1 * sortDir;
        return 0;
      });
    }

    if (rows.length === 0) {
      body.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    body.innerHTML = rows.map(row => {
      const arch = ALL_ARCHS.find(a => a.id === row.archId);
      const name = arch ? archName(arch) : row.archId;
      return `<tr>
        <td><strong>${highlight(name, searchQuery)}</strong><br/><span style="font-size:.75rem;color:var(--muted)">${arch ? esc(arch.level) : ""}</span></td>
        ${langCols.map(lg => {
          const cell = row.cells?.[lg];
          if (!cell) return `<td class="na">—</td>`;
          const note = cell.note?.[CURRENT_LANG] || cell.note?.en || "";
          return `<td>
            <strong style="font-size:.8rem">${esc(cell.framework || "")}</strong><br/>
            <span style="font-size:.75rem;color:var(--muted)">${esc(cell.libs || "")}</span><br/>
            <em style="font-size:.73rem;color:var(--muted)">${esc(note)}</em>
          </td>`;
        }).join("")}
      </tr>`;
    }).join("");

    // Click headers to sort
    head.querySelectorAll("th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
        renderMatrix();
      });
    });
  }

  // ── Building Blocks ────────────────────────────────────────────────────────
  function renderBlocks() {
    const head = $("blocksHead");
    const body = $("blocksBody");
    const noRes = $("blocksNoResults");
    if (!head || !body || typeof BUILDING_BLOCKS === "undefined") return;

    head.innerHTML = `<tr>
      <th>${t("col_block")}</th>
      <th>${t("col_group")}</th>
      <th>${t("col_definition")}</th>
      <th>${t("col_used_in")}</th>
    </tr>`;

    const blocks = BUILDING_BLOCKS.filter(b => {
      if (!searchQuery) return true;
      const ql = searchQuery.toLowerCase();
      return (
        (b.name?.[CURRENT_LANG] || b.name?.en || "").toLowerCase().includes(ql) ||
        (b.definition?.[CURRENT_LANG] || b.definition?.en || "").toLowerCase().includes(ql) ||
        b.group.toLowerCase().includes(ql)
      );
    });

    if (blocks.length === 0) {
      body.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    body.innerHTML = blocks.map(b => {
      const name = b.name?.[CURRENT_LANG] || b.name?.en || b.id;
      const def  = b.definition?.[CURRENT_LANG] || b.definition?.en || "";
      const usedIn = (b.usedIn || []).map(id => {
        const arch = ALL_ARCHS.find(a => a.id === id);
        return arch ? `<span class="tag">${esc(archName(arch))}</span>` : `<span class="tag">${esc(id)}</span>`;
      }).join(" ");
      return `<tr>
        <td><strong>${b.icon || ""} ${highlight(name, searchQuery)}</strong></td>
        <td><span class="tag">${esc(b.group)}</span></td>
        <td style="max-width:340px">${highlight(def, searchQuery)}</td>
        <td style="display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px">${usedIn}</td>
      </tr>`;
    }).join("");
  }

  // ── Language Mapping ───────────────────────────────────────────────────────
  function renderLangmap() {
    const head = $("langmapHead");
    const body = $("langmapBody");
    const noRes = $("langmapNoResults");
    if (!head || !body || typeof LANGMAP === "undefined") return;

    head.innerHTML = `<tr>
      <th>${t("col_lang")}</th>
      <th>${t("col_primary_archs")}</th>
      <th>${t("col_ecosystem")}</th>
      <th>${t("col_testing")}</th>
    </tr>`;

    const rows = LANGMAP.filter(row => {
      if (!searchQuery) return true;
      const ql = searchQuery.toLowerCase();
      const eco = (row.frameworkEcosystem?.[CURRENT_LANG] || row.frameworkEcosystem?.en || "").toLowerCase();
      const idioms = (row.idioms?.[CURRENT_LANG] || row.idioms?.en || "").toLowerCase();
      const testing = (row.testingStack || "").toLowerCase();
      const archText = (row.primaryArchs || []).map(id => {
        const arch = ALL_ARCHS.find(a => a.id === id);
        return arch ? archName(arch) : id;
      }).join(" ").toLowerCase();
      return (
        (row.label || "").toLowerCase().includes(ql) ||
        eco.includes(ql) ||
        idioms.includes(ql) ||
        testing.includes(ql) ||
        archText.includes(ql)
      );
    });

    if (rows.length === 0) {
      body.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    body.innerHTML = rows.map(row => {
      const eco = row.frameworkEcosystem?.[CURRENT_LANG] || row.frameworkEcosystem?.en || "";
      const idioms = row.idioms?.[CURRENT_LANG] || row.idioms?.en || "";
      const archs = (row.primaryArchs || []).map(id => {
        const arch = ALL_ARCHS.find(a => a.id === id);
        return arch ? `<span class="tag">${highlight(archName(arch), searchQuery)}</span>` : `<span class="tag">${highlight(id, searchQuery)}</span>`;
      }).join(" ");
      return `<tr>
        <td><strong>${highlight(row.label, searchQuery)}</strong></td>
        <td style="min-width:200px"><div style="display:flex;flex-wrap:wrap;gap:4px">${archs}</div></td>
        <td style="font-size:.8rem">${highlight(eco, searchQuery)}<br/><em style="color:var(--muted);font-size:.75rem">${highlight(idioms, searchQuery)}</em></td>
        <td style="font-size:.8rem;color:var(--muted)">${highlight(row.testingStack || "", searchQuery)}</td>
      </tr>`;
    }).join("");
  }

  // ── Tooling ────────────────────────────────────────────────────────────────
  function renderTooling() {
    const head = $("toolingHead");
    const body = $("toolingBody");
    const noRes = $("toolingNoResults");
    if (!head || !body || typeof TOOLING === "undefined") return;

    head.innerHTML = `<tr>
      <th>${t("col_tool")}</th>
      <th>${t("col_group")}</th>
      <th>${t("col_usecase")}</th>
      <th>${t("col_languages")}</th>
    </tr>`;

    const rows = TOOLING.flatMap(group => {
      const catLabel = group.category?.[CURRENT_LANG] || group.category?.en || "";
      return (group.tools || []).map(tool => ({ tool, catLabel }));
    }).filter(({ tool, catLabel }) => {
      if (!searchQuery) return true;
      const ql = searchQuery.toLowerCase();
      const uc = (tool.useCase?.[CURRENT_LANG] || tool.useCase?.en || "").toLowerCase();
      return (
        (tool.name || "").toLowerCase().includes(ql) ||
        catLabel.toLowerCase().includes(ql) ||
        uc.includes(ql) ||
        (tool.langs || "").toLowerCase().includes(ql)
      );
    });

    if (rows.length === 0) {
      body.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    body.innerHTML = rows.map(({ tool, catLabel }) => {
      const uc = tool.useCase?.[CURRENT_LANG] || tool.useCase?.en || "";
      return `<tr>
        <td><strong>${highlight(tool.name, searchQuery)}</strong></td>
        <td><span class="tag">${highlight(catLabel, searchQuery)}</span></td>
        <td>${highlight(uc, searchQuery)}</td>
        <td style="font-size:.78rem;color:var(--muted)">${highlight(tool.langs || "", searchQuery)}</td>
      </tr>`;
    }).join("");
  }

  // ── Category View ──────────────────────────────────────────────────────────
  function renderCategories() {
    const view = $("categoryView");
    const noRes = $("categoryNoResults");
    if (!view) return;

    const sourceArchs = searchQuery
      ? ALL_ARCHS.filter(a => archMatches(a, searchQuery))
      : ALL_ARCHS;

    if (sourceArchs.length === 0) {
      view.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    const catMap = {};
    sourceArchs.forEach(a => {
      (a.category || []).forEach(cat => {
        if (!catMap[cat]) catMap[cat] = [];
        catMap[cat].push(a);
      });
    });

    const businessBuckets = {};
    sourceArchs.forEach(a => {
      (a.businessModel || []).forEach(model => {
        if (!businessBuckets[model]) {
          businessBuckets[model] = { foundational: 0, intermediate: 0, advanced: 0, total: 0 };
        }
        if (businessBuckets[model][a.level] !== undefined) businessBuckets[model][a.level] += 1;
        businessBuckets[model].total += 1;
      });
    });

    const categorySummaryRows = Object.entries(catMap)
      .map(([cat, archs]) => {
        const counters = { foundational: 0, intermediate: 0, advanced: 0 };
        archs.forEach(a => { if (counters[a.level] !== undefined) counters[a.level] += 1; });
        return { cat, total: archs.length, ...counters };
      })
      .sort((a, b) => b.total - a.total || a.cat.localeCompare(b.cat));

    const businessSummaryRows = Object.entries(businessBuckets)
      .map(([name, data]) => ({ name, ...data }))
      .sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));

    view.innerHTML = `
      <div class="section">
        <div class="section-title" style="font-size:1rem">
          ${esc(CURRENT_LANG === "vi"
            ? "Tổng quan theo loại ứng dụng và độ phức tạp"
            : "Summary by App Type and Complexity")}
        </div>
        <div class="section-body" style="padding-top:12px">
          <div class="tbl-wrap" style="margin-bottom:14px">
            <table>
              <thead>
                <tr>
                  <th>${esc(CURRENT_LANG === "vi" ? "Loại ứng dụng" : "App Type")}</th>
                  <th>${esc(t("foundational"))}</th>
                  <th>${esc(t("intermediate"))}</th>
                  <th>${esc(t("advanced"))}</th>
                  <th>${esc(CURRENT_LANG === "vi" ? "Tổng" : "Total")}</th>
                </tr>
              </thead>
              <tbody>
                ${categorySummaryRows.map(r => `
                  <tr>
                    <td><strong>${esc(t("cat_" + r.cat) !== "cat_" + r.cat ? t("cat_" + r.cat) : r.cat)}</strong></td>
                    <td>${r.foundational}</td>
                    <td>${r.intermediate}</td>
                    <td>${r.advanced}</td>
                    <td><strong>${r.total}</strong></td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>

          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>${esc(CURRENT_LANG === "vi" ? "Mô hình kinh doanh" : "Business Model")}</th>
                  <th>${esc(t("foundational"))}</th>
                  <th>${esc(t("intermediate"))}</th>
                  <th>${esc(t("advanced"))}</th>
                  <th>${esc(CURRENT_LANG === "vi" ? "Tổng" : "Total")}</th>
                </tr>
              </thead>
              <tbody>
                ${businessSummaryRows.map(r => `
                  <tr>
                    <td><strong>${esc(r.name)}</strong></td>
                    <td>${r.foundational}</td>
                    <td>${r.intermediate}</td>
                    <td>${r.advanced}</td>
                    <td><strong>${r.total}</strong></td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      ${Object.entries(catMap).map(([cat, archs]) => `
      <div class="section">
        <div class="section-title" data-sec="cat-${cat}" style="font-size:1rem">
          ${esc(t("cat_" + cat) || cat)}
          <span class="tag" style="margin-left:auto">${archs.length} ${t("archs_in_category")}</span>
          <span class="caret">▾</span>
        </div>
        <div class="section-body" id="sec-cat-${cat}">
          <div class="card-grid" style="margin-top:12px">
            ${archs.map(arch => `
              <div class="card" data-id="${esc(arch.id)}" style="cursor:pointer" tabindex="0" role="button">
                <div class="card-header">
                  <div class="card-icon">${arch.icon || "📐"}</div>
                  <div>
                    <div class="card-title">${highlight(archName(arch), searchQuery)}</div>
                    <div class="card-subtitle">${esc(arch.level)}</div>
                  </div>
                </div>
                <div class="card-desc">${highlight((arch.description?.[CURRENT_LANG] || arch.description?.en || "").slice(0, 100), searchQuery)}…</div>
              </div>`).join("")}
          </div>
        </div>
      </div>`).join("")}`;

    // open modal on card click
    view.querySelectorAll(".card[data-id]").forEach(card => {
      card.addEventListener("click", () => openModal(card.dataset.id));
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") openModal(card.dataset.id);
      });
    });
    // collapsible category sections
    view.querySelectorAll(".section-title").forEach(h => {
      h.addEventListener("click", e => {
        if (e.target.closest(".card")) return;
        if (!h.dataset.sec) return;
        h.classList.toggle("collapsed");
        const caret = h.querySelector(".caret");
        const sec   = document.getElementById("sec-" + h.dataset.sec);
        if (sec) sec.classList.toggle("collapsed");
        if (caret) caret.textContent = (sec && sec.classList.contains("collapsed")) ? "▸" : "▾";
      });
    });
  }

  // ── Tab switching ──────────────────────────────────────────────────────────
  function switchTab(tabId) {
    activeTab = tabId;
    $$(".nav-tab").forEach(t2 => t2.classList.toggle("active", t2.dataset.tab === tabId));
    $$(".tab-content").forEach(c => c.classList.toggle("active", c.id === `tab-${tabId}`));
    renderCurrentTab();
  }

  function renderCurrentTab() {
    switch (activeTab) {
      case "catalog":    renderCatalog();    break;
      case "matrix":     renderMatrix();     break;
      case "blocks":     renderBlocks();     break;
      case "langmap":    renderLangmap();    break;
      case "tooling":    renderTooling();    break;
      case "categories": renderCategories(); break;
    }
  }

  // ── Search ─────────────────────────────────────────────────────────────────
  function initSearch() {
    const input = $("searchInput");
    const clear = $("searchClear");
    if (!input) return;
    if (clear) clear.style.display = input.value.trim() ? "block" : "none";
    input.addEventListener("input", () => {
      searchQuery = input.value.trim();
      if (clear) clear.style.display = searchQuery ? "block" : "none";
      if (searchTimer) window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(() => {
        renderCurrentTab();
      }, SEARCH_DEBOUNCE_MS);
    });
    if (clear) clear.addEventListener("click", () => {
      input.value = ""; searchQuery = "";
      clear.style.display = "none";
      renderCurrentTab();
    });
  }

  // ── Filters ────────────────────────────────────────────────────────────────
  function initFilters() {
    $$("[data-filter]").forEach(chip => {
      chip.addEventListener("click", () => {
        const filter = chip.dataset.filter;
        const val    = chip.dataset.val;
        $$(`[data-filter="${filter}"]`).forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        if (filter === "level") levelFilter = val;
        if (filter === "lang")  langFilter  = val;
        renderCurrentTab();
      });
    });
  }

  // ── Theme toggle ───────────────────────────────────────────────────────────
  function initTheme() {
    const btn = $("themeToggle");
    const saved = localStorage.getItem("aa-theme");
    if (saved === "dark") { document.body.classList.add("dark"); if (btn) btn.textContent = "☀️"; }
    if (btn) btn.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");
      btn.textContent = isDark ? "☀️" : "🌙";
      localStorage.setItem("aa-theme", isDark ? "dark" : "light");
      syncMermaidTheme();
    });
  }

  function syncMermaidTheme() {
    if (typeof mermaid === "undefined") return;
    const isDark = document.body.classList.contains("dark");
    mermaid.initialize({ startOnLoad: false, theme: isDark ? "dark" : "default", securityLevel: "loose" });
  }

  // ── Language (EN/VI) toggle ────────────────────────────────────────────────
  function initLangToggle() {
    const btn = $("langToggle");
    if (!btn) return;
    btn.addEventListener("click", () => {
      CURRENT_LANG = CURRENT_LANG === "en" ? "vi" : "en";
      btn.textContent = CURRENT_LANG === "en" ? "🇻🇳" : "🇬🇧";
      applyI18n();
      renderCurrentTab();
    });
  }

  // ── Nav tab events ─────────────────────────────────────────────────────────
  function initNavTabs() {
    $$(".nav-tab").forEach(tab => {
      tab.addEventListener("click", () => switchTab(tab.dataset.tab));
    });
  }

  // ── Modal close ────────────────────────────────────────────────────────────
  function initModal() {
    const close = $("modalClose");
    const overlay = $("modalOverlay");
    if (close) close.addEventListener("click", closeModal);
    if (overlay) overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  }

  // ── Sort icon helper ───────────────────────────────────────────────────────
  function sortIcon(col) {
    if (sortCol !== col) return "⇕";
    return sortDir === 1 ? "▲" : "▼";
  }

  // ── hljs language mapping ──────────────────────────────────────────────────
  function langToHljs(lg) {
    const map = { csharp:"csharp", python:"python", go:"go", rust:"rust",
                  java:"java", javascript:"javascript", cpp:"cpp" };
    return map[lg] || "plaintext";
  }

  // ── Keyboard shortcut: / to focus search ──────────────────────────────────
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault();
      const input = $("searchInput");
      if (input) input.focus();
    }
  });

  // ── Boot ───────────────────────────────────────────────────────────────────
  function boot() {
    initTheme();
    initLangToggle();
    applyI18n();
    initSearch();
    initFilters();
    initNavTabs();
    initModal();
    renderCatalog();      // default tab
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

})();

</script>
</body>
</html>
