  // ── Mermaid init ───────────────────────────────────────────────────────────
  if (typeof mermaid !== "undefined") {
    mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "loose" });
    mermaidReady = true;
  }

  // ── Utility ────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function highlight(text, query) {
    if (!query) return esc(text);
    const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
    return esc(text).replace(re, '<mark class="match-highlight">$1</mark>');
  }

  function archName(arch) {
    return (arch.name[CURRENT_LANG] || arch.name.en);
  }

  function archMatches(arch, q) {
    if (!q) return true;
    const ql = q.toLowerCase();
    const fields = [
      archName(arch),
      arch.description?.[CURRENT_LANG] || arch.description?.en || "",
      arch.coreConceptsTools?.[CURRENT_LANG] || arch.coreConceptsTools?.en || "",
      arch.id,
      arch.level,
      ...(arch.category || []),
    ];
    return fields.some(f => f.toLowerCase().includes(ql));
  }

  function filteredArchs() {
    return ALL_ARCHS.filter(a => {
      if (levelFilter !== "all" && a.level !== levelFilter) return false;
      if (langFilter  !== "all" && !(a.codeExamples && a.codeExamples[langFilter])) return false;
      if (searchQuery && !archMatches(a, searchQuery)) return false;
      return true;
    });
  }

  // ── SPAMF score color ─────────────────────────────────────────────────────
  function scoreColor(s) {
    if (s >= 4) return "var(--ok)";
    if (s >= 3) return "var(--accent2)";
    return "var(--danger)";
  }

  // ── Render catalog cards ───────────────────────────────────────────────────
  function renderCatalog() {
    const grid   = $("catalogGrid");
    const noRes  = $("catalogNoResults");
    const archs  = filteredArchs();
    if (!grid) return;

    if (archs.length === 0) {
      grid.innerHTML = "";
      noRes.style.display = "";
      return;
    }
    noRes.style.display = "none";

    grid.innerHTML = archs.map(arch => {
      const name  = archName(arch);
      const desc  = (arch.description?.[CURRENT_LANG] || arch.description?.en || "").slice(0, 140) + "…";
      const langs = arch.codeExamples ? Object.keys(arch.codeExamples).join(", ") : "";
      const spamfAvg = arch.spamf
        ? (Object.values(arch.spamf).reduce((s, v) => s + v.score, 0) / 5).toFixed(1)
        : "—";
      return `
        <div class="card" data-id="${esc(arch.id)}" tabindex="0" role="button" aria-label="${esc(name)}">
          <div class="card-header">
            <div class="card-icon">${arch.icon || "📐"}</div>
            <div>
              <div class="card-title">${highlight(name, searchQuery)}</div>
              <div class="card-subtitle">${esc(arch.level)}</div>
            </div>
          </div>
          <div class="card-desc">${highlight(desc, searchQuery)}</div>
          <div class="card-tags">
            <span class="tag level-${esc(arch.level)}">${esc(arch.level)}</span>
            ${(arch.category || []).slice(0, 2).map(c => `<span class="tag">${esc(c)}</span>`).join("")}
            ${spamfAvg !== "—" ? `<span class="tag" style="background:var(--chip);color:var(--accent)">SPAMF ${spamfAvg}</span>` : ""}
          </div>
        </div>`;
    }).join("");

    // click to open modal
    grid.querySelectorAll(".card").forEach(card => {
      const open = () => openModal(card.dataset.id);
      card.addEventListener("click", open);
      card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") open(); });
    });
  }

  // ── Detail Modal ───────────────────────────────────────────────────────────
  function openModal(id) {
    const arch = ALL_ARCHS.find(a => a.id === id);
    if (!arch) return;

    const overlay = $("modalOverlay");
    const body    = $("modalBody");
    const title   = $("modalTitle");
    const sub     = $("modalSubtitle");
    if (!overlay || !body) return;

    title.textContent = archName(arch);
    sub.textContent   = arch.level;

    const lang = CURRENT_LANG;
    const L    = key => arch[key]?.[lang] || arch[key]?.en || "";

    // Build SPAMF bars
    const spamfKeys = ["security","performance","availability","maintainability","flexibility"];
    const spamfHtml = arch.spamf ? `
      <div class="section">
        <div class="section-title" data-sec="spamf">${t("sec_spamf")} <span class="caret">▾</span></div>
        <div class="section-body" id="sec-spamf">
          <div class="spamf-grid">
            ${spamfKeys.map(k => {
              const item = arch.spamf[k];
              if (!item) return "";
              const note = item.note?.[lang] || item.note?.en || "";
              return `
                <div class="spamf-item">
                  <div class="spamf-label">${t(k)}</div>
                  <div class="spamf-score" style="color:${scoreColor(item.score)}">${item.score}/5</div>
                  <div class="spamf-bar"><div class="spamf-bar-fill" style="width:${item.score*20}%;background:${scoreColor(item.score)}"></div></div>
                  <div class="spamf-note">${esc(note)}</div>
                </div>`;
            }).join("")}
          </div>
        </div>
      </div>` : "";

    // Complexity
    const cplx = arch.complexity;
    const complexityHtml = cplx ? `
      <div class="section">
        <div class="section-title" data-sec="complexity">${t("sec_complexity")} <span class="caret">▾</span></div>
        <div class="section-body" id="sec-complexity">
          <div class="complexity-grid">
            <div class="complexity-item"><h4>${t("time_complexity")}</h4><p>${esc(cplx.time?.[lang] || cplx.time?.en || "")}</p></div>
            <div class="complexity-item"><h4>${t("space_complexity")}</h4><p>${esc(cplx.space?.[lang] || cplx.space?.en || "")}</p></div>
            <div class="complexity-item"><h4>${t("cost_complexity")}</h4><p>${esc(cplx.cost?.[lang] || cplx.cost?.en || "")}</p></div>
          </div>
        </div>
      </div>` : "";

    // Mermaid diagram
    const diagHtml = arch.mermaid ? `
      <div class="section">
        <div class="section-title" data-sec="diagram">${t("sec_diagram")} <span class="caret">▾</span></div>
        <div class="section-body" id="sec-diagram">
          <div class="mermaid-wrap">
            <div class="mermaid" id="mermaid-${arch.id}">${arch.mermaid}</div>
          </div>
        </div>
      </div>` : "";

    // Code examples — language tabs (respect langFilter)
    const allLangs = arch.codeExamples ? Object.keys(arch.codeExamples) : [];
    const langs = (langFilter === "all")
      ? allLangs
      : allLangs.filter(lg => lg === langFilter);
    const codeHtml = langs.length ? `
      <div class="section">
        <div class="section-title" data-sec="code">${t("sec_code")} <span class="caret">▾</span></div>
        <div class="section-body" id="sec-code">
          <div class="lang-tabs" id="langTabs-${arch.id}">
            ${langs.map((lg, i) => `
              <div class="lang-tab ${i === 0 ? "active" : ""}" data-lang="${lg}" data-arch="${arch.id}">
                ${LANG_LABELS?.[lg] || lg}
              </div>`).join("")}
          </div>
          ${langs.map((lg, i) => `
            <div class="lang-code-block ${i === 0 ? "" : "hidden"}" id="code-${arch.id}-${lg}">
              <div style="display:flex;justify-content:flex-end;padding:4px 4px 0">
                <button class="btn" style="font-size:.72rem;padding:3px 10px"
                  onclick="copyCode('${arch.id}','${lg}')">📋 ${t("copy_code")}</button>
              </div>
              <pre><code class="language-${langToHljs(lg)}">${esc(arch.codeExamples[lg])}</code></pre>
            </div>`).join("")}
        </div>
      </div>` : "";

    // Pros / Cons
    const prosArr  = arch.pros?.[lang] || arch.pros?.en || [];
    const consArr  = arch.cons?.[lang] || arch.cons?.en || [];
    const prosHtml = prosArr.length ? `<ul>${prosArr.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
    const consHtml = consArr.length ? `<ul>${consArr.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "";

    body.innerHTML = `
      <!-- Origin + Description -->
      <div class="detail-grid">
        <div class="detail-box">
          <h4>${t("sec_origin")}</h4>
          <p>${esc(L("origin"))}</p>
        </div>
        <div class="detail-box">
          <h4>${t("sec_description")}</h4>
          <p>${esc(L("description"))}</p>
        </div>
      </div>

      <!-- Core Concepts + When to Use -->
      <div class="detail-grid">
        <div class="detail-box">
          <h4>${t("sec_concepts")}</h4>
          <p>${esc(L("coreConceptsTools"))}</p>
        </div>
        <div class="detail-box">
          <h4>${t("sec_when")}</h4>
          <p>${esc(L("whenToUse"))}</p>
        </div>
      </div>

      <!-- Pros + Cons -->
      <div class="detail-grid">
        <div class="detail-box">
          <h4>${t("sec_pros")}</h4>
          ${prosHtml}
        </div>
        <div class="detail-box">
          <h4>${t("sec_cons")}</h4>
          ${consHtml}
        </div>
      </div>

      ${spamfHtml}
      ${complexityHtml}
      ${diagHtml}
      ${codeHtml}
    `;

    overlay.style.display = "flex";
    document.body.style.overflow = "hidden";

    // Highlight code
    body.querySelectorAll("pre code").forEach(el => {
      if (typeof hljs !== "undefined") hljs.highlightElement(el);
    });

    // Render mermaid if available
    if (mermaidReady && arch.mermaid) {
      const el = document.getElementById(`mermaid-${arch.id}`);
      if (el && !el.dataset.rendered) {
        mermaid.run({ nodes: [el] }).then(() => { el.dataset.rendered = "1"; }).catch(() => {});
      }
    }

    // Apply dark theme to mermaid
    syncMermaidTheme();

    // Language tab switching
    body.querySelectorAll(".lang-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        const archId = tab.dataset.arch;
        const lg     = tab.dataset.lang;
        body.querySelectorAll(`[data-arch="${archId}"].lang-tab`).forEach(t2 => t2.classList.remove("active"));
        tab.classList.add("active");
        body.querySelectorAll(`[id^="code-${archId}-"]`).forEach(b => b.classList.add("hidden"));
        const block = document.getElementById(`code-${archId}-${lg}`);
        if (block) block.classList.remove("hidden");
      });
    });

    // Collapsible sections
    body.querySelectorAll(".section-title").forEach(h => {
      h.addEventListener("click", () => {
        h.classList.toggle("collapsed");
        const caret = h.querySelector(".caret");
        const secId = "sec-" + h.dataset.sec;
        const sec   = document.getElementById(secId);
        if (!sec) return;
        sec.classList.toggle("collapsed");
        if (caret) caret.textContent = sec.classList.contains("collapsed") ? "▸" : "▾";
      });
    });
  }

  window.copyCode = function(archId, lang) {
    const block = document.getElementById(`code-${archId}-${lang}`);
    if (!block) return;
    const code = block.querySelector("pre code");
    if (!code) return;
    navigator.clipboard.writeText(code.textContent).then(() => {
      const btn = block.querySelector("button");
      if (btn) { const orig = btn.textContent; btn.textContent = "✓ " + t("copied"); setTimeout(() => btn.textContent = orig, 1500); }
    }).catch(() => {});
  };

  function closeModal() {
    const overlay = $("modalOverlay");
    if (overlay) overlay.style.display = "none";
    document.body.style.overflow = "";
  }

  // ── Cross-Language Matrix ──────────────────────────────────────────────────
  function renderMatrix() {
    const head = $("matrixHead");
    const body = $("matrixBody");
    const noRes = $("matrixNoResults");
    if (!head || !body || typeof MATRIX === "undefined") return;

    const langCols = langFilter === "all" ? LANG_LIST : [langFilter];

    head.innerHTML = `<tr>
      <th data-col="arch" class="${sortCol==="arch"?"sorted":""}">${t("col_arch")} <span class="sort-icon">${sortIcon("arch")}</span></th>
      ${langCols.map(lg => `<th>${LANG_LABELS?.[lg] || lg}</th>`).join("")}
    </tr>`;

    let rows = MATRIX;
    if (searchQuery) {
      rows = rows.filter(row => {
        const arch = ALL_ARCHS.find(a => a.id === row.archId);
        if (!arch) return false;
        return archMatches(arch, searchQuery);
      });
    }
    if (levelFilter !== "all") {
      rows = rows.filter(row => {
        const arch = ALL_ARCHS.find(a => a.id === row.archId);
        return arch && arch.level === levelFilter;
      });
    }

    if (sortCol === "arch") {
      rows = [...rows].sort((a, b) => {
        const aa = ALL_ARCHS.find(x => x.id === a.archId);
        const bb = ALL_ARCHS.find(x => x.id === b.archId);
        const an = aa ? archName(aa).toLowerCase() : a.archId.toLowerCase();
        const bn = bb ? archName(bb).toLowerCase() : b.archId.toLowerCase();
        if (an < bn) return -1 * sortDir;
        if (an > bn) return 1 * sortDir;
        return 0;
      });
    }

    if (rows.length === 0) {
      body.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    body.innerHTML = rows.map(row => {
      const arch = ALL_ARCHS.find(a => a.id === row.archId);
      const name = arch ? archName(arch) : row.archId;
      return `<tr>
        <td><strong>${highlight(name, searchQuery)}</strong><br/><span style="font-size:.75rem;color:var(--muted)">${arch ? esc(arch.level) : ""}</span></td>
        ${langCols.map(lg => {
          const cell = row.cells?.[lg];
          if (!cell) return `<td class="na">—</td>`;
          const note = cell.note?.[CURRENT_LANG] || cell.note?.en || "";
          return `<td>
            <strong style="font-size:.8rem">${esc(cell.framework || "")}</strong><br/>
            <span style="font-size:.75rem;color:var(--muted)">${esc(cell.libs || "")}</span><br/>
            <em style="font-size:.73rem;color:var(--muted)">${esc(note)}</em>
          </td>`;
        }).join("")}
      </tr>`;
    }).join("");

    // Click headers to sort
    head.querySelectorAll("th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
        renderMatrix();
      });
    });
  }

  // ── Building Blocks ────────────────────────────────────────────────────────
  function renderBlocks() {
    const head = $("blocksHead");
    const body = $("blocksBody");
    const noRes = $("blocksNoResults");
    if (!head || !body || typeof BUILDING_BLOCKS === "undefined") return;

    head.innerHTML = `<tr>
      <th>${t("col_block")}</th>
      <th>${t("col_group")}</th>
      <th>${t("col_definition")}</th>
      <th>${t("col_used_in")}</th>
    </tr>`;

    const blocks = BUILDING_BLOCKS.filter(b => {
      if (!searchQuery) return true;
      const ql = searchQuery.toLowerCase();
      return (
        (b.name?.[CURRENT_LANG] || b.name?.en || "").toLowerCase().includes(ql) ||
        (b.definition?.[CURRENT_LANG] || b.definition?.en || "").toLowerCase().includes(ql) ||
        b.group.toLowerCase().includes(ql)
      );
    });

    if (blocks.length === 0) {
      body.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    body.innerHTML = blocks.map(b => {
      const name = b.name?.[CURRENT_LANG] || b.name?.en || b.id;
      const def  = b.definition?.[CURRENT_LANG] || b.definition?.en || "";
      const usedIn = (b.usedIn || []).map(id => {
        const arch = ALL_ARCHS.find(a => a.id === id);
        return arch ? `<span class="tag">${esc(archName(arch))}</span>` : `<span class="tag">${esc(id)}</span>`;
      }).join(" ");
      return `<tr>
        <td><strong>${b.icon || ""} ${highlight(name, searchQuery)}</strong></td>
        <td><span class="tag">${esc(b.group)}</span></td>
        <td style="max-width:340px">${highlight(def, searchQuery)}</td>
        <td style="display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px">${usedIn}</td>
      </tr>`;
    }).join("");
  }

  // ── Language Mapping ───────────────────────────────────────────────────────
  function renderLangmap() {
    const head = $("langmapHead");
    const body = $("langmapBody");
    const noRes = $("langmapNoResults");
    if (!head || !body || typeof LANGMAP === "undefined") return;

    head.innerHTML = `<tr>
      <th>${t("col_lang")}</th>
      <th>${t("col_primary_archs")}</th>
      <th>${t("col_ecosystem")}</th>
      <th>${t("col_testing")}</th>
    </tr>`;

    const rows = LANGMAP.filter(row => {
      if (!searchQuery) return true;
      const ql = searchQuery.toLowerCase();
      const eco = (row.frameworkEcosystem?.[CURRENT_LANG] || row.frameworkEcosystem?.en || "").toLowerCase();
      const idioms = (row.idioms?.[CURRENT_LANG] || row.idioms?.en || "").toLowerCase();
      const testing = (row.testingStack || "").toLowerCase();
      const archText = (row.primaryArchs || []).map(id => {
        const arch = ALL_ARCHS.find(a => a.id === id);
        return arch ? archName(arch) : id;
      }).join(" ").toLowerCase();
      return (
        (row.label || "").toLowerCase().includes(ql) ||
        eco.includes(ql) ||
        idioms.includes(ql) ||
        testing.includes(ql) ||
        archText.includes(ql)
      );
    });

    if (rows.length === 0) {
      body.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    body.innerHTML = rows.map(row => {
      const eco = row.frameworkEcosystem?.[CURRENT_LANG] || row.frameworkEcosystem?.en || "";
      const idioms = row.idioms?.[CURRENT_LANG] || row.idioms?.en || "";
      const archs = (row.primaryArchs || []).map(id => {
        const arch = ALL_ARCHS.find(a => a.id === id);
        return arch ? `<span class="tag">${highlight(archName(arch), searchQuery)}</span>` : `<span class="tag">${highlight(id, searchQuery)}</span>`;
      }).join(" ");
      return `<tr>
        <td><strong>${highlight(row.label, searchQuery)}</strong></td>
        <td style="min-width:200px"><div style="display:flex;flex-wrap:wrap;gap:4px">${archs}</div></td>
        <td style="font-size:.8rem">${highlight(eco, searchQuery)}<br/><em style="color:var(--muted);font-size:.75rem">${highlight(idioms, searchQuery)}</em></td>
        <td style="font-size:.8rem;color:var(--muted)">${highlight(row.testingStack || "", searchQuery)}</td>
      </tr>`;
    }).join("");
  }

  // ── Tooling ────────────────────────────────────────────────────────────────
  function renderTooling() {
    const head = $("toolingHead");
    const body = $("toolingBody");
    const noRes = $("toolingNoResults");
    if (!head || !body || typeof TOOLING === "undefined") return;

    head.innerHTML = `<tr>
      <th>${t("col_tool")}</th>
      <th>${t("col_group")}</th>
      <th>${t("col_usecase")}</th>
      <th>${t("col_languages")}</th>
    </tr>`;

    const rows = TOOLING.flatMap(group => {
      const catLabel = group.category?.[CURRENT_LANG] || group.category?.en || "";
      return (group.tools || []).map(tool => ({ tool, catLabel }));
    }).filter(({ tool, catLabel }) => {
      if (!searchQuery) return true;
      const ql = searchQuery.toLowerCase();
      const uc = (tool.useCase?.[CURRENT_LANG] || tool.useCase?.en || "").toLowerCase();
      return (
        (tool.name || "").toLowerCase().includes(ql) ||
        catLabel.toLowerCase().includes(ql) ||
        uc.includes(ql) ||
        (tool.langs || "").toLowerCase().includes(ql)
      );
    });

    if (rows.length === 0) {
      body.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    body.innerHTML = rows.map(({ tool, catLabel }) => {
      const uc = tool.useCase?.[CURRENT_LANG] || tool.useCase?.en || "";
      return `<tr>
        <td><strong>${highlight(tool.name, searchQuery)}</strong></td>
        <td><span class="tag">${highlight(catLabel, searchQuery)}</span></td>
        <td>${highlight(uc, searchQuery)}</td>
        <td style="font-size:.78rem;color:var(--muted)">${highlight(tool.langs || "", searchQuery)}</td>
      </tr>`;
    }).join("");
  }

  // ── Category View ──────────────────────────────────────────────────────────
  function renderCategories() {
    const view = $("categoryView");
    const noRes = $("categoryNoResults");
    if (!view) return;

    const sourceArchs = searchQuery
      ? ALL_ARCHS.filter(a => archMatches(a, searchQuery))
      : ALL_ARCHS;

    if (sourceArchs.length === 0) {
      view.innerHTML = "";
      if (noRes) noRes.style.display = "";
      return;
    }
    if (noRes) noRes.style.display = "none";

    const catMap = {};
    sourceArchs.forEach(a => {
      (a.category || []).forEach(cat => {
        if (!catMap[cat]) catMap[cat] = [];
        catMap[cat].push(a);
      });
    });

    const businessBuckets = {};
    sourceArchs.forEach(a => {
      (a.businessModel || []).forEach(model => {
        if (!businessBuckets[model]) {
          businessBuckets[model] = { foundational: 0, intermediate: 0, advanced: 0, total: 0 };
        }
        if (businessBuckets[model][a.level] !== undefined) businessBuckets[model][a.level] += 1;
        businessBuckets[model].total += 1;
      });
    });

    const categorySummaryRows = Object.entries(catMap)
      .map(([cat, archs]) => {
        const counters = { foundational: 0, intermediate: 0, advanced: 0 };
        archs.forEach(a => { if (counters[a.level] !== undefined) counters[a.level] += 1; });
        return { cat, total: archs.length, ...counters };
      })
      .sort((a, b) => b.total - a.total || a.cat.localeCompare(b.cat));

    const businessSummaryRows = Object.entries(businessBuckets)
      .map(([name, data]) => ({ name, ...data }))
      .sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));

    view.innerHTML = `
      <div class="section">
        <div class="section-title" style="font-size:1rem">
          ${esc(CURRENT_LANG === "vi"
            ? "Tổng quan theo loại ứng dụng và độ phức tạp"
            : "Summary by App Type and Complexity")}
        </div>
        <div class="section-body" style="padding-top:12px">
          <div class="tbl-wrap" style="margin-bottom:14px">
            <table>
              <thead>
                <tr>
                  <th>${esc(CURRENT_LANG === "vi" ? "Loại ứng dụng" : "App Type")}</th>
                  <th>${esc(t("foundational"))}</th>
                  <th>${esc(t("intermediate"))}</th>
                  <th>${esc(t("advanced"))}</th>
                  <th>${esc(CURRENT_LANG === "vi" ? "Tổng" : "Total")}</th>
                </tr>
              </thead>
              <tbody>
                ${categorySummaryRows.map(r => `
                  <tr>
                    <td><strong>${esc(t("cat_" + r.cat) !== "cat_" + r.cat ? t("cat_" + r.cat) : r.cat)}</strong></td>
                    <td>${r.foundational}</td>
                    <td>${r.intermediate}</td>
                    <td>${r.advanced}</td>
                    <td><strong>${r.total}</strong></td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>

          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>${esc(CURRENT_LANG === "vi" ? "Mô hình kinh doanh" : "Business Model")}</th>
                  <th>${esc(t("foundational"))}</th>
                  <th>${esc(t("intermediate"))}</th>
                  <th>${esc(t("advanced"))}</th>
                  <th>${esc(CURRENT_LANG === "vi" ? "Tổng" : "Total")}</th>
                </tr>
              </thead>
              <tbody>
                ${businessSummaryRows.map(r => `
                  <tr>
                    <td><strong>${esc(r.name)}</strong></td>
                    <td>${r.foundational}</td>
                    <td>${r.intermediate}</td>
                    <td>${r.advanced}</td>
                    <td><strong>${r.total}</strong></td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      ${Object.entries(catMap).map(([cat, archs]) => `
      <div class="section">
        <div class="section-title" data-sec="cat-${cat}" style="font-size:1rem">
          ${esc(t("cat_" + cat) || cat)}
          <span class="tag" style="margin-left:auto">${archs.length} ${t("archs_in_category")}</span>
          <span class="caret">▾</span>
        </div>
        <div class="section-body" id="sec-cat-${cat}">
          <div class="card-grid" style="margin-top:12px">
            ${archs.map(arch => `
              <div class="card" data-id="${esc(arch.id)}" style="cursor:pointer" tabindex="0" role="button">
                <div class="card-header">
                  <div class="card-icon">${arch.icon || "📐"}</div>
                  <div>
                    <div class="card-title">${highlight(archName(arch), searchQuery)}</div>
                    <div class="card-subtitle">${esc(arch.level)}</div>
                  </div>
                </div>
                <div class="card-desc">${highlight((arch.description?.[CURRENT_LANG] || arch.description?.en || "").slice(0, 100), searchQuery)}…</div>
              </div>`).join("")}
          </div>
        </div>
      </div>`).join("")}`;

    // open modal on card click
    view.querySelectorAll(".card[data-id]").forEach(card => {
      card.addEventListener("click", () => openModal(card.dataset.id));
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") openModal(card.dataset.id);
      });
    });
    // collapsible category sections
    view.querySelectorAll(".section-title").forEach(h => {
      h.addEventListener("click", e => {
        if (e.target.closest(".card")) return;
        if (!h.dataset.sec) return;
        h.classList.toggle("collapsed");
        const caret = h.querySelector(".caret");
        const sec   = document.getElementById("sec-" + h.dataset.sec);
        if (sec) sec.classList.toggle("collapsed");
        if (caret) caret.textContent = (sec && sec.classList.contains("collapsed")) ? "▸" : "▾";
      });
    });
  }

  // ── Tab switching ──────────────────────────────────────────────────────────
  function switchTab(tabId) {
    activeTab = tabId;
    $$(".nav-tab").forEach(t2 => t2.classList.toggle("active", t2.dataset.tab === tabId));
    $$(".tab-content").forEach(c => c.classList.toggle("active", c.id === `tab-${tabId}`));
    renderCurrentTab();
  }

  function renderCurrentTab() {
    switch (activeTab) {
      case "catalog":    renderCatalog();    break;
      case "matrix":     renderMatrix();     break;
      case "blocks":     renderBlocks();     break;
      case "langmap":    renderLangmap();    break;
      case "tooling":    renderTooling();    break;
      case "categories": renderCategories(); break;
    }
  }

  // ── Search ─────────────────────────────────────────────────────────────────
  function initSearch() {
    const input = $("searchInput");
    const clear = $("searchClear");
    if (!input) return;
    if (clear) clear.style.display = input.value.trim() ? "block" : "none";
    input.addEventListener("input", () => {
      searchQuery = input.value.trim();
      if (clear) clear.style.display = searchQuery ? "block" : "none";
      if (searchTimer) window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(() => {
        renderCurrentTab();
      }, SEARCH_DEBOUNCE_MS);
    });
    if (clear) clear.addEventListener("click", () => {
      input.value = ""; searchQuery = "";
      clear.style.display = "none";
      renderCurrentTab();
    });
  }

  // ── Filters ────────────────────────────────────────────────────────────────
  function initFilters() {
    $$("[data-filter]").forEach(chip => {
      chip.addEventListener("click", () => {
        const filter = chip.dataset.filter;
        const val    = chip.dataset.val;
        $$(`[data-filter="${filter}"]`).forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        if (filter === "level") levelFilter = val;
        if (filter === "lang")  langFilter  = val;
        renderCurrentTab();
      });
    });
  }

  // ── Theme toggle ───────────────────────────────────────────────────────────
  function initTheme() {
    const btn = $("themeToggle");
    const saved = localStorage.getItem("aa-theme");
    if (saved === "dark") { document.body.classList.add("dark"); if (btn) btn.textContent = "☀️"; }
    if (btn) btn.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");
      btn.textContent = isDark ? "☀️" : "🌙";
      localStorage.setItem("aa-theme", isDark ? "dark" : "light");
      syncMermaidTheme();
    });
  }

  function syncMermaidTheme() {
    if (typeof mermaid === "undefined") return;
    const isDark = document.body.classList.contains("dark");
    mermaid.initialize({ startOnLoad: false, theme: isDark ? "dark" : "default", securityLevel: "loose" });
  }

  // ── Language (EN/VI) toggle ────────────────────────────────────────────────
  function initLangToggle() {
    const btn = $("langToggle");
    if (!btn) return;
    btn.addEventListener("click", () => {
      CURRENT_LANG = CURRENT_LANG === "en" ? "vi" : "en";
      btn.textContent = CURRENT_LANG === "en" ? "🇻🇳" : "🇬🇧";
      applyI18n();
      renderCurrentTab();
    });
  }

  // ── Nav tab events ─────────────────────────────────────────────────────────
  function initNavTabs() {
    $$(".nav-tab").forEach(tab => {
      tab.addEventListener("click", () => switchTab(tab.dataset.tab));
    });
  }

  // ── Modal close ────────────────────────────────────────────────────────────
  function initModal() {
    const close = $("modalClose");
    const overlay = $("modalOverlay");
    if (close) close.addEventListener("click", closeModal);
    if (overlay) overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  }

  // ── Sort icon helper ───────────────────────────────────────────────────────
  function sortIcon(col) {
    if (sortCol !== col) return "⇕";
    return sortDir === 1 ? "▲" : "▼";
  }

  // ── hljs language mapping ──────────────────────────────────────────────────
  function langToHljs(lg) {
    const map = { csharp:"csharp", python:"python", go:"go", rust:"rust",
                  java:"java", javascript:"javascript", cpp:"cpp" };
    return map[lg] || "plaintext";
  }

  // ── Keyboard shortcut: / to focus search ──────────────────────────────────
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault();
      const input = $("searchInput");
      if (input) input.focus();
    }
  });

  // ── Boot ───────────────────────────────────────────────────────────────────
  function boot() {
    initTheme();
    initLangToggle();
    applyI18n();
    initSearch();
    initFilters();
    initNavTabs();
    initModal();
    renderCatalog();      // default tab
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

})();

</script>
</body>
</html>
