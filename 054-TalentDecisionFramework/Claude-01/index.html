<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Decision Framework — Buffett · Munger · Grant · Collins</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --bg:#f8f7f4;--surface:#fff;--surface-alt:#f2f0ec;
  --border:#e5e2db;--border-strong:#c9c5bc;
  --text-primary:#1a1916;--text-secondary:#6b6860;--text-muted:#9e9b95;
  --accent:#1a6b4a;--accent-light:#e6f2ec;--accent-mid:#2d9a6e;
  --red:#c0392b;--red-light:#fdf2f1;--red-border:#f5c0bb;
  --gold:#b8860b;--gold-light:#fffaee;--gold-border:#f5d98a;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --transition:150ms ease;
}
html.dark{
  --bg:#0f0f0e;--surface:#1a1917;--surface-alt:#232220;
  --border:#2e2c29;--border-strong:#3d3b37;
  --text-primary:#e8e5df;--text-secondary:#9b9790;--text-muted:#5e5c58;
  --accent:#2d9a6e;--accent-light:#0e2d1f;--accent-mid:#3ab87f;
  --red:#e05545;--red-light:#1f0f0d;--red-border:#5a2520;
  --gold:#c8a040;--gold-light:#1a1200;--gold-border:#3a2c00;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
}
html{font-size:15px;transition:background-color .25s,color .25s}
body,
.section,.score-card,.verdict-card,.tabs-nav,
.tab-btn,.lang-toggle,.btn,.section-header,.criterion{
  transition:background-color .25s,border-color .25s,color .25s,box-shadow .25s}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:880px;margin:0 auto;padding:2rem 1.25rem 5rem}

/* ── Header ── */
.header{margin-bottom:2.5rem}
.header-top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:.5rem}
.header-eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-mid);margin-bottom:.3rem}
.header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;color:var(--text-primary);line-height:1.25;margin-bottom:.5rem}
.header-sub{font-size:.875rem;color:var(--text-secondary);max-width:580px}
.source-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:1rem}
.pill{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid transparent}
.pill-b{background:#e8f4e8;color:#2a6e2a;border-color:#b6d9b6}
.pill-m{background:#eeebf8;color:#4a3d9a;border-color:#c4bae8}
.pill-g{background:#fef3dc;color:#7a4f00;border-color:#f5d98a}
.pill-c{background:#e4eef8;color:#1a4a7a;border-color:#a8c8e8}
html.dark .pill-b{background:#0e2010;color:#5db87a;border-color:#1a4028}
html.dark .pill-m{background:#130f28;color:#9b90e0;border-color:#2a2050}
html.dark .pill-g{background:#1a1200;color:#c8a040;border-color:#3a2c00}
html.dark .pill-c{background:#0a1628;color:#6090cc;border-color:#1a3050}

/* ── Controls ── */
.header-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.lang-toggle{display:flex;align-items:center;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:3px;gap:2px}
.lang-btn{padding:5px 13px;border:none;background:transparent;border-radius:var(--radius-sm);font-family:var(--font);font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all var(--transition);letter-spacing:.04em}
.lang-btn:hover{color:var(--text-secondary)}
.lang-btn.active{background:var(--surface);color:var(--text-primary);box-shadow:var(--shadow-sm)}
.theme-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-alt);cursor:pointer;font-size:1rem;flex-shrink:0;transition:background var(--transition),border-color var(--transition),transform .15s}
.theme-btn:hover{background:var(--surface);border-color:var(--border-strong);transform:scale(1.08)}
.theme-btn:active{transform:scale(.94)}

/* ── Tabs ── */
.tabs-nav{display:flex;gap:4px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-lg);padding:4px;margin-bottom:1.75rem;flex-wrap:wrap}
.tab-btn{flex:1;padding:9px 10px;border:none;background:transparent;border-radius:var(--radius-md);font-family:var(--font);font-size:.8125rem;font-weight:500;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;min-width:0}
.tab-btn:hover{color:var(--text-primary);background:rgba(255,255,255,.6)}
html.dark .tab-btn:hover{background:rgba(255,255,255,.06)}
.tab-btn.active{background:var(--surface);color:var(--text-primary);box-shadow:var(--shadow-sm);font-weight:600}
.tab-btn .tab-badge{background:var(--surface-alt);color:var(--text-muted);font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;margin-left:2px}
.tab-btn.active .tab-badge{background:var(--accent-light);color:var(--accent)}
.tab-btn.has-redflag .tab-badge{background:var(--red-light);color:var(--red)}

/* ── Panel ── */
.panel{display:none}.panel.active{display:block}

/* ── Score strip ── */
.score-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px}
.score-label{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.score-number{font-size:1.6rem;font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--text-primary)}
.score-sub{font-size:11px;color:var(--text-muted);margin-top:3px}
.score-card.redflag-alert{border-color:var(--red-border);background:var(--red-light)}
.score-card.redflag-alert .score-number,.score-card.redflag-alert .score-label{color:var(--red)}

/* ── Progress ── */
.progress-wrap{margin-bottom:1.5rem}
.progress-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--accent-mid);transition:width .4s cubic-bezier(.4,0,.2,1);width:0%}
.progress-fill.danger{background:var(--red)}

/* ── Rating Level Card ── */
.rating-card{margin-bottom:1.5rem;border-radius:var(--radius-lg);border:2px solid var(--border);padding:18px 20px;background:var(--surface);transition:all .3s}
.rating-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rating-stars{font-size:1.1rem;letter-spacing:1px;line-height:1}
.rating-label{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.rating-pct{font-size:.8125rem;font-weight:500;color:var(--text-muted);margin-left:auto}
.rating-desc{font-size:.8125rem;color:var(--text-secondary);line-height:1.55;margin-bottom:10px}
.rating-gap{display:flex;flex-direction:column;gap:6px}
.gap-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
.gap-items{display:flex;flex-direction:column;gap:3px}
.gap-item{font-size:.8rem;line-height:1.45;padding:4px 10px;border-radius:5px;display:flex;gap:6px;align-items:flex-start}
.gap-item-crit{background:var(--red-light);color:var(--red)}
.gap-item-high{background:var(--gold-light);color:var(--gold)}
.gap-item-rf{background:var(--red-light);color:var(--red);border:1px solid var(--red-border)}
.gap-none{font-size:.8125rem;color:var(--accent-mid);font-style:italic}

/* Rating border colors by level */
.rating-lv1{border-color:#c9c5bc;background:var(--surface-alt)}
.rating-lv2{border-color:#c9c5bc}
.rating-lv3{border-color:var(--gold-border)}
.rating-lv4{border-color:var(--accent-mid)}
.rating-lv5{border-color:var(--accent);box-shadow:0 0 0 2px rgba(45,154,110,.12)}
.rating-lv-rf{border-color:var(--red);border-width:2px;background:var(--red-light)}
.rating-lv1 .rating-label{color:var(--text-muted)}
.rating-lv2 .rating-label{color:var(--text-secondary)}
.rating-lv3 .rating-label{color:var(--gold)}
.rating-lv4 .rating-label{color:var(--accent-mid)}
.rating-lv5 .rating-label{color:var(--accent)}
.rating-lv-rf .rating-label{color:var(--red)}

/* ── Sections ── */
.sections{display:flex;flex-direction:column;gap:8px}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.section:hover{box-shadow:var(--shadow-sm)}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;user-select:none;gap:10px}
.section-header:hover{background:var(--surface-alt)}
.section-title-group{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.section-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.section-title{font-size:.875rem;font-weight:600;color:var(--text-primary)}
.section-pills{display:flex;gap:4px;flex-wrap:wrap}
.section-meta{display:flex;align-items:center;gap:10px;flex-shrink:0}
.section-progress-text{font-size:12px;font-weight:500;color:var(--text-muted)}
.section-mini-bar{width:50px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.section-mini-fill{height:100%;background:var(--accent-mid);border-radius:2px;transition:width .3s}
.chevron-icon{color:var(--text-muted);transition:transform var(--transition);flex-shrink:0}
.section.open .chevron-icon{transform:rotate(180deg)}
.section-body{display:none;border-top:1px solid var(--border)}
.section.open .section-body{display:block}

/* ── Red flag section ── */
.section.redflag-section{border-color:var(--red-border)}
.section.redflag-section .section-header{background:var(--red-light)}
.section.redflag-section .section-header:hover{filter:brightness(.97)}
.section.redflag-section .section-title{color:var(--red)}
.section.redflag-section .section-mini-fill{background:var(--red)}
.section.redflag-section.has-active{border-color:var(--red);box-shadow:0 0 0 2px rgba(192,57,43,.15)}
.redflag-banner{background:var(--red-light);border-bottom:1px solid var(--red-border);padding:8px 16px;font-size:.8125rem;color:var(--red);display:flex;align-items:center;gap:6px}
.redflag-banner strong{font-weight:600}

/* ── Criteria ── */
.criterion{display:flex;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.criterion:last-child{border-bottom:none}
.criterion:hover{background:var(--surface-alt)}
.criterion.checked{background:var(--accent-light)}
.criterion.redflag:hover{background:var(--red-light)}
.criterion.redflag.checked{background:var(--red-light)!important}
.chk-col{flex-shrink:0;padding-top:1px}
.chk-col input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--accent)}
.criterion.redflag .chk-col input[type=checkbox]{accent-color:var(--red)}
.crit-content{flex:1;min-width:0}
.crit-title{font-size:.875rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.4;display:block;cursor:pointer}
.criterion.checked .crit-title{color:var(--text-secondary);text-decoration:line-through}
.criterion.redflag.checked .crit-title{color:var(--red)!important;text-decoration:none}
.crit-desc{font-size:.8125rem;color:var(--text-secondary);line-height:1.55;margin-bottom:7px}
.crit-footer{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.weight-tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.w-critical{background:var(--red-light);color:var(--red);border:1px solid var(--red-border)}
.w-high{background:var(--gold-light);color:var(--gold);border:1px solid var(--gold-border)}
.w-medium{background:var(--accent-light);color:var(--accent-mid);border:1px solid var(--border)}
.w-redflag{background:var(--red-light);color:var(--red);border:1px solid var(--red-border)}

/* ── Filter & Search bar ── */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1rem;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.filter-group{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-right:2px;white-space:nowrap}
.filter-chip{padding:4px 10px;border:1px solid var(--border);border-radius:20px;background:transparent;font-family:var(--font);font-size:11px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--transition);white-space:nowrap}
.filter-chip:hover{border-color:var(--border-strong);color:var(--text-primary)}
.filter-chip.active{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}
.filter-chip.active-b{background:#2a6e2a;color:#fff;border-color:#2a6e2a}
.filter-chip.active-m{background:#4a3d9a;color:#fff;border-color:#4a3d9a}
.filter-chip.active-g{background:#7a4f00;color:#fff;border-color:#7a4f00}
.filter-chip.active-c{background:#1a4a7a;color:#fff;border-color:#1a4a7a}
.filter-chip.active-critical{background:var(--red);color:#fff;border-color:var(--red)}
.filter-chip.active-high{background:var(--gold);color:#fff;border-color:var(--gold)}
.filter-chip.active-medium{background:var(--accent-mid);color:#fff;border-color:var(--accent-mid)}
.filter-chip.active-redflag{background:var(--red);color:#fff;border-color:var(--red)}
.filter-divider{width:1px;height:20px;background:var(--border);flex-shrink:0}
.search-wrap{flex:1;min-width:160px;position:relative;display:flex;align-items:center}
.search-icon{position:absolute;left:10px;color:var(--text-muted);font-size:12px;pointer-events:none}
.search-input{width:100%;padding:5px 10px 5px 28px;border:1px solid var(--border);border-radius:20px;background:var(--surface-alt);font-family:var(--font);font-size:12px;color:var(--text-primary);outline:none;transition:all var(--transition)}
.search-input::placeholder{color:var(--text-muted)}
.search-input:focus{border-color:var(--border-strong);background:var(--surface);box-shadow:0 0 0 2px rgba(45,154,110,.12)}
.search-clear{position:absolute;right:10px;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:0;line-height:1;display:none;transition:color var(--transition)}
.search-clear:hover{color:var(--text-primary)}
.search-clear.visible{display:flex;align-items:center;justify-content:center}
.search-input.has-value{padding-right:30px}
.filter-count{font-size:11px;color:var(--text-muted);white-space:nowrap;margin-left:4px}

/* ── Sticky filter bar ── */
.filter-bar-sticky-wrap{position:sticky;top:0;z-index:100;margin-bottom:1rem}
.filter-bar-sticky-wrap .filter-bar{margin-bottom:0;border-radius:0;border-left:none;border-right:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.filter-bar-sticky-wrap.is-stuck .filter-bar{border-top:none;border-radius:0}
/* when not stuck, restore normal look */
.filter-bar-wrap{margin-bottom:1rem}
.filter-bar-wrap .filter-bar{margin-bottom:0}

/* ── Sticky sentinel ── */
.sticky-sentinel{height:1px;margin-bottom:-1px;visibility:hidden}

/* ── Gap item expandable ── */
.gap-item{position:relative;cursor:pointer;transition:background var(--transition),box-shadow var(--transition)}
.gap-item:hover{filter:brightness(.95);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.gap-item-expand{display:none;margin-top:6px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;cursor:default}
.gap-item-expand.open{display:block}
.gap-item-expand-title{font-size:.8125rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.4}
.gap-item-expand-desc{font-size:.8rem;color:var(--text-secondary);line-height:1.55;margin-bottom:6px}
.gap-item-expand-footer{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.gap-item-arrow{margin-left:auto;font-size:10px;opacity:.5;transition:transform var(--transition);flex-shrink:0}
.gap-item.expanded .gap-item-arrow{transform:rotate(180deg)}

/* ── Search highlight ── */
mark.hl{background:#fde68a;color:#78350f;border-radius:2px;padding:0 1px}
html.dark mark.hl{background:#78350f;color:#fde68a}

/* hidden by filter */
.criterion.filter-hidden{display:none}
.no-results{padding:16px;text-align:center;font-size:.8125rem;color:var(--text-muted);font-style:italic}

/* ── Rating legend ── */
.rating-legend{margin-top:1.25rem;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.rating-legend-header{padding:10px 16px;background:var(--surface-alt);cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.rating-legend-header:hover{filter:brightness(.97)}
.rating-legend-title{font-size:12px;font-weight:600;color:var(--text-secondary)}
.rating-legend-body{display:none;border-top:1px solid var(--border)}
.rating-legend.open .rating-legend-body{display:block}
.rating-legend.open .chevron-icon{transform:rotate(180deg)}
.legend-row{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}
.legend-row:last-child{border-bottom:none}
.legend-stars{font-size:.9rem;white-space:nowrap;width:80px;flex-shrink:0;padding-top:1px}
.legend-info{}
.legend-name{font-size:.8125rem;font-weight:600;color:var(--text-primary);margin-bottom:2px}
.legend-desc{font-size:.8rem;color:var(--text-secondary);line-height:1.5}
.legend-threshold{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin-top:2px}

/* ── Actions ── */
.panel-actions{display:flex;align-items:center;gap:8px;margin-top:1.25rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--text-secondary);font-family:var(--font);font-size:.8125rem;font-weight:500;cursor:pointer;transition:all var(--transition)}
.btn:hover{background:var(--surface-alt);color:var(--text-primary);border-color:var(--text-muted)}
.btn:active{transform:scale(.98)}
.btn-spacer{margin-left:auto}

@media(max-width:680px){
  .score-strip{grid-template-columns:repeat(2,1fr)}
  .section-pills{display:none}
  .header h1{font-size:1.3rem}
  .tab-btn{font-size:.75rem;padding:8px 6px}
}
@media print{
  .tabs-nav,.lang-toggle,.panel-actions,.theme-btn{display:none!important}
  .panel{display:block!important}
  .section-body{display:block!important}
  body{background:white}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-top-row">
      <div>
        <div class="header-eyebrow" id="hd-eyebrow"></div>
        <h1 id="hd-title"></h1>
      </div>
      <div class="header-controls">
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Chuyển sáng/tối">☀️</button>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button class="lang-btn active" id="lang-vi" onclick="setLang('vi')">VI</button>
          <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
        </div>
      </div>
    </div>
    <p class="header-sub" id="hd-sub"></p>
    <div class="source-pills">
      <span class="pill pill-b">Buffett — Moat &amp; Character</span>
      <span class="pill pill-m">Munger — Mental Models</span>
      <span class="pill pill-g">Grant — Psychology &amp; Giving</span>
      <span class="pill pill-c">Collins — Level 5 &amp; Flywheel</span>
    </div>
  </header>
  <nav class="tabs-nav" role="tablist" id="tabs-nav"></nav>
  <div id="panels"></div>
</div>
<script>
/* ════════════════════════════════════════════════
   I18N LAYER
   ════════════════════════════════════════════════ */
const I18N = {
  vi:{
    eyebrow:'Decision Framework',
    title:'Đánh giá Nhân tài & Tổ chức',
    sub:'Tổng hợp tiêu chí từ Buffett, Munger, Grant và Collins — bao gồm cờ đỏ loại bỏ ngay và hệ thống đánh giá mức độ.',
    tabs:['🏢 Chọn công ty','👤 Tuyển nhân viên','🌱 Phát triển nhân tài','🪞 Tự đánh giá'],
    scoreLabels:['Tổng điểm','Bắt buộc','Mức độ','Cờ đỏ'],
    scoreSub:(c,t)=>`${c}/${t} tiêu chí`,
    critSub:'phải đạt tất cả',
    rfSub:'loại bỏ ngay',
    emptyH:'Chưa đánh giá',
    emptyB:'Bắt đầu đánh dấu các tiêu chí để xem đánh giá mức độ.',

<script>
/* ── Theme init ── */
(function(){
  const saved=localStorage.getItem('tdf-theme');
  const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(saved==='dark'||(!saved&&dark)){
    document.documentElement.classList.add('dark');
    document.getElementById('theme-btn').textContent='🌙';
  }
})();
window.toggleTheme=function(){
  const isDark=document.documentElement.classList.toggle('dark');
  document.getElementById('theme-btn').textContent=isDark?'🌙':'☀️';
  localStorage.setItem('tdf-theme',isDark?'dark':'light');
};

/* ── Rendering Engine ── */
(function(){
  'use strict';
  const SRC_CLASS={b:'pill-b',m:'pill-m',g:'pill-g',c:'pill-c'};
  const SRC_LABEL={b:'Buffett',m:'Munger',g:'Grant',c:'Collins'};
  const W_CLASS={critical:'w-critical',high:'w-high',medium:'w-medium',redflag:'w-redflag'};

  let lang='vi', activePanel=PANELS[0].id;
  const checked={}, openState={}, filterState={};
  const debounceTimers={};
  /* itemIndex: flat map pid -> array of {si,ii,item} for gap lookups */
  const itemIndex={};

  PANELS.forEach(p=>{
    checked[p.id]  =p.sections.map(s=>s.items.map(()=>false));
    openState[p.id]=p.sections.map(()=>false);
    filterState[p.id]={src:null,wgt:null,query:''};
    itemIndex[p.id]=[];
    p.sections.forEach((sec,si)=>sec.items.forEach((item,ii)=>itemIndex[p.id].push({si,ii,item})));
  });

  const T  =()=>I18N[lang];
  const $  =id=>document.getElementById(id);
  const set=(id,txt)=>{const el=$(id);if(el)el.textContent=txt;};
  const wid=(id,pct)=>{const el=$(id);if(el)el.style.width=pct+'%';};
  const pill=src=>`<span class="pill ${SRC_CLASS[src]}">${SRC_LABEL[src]}</span>`;

  function debounce(pid,fn,ms=500){
    clearTimeout(debounceTimers[pid]);
    debounceTimers[pid]=setTimeout(fn,ms);
  }

  /* ── highlight query matches in text ── */
  function highlight(text, q){
    if(!q)return text;
    const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return text.replace(new RegExp(`(${escaped})`,'gi'),'<mark class="hl">$1</mark>');
  }

  /* ── filter + highlight ── */
  function applyFilter(pid){
    const panel=PANELS.find(x=>x.id===pid);
    const {src,wgt,query}=filterState[pid];
    const q=query.trim().toLowerCase();
    let visible=0,total=0;
    panel.sections.forEach((sec,si)=>{
      let secVis=0;
      sec.items.forEach((item,ii)=>{
        total++;
        const el=$(`crit-${pid}-${si}-${ii}`);
        if(!el)return;
        const srcMatch=!src||item.src.includes(src);
        const wgtMatch=!wgt||item.weight===wgt;
        const titleLC=item[lang].title.toLowerCase();
        const descLC =item[lang].desc.toLowerCase();
        const qMatch =!q||titleLC.includes(q)||descLC.includes(q);
        const show=srcMatch&&wgtMatch&&qMatch;
        el.classList.toggle('filter-hidden',!show);
        if(show){
          secVis++;visible++;
          const titleEl=el.querySelector('.crit-title');
          const descEl =el.querySelector('.crit-desc');
          if(titleEl)titleEl.innerHTML=highlight(item[lang].title,q);
          if(descEl) descEl.innerHTML =highlight(item[lang].desc,q);
        } else {
          const titleEl=el.querySelector('.crit-title');
          const descEl =el.querySelector('.crit-desc');
          if(titleEl)titleEl.textContent=item[lang].title;
          if(descEl) descEl.textContent =item[lang].desc;
        }
      });
      /* hide entire section when no items match; show when any match */
      const secEl=$(`sec-${pid}-${si}`);
      if(secEl) secEl.style.display=secVis===0?'none':'';
      /* auto-open section on search match */
      if(q&&secVis>0&&!openState[pid][si])secEl?.classList.add('open');
    });
    set(`filter-count-${pid}`,T().filterCount(visible,total));
    refreshScores(pid);
  }

  /* ── scores ── */
  function calcScores(pid){
    const p=PANELS.find(x=>x.id===pid);
    let tot=0,chk=0,critTot=0,critChk=0,rfActive=[],rfTot=0;
    const missedCrit=[],missedHigh=[];
    p.sections.forEach((sec,si)=>{
      sec.items.forEach((item,ii)=>{
        const isChk=checked[pid][si][ii];
        if(item.weight==='redflag'){rfTot++;if(isChk)rfActive.push(item[lang].title);return;}
        tot++;
        if(item.weight==='critical'){critTot++;if(!isChk)missedCrit.push(item[lang].title);}
        if(item.weight==='high'&&!isChk)missedHigh.push(item[lang].title);
        if(isChk){chk++;if(item.weight==='critical')critChk++;}
      });
    });
    return{tot,chk,critTot,critChk,pct:tot?Math.round(chk/tot*100):0,rfActive,rfTot,missedCrit,missedHigh};
  }

  function getRatingLevel(panel,sc){
    if(sc.rfActive.length>0)return -1;
    const thr=panel.ratingThresholds;
    const allCrit=sc.critChk===sc.critTot&&sc.critTot>0;
    if(sc.pct>=thr[3]&&allCrit)return 4;
    if(sc.pct>=thr[2]&&allCrit)return 3;
    if(sc.pct>=thr[1]&&allCrit)return 2;
    if(sc.pct>=thr[0])return 1;
    return 0;
  }

  /* ── lookup full item data by title ── */
  function findItemByTitle(pid,title){
    return itemIndex[pid].find(e=>e.item[lang].title===title)||null;
  }

  /* ── gap click handler — reads title from data-gap-title attribute ── */
  window.handleGapClick=function(el){
    const pid=el.dataset.pid;
    const title=el.dataset.gapTitle;
    const existing=el.querySelector('.gap-item-expand');
    if(existing){
      existing.classList.toggle('open');
      el.classList.toggle('expanded',existing.classList.contains('open'));
      return;
    }
    const entry=findItemByTitle(pid,title);
    if(!entry)return;
    const item=entry.item;
    const q=filterState[pid].query.trim().toLowerCase();
    const detail=document.createElement('div');
    detail.className='gap-item-expand open';
    detail.onclick=e=>e.stopPropagation();
    detail.innerHTML=`
      <div class="gap-item-expand-title">${q?highlight(item[lang].title,q):item[lang].title}</div>
      <div class="gap-item-expand-desc">${q?highlight(item[lang].desc,q):item[lang].desc}</div>
      <div class="gap-item-expand-footer">
        ${item.src.map(pill).join('')}
        <span class="weight-tag ${W_CLASS[item.weight]}">${T().weight[item.weight]}</span>
      </div>`;
    el.appendChild(detail);
    el.classList.add('expanded');
  };

  /* ── build gap item HTML — data-title avoids all inline quote escaping ── */
  function gapItemHTML(title,pid,cls,prefix,q){
    const displayTitle=q?highlight(title,q):title;
    return `<div class="gap-item ${cls}" data-pid="${pid}" data-gap-title="${title.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" onclick="handleGapClick(this)">
      <span>${prefix} ${displayTitle}</span>
      <span class="gap-item-arrow">▼</span>
    </div>`;
  }

  /* ── gap analysis ── */
  function buildGapHTML(panel,sc,lvIdx,q){
    const T_=T();
    const pid=panel.id;
    if(sc.rfActive.length>0)return'';
    if(lvIdx>=4)return`<div class="gap-none">${T_.gapNone}</div>`;
    const thr=panel.ratingThresholds;
    const nextThr=lvIdx<3?thr[lvIdx]:thr[3];
    const allCrit=sc.critChk===sc.critTot&&sc.critTot>0;
    let html=`<div class="gap-label">${T_.gapTitle}</div><div class="gap-items">`;

    if(!allCrit&&sc.missedCrit.length>0){
      html+=`<div class="gap-label" style="margin-top:0">${T_.gapCritTitle}</div>`;
      html+=sc.missedCrit.map(t=>gapItemHTML(t,pid,'gap-item-crit','→',q)).join('');
    }

    if(sc.missedHigh.length>0){
      const pctNeeded=nextThr-sc.pct;
      const perItem=sc.tot>0?Math.ceil(100/sc.tot):5;
      const needCount=pctNeeded>0?Math.ceil(pctNeeded/perItem):0;
      if(needCount>0){
        if(needCount>=sc.missedHigh.length){
          html+=`<div class="gap-label" style="margin-top:6px">${T_.gapHighTitle}</div>`;
          html+=sc.missedHigh.map(t=>gapItemHTML(t,pid,'gap-item-high','→',q)).join('');
        } else {
          const lbl=lang==='vi'
            ?`Còn thiếu ${needCount} trong số ${sc.missedHigh.length} tiêu chí sau:`
            :`Need ${needCount} of these ${sc.missedHigh.length} criteria:`;
          html+=`<div class="gap-label" style="margin-top:6px">${lbl}</div>`;
          html+=sc.missedHigh.map(t=>gapItemHTML(t,pid,'gap-item-high','→',q)).join('');
        }
      }
    }
    html+='</div>';
    return html;
  }

  function getClassicVerdict(panel,sc){
    const allCrit=sc.critChk===sc.critTot&&sc.critTot>0;
    for(const v of panel.verdicts[lang])
      if(sc.pct>=v.minPct&&(!v.needAllCritical||allCrit))return v;
    return panel.verdicts[lang].at(-1);
  }

  function buildLegendHTML(panel){
    const T_=T();
    const lvls=T_.levels[panel.id];
    const thr=panel.ratingThresholds;
    const thresholds=[0,thr[0],thr[1],thr[2],thr[3]];
    const needCrit=[false,false,true,true,true];
    const colors=['text-muted','text-secondary','gold','accent-mid','accent'];
    let rows=lvls.map((lv,i)=>`<div class="legend-row">
      <div class="legend-stars">${lv.stars}</div>
      <div class="legend-info">
        <div class="legend-name" style="color:var(--${colors[i]})">${lv.label}</div>
        <div class="legend-desc">${lv.desc}</div>
        <div class="legend-threshold">${T_.legendThreshold(thresholds[i],needCrit[i])}</div>
      </div></div>`).join('');
    const rfLabel=lang==='vi'?'🚩 Loại bỏ ngay':'🚩 Disqualified';
    const rfDesc=lang==='vi'
      ?'Kích hoạt ngay khi bất kỳ cờ đỏ nào được đánh dấu — bất kể điểm số.'
      :'Triggered immediately when any red flag is checked — regardless of score.';
    rows+=`<div class="legend-row" style="background:var(--red-light)">
      <div class="legend-stars">🚩</div>
      <div class="legend-info">
        <div class="legend-name" style="color:var(--red)">${rfLabel}</div>
        <div class="legend-desc" style="color:var(--red)">${rfDesc}</div>
      </div></div>`;
    return rows;
  }

  /* ── refresh scores ── */
  function refreshScores(pid){
    const panel=PANELS.find(x=>x.id===pid);
    const sc=calcScores(pid);
    const lvIdx=getRatingLevel(panel,sc);
    const hasRF=sc.rfActive.length>0;
    const q=filterState[pid].query.trim().toLowerCase();

    set(`s-pct-${pid}`,sc.pct+'%');
    set(`s-raw-${pid}`,T().scoreSub(sc.chk,sc.tot));
    set(`s-crt-${pid}`,`${sc.critChk}/${sc.critTot}`);
    set(`s-rf-${pid}`,`${sc.rfActive.length}/${sc.rfTot}`);
    $(`sc-rf-${pid}`)?.classList.toggle('redflag-alert',hasRF);

    const lvLabel=$(`s-lv-${pid}`);
    if(lvLabel){
      if(sc.chk===0&&!hasRF)lvLabel.textContent='—';
      else if(hasRF)lvLabel.textContent='🚩';
      else lvLabel.textContent=T().levels[pid][lvIdx]?.stars??'—';
    }
    wid(`prog-${pid}`,sc.pct);
    $(`prog-${pid}`)?.classList.toggle('danger',hasRF);
    const tb=$(`tbadge-${pid}`);
    if(tb)tb.textContent=sc.pct+'%';
    document.querySelector(`[data-panel="${pid}"]`)?.classList.toggle('has-redflag',hasRF);

    panel.sections.forEach((sec,si)=>{
      const sChk=checked[pid][si].filter(Boolean).length;
      set(`scscore-${pid}-${si}`,`${sChk}/${sec.items.length}`);
      wid(`scfill-${pid}-${si}`,sec.items.length?Math.round(sChk/sec.items.length*100):0);
      if(sec.isRedflag){
        const rfChk=sec.items.filter((_,ii)=>checked[pid][si][ii]).length;
        $(`sec-${pid}-${si}`)?.classList.toggle('has-active',rfChk>0);
      }
    });

    const rfBanner=$(`rfbanner-${pid}`);
    if(rfBanner)rfBanner.innerHTML=hasRF
      ?`<strong>${T().rfBannerActive(sc.rfActive.length)}</strong>`
      :T().rfBannerNone;

    const rCard=$(`rating-${pid}`);
    if(!rCard)return;
    if(sc.chk===0&&!hasRF){
      rCard.className='rating-card rating-lv1';
      rCard.innerHTML=`<div class="verdict-heading" style="color:var(--text-muted)">${T().emptyH}</div>
        <div class="verdict-body" style="color:var(--text-muted);margin-top:4px">${T().emptyB}</div>`;
      return;
    }
    if(hasRF){
      rCard.className='rating-card rating-lv-rf';
      rCard.innerHTML=`<div class="rating-header">
        <span class="rating-stars">🚩</span>
        <span class="rating-label">${T().rfVerdictLabel}</span></div>
        <div class="rating-desc">${T().rfVerdictBody(sc.rfActive)}</div>
        <div class="rating-gap"><div class="gap-label">${T().gapRfTitle}</div>
        <div class="gap-items">${sc.rfActive.map(t=>gapItemHTML(t,pid,'gap-item-rf','🚩',q)).join('')}</div></div>`;
      return;
    }
    const lvls=T().levels[pid];
    const lv=lvls[lvIdx];
    const cv=getClassicVerdict(panel,sc);
    const lvClass=['rating-lv1','rating-lv2','rating-lv3','rating-lv4','rating-lv5'][lvIdx];
    rCard.className=`rating-card ${lvClass}`;
    rCard.innerHTML=`<div class="rating-header">
      <span class="rating-stars">${lv.stars}</span>
      <span class="rating-label">${cv.label}</span>
      <span class="rating-pct">${sc.pct}%</span></div>
      <div class="rating-desc">${lv.desc}</div>
      <div class="rating-gap">${buildGapHTML(panel,sc,lvIdx,q)}</div>`;
  }

  /* ── build all ── */
  function buildAll(){
    document.documentElement.lang=lang;
    set('hd-eyebrow',T().eyebrow);
    set('hd-title',T().title);
    $('hd-sub').textContent=T().sub;

    const nav=$('tabs-nav');nav.innerHTML='';
    PANELS.forEach((p,pi)=>{
      const btn=document.createElement('button');
      btn.className='tab-btn'+(p.id===activePanel?' active':'');
      btn.role='tab';
      btn.setAttribute('aria-selected',p.id===activePanel?'true':'false');
      btn.dataset.panel=p.id;
      btn.innerHTML=`${T().tabs[pi]} <span class="tab-badge" id="tbadge-${p.id}">0%</span>`;
      btn.addEventListener('click',()=>switchTab(p.id));
      nav.appendChild(btn);
    });

    const container=$('panels');container.innerHTML='';
    PANELS.forEach(p=>container.appendChild(buildPanel(p)));
    PANELS.forEach(p=>{applyFilter(p.id);refreshScores(p.id);});
    /* re-attach sticky observers after rebuild */
    initStickyBars();
  }

  /* ── build one panel ── */
  function buildPanel(panel){
    const pid=panel.id;
    const div=document.createElement('div');
    div.className='panel'+(pid===activePanel?' active':'');
    div.id=`panel-${pid}`;
    const L=T().scoreLabels;

    /* 1 — score strip + progress */
    div.innerHTML=`
      <div class="score-strip">
        <div class="score-card"><div class="score-label">${L[0]}</div><div class="score-number" id="s-pct-${pid}">0%</div><div class="score-sub" id="s-raw-${pid}"></div></div>
        <div class="score-card"><div class="score-label">${L[1]}</div><div class="score-number" id="s-crt-${pid}">0/0</div><div class="score-sub">${T().critSub}</div></div>
        <div class="score-card"><div class="score-label">${L[2]}</div><div class="score-number" id="s-lv-${pid}" style="font-size:1.4rem">—</div></div>
        <div class="score-card" id="sc-rf-${pid}"><div class="score-label">${L[3]}</div><div class="score-number" id="s-rf-${pid}">0/0</div><div class="score-sub">${T().rfSub}</div></div>
      </div>
      <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="prog-${pid}"></div></div></div>`;

    /* 2 — sticky filter bar */
    const sentinel=document.createElement('div');
    sentinel.className='sticky-sentinel';
    sentinel.id=`sentinel-${pid}`;
    div.appendChild(sentinel);

    const stickyWrap=document.createElement('div');
    stickyWrap.className='filter-bar-sticky-wrap';
    stickyWrap.id=`filter-sticky-${pid}`;
    div.appendChild(stickyWrap);

    const filterBarEl=document.createElement('div');
    filterBarEl.id=`filter-bar-${pid}`;
    stickyWrap.appendChild(filterBarEl);
    populateFilterBar(filterBarEl,panel);

    /* 3 — sections */
    const sectionsEl=document.createElement('div');
    sectionsEl.className='sections';
    sectionsEl.id=`sections-${pid}`;
    div.appendChild(sectionsEl);

    panel.sections.forEach((sec,si)=>{
      const secEl=document.createElement('div');
      secEl.className='section'+(sec.isRedflag?' redflag-section':'')+(openState[pid][si]?' open':'');
      secEl.id=`sec-${pid}-${si}`;
      const srcPills=[...new Set(sec.items.flatMap(i=>i.src))].map(pill).join('');
      secEl.innerHTML=`
        <div class="section-header" role="button" tabindex="0"
             onclick="toggleSection('${pid}',${si})"
             onkeydown="if(event.key==='Enter'||event.key===' ')toggleSection('${pid}',${si})">
          <div class="section-title-group">
            <span class="section-icon">${sec.icon}</span>
            <span class="section-title">${sec.title[lang]}</span>
            <div class="section-pills">${srcPills}</div>
          </div>
          <div class="section-meta">
            <div class="section-mini-bar"><div class="section-mini-fill" id="scfill-${pid}-${si}" style="width:0%"></div></div>
            <span class="section-progress-text" id="scscore-${pid}-${si}">0/${sec.items.length}</span>
            <svg class="chevron-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="4,6 8,10 12,6"/></svg>
          </div>
        </div>
        <div class="section-body" id="sbody-${pid}-${si}">
          ${sec.isRedflag?`<div class="redflag-banner" id="rfbanner-${pid}">${T().rfBannerNone}</div>`:''}
          <div id="no-results-${pid}-${si}" class="no-results" style="display:none">${T().noResults}</div>
        </div>`;
      const body=secEl.querySelector(`#sbody-${pid}-${si}`);
      sec.items.forEach((item,ii)=>{
        const chkId=`chk-${pid}-${si}-${ii}`;
        const isChk=checked[pid][si][ii];
        const isRF=item.weight==='redflag';
        const crit=document.createElement('div');
        crit.className='criterion'+(isRF?' redflag':'')+(isChk?' checked':'');
        crit.id=`crit-${pid}-${si}-${ii}`;
        crit.dataset.src=item.src.join(',');
        crit.dataset.wgt=item.weight;
        crit.innerHTML=`
          <div class="chk-col"><input type="checkbox" id="${chkId}" ${isChk?'checked':''}
               aria-label="${item[lang].title}"
               onchange="toggle('${pid}',${si},${ii},this.checked)"></div>
          <div class="crit-content">
            <label class="crit-title" for="${chkId}">${item[lang].title}</label>
            <div class="crit-desc">${item[lang].desc}</div>
            <div class="crit-footer">${item.src.map(pill).join('')}
              <span class="weight-tag ${W_CLASS[item.weight]}">${T().weight[item.weight]}</span>
            </div>
          </div>`;
        body.appendChild(crit);
      });
      sectionsEl.appendChild(secEl);
    });

    /* 4 — rating card */
    const ratingEl=document.createElement('div');
    ratingEl.className='rating-card rating-lv1';
    ratingEl.id=`rating-${pid}`;
    ratingEl.innerHTML=`<div class="verdict-heading" style="color:var(--text-muted)">${T().emptyH}</div>
      <div class="verdict-body" style="color:var(--text-muted);margin-top:4px">${T().emptyB}</div>`;
    div.appendChild(ratingEl);

    /* 5 — rating legend */
    const legendEl=document.createElement('div');
    legendEl.id=`legend-${pid}`;
    div.appendChild(legendEl);
    populateLegend(legendEl,panel);

    /* 6 — actions */
    const actEl=document.createElement('div');
    actEl.className='panel-actions';
    actEl.innerHTML=`
      <button class="btn" onclick="resetPanel('${pid}')">${T().btnReset}</button>
      <button class="btn" onclick="expandAll('${pid}')">${T().btnExpand}</button>
      <button class="btn btn-spacer" onclick="collapseAll('${pid}')">${T().btnCollapse}</button>`;
    div.appendChild(actEl);
    return div;
  }

  /* ── sticky filter bar via IntersectionObserver ── */
  const stickyObservers=[];
  function initStickyBars(){
    stickyObservers.forEach(o=>o.disconnect());
    stickyObservers.length=0;
    PANELS.forEach(p=>{
      const sentinel=$(`sentinel-${p.id}`);
      const wrap=$(`filter-sticky-${p.id}`);
      if(!sentinel||!wrap)return;
      const obs=new IntersectionObserver(entries=>{
        entries.forEach(e=>{
          /* when sentinel is NOT visible, filter bar is sticky */
          wrap.classList.toggle('is-stuck',!e.isIntersecting);
        });
      },{threshold:0,rootMargin:'0px'});
      obs.observe(sentinel);
      stickyObservers.push(obs);
    });
  }

  /* ── filter bar ── */
  function populateFilterBar(bar,panel){
    const pid=panel.id;
    const fs=filterState[pid];
    const allSrcs=[...new Set(panel.sections.flatMap(s=>s.items.flatMap(i=>i.src)))];
    const srcChips=allSrcs.map(s=>`<button class="filter-chip${fs.src===s?` active-${s}`:''}" onclick="filterBySrc('${pid}','${s}')">${T().filterSrc[s]}</button>`).join('');
    const wgts=['critical','high','medium','redflag'];
    const wgtChips=wgts.map(w=>`<button class="filter-chip${fs.wgt===w?` active-${w}`:''}" onclick="filterByWgt('${pid}','${w}')">${T().filterWgt[w]}</button>`).join('');
    const total=panel.sections.reduce((a,s)=>a+s.items.length,0);
    bar.innerHTML=`<div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">${T().filterSrcLabel}</span>
        <button class="filter-chip${!fs.src?' active':''}" onclick="filterBySrc('${pid}',null)">${T().filterAll}</button>
        ${srcChips}
      </div>
      <div class="filter-divider"></div>
      <div class="filter-group">
        <span class="filter-label">${T().filterWgtLabel}</span>
        <button class="filter-chip${!fs.wgt?' active':''}" onclick="filterByWgt('${pid}',null)">${T().filterAll}</button>
        ${wgtChips}
      </div>
      <div class="filter-divider"></div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input${fs.query?' has-value':''}" id="search-${pid}" type="text"
               placeholder="${T().searchPlaceholder}" value="${fs.query}"
               oninput="onSearchInput('${pid}',this.value)">
        <button class="search-clear${fs.query?' visible':''}" id="search-clear-${pid}"
                onclick="clearSearch('${pid}')" title="Xoá tìm kiếm">✕</button>
      </div>
      <span class="filter-count" id="filter-count-${pid}">${T().filterCount(total,total)}</span>
    </div>`;
  }

  /* ── legend ── */
  function populateLegend(el,panel){
    const pid=panel.id;
    el.innerHTML=`<div class="rating-legend" id="legend-wrap-${pid}">
      <div class="rating-legend-header" onclick="toggleLegend('${pid}')">
        <span class="rating-legend-title">${T().legendTitle}</span>
        <svg class="chevron-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="4,6 8,10 12,6"/></svg>
      </div>
      <div class="rating-legend-body">${buildLegendHTML(panel)}</div>
    </div>`;
  }

  /* ── tab switch ── */
  function switchTab(pid){
    activePanel=pid;
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.classList.toggle('active',b.dataset.panel===pid);
      b.setAttribute('aria-selected',b.dataset.panel===pid?'true':'false');
    });
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${pid}`));
  }

  /* ── public API ── */
  window.setLang=function(nl){
    if(nl===lang)return;lang=nl;
    $('lang-vi').classList.toggle('active',lang==='vi');
    $('lang-en').classList.toggle('active',lang==='en');
    buildAll();
  };
  window.toggle=function(pid,si,ii,val){
    checked[pid][si][ii]=val;
    $(`crit-${pid}-${si}-${ii}`)?.classList.toggle('checked',val);
    refreshScores(pid);
  };
  window.toggleSection=function(pid,si){
    const el=$(`sec-${pid}-${si}`);if(!el)return;
    el.classList.toggle('open');
    openState[pid][si]=el.classList.contains('open');
  };
  window.toggleLegend=function(pid){$(`legend-wrap-${pid}`)?.classList.toggle('open');};
  window.filterBySrc=function(pid,src){
    filterState[pid].src=(filterState[pid].src===src)?null:src;
    const barEl=$(`filter-bar-${pid}`);
    const panel=PANELS.find(p=>p.id===pid);
    if(barEl&&panel)populateFilterBar(barEl,panel);
    applyFilter(pid);
  };
  window.filterByWgt=function(pid,wgt){
    filterState[pid].wgt=(filterState[pid].wgt===wgt)?null:wgt;
    const barEl=$(`filter-bar-${pid}`);
    const panel=PANELS.find(p=>p.id===pid);
    if(barEl&&panel)populateFilterBar(barEl,panel);
    applyFilter(pid);
  };
  window.onSearchInput=function(pid,val){
    /* immediately update clear button visibility */
    const inp=$(`search-${pid}`);
    const clr=$(`search-clear-${pid}`);
    if(inp)inp.classList.toggle('has-value',val.length>0);
    if(clr)clr.classList.toggle('visible',val.length>0);
    debounce(pid,()=>{filterState[pid].query=val;applyFilter(pid);},500);
  };
  window.clearSearch=function(pid){
    filterState[pid].query='';
    const inp=$(`search-${pid}`);
    if(inp){inp.value='';inp.classList.remove('has-value');inp.focus();}
    const clr=$(`search-clear-${pid}`);
    if(clr)clr.classList.remove('visible');
    clearTimeout(debounceTimers[pid]);
    applyFilter(pid);
  };
  window.resetPanel=function(pid){
    const panel=PANELS.find(p=>p.id===pid);
    panel.sections.forEach((_,si)=>_.items.forEach((__,ii)=>{
      checked[pid][si][ii]=false;
      const chk=$(`chk-${pid}-${si}-${ii}`);if(chk)chk.checked=false;
      $(`crit-${pid}-${si}-${ii}`)?.classList.remove('checked');
    }));
    refreshScores(pid);
  };
  window.expandAll=pid=>PANELS.find(p=>p.id===pid).sections.forEach((_,si)=>{
    openState[pid][si]=true;$(`sec-${pid}-${si}`)?.classList.add('open');});
  window.collapseAll=pid=>PANELS.find(p=>p.id===pid).sections.forEach((_,si)=>{
    openState[pid][si]=false;$(`sec-${pid}-${si}`)?.classList.remove('open');});

  buildAll();
})();
</script>
</body>
</html>
