<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Decision Framework - Multi-Thinker Evaluation System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        /* ============================================
           CSS VARIABLES & THEME FOUNDATION
           ============================================ */
        
        :root {
            /* Light theme colors */
            --bg-primary: #f3f6fb;
            --bg-secondary: #ffffff;
            --bg-tertiary: #eef2f8;
            --text-primary: #152238;
            --text-secondary: #4c5d76;
            --text-muted: #7f8ea4;
            --border-color: #d7deea;
            --border-light: #e9edf4;
            --surface-elevated: rgba(255, 255, 255, 0.88);
            --accent-1: #2454ff;
            --accent-2: #1f8f73;
            
            /* Accent colors by author */
            --buffett-color: #2e5090;
            --munger-color: #8b4513;
            --grant-color: #c41e3a;
            --collins-color: #1b5e20;
            
            /* Status colors */
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #17a2b8;
            
            /* Rating level colors */
            --rating-level-1: #dc3545;
            --rating-level-2: #fd7e14;
            --rating-level-3: #ffc107;
            --rating-level-4: #28a745;
            --rating-level-5: #1b5e20;
            
            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-xxl: 3rem;
            
            /* Typography */
            --font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
            --font-family-display: 'Manrope', 'Segoe UI', Arial, sans-serif;
            --font-size-base: 16px;
            --font-size-sm: 14px;
            --font-size-lg: 18px;
            --font-size-xl: 20px;
            --font-size-xxl: 24px;
            
            /* Shadows */
            --shadow-sm: 0 8px 18px rgba(28, 52, 95, 0.08);
            --shadow-md: 0 14px 30px rgba(24, 44, 85, 0.12);
            --shadow-lg: 0 22px 46px rgba(18, 33, 66, 0.16);
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
            --transition-slow: 350ms ease;
        }
        
        /* Dark theme */
        [data-theme="dark"] {
            --bg-primary: #0f1727;
            --bg-secondary: #151f34;
            --bg-tertiary: #1f2b43;
            --text-primary: #edf2ff;
            --text-secondary: #b6c1da;
            --text-muted: #90a0bf;
            --border-color: #2e3c58;
            --border-light: #25324c;
            --surface-elevated: rgba(20, 30, 50, 0.85);
            --accent-1: #70a4ff;
            --accent-2: #53caa7;
        }
        
        /* ============================================
           GLOBAL STYLES
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(circle at 8% 12%, rgba(52, 103, 255, 0.16), transparent 28%),
                radial-gradient(circle at 90% 20%, rgba(31, 143, 115, 0.14), transparent 33%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
            transition: background-color var(--transition-base), color var(--transition-base);
        }
        
        /* ============================================
           LAYOUT COMPONENTS
           ============================================ */
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }
        
        header {
            background: linear-gradient(135deg, rgba(36, 84, 255, 0.08), rgba(31, 143, 115, 0.08));
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-lg) 0;
            position: relative;
            transition: background-color var(--transition-base);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-lg);
        }
        
        .header-title {
            flex: 1;
        }
        
        .header-title h1 {
            font-family: var(--font-family-display);
            font-size: clamp(1.35rem, 2.3vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-xs);
        }
        
        .header-subtitle {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        .header-controls {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        /* ============================================
           BUTTONS & CONTROLS
           ============================================ */
        
        button {
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            transition: all var(--transition-fast);
            background: linear-gradient(120deg, var(--accent-1), #3568ff);
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow-sm);
        }
        
        button:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: var(--shadow-md);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: var(--surface-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: var(--bg-tertiary);
        }
        
        /* ============================================
           MAIN LAYOUT
           ============================================ */
        
        main {
            padding: var(--spacing-xl) 0;
            min-height: calc(100vh - 200px);
        }
        
        .topic-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xxl);
        }
        
        .topic-card {
            background: linear-gradient(180deg, var(--surface-elevated), var(--bg-secondary));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: var(--spacing-lg);
            cursor: pointer;
            transition: all var(--transition-base);
            text-align: center;
            box-shadow: var(--shadow-sm);
            animation: riseIn 380ms ease both;
        }
        
        .topic-card:hover {
            border-color: var(--accent-1);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }
        
        .topic-card.active {
            border-color: var(--accent-1);
            background: linear-gradient(180deg, rgba(36, 84, 255, 0.12), var(--bg-secondary));
        }
        
        .topic-card h3 {
            font-size: var(--font-size-lg);
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
            font-family: var(--font-family-display);
            font-weight: 700;
        }
        
        .topic-card p {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        /* ============================================
           FILTER TOOLBAR (STICKY)
           ============================================ */
        
        .filter-toolbar {
            background: var(--surface-elevated);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-md) 0;
            position: sticky;
            top: 0;
            z-index: 220;
            display: none;
            box-shadow: 0 12px 30px rgba(15, 28, 58, 0.12);
        }

        .filter-toolbar .toolbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }
        
        .filter-toolbar.visible {
            display: block;
        }
        
        .toolbar-content {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        
        .search-box input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: var(--font-size-sm);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .search-box input:focus,
        .filter-select:focus {
            outline: none;
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(36, 84, 255, 0.16);
        }
        
        .filter-group {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
        }
        
        .filter-label {
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .filter-select {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: var(--font-size-sm);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
        }
        
        /* ============================================
           BADGE & TAG STYLES
           ============================================ */
        
        .badge {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        
        .badge-buffett {
            background-color: rgba(46, 80, 144, 0.2);
            color: var(--buffett-color);
        }
        
        .badge-munger {
            background-color: rgba(139, 69, 19, 0.2);
            color: var(--munger-color);
        }
        
        .badge-grant {
            background-color: rgba(196, 30, 58, 0.2);
            color: var(--grant-color);
        }
        
        .badge-collins {
            background-color: rgba(27, 94, 32, 0.2);
            color: var(--collins-color);
        }
        
        .badge-mandatory {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
        
        .badge-optional {
            background-color: rgba(23, 162, 184, 0.1);
            color: var(--info);
            border: 1px solid var(--info);
        }
        
        /* ============================================
           EXPANDABLE CARDS
           ============================================ */
        
        .card {
            background: linear-gradient(180deg, var(--surface-elevated), var(--bg-secondary));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: var(--spacing-md);
            overflow: hidden;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-sm);
        }
        
        .card.highlight {
            border-color: var(--warning);
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.1);
        }
        
        .card-header {
            padding: var(--spacing-md);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--spacing-md);
            background: transparent;
            transition: background-color var(--transition-fast);
        }
        
        .card-header:hover {
            background-color: rgba(36, 84, 255, 0.08);
        }
        
        .card-header-title {
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }
        
        .card-header-meta {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .card-toggle {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: var(--font-size-lg);
            border-radius: 999px;
            background: var(--bg-tertiary);
            line-height: 1;
            text-align: center;
            transition: transform var(--transition-fast);
        }

        .card-checkbox-row {
            display: flex;
            gap: .6rem;
            align-items: center;
            cursor: pointer;
        }

        .card-checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            flex: 0 0 auto;
            accent-color: var(--accent-1);
            align-self: center;
            transform: translateY(0);
        }

        .card-checkbox-content {
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .card.expanded .card-toggle {
            transform: rotate(180deg);
        }
        
        .card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--transition-base);
            padding: 0 var(--spacing-md);
        }
        
        .card.expanded .card-body {
            max-height: 2000px;
            padding: 0 var(--spacing-md) var(--spacing-md);
        }
        
        .card-content {
            font-size: var(--font-size-sm);
            line-height: 1.7;
            color: var(--text-secondary);
        }
        
        .card-section {
            margin-bottom: var(--spacing-md);
        }
        
        .card-section-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
            font-size: var(--font-size-sm);
        }
        
        /* ============================================
           RATING DISPLAY
           ============================================ */
        
        .rating-display {
            background: linear-gradient(180deg, var(--surface-elevated), var(--bg-secondary));
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: var(--spacing-lg);
            margin: var(--spacing-xl) 0;
            box-shadow: var(--shadow-md);
            animation: riseIn 320ms ease both;
        }

        .summary-top {
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: var(--spacing-lg);
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .progress-ring {
            --progress-angle: 0deg;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background:
                conic-gradient(var(--accent-1) var(--progress-angle), rgba(127, 142, 164, 0.25) var(--progress-angle)),
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
            display: grid;
            place-items: center;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .progress-ring::after {
            content: "";
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            position: absolute;
        }

        .progress-ring-value {
            position: relative;
            z-index: 2;
            text-align: center;
            font-family: var(--font-family-display);
        }

        .progress-ring-value strong {
            display: block;
            font-size: 1.65rem;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .progress-ring-value span {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .summary-headline {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .summary-level-name {
            font-family: var(--font-family-display);
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .score-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
            gap: .75rem;
            margin-top: .8rem;
        }

        .score-tile {
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.02));
            padding: .8rem .9rem;
            box-shadow: var(--shadow-sm);
        }

        .score-tile-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 0.28rem;
        }

        .score-tile-value {
            font-family: var(--font-family-display);
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        
        .rating-badge {
            display: inline-block;
            padding: 0.7rem 1.1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: var(--font-size-lg);
            color: white;
            margin-bottom: var(--spacing-md);
            box-shadow: var(--shadow-sm);
        }
        
        .rating-section {
            margin-top: var(--spacing-lg);
        }
        
        .rating-section-title {
            font-weight: 600;
            font-size: var(--font-size-lg);
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
        }
        
        .missing-items, .unresolved-flags {
            background: rgba(255, 193, 7, 0.12);
            padding: var(--spacing-md);
            border-left: 4px solid var(--warning);
            border-radius: 12px;
            margin-top: var(--spacing-md);
        }
        
        .missing-item, .flag-item {
            padding: var(--spacing-sm) 0;
            cursor: pointer;
            color: var(--accent-1);
            text-decoration: none;
            border-bottom: 1px dashed var(--border-color);
            transition: all var(--transition-fast);
        }
        
        .missing-item:hover, .flag-item:hover {
            padding-left: var(--spacing-md);
            font-weight: 600;
        }
        
        .missing-item:last-child, .flag-item:last-child {
            border-bottom: none;
        }

        .legend-grid {
            display: grid;
            gap: 0.7rem;
        }

        .legend-card {
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: linear-gradient(180deg, var(--surface-elevated), var(--bg-secondary));
            box-shadow: var(--shadow-sm);
            padding: 0.8rem 0.95rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 0.8rem;
            align-items: center;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(127, 142, 164, 0.12);
        }

        .legend-main strong {
            display: block;
            font-size: 0.98rem;
            margin-bottom: 0.1rem;
        }

        .legend-main small {
            color: var(--text-secondary);
            display: block;
            line-height: 1.45;
        }

        .legend-threshold {
            color: var(--text-secondary);
            font-size: 12px;
            text-align: right;
            white-space: nowrap;
        }
        
        /* ============================================
           RED FLAGS EMPHASIS
           ============================================ */
        
        .red-flag {
            border-left: 5px solid var(--danger) !important;
        }
        
        .red-flag .card-header {
            background: linear-gradient(90deg, rgba(220, 53, 69, 0.11), transparent);
        }
        
        .red-flag-indicator {
            color: var(--danger);
            font-weight: 700;
            font-size: var(--font-size-lg);
        }
        
        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .header-controls {
                width: 100%;
                justify-content: flex-start;
                gap: var(--spacing-sm);
            }

            .header-controls button,
            .header-controls .filter-select {
                width: calc(50% - 0.25rem);
                min-width: 140px;
            }
            
            .toolbar-content {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-toolbar .toolbar-content {
                padding: 0 var(--spacing-sm);
            }
            
            .search-box {
                min-width: 100%;
            }
            
            .filter-group {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
            }
            
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .card-header-meta {
                justify-content: flex-start;
                width: 100%;
            }

            .summary-top {
                grid-template-columns: 1fr;
            }

            .progress-ring {
                width: 128px;
                height: 128px;
            }

            .progress-ring::after {
                width: 94px;
                height: 94px;
            }

            .legend-card {
                grid-template-columns: auto 1fr;
            }

            .legend-threshold {
                grid-column: 2 / 3;
                text-align: left;
            }
        }
        
        /* ============================================
           UTILITY CLASSES
           ============================================ */
        
        .hidden {
            display: none !important;
        }
        
        .highlight-match {
            background-color: var(--warning);
            font-weight: 600;
            padding: 0 2px;
            border-radius: 4px;
        }
        
        .clickable {
            cursor: pointer;
            text-decoration: underline;
            color: var(--buffett-color);
        }
        
        .clickable:hover {
            color: #1e3f5a;
        }

        .app-footer {
            background: linear-gradient(180deg, rgba(36, 84, 255, 0.08), rgba(31, 143, 115, 0.08));
            padding: var(--spacing-lg);
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            margin-top: var(--spacing-xxl);
            font-size: var(--font-size-sm);
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="header-title">
                    <h1>Talent Decision Framework</h1>
                    <p class="header-subtitle">Synthesized wisdom from Warren Buffett, Charlie Munger, Adam Grant & Jim Collins</p>
                </div>
                <div class="header-controls">
                    <button id="themeToggle" class="btn-secondary">🌙 Dark Mode</button>
                    <button id="exportStateBtn" class="btn-secondary">Export JSON</button>
                    <button id="importStateBtn" class="btn-secondary">Import JSON</button>
                    <input id="importStateInput" type="file" accept="application/json,.json" class="hidden">
                    <select id="languageSelect" class="filter-select">
                        <option value="en">English</option>
                        <option value="vi">Tiếng Việt</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="topicSelector" class="topic-selector"></div>
        
        <div id="filterToolbar" class="filter-toolbar">
            <div class="toolbar-content">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search criteria, red flags...">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Author:</label>
                    <select id="authorFilter" class="filter-select">
                        <option value="">All Authors</option>

        function rebalanceRatingThresholds() {
            const levelScoreRatio = {
                weak: 0.28,
                watchlist: 0.45,
                strong: 0.62,
                exceptional: 0.78
            };

            const levelMandatoryRatio = {
                weak: 0.35,
                watchlist: 0.5,
                strong: 0.65,
                exceptional: 0.8
            };

            Object.values(TOPICS).forEach((topic) => {
                const maxScore = topic.criteria.reduce((sum, item) => sum + item.weight, 0);
                const mandatoryTotal = topic.criteria.filter((item) => item.mandatory).length;

                topic.ratingLevels = topic.ratingLevels.map((level) => {
                    if (level.id === "disqualified") {
                        return { ...level, minScore: 0, mandatoryMin: 0 };
                    }
                    return {
                        ...level,
                        minScore: Math.round(maxScore * (levelScoreRatio[level.id] || 0)),
                        mandatoryMin: Math.max(1, Math.round(mandatoryTotal * (levelMandatoryRatio[level.id] || 0)))
                    };
                });
            });
        }

        function escapeHtml(value) {
            return value.replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
        }

        function highlight(text, query) {
            if (!query) return escapeHtml(text);
            const escaped = escapeHtml(text);
            const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            return escaped.replace(new RegExp(`(${safeQuery})`, "ig"), '<span class="highlight-match">$1</span>');
        }

        function ensureTopicEvaluation(topicKey) {
            if (!appState.evaluations[topicKey]) {
                appState.evaluations[topicKey] = { criteria: {}, flags: {} };
            }
            return appState.evaluations[topicKey];
        }

        function getTopicMaxScore(topic) {
            return topic.criteria.reduce((sum, item) => sum + item.weight, 0);
        }

        function getFilteredCriteria(topic) {
            const { search, author, mandatory, category } = appState.filters;
            return topic.criteria.filter((item) => {
                const searchText = `${txt(item, "title")} ${txt(item, "short")} ${txt(item, "detail")} ${item.philosophy}`.toLowerCase();
                if (search && !searchText.includes(search)) return false;
                if (author && !item.authors.includes(author)) return false;
                if (mandatory === "mandatory" && !item.mandatory) return false;
                if (mandatory === "optional" && item.mandatory) return false;
                if (category && item.category !== category) return false;
                return true;
            });
        }

        function getFilteredFlags(topic) {
            const { search, author, category } = appState.filters;
            return topic.redFlags.filter((item) => {
                const searchText = `${txt(item, "title")} ${txt(item, "explanation")} ${txt(item, "whyItMatters")}`.toLowerCase();
                if (search && !searchText.includes(search)) return false;
                if (author && !item.authors.includes(author)) return false;
                if (category && item.category !== category) return false;
                return true;
            });
        }

        function calculateEvaluation(topicKey) {
            const topic = TOPICS[topicKey];
            const evaluation = ensureTopicEvaluation(topicKey);
            const maxScore = getTopicMaxScore(topic);

            const completedCriteria = topic.criteria.filter((item) => evaluation.criteria[item.id]);
            const unresolvedFlags = topic.redFlags.filter((item) => evaluation.flags[item.id]);
            const score = completedCriteria.reduce((sum, item) => sum + item.weight, 0);

            const mandatoryTotal = topic.criteria.filter((item) => item.mandatory).length;
            const mandatoryMet = completedCriteria.filter((item) => item.mandatory).length;

            let currentLevel = topic.ratingLevels[0];
            if (unresolvedFlags.length === 0) {
                for (const level of topic.ratingLevels) {
                    if (score >= level.minScore && mandatoryMet >= level.mandatoryMin) {
                        currentLevel = level;
                    }
                }
            }

            const currentIndex = topic.ratingLevels.findIndex((item) => item.id === currentLevel.id);
            const nextLevel = currentIndex >= 0 && currentIndex < topic.ratingLevels.length - 1 ? topic.ratingLevels[currentIndex + 1] : null;

            const missingMandatory = topic.criteria.filter((item) => item.mandatory && !evaluation.criteria[item.id]);
            const candidateCriteria = topic.criteria.filter((item) => !evaluation.criteria[item.id]);
            const scoreGap = Math.max(0, (nextLevel ? nextLevel.minScore : score) - score);
            const avgWeight = candidateCriteria.length ? candidateCriteria.reduce((s, c) => s + c.weight, 0) / candidateCriteria.length : 1;
            const missingCountHint = Math.min(candidateCriteria.length, Math.ceil(scoreGap / Math.max(1, avgWeight)));

            return {
                score,
                maxScore,
                completion: maxScore > 0 ? Math.round((score / maxScore) * 100) : 0,
                mandatoryTotal,
                mandatoryMet,
                unresolvedFlags,
                currentLevel,
                nextLevel,
                missingMandatory,
                candidateCriteria,
                missingCountHint
            };
        }

        function exportEvaluationState() {
            const payload = buildExportPayload();
            const data = JSON.stringify(payload, null, 2);
            const blob = new Blob([data], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            const datePart = new Date().toISOString().slice(0, 10);
            anchor.href = url;
            anchor.download = `talent-decision-evaluation-${datePart}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(url);
        }

        function sanitizeImportedEvaluations(rawData) {
            const source = rawData && typeof rawData === "object" && rawData.evaluations ? rawData.evaluations : rawData;
            if (!source || typeof source !== "object") return null;

            const sanitized = {};
            Object.keys(TOPICS).forEach((topicKey) => {
                const topic = TOPICS[topicKey];
                const topicInput = source[topicKey] || {};
                const criteriaInput = topicInput.criteria || {};
                const flagsInput = topicInput.flags || {};

                const criteria = {};
                const flags = {};

                topic.criteria.forEach((item) => {
                    if (criteriaInput[item.id] === true) {
                        criteria[item.id] = true;
                    }
                });

                topic.redFlags.forEach((item) => {
                    if (flagsInput[item.id] === true) {
                        flags[item.id] = true;
                    }
                });

                sanitized[topicKey] = { criteria, flags };
            });

            return sanitized;
        }

        function importEvaluationStateFromFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(String(reader.result || "{}"));
                    const sanitized = sanitizeImportedEvaluations(parsed);
                    if (!sanitized) {
                        window.alert(t("controls.importInvalid"));
                        return;
                    }
                    appState.evaluations = sanitized;
                    saveEvaluations();
                    render();
                    window.alert(t("controls.importSuccess"));
                } catch (error) {
                    window.alert(t("controls.importInvalid"));
                }
            };
            reader.onerror = () => {
                window.alert(t("controls.importReadError"));
            };
            reader.readAsText(file);
        }

        function renderTopicSelector() {
            const selector = document.getElementById("topicSelector");
            selector.innerHTML = "";
            Object.keys(TOPICS).forEach((topicKey) => {
                const topicText = getTopicText(topicKey);
                const card = document.createElement("div");
                card.className = `topic-card ${appState.currentTopic === topicKey ? "active" : ""}`;
                card.innerHTML = `<h3>${topicText.title}</h3><p>${topicText.description}</p>`;
                card.addEventListener("click", () => {
                    appState.currentTopic = topicKey;
                    ensureTopicEvaluation(topicKey);
                    resetFilters(false);
                    render();
                });
                selector.appendChild(card);
            });
        }

        function renderFilterControls() {
            const authorFilter = document.getElementById("authorFilter");
            const mandatoryFilter = document.getElementById("mandatoryFilter");

            authorFilter.innerHTML = `
                <option value="">${t("controls.allAuthors")}</option>
                <option value="buffett">Buffett</option>
                <option value="munger">Munger</option>
                <option value="grant">Grant</option>
                <option value="collins">Collins</option>
            `;

            mandatoryFilter.innerHTML = `
                <option value="">${t("controls.allTypes")}</option>
                <option value="mandatory">${t("controls.mandatoryOnly")}</option>
                <option value="optional">${t("controls.optionalOnly")}</option>
            `;

            let categoryFilter = document.getElementById("categoryFilter");
            if (!categoryFilter) {
                const wrapper = document.createElement("div");
                wrapper.className = "filter-group";
                wrapper.innerHTML = `<label class="filter-label" id="categoryLabel"></label><select id="categoryFilter" class="filter-select"></select>`;
                document.querySelector(".toolbar-content").insertBefore(wrapper, document.getElementById("resetFilters"));
                categoryFilter = wrapper.querySelector("#categoryFilter");
                categoryFilter.addEventListener("change", handleFilterChange);
            }

            const categories = TOPICS[appState.currentTopic].categories;
            categoryFilter.innerHTML = `<option value="">${t("controls.allCategories")}</option>${categories.map((item) => `<option value="${item}">${getCategoryLabel(item)}</option>`).join("")}`;
            document.getElementById("categoryLabel").textContent = `${t("controls.category")}:`;

            const labels = document.querySelectorAll(".filter-label");
            if (labels[0]) labels[0].textContent = `${t("controls.author")}:`;
            if (labels[1]) labels[1].textContent = `${t("controls.type")}:`;

            authorFilter.value = appState.filters.author;
            mandatoryFilter.value = appState.filters.mandatory;
            categoryFilter.value = appState.filters.category;
        }

        function showFilterToolbar() {
            document.getElementById("filterToolbar").classList.add("visible");
        }

        function hideFilterToolbar() {
            document.getElementById("filterToolbar").classList.remove("visible");
        }

        function renderTopicContent() {
            const topic = TOPICS[appState.currentTopic];
            const stats = calculateEvaluation(appState.currentTopic);
            const criteria = getFilteredCriteria(topic);
            const flags = getFilteredFlags(topic);

            const contentArea = document.getElementById("contentArea");
            contentArea.innerHTML = `
                ${buildSummaryPanel(stats, topic)}
                <section>
                    <h2 style="margin-bottom: 1rem;">${t("labels.criteria")} (${criteria.length}/${topic.criteria.length})</h2>
                    ${criteria.length ? criteria.map((item) => buildCriterionCard(item)).join("") : `<p style="color: var(--text-secondary); padding: .5rem 0 1rem;">${t("labels.noCriteriaMatch")}</p>`}
                </section>
                <section style="margin-top: 2rem;">
                    <h2 style="margin-bottom: 1rem; color: var(--danger);">${t("labels.redFlags")} (${flags.length}/${topic.redFlags.length})</h2>
                    ${flags.length ? flags.map((item) => buildRedFlagCard(item)).join("") : `<p style="color: var(--text-secondary); padding: .5rem 0 1rem;">${t("labels.noFlagsMatch")}</p>`}
                </section>
                ${buildLegendPanel(topic)}
            `;

            attachCardHandlers();
            attachInputHandlers();
            attachSummaryLinks();
        }

        function buildSummaryPanel(stats, topic) {
            const levelColorMap = {
                disqualified: "var(--rating-level-1)",
                weak: "var(--rating-level-2)",
                watchlist: "var(--rating-level-3)",
                strong: "var(--rating-level-4)",
                exceptional: "var(--rating-level-5)"
            };

            const progressAngle = `${Math.max(0, Math.min(360, Math.round((stats.completion / 100) * 360)))}deg`;

            const ratingName = t(`ratings.${stats.currentLevel.id}`);
            const unresolvedFlagsHtml = stats.unresolvedFlags.length
                ? `<div class="unresolved-flags"><strong>${t("labels.unresolvedFlags")}</strong>${stats.unresolvedFlags.map((item) => `<div class="flag-item" data-ref="${item.id}">• ${highlight(txt(item, "title"), appState.filters.search)}</div>`).join("")}</div>`
                : "";

            let missingHtml = `<div class="missing-items"><strong>${t("labels.missingToNext")}</strong><div>${t("summary.noHigher")}</div></div>`;
            if (stats.nextLevel) {
                const candidateList = stats.candidateCriteria.map((item) => `<div class="missing-item" data-ref="${item.id}">• ${highlight(txt(item, "title"), appState.filters.search)} (${item.weight})</div>`).join("");
                const message = t("summary.stillMissingXFromY")
                    .replace("{x}", String(stats.missingCountHint))
                    .replace("{y}", String(stats.candidateCriteria.length));
                missingHtml = `<div class="missing-items"><strong>${t("summary.nextLevel")}: ${t(`ratings.${stats.nextLevel.id}`)}</strong><div style="margin-top: .5rem;">${message}</div>${candidateList || `<div>${t("labels.noMissing")}</div>`}</div>`;
            }

            const blocked = stats.unresolvedFlags.length > 0 ? `<div style="margin-top: .75rem; color: var(--danger); font-weight: 600;">${t("summary.blockedByFlags")}</div>` : "";

            return `
                <div class="rating-display">
                    <div class="summary-top">
                        <div class="progress-ring" style="--progress-angle:${progressAngle};">
                            <div class="progress-ring-value">
                                <strong>${stats.completion}%</strong>
                                <span>${t("labels.completion")}</span>
                            </div>
                        </div>
                        <div class="summary-headline">
                            <span class="rating-badge" style="background:${levelColorMap[stats.currentLevel.id]};">${ratingName}</span>
                            <div class="summary-level-name">${t("summary.currentLevel")}: ${ratingName}</div>
                            <div>${txt(stats.currentLevel, "description")}</div>
                        </div>
                    </div>
                    <div class="score-tiles">
                        <div class="score-tile">
                            <div class="score-tile-label">${t("labels.totalScore")}</div>
                            <div class="score-tile-value">${stats.score}</div>
                        </div>
                        <div class="score-tile">
                            <div class="score-tile-label">${t("labels.maxScore")}</div>
                            <div class="score-tile-value">${stats.maxScore}</div>
                        </div>
                        <div class="score-tile">
                            <div class="score-tile-label">${t("labels.completion")}</div>
                            <div class="score-tile-value">${stats.completion}%</div>
                        </div>
                        <div class="score-tile">
                            <div class="score-tile-label">${t("labels.mandatoryCount")}</div>
                            <div class="score-tile-value">${stats.mandatoryMet}/${stats.mandatoryTotal}</div>
                        </div>
                    </div>
                    ${blocked}
                    ${missingHtml}
                    ${unresolvedFlagsHtml}
                </div>
            `;
        }

        function buildLegendPanel(topic) {
            const levelColorMap = {
                disqualified: "var(--rating-level-1)",
                weak: "var(--rating-level-2)",
                watchlist: "var(--rating-level-3)",
                strong: "var(--rating-level-4)",
                exceptional: "var(--rating-level-5)"
            };

            return `
                <section class="rating-section">
                    <h3 class="rating-section-title">${t("labels.levelLegend")}</h3>
                    <div class="legend-grid">
                        ${topic.ratingLevels.map((level) => `
                            <div class="legend-card">
                                <span class="legend-dot" style="background:${levelColorMap[level.id]};"></span>
                                <div class="legend-main">
                                    <strong>${t(`ratings.${level.id}`)}</strong>
                                    <small>${txt(level, "description")}</small>
                                </div>
                                <div class="legend-threshold">${t("labels.minScore")}: ${level.minScore}<br>${t("labels.mandatoryCount").toLowerCase()}: ${level.mandatoryMin}</div>
                            </div>
                        `).join("")}
                    </div>
                </section>
            `;
        }

        function buildCriterionCard(item) {
            const checked = !!ensureTopicEvaluation(appState.currentTopic).criteria[item.id];
            const mandatoryClass = item.mandatory ? "badge-mandatory" : "badge-optional";
            const mandatoryText = item.mandatory ? t("labels.mandatory") : t("labels.optional");

            return `
                <article class="card" id="${item.id}">
                    <div class="card-header" data-toggle="${item.id}">
                        <div class="card-header-title">
                            <label class="card-checkbox-row">
                                <input type="checkbox" data-criterion="${item.id}" ${checked ? "checked" : ""}>
                                <span class="card-checkbox-content">${highlight(txt(item, "title"), appState.filters.search)}<small style="color:var(--text-secondary);">${highlight(txt(item, "short"), appState.filters.search)}</small></span>
                            </label>
                        </div>
                        <div class="card-header-meta">
                            ${item.authors.map((name) => `<span class="badge ${AUTHOR_CLASSES[name]}">${name}</span>`).join("")}
                            <span class="badge ${mandatoryClass}">${mandatoryText}</span>
                            <span class="badge btn-secondary">${t("labels.weight")} ${item.weight}</span>
                            <span class="card-toggle">⌄</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-content">
                            <div class="card-section"><div class="card-section-title">${t("labels.details")}</div>${highlight(txt(item, "detail"), appState.filters.search)}</div>
                            <div class="card-section"><div class="card-section-title">${t("labels.philosophy")}</div>${highlight(item.philosophy, appState.filters.search)}</div>
                            <div class="card-section"><div class="card-section-title">${t("labels.category")}</div>${getCategoryLabel(item.category)}</div>
                        </div>
                    </div>
                </article>
            `;
        }

        function buildRedFlagCard(item) {
            const checked = !!ensureTopicEvaluation(appState.currentTopic).flags[item.id];
            return `
                <article class="card red-flag" id="${item.id}">
                    <div class="card-header" data-toggle="${item.id}">
                        <div class="card-header-title">
                            <label class="card-checkbox-row">
                                <input type="checkbox" data-flag="${item.id}" ${checked ? "checked" : ""}>
                                <span class="card-checkbox-content"><span><span class="red-flag-indicator">⚠</span> ${highlight(txt(item, "title"), appState.filters.search)}</span></span>
                            </label>
                        </div>
                        <div class="card-header-meta">
                            ${item.authors.map((name) => `<span class="badge ${AUTHOR_CLASSES[name]}">${name}</span>`).join("")}
                            <span class="badge badge-mandatory">${t("labels.disqualifier")}</span>
                            <span class="card-toggle">⌄</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-content">
                            <div class="card-section"><div class="card-section-title">${t("labels.details")}</div>${highlight(txt(item, "explanation"), appState.filters.search)}</div>
                            <div class="card-section"><div class="card-section-title">${t("labels.whyItMatters")}</div>${highlight(txt(item, "whyItMatters"), appState.filters.search)}</div>
                            <div class="card-section"><div class="card-section-title">${t("labels.category")}</div>${getCategoryLabel(item.category)}</div>
                        </div>
                    </div>
                </article>
            `;
        }

        function attachCardHandlers() {
            document.querySelectorAll("[data-toggle]").forEach((header) => {
                header.addEventListener("click", (event) => {
                    if (event.target.matches("input")) return;
                    const id = header.getAttribute("data-toggle");
                    const card = document.getElementById(id);
                    card.classList.toggle("expanded");
                });
            });
        }

        function attachInputHandlers() {
            document.querySelectorAll("input[data-criterion]").forEach((input) => {
                input.addEventListener("change", (event) => {
                    const evalState = ensureTopicEvaluation(appState.currentTopic);
                    evalState.criteria[event.target.getAttribute("data-criterion")] = event.target.checked;
                    saveEvaluations();
                    renderTopicContent();
                });
            });

            document.querySelectorAll("input[data-flag]").forEach((input) => {
                input.addEventListener("change", (event) => {
                    const evalState = ensureTopicEvaluation(appState.currentTopic);
                    evalState.flags[event.target.getAttribute("data-flag")] = event.target.checked;
                    saveEvaluations();
                    renderTopicContent();
                });
            });
        }

        function attachSummaryLinks() {
            document.querySelectorAll("[data-ref]").forEach((item) => {
                item.addEventListener("click", () => {
                    const target = document.getElementById(item.getAttribute("data-ref"));
                    if (!target) return;
                    target.classList.add("expanded", "highlight");
                    target.scrollIntoView({ behavior: "smooth", block: "center" });
                    setTimeout(() => target.classList.remove("highlight"), 1600);
                });
            });
        }

        function debounce(fn, wait) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), wait);
            };
        }

        function handleSearch(event) {
            appState.filters.search = event.target.value.trim().toLowerCase();
            renderTopicContent();
        }

        function handleFilterChange() {
            appState.filters.author = document.getElementById("authorFilter").value;
            appState.filters.mandatory = document.getElementById("mandatoryFilter").value;
            const categoryFilter = document.getElementById("categoryFilter");
            appState.filters.category = categoryFilter ? categoryFilter.value : "";
            renderTopicContent();
        }

        function resetFilters(reRender = true) {
            appState.filters = { search: "", author: "", mandatory: "", category: "" };
            document.getElementById("searchInput").value = "";
            document.getElementById("authorFilter").value = "";
            document.getElementById("mandatoryFilter").value = "";
            const categoryFilter = document.getElementById("categoryFilter");
            if (categoryFilter) categoryFilter.value = "";
            if (reRender) render();
        }

        function initializeApp() {
            document.getElementById("languageSelect").value = appState.currentLanguage;
            setTheme(appState.currentTheme);

            document.getElementById("themeToggle").addEventListener("click", () => {
                setTheme(appState.currentTheme === "dark" ? "light" : "dark");
            });

            document.getElementById("exportStateBtn").addEventListener("click", exportEvaluationState);
            document.getElementById("importStateBtn").addEventListener("click", () => {
                document.getElementById("importStateInput").click();
            });
            document.getElementById("importStateInput").addEventListener("change", (event) => {
                const [file] = event.target.files || [];
                importEvaluationStateFromFile(file);
                event.target.value = "";
            });

            document.getElementById("languageSelect").addEventListener("change", (event) => {
                appState.currentLanguage = event.target.value;
                localStorage.setItem("language", appState.currentLanguage);
                render();
            });

            document.getElementById("searchInput").addEventListener("input", debounce(handleSearch, 500));
            document.getElementById("authorFilter").addEventListener("change", handleFilterChange);
            document.getElementById("mandatoryFilter").addEventListener("change", handleFilterChange);
            document.getElementById("resetFilters").addEventListener("click", () => resetFilters(true));

            render();
        }

        document.addEventListener("DOMContentLoaded", initializeApp);
    </script>
</body>
</html>
