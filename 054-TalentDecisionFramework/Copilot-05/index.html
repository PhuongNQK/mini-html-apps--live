<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talent Decision Framework</title>
<style>
/* ── CSS Variables ─────────────────────────────────────────────── */
:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface-alt: #f0ede8;
  --border: #d8d3c8; --text: #1a1816; --text-muted: #6b6560;
  --accent: #2563eb; --accent-hover: #1d4ed8;
  --green: #16a34a; --yellow: #d97706; --red: #dc2626;
  --red-soft: #fef2f2; --red-border: #fca5a5;
  --yellow-soft: #fffbeb; --yellow-border: #fcd34d;
  --green-soft: #f0fdf4; --green-border: #86efac;
  --blue-soft: #eff6ff; --blue-border: #93c5fd;
  --hl-bg: #fde68a; --hl-text: #78350f;
  --pill-buffett: #dbeafe; --pill-buffett-t: #1e40af;
  --pill-munger: #fce7f3; --pill-munger-t: #9d174d;
  --pill-grant: #d1fae5; --pill-grant-t: #065f46;
  --pill-collins: #fef3c7; --pill-collins-t: #92400e;
  --shadow: 0 1px 3px rgba(0,0,0,.1);
  --radius: 8px; --transition: 250ms ease;
}
[data-theme="dark"] {
  --bg: #0f0f0e; --surface: #1a1917; --surface-alt: #232220;
  --border: #3a3733; --text: #e8e4de; --text-muted: #9c958d;
  --accent: #60a5fa; --accent-hover: #93c5fd;
  --green: #4ade80; --yellow: #fbbf24; --red: #f87171;
  --red-soft: #2d1515; --red-border: #7f1d1d;
  --yellow-soft: #2d2210; --yellow-border: #78350f;
  --green-soft: #0d2016; --green-border: #14532d;
  --blue-soft: #0d1c35; --blue-border: #1e3a5f;
  --hl-bg: #92400e; --hl-text: #fde68a;
  --pill-buffett: #1e3a5f; --pill-buffett-t: #93c5fd;
  --pill-munger: #3b1a2e; --pill-munger-t: #f9a8d4;
  --pill-grant: #0d2016; --pill-grant-t: #6ee7b7;
  --pill-collins: #2d2210; --pill-collins-t: #fcd34d;
  --shadow: 0 1px 4px rgba(0,0,0,.4);
}
/* ── Reset ─────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;transition:background var(--transition),color var(--transition)}
button{cursor:pointer;font:inherit;border:none;background:none}
input{font:inherit}
ul{list-style:none}
mark.hl{background:var(--hl-bg);color:var(--hl-text);border-radius:2px;padding:0 2px}
/* ── Layout ─────────────────────────────────────────────────────── */
#app{max-width:900px;margin:0 auto;padding:0 16px 40px}
/* ── Header ─────────────────────────────────────────────────────── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:1.15rem;font-weight:700;color:var(--text)}
.hdr-title span{color:var(--accent);font-size:.8em}
.hdr-ctrls{display:flex;gap:8px;align-items:center}
.btn-icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:background var(--transition);box-shadow:var(--shadow)}
.btn-icon:hover{background:var(--surface-alt)}
.btn-lang{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;box-shadow:var(--shadow)}
.btn-lang:hover{background:var(--surface-alt)}
/* ── Tabs ────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:9px 14px;border-radius:8px 8px 0 0;font-size:.84rem;font-weight:600;color:var(--text-muted);background:transparent;border:1px solid transparent;border-bottom:none;white-space:nowrap;transition:all var(--transition)}
.tab-btn:hover{color:var(--text);background:var(--surface-alt)}
.tab-btn.active{color:var(--accent);background:var(--surface);border-color:var(--border);margin-bottom:-2px}
.tab-btn .tab-badge{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:10px;font-size:.75rem;background:var(--surface-alt);color:var(--text-muted)}
.tab-btn.active .tab-badge{background:var(--blue-soft);color:var(--accent)}
.tab-btn.has-rf .tab-badge{background:var(--red-soft)!important;color:var(--red)!important}
/* ── Score Strip ─────────────────────────────────────────────────── */
.score-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:680px){.score-strip{grid-template-columns:repeat(2,1fr)}}
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:var(--shadow)}
.score-card.rf-active{border-color:var(--red);background:var(--red-soft)}
.score-card .sc-val{font-size:1.4rem;font-weight:700;color:var(--accent)}
.score-card.rf-active .sc-val{color:var(--red)}
.score-card .sc-lbl{font-size:.72rem;color:var(--text-muted);margin-top:2px}
/* ── Filter Bar ─────────────────────────────────────────────────── */
.filter-sentinel{height:1px}
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:all var(--transition)}
.filter-bar.stuck{position:sticky;top:0;z-index:10;border-radius:0 0 var(--radius) var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-label{font-size:.75rem;color:var(--text-muted);min-width:60px}
.chip{padding:3px 10px;border-radius:14px;font-size:.78rem;font-weight:500;border:1px solid var(--border);background:var(--surface-alt);color:var(--text-muted);transition:all var(--transition)}
.chip:hover,.chip.active{border-color:var(--accent);color:var(--accent);background:var(--blue-soft)}
.chip.a-buffett.active{border-color:var(--pill-buffett-t);color:var(--pill-buffett-t);background:var(--pill-buffett)}
.chip.a-munger.active{border-color:var(--pill-munger-t);color:var(--pill-munger-t);background:var(--pill-munger)}
.chip.a-grant.active{border-color:var(--pill-grant-t);color:var(--pill-grant-t);background:var(--pill-grant)}
.chip.a-collins.active{border-color:var(--pill-collins-t);color:var(--pill-collins-t);background:var(--pill-collins)}
.chip.w-critical.active{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.chip.w-high.active{border-color:var(--yellow);color:var(--yellow);background:var(--yellow-soft)}
.chip.w-medium.active{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.chip.w-redflag.active{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{width:100%;padding:5px 28px 5px 10px;border:1px solid var(--border);border-radius:20px;background:var(--surface-alt);color:var(--text);font-size:.83rem;outline:none;transition:border-color var(--transition)}
.search-wrap input:focus{border-color:var(--accent)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--text-muted);display:none}
.search-clear.show{display:block}
.filter-counter{font-size:.75rem;color:var(--text-muted);margin-left:auto;white-space:nowrap}
/* ── Panel Controls ──────────────────────────────────────────────── */
.panel-ctrls{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.btn-sm{padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);transition:all var(--transition)}
.btn-sm:hover{background:var(--surface-alt);color:var(--text)}
/* ── Section (Accordion) ─────────────────────────────────────────── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.section.rf-section{border-color:var(--red-border);background:var(--red-soft)}
.section.rf-section.rf-triggered{animation:pulse-border 1.2s ease-in-out 3}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}50%{box-shadow:0 0 0 4px rgba(220,38,38,.35)}}
.sec-header{display:flex;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;gap:10px}
.sec-header:hover{background:var(--surface-alt)}
.sec-toggle{font-size:.7rem;color:var(--text-muted);transition:transform var(--transition);margin-right:2px}
.section.open .sec-toggle{transform:rotate(90deg)}
.sec-title{font-weight:600;font-size:.92rem;flex:1}
.sec-progress{flex:0 0 80px;height:6px;background:var(--surface-alt);border-radius:3px;overflow:hidden}
.sec-progress-bar{height:100%;background:var(--accent);border-radius:3px;transition:width var(--transition)}
.sec-count{font-size:.75rem;color:var(--text-muted);margin-left:8px;white-space:nowrap}
.sec-body{display:none;padding:0 14px 12px}
.section.open .sec-body{display:block}
/* ── Criterion Item ──────────────────────────────────────────────── */
.crit-item{border:1px solid var(--border);border-radius:6px;margin-bottom:7px;overflow:hidden;transition:border-color var(--transition)}
.crit-item.w-critical{border-left:3px solid var(--red);background:var(--red-soft)}
.crit-item.w-high{border-left:3px solid var(--yellow);background:var(--yellow-soft)}
.crit-item.w-medium{border-left:3px solid var(--green);background:var(--green-soft)}
.crit-item.w-redflag{border-left:3px solid var(--red);background:var(--red-soft)}
.crit-item.checked .crit-hd{opacity:.7}
.crit-hd{display:flex;align-items:flex-start;padding:9px 10px;gap:9px;cursor:pointer}
.crit-hd:hover{background:rgba(0,0,0,.03)}
.crit-cb{width:17px;height:17px;accent-color:var(--accent);margin-top:2px;flex-shrink:0;cursor:pointer}
.crit-main{flex:1;min-width:0}
.crit-title{font-weight:600;font-size:.88rem}
.crit-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{padding:1px 8px;border-radius:10px;font-size:.72rem;font-weight:500}
.pill-buffett{background:var(--pill-buffett);color:var(--pill-buffett-t)}
.pill-munger{background:var(--pill-munger);color:var(--pill-munger-t)}
.pill-grant{background:var(--pill-grant);color:var(--pill-grant-t)}
.pill-collins{background:var(--pill-collins);color:var(--pill-collins-t)}
.pill-weight{font-size:.7rem;padding:1px 7px;border-radius:10px}
.pill-critical{background:var(--red-soft);color:var(--red);border:1px solid var(--red-border)}
.pill-high{background:var(--yellow-soft);color:var(--yellow);border:1px solid var(--yellow-border)}
.pill-medium{background:var(--green-soft);color:var(--green);border:1px solid var(--green-border)}
.pill-redflag{background:var(--red-soft);color:var(--red);border:1px solid var(--red-border)}
.crit-expand-btn{font-size:.72rem;color:var(--accent);background:none;border:none;margin-left:auto;white-space:nowrap;padding:0 2px;flex-shrink:0;align-self:center}
.crit-detail{display:none;padding:0 10px 10px 36px;font-size:.83rem;color:var(--text-muted);line-height:1.55;border-top:1px solid var(--border)}
.crit-detail.open{display:block}
/* ── Rating Card ─────────────────────────────────────────────────── */
.rating-card{border-radius:var(--radius);padding:18px;margin-top:16px;border:2px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
.rating-card.level-good{border-color:var(--green);background:var(--green-soft)}
.rating-card.level-warn{border-color:var(--yellow);background:var(--yellow-soft)}
.rating-card.level-bad{border-color:var(--red);background:var(--red-soft)}
.rating-card.level-rf{border-color:var(--red);background:var(--red-soft);animation:pulse-border 1.2s ease-in-out 2}
.rc-top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.rc-stars{font-size:1.5rem}
.rc-info{flex:1}
.rc-label{font-weight:700;font-size:1rem}
.rc-pct{color:var(--text-muted);font-size:.85rem}
.rc-desc{font-size:.87rem;margin-bottom:12px;color:var(--text-muted)}
.rc-gap h4{font-size:.88rem;font-weight:700;margin-bottom:8px}
.gap-group{margin-bottom:10px}
.gap-group-title{font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:4px}
.gap-item{border:1px solid var(--border);border-radius:5px;margin-bottom:4px;overflow:hidden}
.gap-item-hd{display:flex;align-items:center;padding:6px 9px;cursor:pointer;font-size:.83rem;gap:7px}
.gap-item-hd:hover{background:var(--surface-alt)}
.gap-toggle{font-size:.65rem;color:var(--text-muted);transition:transform var(--transition)}
.gap-item.open .gap-toggle{transform:rotate(90deg)}
.gap-detail{display:none;padding:6px 9px 8px 22px;font-size:.81rem;color:var(--text-muted);border-top:1px solid var(--border)}
.gap-item.open .gap-detail{display:block}
/* ── Level Table ─────────────────────────────────────────────────── */
.level-table-wrap{margin-top:10px}
.level-table-toggle{font-size:.8rem;color:var(--accent);background:none;border:none;cursor:pointer;padding:0}
.level-table{display:none;margin-top:8px;border-radius:6px;overflow:hidden;border:1px solid var(--border);font-size:.8rem}
.level-table.open{display:table;width:100%;border-collapse:collapse}
.level-table th,.level-table td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left}
.level-table th{background:var(--surface-alt);font-weight:600}
.level-table tr:last-child td{border-bottom:none}
/* ── Hidden items ────────────────────────────────────────────────── */
.crit-item.hidden,.section.all-hidden{display:none}
/* ── Section icon ───────────────────────────────────────────────── */
.sec-icon{font-size:1rem;margin-right:5px;flex-shrink:0;line-height:1}
/* ── Back-to-top button ─────────────────────────────────────────── */
.btn-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:1.3rem;font-weight:700;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s,transform .2s;z-index:100;display:flex;align-items:center;justify-content:center;line-height:1}
.btn-top.visible{opacity:1;pointer-events:auto}
.btn-top:hover{transform:scale(1.1)}
/* ── Print ───────────────────────────────────────────────────────── */
@media print{
  .hdr-ctrls,.tabs,.filter-bar,.panel-ctrls{display:none!important}
  .section{box-shadow:none;break-inside:avoid}
  .sec-body{display:block!important}
  .crit-detail{display:block!important}
}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="hdr">
    <div class="hdr-title">Talent Decision Framework <span>Buffett · Munger · Grant · Collins</span></div>
    <div class="hdr-ctrls">
      <button class="btn-lang" id="btn-lang" title="Switch language">EN</button>
      <button class="btn-icon" id="btn-theme" title="Toggle theme">☀️</button>
    </div>
  </header>
  <!-- Tabs -->
  <nav class="tabs" id="tabs-nav"></nav>
  <!-- Panels -->
  <div id="panels-container"></div>
</div>

        desc:D('Buffett/Munger: Đây là khoản đầu tư quan trọng nhất — đầu tư vào trí tuệ của bản thân.','Buffett/Munger: This is the most important investment — investing in your own intellect.'),

        desc:D('Grant: Cho đi có ranh giới; ưu tiên những đóng góp tác động cao và bền vững.','Grant: Gives with boundaries; prioritizes high-impact and sustainable contributions.'),

        src:['Grant','Collins'], w:'high' },

        desc:D('Grant: Những người chỉ ủng hộ giúp bạn cảm thấy tốt; những người thách thức giúp bạn thực sự tốt hơn.','Grant: Those who only support make you feel better; those who challenge actually make you better.'),
        src:['Grant'], w:'high' },
    ]},
    { id:'p4rf', title:D('🚩 Cờ đỏ — Nhìn nhận lại ngay nếu phát hiện','🚩 Red Flags — Honestly reassess immediately if detected'), isRedFlag:true, items:[
      { id:'p4rf1', title:D('Làm sai khi không ai nhìn','Acts wrongly when unobserved'), desc:D('Buffett: Kiểm tra tính nhất quán thực sự. Hành vi khi ở một mình tiết lộ giá trị thực.','Buffett: Real consistency test. Behavior when alone reveals true values.'), src:['Buffett'], w:'redflag' },
      { id:'p4rf2', title:D('Không nhớ lần cuối thay đổi ý kiến quan trọng','Can\'t remember last time you changed an important opinion'), desc:D('Grant/Munger: Dấu hiệu của confirmation bias cứng — ý kiến không thay đổi = không học hỏi.','Grant/Munger: Sign of rigid confirmation bias — unchanging views = not learning.'), src:['Grant','Munger'], w:'redflag' },
      { id:'p4rf3', title:D('Hoạt động ngoài circle of competence mà không có kế hoạch','Operating outside circle of competence without a plan'), desc:D('Buffett/Munger: Không phải vấn đề khi mở rộng có kế hoạch; vấn đề là tự lừa dối về năng lực hiện tại.','Buffett/Munger: Not a problem when expanding with a plan; the problem is self-deception about current capability.'), src:['Buffett','Munger'], w:'redflag' },
      { id:'p4rf4', title:D('Victim mentality — Mọi việc "xảy ra với mình"','Victim mentality — Things "happen to" you'), desc:D('Collins: Ngược lại của "mirror and window" — luôn nhìn ra ngoài để đổ lỗi, không nhìn vào gương để tự kiểm.','Collins: Opposite of "mirror and window" — always looks out to blame, never in the mirror to self-check.'), src:['Collins'], w:'redflag' },

      { id:'p4rf7', title:D('Lãng phí thời gian vào việc không tạo giá trị dài hạn','Wasting time on activities with no long-term value'), desc:D('Buffett/Collins: Thời gian là nguồn lực không thể tái tạo. Tự hỏi: 5 năm nữa tôi có vui vì đã làm điều này không?','Buffett/Collins: Time is a non-renewable resource. Ask: will I be glad I did this in 5 years?'), src:['Buffett','Collins'], w:'redflag' },
      { id:'p4rf8', title:D('Tránh né feedback và phản biện','Avoiding feedback and pushback'), desc:D('Grant: Sắp xếp cuộc sống/công việc để không nhận được feedback khó — dấu hiệu cần xem lại.','Grant: Arranging life/work to avoid difficult feedback — a signal worth examining.'), src:['Grant'], w:'redflag' },
      { id:'p4rf9', title:D('Giả vờ chắc chắn khi thực ra không chắc','Pretending to be certain when actually uncertain'), desc:D('Munger: Intellectual dishonesty với bản thân — nguy hiểm hơn là giả vờ với người khác.','Munger: Intellectual dishonesty with yourself — more dangerous than pretending to others.'), src:['Munger'], w:'redflag' },
      { id:'p4rf10', title:D('So sánh bản thân với người khác hơn phiên bản tốt hơn của mình','Comparing to others rather than your better self'), desc:D('Munger: Envy (so sánh ngang) là vô ích; tiêu chuẩn nên là bản thân hôm qua.','Munger: Envy (lateral comparison) is pointless; the standard should be your yesterday self.'), src:['Munger'], w:'redflag' },
    ]},
  ],
];
</script>

<script>
// ── State ──────────────────────────────────────────────────────────
const state = {
  lang: localStorage.getItem('tdf-lang') || 'vi',
  theme: localStorage.getItem('tdf-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  activePanel: 0,
  panels: CRITERIA.map(() => ({
    checks: {}, open: {}, filterAuthors: [], filterWeights: [], query: '', levelTableOpen: false
  }))
};

function t(key, ...args) {
  const L = I18N[state.lang];
  const v = L[key];
  return typeof v === 'function' ? v(...args) : v;
}
function tx(obj) { return (obj && obj[state.lang]) || ''; }

// ── Score computation ───────────────────────────────────────────────
function computeScore(pi) {
  const sections = CRITERIA[pi];
  let total = 0, checked = 0, critTotal = 0, critChecked = 0, rfActive = [];
  sections.forEach(sec => {
    sec.items.forEach(item => {
      if (item.w === 'redflag') {
        if (state.panels[pi].checks[item.id]) rfActive.push(item);
        return;
      }
      total++;
      if (state.panels[pi].checks[item.id]) checked++;
      if (item.w === 'critical') {
        critTotal++;
        if (state.panels[pi].checks[item.id]) critChecked++;
      }
    });
  });
  const pct = total ? Math.round(checked / total * 100) : 0;
  const allCritical = critTotal === critChecked;
  let level;
  if (rfActive.length) { level = 'rf'; }
  else if (pct >= 90 && allCritical) { level = 5; }
  else if (pct >= 75 && allCritical) { level = 4; }
  else if (pct >= 60 && allCritical) { level = 3; }
  else if (pct >= 40) { level = 2; }
  else { level = 1; }
  return { pct, checked, total, critChecked, critTotal, level, rfActive };
}

// ── Escaping ──────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlight(text, query) {
  if (!query) return esc(text);
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark class="hl">$1</mark>');
}

// ── Build DOM: single criterion ────────────────────────────────────
function buildCritItem(item, pi, query) {
  const L = I18N[state.lang];
  const checked = state.panels[pi].checks[item.id] || false;
  const title = tx(item.title);
  const desc = tx(item.desc);
  const wTag = L.weightTags[item.w];
  const srcs = item.src.map(s => `<span class="pill pill-${s.toLowerCase()}">${esc(s)}</span>`).join('');
  const wPill = `<span class="pill pill-weight pill-${item.w}">${esc(wTag)}</span>`;
  const hlTitle = highlight(title, query);
  const hlDesc = highlight(desc, query);
  return `<div class="crit-item w-${item.w}${checked?' checked':''}" data-id="${item.id}" data-w="${item.w}" data-src="${item.src.join(',')}">
  <label class="crit-hd">
    <input type="checkbox" class="crit-cb" data-pi="${pi}" data-id="${item.id}"${checked?' checked':''}>
    <div class="crit-main">
      <div class="crit-title">${hlTitle}</div>
      <div class="crit-pills">${srcs}${wPill}</div>
    </div>
    <button class="crit-expand-btn" data-expand="${item.id}">${t('expandBtn')}</button>
  </label>
  <div class="crit-detail" id="detail-${item.id}">${hlDesc}</div>
</div>`;
}

// ── Section icons ─────────────────────────────────────────────────
const SEC_ICONS = {
  p1s1:'🏰', p1s2:'🎯', p1s3:'👥', p1s4:'💰', p1s5:'⚙️', p1s6:'⚖️', p1rf:'🚩',
  p2s1:'✨', p2s2:'🧠', p2s3:'📊', p2s4:'🤝', p2s5:'🧩', p2rf:'🚩',
  p3s1:'🔍', p3s2:'🌱', p3s3:'📚', p3s4:'🗺️', p3s5:'🔒', p3rf:'🚩',
  p4s1:'✨', p4s2:'🎯', p4s3:'🧠', p4s4:'🧭', p4s5:'⏰', p4s6:'🤝', p4rf:'🚩',
};
// ── Build DOM: section ─────────────────────────────────────────────
function buildSection(sec, pi, query) {
  const isOpen = !!state.panels[pi].open[sec.id];
  const scoreData = computeSectionScore(sec, pi);
  const pct = scoreData.total ? Math.round(scoreData.checked / scoreData.total * 100) : 0;
  const itemsHtml = sec.items.map(item => buildCritItem(item, pi, query)).join('');
  const cls = `section${sec.isRedFlag ? ' rf-section' : ''}${isOpen ? ' open' : ''}`;
  const secIcon = SEC_ICONS[sec.id] || '';
  return `<div class="${cls}" id="sec-${sec.id}">
  <div class="sec-header" data-sec="${sec.id}" data-pi="${pi}">
    <span class="sec-toggle">▶</span>
    ${secIcon ? `<span class="sec-icon">${secIcon}</span>` : ''}
    <span class="sec-title">${esc(tx(sec.title))}</span>
    ${!sec.isRedFlag ? `<div class="sec-progress"><div class="sec-progress-bar" style="width:${pct}%"></div></div>
    <span class="sec-count">${scoreData.checked}/${scoreData.total}</span>` : ''}
  </div>
  <div class="sec-body">${itemsHtml}</div>
</div>`;
}

function computeSectionScore(sec, pi) {
  let total = 0, checked = 0;
  sec.items.forEach(item => {
    if (item.w === 'redflag') return;
    total++;
    if (state.panels[pi].checks[item.id]) checked++;
  });
  return { total, checked };
}

// ── Build DOM: Score Strip ─────────────────────────────────────────
function buildScoreStrip(pi) {
  const s = computeScore(pi);
  const rfCls = s.rfActive.length ? ' rf-active' : '';
  const starsLabel = s.level === 'rf' ? t('rfOverride') : (t('panelLevels')[pi][s.level] || '');
  return `<div class="score-strip" id="score-strip-${pi}">
  <div class="score-card${rfCls}"><div class="sc-val">${s.pct}%</div><div class="sc-lbl">${t('scorePct')}</div></div>
  <div class="score-card${rfCls}"><div class="sc-val">${s.critChecked}/${s.critTotal}</div><div class="sc-lbl">${t('scoreCritical')}</div></div>
  <div class="score-card${rfCls}"><div class="sc-val">${s.level === 'rf' ? '🚩' : '⭐'.repeat(s.level)}</div><div class="sc-lbl">${t('scoreStars')}</div></div>
  <div class="score-card${rfCls}"><div class="sc-val">${s.rfActive.length}/${CRITERIA[pi].find(s=>s.isRedFlag)?.items.length||0}</div><div class="sc-lbl">${t('scoreRF')}</div></div>
</div>`;
}

// ── Build DOM: Rating Card ─────────────────────────────────────────
function buildRatingCard(pi) {
  const s = computeScore(pi);
  const L = I18N[state.lang];
  const levelKey = s.level === 'rf' ? 'rf' : s.level;
  const label = L.panelLevels[pi][levelKey] || '';
  const desc = L.levelDescs[pi][levelKey] || '';
  const cls = s.level === 'rf' ? 'level-rf' : s.level >= 4 ? 'level-good' : s.level === 3 ? 'level-warn' : 'level-bad';

  // Gap analysis
  let gapHtml = '';
  if (s.level !== 'rf' && s.level < 5) {
    const nextLevel = s.level + 1;
    const thresholds = { 2: 40, 3: 60, 4: 75, 5: 90 };
    const needPct = thresholds[nextLevel] || 90;
    const needCritical = nextLevel >= 3;
    // missing critical
    const missingCritical = [];
    const missingHigh = [];
    CRITERIA[pi].forEach(sec => {
      if (sec.isRedFlag) return;
      sec.items.forEach(item => {
        if (item.w === 'critical' && !state.panels[pi].checks[item.id]) missingCritical.push(item);
        if (item.w === 'high' && !state.panels[pi].checks[item.id]) missingHigh.push(item);
      });
    });
    const gapItems = (items, label) => {
      if (!items.length) return '';
      return `<div class="gap-group"><div class="gap-group-title">${esc(label)}</div>
        ${items.map(item => `<div class="gap-item" id="gap-${item.id}">
          <div class="gap-item-hd" data-gap="${item.id}"><span class="gap-toggle">▶</span>${esc(tx(item.title))}</div>
          <div class="gap-detail">${esc(tx(item.desc))}<br><small>${item.src.map(s=>`<span class="pill pill-${s.toLowerCase()}">${esc(s)}</span>`).join(' ')}</small></div>
        </div>`).join('')}
      </div>`;
    };
    gapHtml = `<div class="rc-gap"><h4>${t('gapTitle')} (→ ${needPct}%${needCritical ? ' + ' + t('scoreCritical') : ''})</h4>
      ${needCritical && missingCritical.length ? gapItems(missingCritical, t('gapMissingCritical')) : ''}
      ${missingHigh.length ? gapItems(missingHigh, t('gapMissingHigh')) : ''}
    </div>`;
  } else if (s.level === 'rf') {
    const rfList = s.rfActive.map(item => `<div class="gap-item" id="gap-${item.id}">
      <div class="gap-item-hd" data-gap="${item.id}"><span class="gap-toggle">▶</span>🚩 ${esc(tx(item.title))}</div>
      <div class="gap-detail">${esc(tx(item.desc))}</div>
    </div>`).join('');
    gapHtml = `<div class="rc-gap"><h4>${t('rfActive')}</h4>${rfList}</div>`;
  }

  // Level table
  const ltOpen = state.panels[pi].levelTableOpen;
  const ltHtml = buildLevelTable(pi, ltOpen);

  return `<div class="rating-card ${cls}" id="rating-card-${pi}">
  <div class="rc-top">
    <div class="rc-stars">${s.level === 'rf' ? '🚩' : '⭐'.repeat(s.level)}</div>
    <div class="rc-info">
      <div class="rc-label">${esc(label)}</div>
      <div class="rc-pct">${s.pct}% · ${s.checked}/${s.total}</div>
    </div>
  </div>
  <div class="rc-desc">${esc(desc)}</div>
  ${gapHtml}
  ${ltHtml}
</div>`;
}

function buildLevelTable(pi, open) {
  const L = I18N[state.lang];
  const heads = L.levelTableHead.map(h=>`<th>${esc(h)}</th>`).join('');
  const rows = L.levelRows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="level-table-wrap">
  <button class="level-table-toggle" data-lt="${pi}">${open ? t('levelTableHide') : t('levelTableToggle')}</button>
  <table class="level-table${open?' open':''}">${heads}${rows}</table>
</div>`;
}

// ── Build DOM: Filter Bar ───────────────────────────────────────────
function buildFilterBar(pi) {
  const ps = state.panels[pi];
  const L = I18N[state.lang];
  const authorChips = ['Buffett','Munger','Grant','Collins'].map(a =>
    `<button class="chip a-${a.toLowerCase()}${ps.filterAuthors.includes(a)?' active':''}" data-fa="${a}" data-pi="${pi}">${a}</button>`
  ).join('');
  const weightChips = ['critical','high','medium','redflag'].map(w =>
    `<button class="chip w-${w}${ps.filterWeights.includes(w)?' active':''}" data-fw="${w}" data-pi="${pi}">${esc(L.weights[w])}</button>`
  ).join('');
  return `<div class="filter-bar" id="filter-bar-${pi}">
  <div class="filter-row">
    <span class="filter-label">${t('filterByAuthor')}</span>${authorChips}
  </div>
  <div class="filter-row">
    <span class="filter-label">${t('filterByWeight')}</span>${weightChips}
    <span class="filter-counter" id="filter-counter-${pi}"></span>
  </div>
  <div class="filter-row">
    <div class="search-wrap">
      <input type="text" id="search-${pi}" placeholder="${t('searchPlaceholder')}" value="${esc(ps.query)}">
      <button class="search-clear${ps.query?' show':''}" data-sc="${pi}">✕</button>
    </div>
  </div>
</div>`;
}

// ── Build DOM: Full Panel ──────────────────────────────────────────
function buildPanel(pi) {
  const query = state.panels[pi].query;
  const sectionsHtml = CRITERIA[pi].map(sec => buildSection(sec, pi, query)).join('');
  const L = I18N[state.lang];
  return `<div id="panel-${pi}" class="panel-content">
  ${buildScoreStrip(pi)}
  <div class="panel-ctrls">
    <button class="btn-sm" data-expand-all="${pi}">${t('expandAll')}</button>
    <button class="btn-sm" data-collapse-all="${pi}">${t('collapseAll')}</button>
    <button class="btn-sm" data-reset="${pi}">${t('resetAll')}</button>
  </div>
  <div class="filter-sentinel" id="fs-${pi}"></div>
  ${buildFilterBar(pi)}
  <div id="sections-${pi}">${sectionsHtml}</div>
  ${buildRatingCard(pi)}
</div>`;
}

// ── Build Tabs ─────────────────────────────────────────────────────
function buildTabs() {
  const nav = document.getElementById('tabs-nav');
  nav.innerHTML = CRITERIA.map((_, pi) => {
    const s = computeScore(pi);
    const isRf = s.rfActive.length > 0;
    const badge = s.level === 'rf' ? '🚩' : s.pct + '%';
    const L = I18N[state.lang];
    const label = window.innerWidth < 600 ? L.panelTabsShort[pi] : L.panelTabs[pi];
    return `<button class="tab-btn${pi===state.activePanel?' active':''}${isRf?' has-rf':''}" data-tab="${pi}">
      ${esc(label)}<span class="tab-badge">${badge}</span>
    </button>`;
  }).join('');
}

// ── Main render ────────────────────────────────────────────────────
function render(fullRebuild) {
  applyTheme();
  buildTabs();
  const container = document.getElementById('panels-container');
  if (fullRebuild) {
    container.innerHTML = buildPanel(state.activePanel);
    setupSentinel(state.activePanel);
  } else {
    const existing = document.getElementById(`panel-${state.activePanel}`);
    if (existing) {
      existing.outerHTML = buildPanel(state.activePanel);
      setupSentinel(state.activePanel);
    } else {
      container.innerHTML = buildPanel(state.activePanel);
      setupSentinel(state.activePanel);
    }
  }
  applyFilters(state.activePanel);
  updateLangBtn();
}

function rerenderPanel(pi) {
  const container = document.getElementById('panels-container');
  container.innerHTML = buildPanel(pi);
  setupSentinel(pi);
  applyFilters(pi);
}

// ── Filter & Search logic ──────────────────────────────────────────
function applyFilters(pi) {
  const ps = state.panels[pi];
  const fa = ps.filterAuthors, fw = ps.filterWeights, q = ps.query.toLowerCase().trim();
  let visible = 0, total = 0;
  document.querySelectorAll(`#sections-${pi} .section`).forEach(secEl => {
    let anyVisible = false;
    secEl.querySelectorAll('.crit-item').forEach(el => {
      const w = el.dataset.w;
      const srcs = (el.dataset.src || '').split(',');
      const titleEl = el.querySelector('.crit-title');
      const descEl = el.querySelector('.crit-detail');
      const rawTitle = titleEl?.textContent || '';
      const rawDesc = descEl?.textContent || '';
      let show = true;
      if (fa.length && !fa.some(a => srcs.includes(a))) show = false;
      if (fw.length && !fw.includes(w)) show = false;
      if (q) {
        const match = rawTitle.toLowerCase().includes(q) || rawDesc.toLowerCase().includes(q);
        if (!match) show = false;
        // highlight
        if (show) {
          if (titleEl) titleEl.innerHTML = highlight(rawTitle, q);
          if (descEl) descEl.innerHTML = highlight(rawDesc, q);
        }
      } else {
        if (titleEl) titleEl.innerHTML = esc(rawTitle);
        if (descEl) descEl.innerHTML = esc(rawDesc);
      }
      el.classList.toggle('hidden', !show);
      if (show) { anyVisible = true; total++; visible++; }
      else if (!show) { total++; }
    });
    secEl.classList.toggle('all-hidden', !anyVisible);
    // auto-open sections on search
    if (q && anyVisible && !secEl.classList.contains('open')) {
      secEl.classList.add('open');
      state.panels[pi].open[secEl.id.replace('sec-','')] = true;
    }
  });
  const counter = document.getElementById(`filter-counter-${pi}`);
  if (counter) counter.textContent = `${visible}/${total} ${t('counter')}`;
}

// ── Sticky filter via IntersectionObserver ──────────────────────────
function setupSentinel(pi) {
  const sentinel = document.getElementById(`fs-${pi}`);
  const bar = document.getElementById(`filter-bar-${pi}`);
  if (!sentinel || !bar) return;
  new IntersectionObserver(entries => {
    bar.classList.toggle('stuck', !entries[0].isIntersecting);
  }, { threshold: 0 }).observe(sentinel);
}

// ── Theme ──────────────────────────────────────────────────────────
function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('btn-theme').textContent = state.theme === 'dark' ? '🌙' : '☀️';
}

function updateLangBtn() {
  const btn = document.getElementById('btn-lang');
  if (btn) btn.textContent = state.lang === 'vi' ? 'EN' : 'VI';
}

// ── Debounce ───────────────────────────────────────────────────────
function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// ── Event delegation ───────────────────────────────────────────────
function wireEvents() {
  // Theme toggle
  document.getElementById('btn-theme').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('tdf-theme', state.theme);
    applyTheme();
  });

  // Lang toggle
  document.getElementById('btn-lang').addEventListener('click', () => {
    state.lang = state.lang === 'vi' ? 'en' : 'vi';
    localStorage.setItem('tdf-lang', state.lang);
    render(true);
  });

  // Tabs
  document.getElementById('tabs-nav').addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    state.activePanel = +btn.dataset.tab;
    render(true);
  });

  // Panel controls — delegate on container
  document.getElementById('panels-container').addEventListener('click', e => {
    const pi = state.activePanel;
    const ps = state.panels[pi];

    // Checkbox
    const cb = e.target.closest('.crit-cb');
    if (cb) {
      const id = cb.dataset.id;
      const checked = cb.checked;
      ps.checks[id] = checked;
      // rerender rating card & score strip only
      const sc = document.getElementById(`score-strip-${pi}`);
      if (sc) sc.outerHTML = buildScoreStrip(pi);
      const rc = document.getElementById(`rating-card-${pi}`);
      if (rc) rc.outerHTML = buildRatingCard(pi);
      // section progress
      const secEl = cb.closest('.section');
      if (secEl) {
        const secId = secEl.id.replace('sec-','');
        const sec = CRITERIA[pi].find(s => s.id === secId);
        if (sec) {
          const sd = computeSectionScore(sec, pi);
          const pct = sd.total ? Math.round(sd.checked/sd.total*100) : 0;
          const bar = secEl.querySelector('.sec-progress-bar');
          if (bar) bar.style.width = pct + '%';
          const cnt = secEl.querySelector('.sec-count');
          if (cnt) cnt.textContent = sd.checked + '/' + sd.total;
        }
      }
      // toggle .checked
      cb.closest('.crit-item')?.classList.toggle('checked', checked);
      // update tab badge
      buildTabs();
      // rf-section pulse
      if (cb.closest('.rf-section') && checked) {
        const rfsec = cb.closest('.rf-section');
        rfsec.classList.remove('rf-triggered');
        void rfsec.offsetWidth;
        rfsec.classList.add('rf-triggered');
      }
      return;
    }

    // Expand/collapse criterion detail
    const expBtn = e.target.closest('[data-expand]');
    if (expBtn) {
      e.preventDefault();
      const id = expBtn.dataset.expand;
      const detail = document.getElementById(`detail-${id}`);
      if (detail) {
        const isOpen = detail.classList.toggle('open');
        expBtn.textContent = isOpen ? t('collapseBtn') : t('expandBtn');
      }
      return;
    }

    // Section accordion header
    const secHd = e.target.closest('.sec-header');
    if (secHd && !e.target.closest('.crit-cb') && !e.target.closest('[data-expand]')) {
      const secId = secHd.dataset.sec;
      const secEl = document.getElementById(`sec-${secId}`);
      if (secEl) {
        const opening = !secEl.classList.contains('open');
        secEl.classList.toggle('open', opening);
        ps.open[secId] = opening;
      }
      return;
    }

    // Expand All / Collapse All / Reset
    if (e.target.closest('[data-expand-all]')) {
      CRITERIA[pi].forEach(sec => { ps.open[sec.id] = true; });
      document.querySelectorAll(`#sections-${pi} .section`).forEach(el => el.classList.add('open'));
      return;
    }
    if (e.target.closest('[data-collapse-all]')) {
      CRITERIA[pi].forEach(sec => { ps.open[sec.id] = false; });
      document.querySelectorAll(`#sections-${pi} .section`).forEach(el => el.classList.remove('open'));
      return;
    }
    if (e.target.closest('[data-reset]')) {
      ps.checks = {}; ps.open = {};
      rerenderPanel(pi);
      buildTabs();
      return;
    }

    // Author filter chips
    const fa = e.target.closest('[data-fa]');
    if (fa) {
      const a = fa.dataset.fa;
      const idx = ps.filterAuthors.indexOf(a);
      if (idx >= 0) ps.filterAuthors.splice(idx, 1); else ps.filterAuthors.push(a);
      fa.classList.toggle('active', ps.filterAuthors.includes(a));
      applyFilters(pi);
      return;
    }

    // Weight filter chips
    const fw = e.target.closest('[data-fw]');
    if (fw) {
      const w = fw.dataset.fw;
      const idx = ps.filterWeights.indexOf(w);
      if (idx >= 0) ps.filterWeights.splice(idx, 1); else ps.filterWeights.push(w);
      fw.classList.toggle('active', ps.filterWeights.includes(w));
      applyFilters(pi);
      return;
    }

    // Search clear
    const sc = e.target.closest('[data-sc]');
    if (sc) {
      const searchEl = document.getElementById(`search-${pi}`);
      if (searchEl) { searchEl.value = ''; ps.query = ''; sc.classList.remove('show'); applyFilters(pi); }
      return;
    }

    // Level table toggle
    const lt = e.target.closest('[data-lt]');
    if (lt) {
      ps.levelTableOpen = !ps.levelTableOpen;
      const rc = document.getElementById(`rating-card-${pi}`);
      if (rc) rc.outerHTML = buildRatingCard(pi);
      return;
    }

    // Gap item accordion
    const gapHd = e.target.closest('[data-gap]');
    if (gapHd) {
      const gapEl = gapHd.closest('.gap-item');
      if (gapEl) gapEl.classList.toggle('open');
      return;
    }
  });

  // Search input (debounced)
  document.getElementById('panels-container').addEventListener('input', debounce(e => {
    const input = e.target.closest('input[id^="search-"]');
    if (!input) return;
    const pi = state.activePanel;
    state.panels[pi].query = input.value;
    const clrBtn = input.parentNode.querySelector('[data-sc]');
    if (clrBtn) clrBtn.classList.toggle('show', !!input.value);
    applyFilters(pi);
  }, 300));
}

// ── Init ───────────────────────────────────────────────────────────
render(true);
wireEvents();
// ── Back-to-top button ─────────────────────────────────────────────
(function(){
  const btn = document.createElement('button');
  btn.id = 'btn-top'; btn.className = 'btn-top';
  btn.title = 'Về đầu trang'; btn.setAttribute('aria-label', 'Về đầu trang');
  btn.textContent = '↑';
  document.body.appendChild(btn);
  window.addEventListener('scroll', () => btn.classList.toggle('visible', window.scrollY > window.innerHeight), {passive:true});
  btn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
})();
</script>
