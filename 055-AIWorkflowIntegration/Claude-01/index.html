/* =======================================================================
   LAYER 2 — RENDER
   Pure functions: DATA → HTML strings. No state. No events.
   ======================================================================= */
const RENDER = {

  dotClass(type) { return type === 'gate' ? 'step-dot-outer' : `step-dot-outer c-${type}`; },
  dotStyle(type) { return type === 'gate' ? 'border-color:var(--text3)' : `border-color:var(--c-${type})`; },
  stepBadgeClass(type) { return type === 'gate' ? 'step-type-badge' : `step-type-badge c-${type} border-${type} bg-${type}`; },
  stepBadgeStyle(type) { return type === 'gate' ? 'color:var(--text3);border-color:var(--line2)' : ''; },

  /* ── sidebar ── */
  sidebar({ meta, nav }) {
    const totalBlocks = DATA.blocks.reduce((a, g) => a + g.items.length, 0);
    const items = nav.map(n => {
      const num = n.count ? `<span class="nav-num">${n.count}</span>` : '';
      return `<div class="nav-item" onclick="APP.show('${n.id}')" id="nav-${n.id}">
        <span class="nav-dot" style="background:${n.dot}"></span>${n.label}${num}
      </div>`;
    }).join('');
    return `
      <div class="logo-block">
        <div class="logo-label">${meta.tagline} · ${meta.version}</div>
        <div class="logo-title">${meta.titleLine1}<br><em>${meta.titleLine2}</em></div>
      </div>
      <nav><div class="nav-section">
        <div class="nav-section-label">Navigation</div>${items}
      </div></nav>
      <div class="sidebar-footer">
        ${DATA.approaches.length} approaches<br>
        ${DATA.blocks.reduce((a,g)=>a+g.items.length,0)} building blocks<br>
        ${DATA.principles.length} principles<br>
        ${DATA.workflows.length} workflows
      </div>`;
  },

  _sectionIcons: { overview:'🗺', approaches:'🧭', blocks:'🧱', principles:'💡', framework:'🎯', workflows:'⚙️' },

  searchBar(sectionId) {
    const filterHtml = RENDER._filterPills(sectionId);
    return `
      <div class="search-bar" id="search-bar-${sectionId}">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input class="search-input" id="search-input-${sectionId}" type="text"
            placeholder="Search…" oninput="APP.onSearch('${sectionId}',this.value)"
            autocomplete="off" spellcheck="false">
          <button class="search-clear" id="search-clear-${sectionId}"
            onclick="APP.clearSearch('${sectionId}')" aria-label="Clear search">✕</button>
        </div>
        ${filterHtml}
      </div>`;
  },

  _filterPills(sectionId) {
    const configs = {
      approaches: { label:'Group', pills: DATA.groups.map(g=>({id:g.num,label:`${g.num}: ${g.name}`.substring(0,18)})) },
      blocks:     { label:'Category', pills: DATA.blocks.map(g=>({id:g.category,label:g.category})) },
      principles: { label:'', pills:[] },
      workflows:  { label:'Type', pills: [...new Set(DATA.workflows.flatMap(w=>w.badges.map(b=>b.key)))].map(k=>({id:k,label:k.charAt(0).toUpperCase()+k.slice(1)})) },
    };
    const cfg = configs[sectionId];
    if (!cfg || !cfg.pills.length) return '';
    const pills = cfg.pills.map(p =>
      `<button class="filter-pill" data-section="${sectionId}" data-filter="${p.id}"
        onclick="APP.toggleFilter('${sectionId}','${p.id}',this)">${p.label}</button>`
    ).join('');
    return `<span class="filter-label">${cfg.label}</span>${pills}
      <button class="filter-pill" onclick="APP.clearFilters('${sectionId}')" style="opacity:.55">✕ All</button>`;
  },

  sectionOverview({ meta, overviewTable, overviewMatrix }) {
    const tags  = DATA.approaches.map(a => `<span class="hero-tag">${a.label}</span>`).join('');
    const stats = meta.stats.map(s => `
      <div class="overview-cell">
        <div class="overview-cell-label">${s.label}</div>
        <div class="overview-cell-val">${s.value}</div>
        <div class="overview-cell-sub">${s.sub}</div>
      </div>`).join('');
    const ths  = overviewTable.headers.map(h => `<th>${h}</th>`).join('');
    const rows = overviewTable.rows.map(r => `
      <tr>
        <td style="font-family:var(--mono);font-size:10px;color:var(--text3);white-space:nowrap">${r.num}</td>
        <td style="white-space:nowrap"><span class="dot-badge" style="background:var(--c-${r.id})"></span>${r.name}</td>
        <td style="font-size:11px;color:var(--text3)">${r.group}</td>
        <td>${r.role}</td><td>${r.cadence}</td>
        <td><div class="fit-pills">${r.fit.map(f=>`<span class="fit-pill">${f}</span>`).join('')}</div></td>
        <td><span style="color:${r.auditColor}">${r.audit}</span></td>
      </tr>`).join('');
    const colHeads = overviewMatrix.cols.map(c =>
      `<div class="matrix-col-head">${c.replace('\\n','<br>')}</div>`).join('');
    const matrixRows = overviewMatrix.rows.map(r => {
      const cells = r.cells.map(c =>
        `<div class="matrix-cell cell-${c}">${overviewMatrix.cellLabels[c]}</div>`).join('');
      return `<div class="matrix-row-head">${r.label}</div>${cells}`;
    }).join('');
    return `
      <div class="hero">
        <div class="hero-eyebrow">${meta.hero.eyebrow}</div>
        <div class="hero-title">${meta.hero.title.replace('<em>','<br><em>')}</div>
        <div class="hero-sub">${meta.hero.sub}</div>
        <div class="hero-tags">${tags}</div>
      </div>
      <div class="overview-grid">${stats}</div>
      <div class="table-wrap"><table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="map-section">
        <div class="map-label">Approach Fit Matrix — by task property</div>
        <div class="matrix-grid" style="grid-template-columns:80px repeat(5,1fr)">
          <div class="matrix-corner"></div>${colHeads}${matrixRows}
        </div>
      </div>
      ${RENDER._attribution()}`;
  },

  sectionApproaches(approaches) {
    const byGroup = {};
    approaches.forEach(a => { (byGroup[a.group]=byGroup[a.group]||[]).push(a); });
    const groups = DATA.groups.map(g => {
      const list = byGroup[g.num] || [];
      const dots = g.colors.map(c=>`<div class="group-color-dot" style="background:var(--c-${c})"></div>`).join('');
      const cards = list.map(a => {
        const pills = a.pills.map(p=>`<span class="cpill">${p}</span>`).join('');
        return `
          <div class="approach-card" id="card-${a.id}"
            data-group="${a.group}"
            data-searchable="${a.label} ${a.name.replace('\\n',' ')} ${a.tagline} ${a.pills.join(' ')} ${a.excels.join(' ')} ${a.mechanics.join(' ')}"
            onclick="APP.openModal('approach','${a.id}')">
            <div class="card-index">${a.index} — ${a.label}</div>
            <div class="card-badge c-${a.id} border-${a.id} bg-${a.id}">${a.label}</div>
            <div class="card-name">${a.name.replace('\\n','<br>')}</div>
            <div class="card-tagline">${a.tagline}</div>
            <div class="card-pills">${pills}</div>
            <div class="card-expand-hint">↗ Details</div>
          </div>`;
      }).join('');
      return `
        <div class="approach-group" id="${g.id}" data-group="${g.num}">
          <div class="group-header">
            <span class="group-header-num">Group ${g.num}</span>
            <span class="group-header-name">${g.name}</span>
            <div class="group-color-bar">${dots}</div>
            <span class="group-header-desc">${g.desc}</span>
          </div>
          <div class="approach-grid">${cards}</div>
        </div>`;
    }).join('');
    return `
      <div class="sec-header">
        <span class="sec-icon">${RENDER._sectionIcons.approaches}</span>
        <div class="sec-eyebrow">Section 02</div>
        <div class="sec-title">Fourteen Approaches</div>
        <div class="sec-desc">Organised into four groups. Click any card to open a detailed view. Use ← → arrow keys to navigate between approaches.</div>
      </div>
      ${RENDER.searchBar('approaches')}
      <div id="approaches-content">${groups}</div>`;
  },

  sectionBlocks(blocks) {
    const groups = blocks.map(g => {
      const cards = g.items.map(b => `
        <div class="block-card" data-category="${g.category}"
          data-searchable="${b.name} ${b.desc} ${b.used}"
          onclick="APP.openModal('block',${JSON.stringify(b.name)})">
          <div class="block-icon">${b.icon}</div>
          <div class="block-name">${b.name}</div>
          <div class="block-desc">${b.desc}</div>
          <div class="block-used">${b.used}</div>
        </div>`).join('');
      return `
        <div class="blocks-category" data-category="${g.category}">
          <div class="blocks-section-title">${g.category}</div>
          <div class="blocks-grid">${cards}</div>
        </div>`;
    }).join('');
    return `
      <div class="sec-header">
        <span class="sec-icon">${RENDER._sectionIcons.blocks}</span>
        <div class="sec-eyebrow">Section 03</div>
        <div class="sec-title">21 Building Blocks</div>
        <div class="sec-desc">21 atomic components across 4 categories. Click any block for details.</div>
      </div>
      ${RENDER.searchBar('blocks')}
      <div class="blocks-page" id="blocks-content">${groups}</div>`;
  },

  sectionPrinciples(principles) {
    const items = principles.map(p => `
      <div class="principle-item" data-searchable="${p.title} ${p.body} ${p.guideline}"
        onclick="APP.openModal('principle','${p.num}')">
        <div class="principle-num">${p.num}</div>
        <div class="principle-body">
          <h3>${p.title}</h3>
          <p>${p.body}</p>
          <div class="principle-guideline">${p.guideline}</div>
        </div>
      </div>`).join('');
    return `
      <div class="sec-header">
        <span class="sec-icon">${RENDER._sectionIcons.principles}</span>
        <div class="sec-eyebrow">Section 04</div>
        <div class="sec-title">Eleven Principles</div>
        <div class="sec-desc">Eleven durable rules. Click any principle to open a focused view.</div>
      </div>
      ${RENDER.searchBar('principles')}
      <div class="principles-page" id="principles-content">${items}</div>`;
  },

  sectionFramework({ intro, questions }) {
    const qs = questions.map(q => {
      const suffix = q.suffix ? ` — ${q.suffix}` : '';
      const opts   = q.options.map(o =>
        `<span class="q-opt" onclick="APP.answer(${q.id},'${o.value}',this)">${o.label}</span>`
      ).join('');
      return `
        <div class="q-card" id="qcard-${q.id}">
          <div class="q-label">Question 0${q.id} of 0${questions.length}${suffix}</div>
          <div class="q-text">${q.text}</div>
          <div class="q-sub">${q.sub}</div>
          <div class="q-options">${opts}</div>
        </div>`;
    }).join('');
    return `
      <div class="sec-header">
        <span class="sec-icon">${RENDER._sectionIcons.framework}</span>
        <div class="sec-eyebrow">Section 05</div>
        <div class="sec-title">Decision Framework</div>
        <div class="sec-desc">Answer six questions. The framework triangulates the best approach across all 14 options.</div>
      </div>
      <div class="framework-page">
        <div class="framework-intro">${intro}</div>
        <div class="questions-col">${qs}</div>
        <div id="rec-panel" class="rec-panel">
          <div class="rec-label" id="rec-label"></div>
          <div class="rec-title" id="rec-title"></div>
          <div class="rec-desc"  id="rec-desc"></div>
          <div class="rec-steps" id="rec-steps"></div>
        </div>
      </div>`;
  },

  sectionWorkflows(workflows) {
    const tabs = workflows.map((w, i) => {
      const badges = w.badges.map(b=>`<span class="wf-badge c-${b.key} border-${b.key}">${b.label}</span>`).join('');
      return `
        <div class="wf-tab${i===0?' active':''}" id="wftab-${w.id}" onclick="APP.switchWf('${w.id}')"
          data-searchable="${w.title} ${w.badges.map(b=>b.label).join(' ')}">
          <div class="wf-tab-num">0${i+1}</div>
          <div class="wf-tab-name">${w.title}</div>
          <div class="wf-badge-row">${badges}</div>
        </div>`;
    }).join('');
    const bodies = workflows.map((w, i) => {
      const steps = w.steps.map(s => {
        const tools    = s.tools.map(t=>`<span class="step-tool">${t}</span>`).join('');
        const dotCls   = RENDER.dotClass(s.type);
        const dotSty   = RENDER.dotStyle(s.type);
        const badgeCls = RENDER.stepBadgeClass(s.type);
        const badgeSty = RENDER.stepBadgeStyle(s.type);
        return `
          <div class="step-row">
            <div class="step-spine">
              <div class="${dotCls}" style="${dotSty}"></div>
              <div class="step-line-seg"></div>
            </div>
            <div class="step-content">
              <div class="step-meta">
                <span class="step-phase">Step ${s.phase}</span>
                <span class="${badgeCls}" style="${badgeSty}">${s.label}</span>
              </div>
              <div class="step-title">${s.title}</div>
              <div class="step-desc">${s.desc}</div>
              <div class="step-tools">${tools}</div>
            </div>
          </div>`;
      }).join('');
      return `
        <div class="wf-body${i===0?' active':''}" id="wfbody-${w.id}">
          <div class="wf-header">
            <div class="wf-title">${w.title}</div>
            <div class="wf-meta">Risk: ${w.risk}<span>·</span>Duration: ${w.duration}<span>·</span>${w.team}</div>
          </div>
          <div class="wf-steps">${steps}</div>
        </div>`;
    }).join('');
    return `
      <div class="sec-header">
        <span class="sec-icon">${RENDER._sectionIcons.workflows}</span>
        <div class="sec-eyebrow">Section 06</div>
        <div class="sec-title">Recommended Workflows</div>
        <div class="sec-desc">Ten end-to-end workflows combining multiple approaches and building blocks.</div>
      </div>
      ${RENDER.searchBar('workflows')}
      <div class="workflows-page" id="workflows-content">
        <div class="wf-picker">${tabs}</div>
        ${bodies}
      </div>`;
  },

  allSections(data) {
    return `
      <section id="s-overview"   class="overview-page active">${RENDER.sectionOverview(data)}</section>
      <section id="s-approaches"                             >${RENDER.sectionApproaches(data.approaches)}</section>
      <section id="s-blocks"                                 >${RENDER.sectionBlocks(data.blocks)}</section>
      <section id="s-principles"                             >${RENDER.sectionPrinciples(data.principles)}</section>
      <section id="s-framework"                              >${RENDER.sectionFramework(data.framework)}</section>
      <section id="s-workflows"                              >${RENDER.sectionWorkflows(data.workflows)}</section>`;
  },

  _attribution() {
    return `
      <div class="attribution">
        <div class="attribution-badge">
          <span>🤖</span>
          <span>Content generated by <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a> (Anthropic)</span>
        </div>
        <span>AI Workflow Integration Atlas · v2.0</span>
        <span>Structure, content &amp; code co-authored with Claude Sonnet</span>
      </div>`;
  },

  modalApproach(id) {
    const a = DATA.approaches.find(x => x.id === id);
    if (!a) return '';
    const pills = a.pills.map(p=>`<span class="modal-pill">${p}</span>`).join('');
    const tradeoffs = a.tradeoffs.map(t=>`
      <div class="modal-trow">
        <span class="modal-tlbl">${t.label}</span>
        <div class="modal-ttrack"><div class="modal-tfill bar-${a.id}" style="width:${t.value}%"></div></div>
        <span class="modal-tval c-${a.id}">${t.value}</span>
      </div>`).join('');
    return `
      <div class="modal-section">
        <div class="modal-pills">${pills}</div>
        <p style="font-size:13px;color:var(--text2);line-height:1.65;margin-top:6px">${a.tagline}</p>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">When it excels</div>
        <ul class="modal-list">${a.excels.map(x=>`<li>${x}</li>`).join('')}</ul>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">Core mechanics</div>
        <ul class="modal-list">${a.mechanics.map(x=>`<li>${x}</li>`).join('')}</ul>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">When to avoid</div>
        <ul class="modal-list">${a.avoid.map(x=>`<li>${x}</li>`).join('')}</ul>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">Tradeoff Profile</div>
        <div class="modal-tradeoffs">${tradeoffs}</div>
      </div>
      <div class="modal-note" style="border-left-color:var(--c-${a.id})">${a.note}</div>`;
  },

  modalBlock(name) {
    let found = null, cat = '';
    DATA.blocks.forEach(g => { const b = g.items.find(x=>x.name===name); if(b){found=b;cat=g.category;} });
    if (!found) return '';
    return `
      <div class="block-modal-icon">${found.icon}</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:14px">${found.desc}</p>
      <div class="block-modal-used"><strong style="color:var(--text3);font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase">Used in</strong><br><br>${found.used}</div>`;
  },

  modalPrinciple(num) {
    const p = DATA.principles.find(x => x.num === num);
    if (!p) return '';
    return `
      <div class="modal-section">
        <p style="font-size:13px;color:var(--text2);line-height:1.75">${p.body}</p>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">Practical Guideline</div>
        <p style="font-family:var(--mono);font-size:12px;color:var(--text3);line-height:1.65;border-left:2px solid var(--line2);padding-left:12px">${p.guideline}</p>
      </div>`;
  },

  injectDynamicStyles(approaches, workflows) {
    const wfColorMap = { onboard:'std', regulatory:'spec', feature:'agent', debug:'skill', greenfield:'big', pipeline_wf:'pipeline', memory_onboard:'memory', platform:'hybrid', legacy:'rag', steady_state:'hybrid' };
    const cardStyles = approaches.map(a=>`#card-${a.id}::before{background:var(--c-${a.id})}`).join('\n');
    const wfStyles   = workflows.map(w => {
      const k = wfColorMap[w.id] || w.badges[0]?.key || 'spec';
      return `#wftab-${w.id}.active::after{background:var(--c-${k})}`;
    }).join('\n');
    const el = document.createElement('style');
    el.textContent = cardStyles + '\n' + wfStyles;
    document.head.appendChild(el);
  },

};


/* =======================================================================
   LAYER 3 — APP
   ======================================================================= */
const APP = {

  state: {
    activeSection: 'overview',
    answers: {},
    sidebarOpen: false,
    theme: 'dark',
    searchTimers: {},
    activeFilters: {},
    modalOpen: false,
  },

  _isMobile() { return window.innerWidth <= 700; },

  init() {
    document.getElementById('sidebar').innerHTML  = RENDER.sidebar(DATA);
    document.getElementById('sections').innerHTML = RENDER.allSections(DATA);
    RENDER.injectDynamicStyles(DATA.approaches, DATA.workflows);
    this.show('overview');
    this._applyTheme(localStorage.getItem('atlas-theme') || 'dark');
    if (!this._isMobile()) this._setSidebar(true);
    window.addEventListener('resize', () => {
      if (!this._isMobile() && !this.state.sidebarOpen) this._setSidebar(true);
    });
    this._initScrollTop();
    this._initModal();
  },

  /* sidebar */
  _setSidebar(open) {
    const shell = document.getElementById('shell');
    const bd    = document.getElementById('sidebar-backdrop');
    const btn   = document.getElementById('topbar-toggle');
    shell.classList.toggle('sidebar-hidden', !open);
    if (bd)  bd.classList.toggle('visible', open && this._isMobile());
    if (btn) btn.title = open ? 'Hide sidebar' : 'Show sidebar';
    this.state.sidebarOpen = open;
  },
  toggleSidebar() { this._setSidebar(!this.state.sidebarOpen); },

  show(id) {
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.getElementById('s-'+id)?.classList.add('active');
    document.getElementById('nav-'+id)?.classList.add('active');
    this.state.activeSection = id;
    if (this._isMobile()) this._setSidebar(false);
    const m = document.getElementById('main');
    if (m) m.scrollTop = 0;
  },

  /* theme */
  _applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    this.state.theme = theme;
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.innerHTML  = theme === 'dark' ? '☀' : '☾';
      btn.title      = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    }
    try { localStorage.setItem('atlas-theme', theme); } catch(e) {}
  },
  toggleTheme() { this._applyTheme(this.state.theme === 'dark' ? 'light' : 'dark'); },

  /* scroll-to-top */
  _initScrollTop() {
    const btn = document.createElement('button');
    btn.className = 'scroll-top';
    btn.innerHTML = '↑';
    btn.title = 'Back to top';
    btn.onclick = () => document.getElementById('main')?.scrollTo({top:0,behavior:'smooth'});
    document.body.appendChild(btn);
    document.getElementById('main')?.addEventListener('scroll', () => {
      const m = document.getElementById('main');
      btn.classList.toggle('visible', m && m.scrollTop > m.clientHeight * 0.5);
    }, {passive:true});
  },

  /* search */
  onSearch(sid, query) {
    const cb = document.getElementById('search-clear-'+sid);
    if (cb) cb.classList.toggle('visible', query.length > 0);
    clearTimeout(this.state.searchTimers[sid]);
    this.state.searchTimers[sid] = setTimeout(() => this._applySearch(sid, query.trim().toLowerCase()), 280);
  },

  clearSearch(sid) {
    const inp = document.getElementById('search-input-'+sid);
    if (inp) { inp.value = ''; inp.focus(); }
    document.getElementById('search-clear-'+sid)?.classList.remove('visible');
    this._applySearch(sid, '');
  },

  _applySearch(sid, q) {
    const filters = this.state.activeFilters[sid] || new Set();
    const selMap = {
      approaches: '#approaches-content .approach-card',
      blocks:     '#blocks-content .block-card',
      principles: '#principles-content .principle-item',
      workflows:  '#workflows-content .wf-tab',
    };
    const sel = selMap[sid]; if (!sel) return;
    const items = document.querySelectorAll(sel);

    items.forEach(el => {
      const text  = (el.dataset.searchable||'').toLowerCase();
      const group = el.dataset.group || el.dataset.category || '';
      const matchQ = !q || text.includes(q);
      const matchF = !filters.size || [...filters].some(f => group.includes(f));
      el.style.display = (matchQ && matchF) ? '' : 'none';
      this._highlight(el, q);
    });

    /* hide empty group headers */
    if (sid === 'approaches') {
      document.querySelectorAll('#approaches-content .approach-group').forEach(g => {
        g.style.display = [...g.querySelectorAll('.approach-card')].some(c=>c.style.display!=='none') ? '' : 'none';
      });
    }
    if (sid === 'blocks') {
      document.querySelectorAll('#blocks-content .blocks-category').forEach(g => {
        g.style.display = [...g.querySelectorAll('.block-card')].some(c=>c.style.display!=='none') ? '' : 'none';
      });
    }
  },

  _highlight(el, q) {
    el.querySelectorAll('mark.sh').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
    el.normalize();
    if (!q) return;
    const targets = el.querySelectorAll('.card-name,.card-tagline,.block-name,.block-desc,.principle-body h3,.principle-body p,.wf-tab-name');
    const walk = node => {
      if (node.nodeType === 3) {
        const i = node.textContent.toLowerCase().indexOf(q);
        if (i === -1) return;
        const par = node.parentNode;
        par.insertBefore(document.createTextNode(node.textContent.slice(0,i)), node);
        const m = document.createElement('mark'); m.className='sh'; m.textContent=node.textContent.slice(i,i+q.length);
        par.insertBefore(m, node);
        par.insertBefore(document.createTextNode(node.textContent.slice(i+q.length)), node);
        par.removeChild(node);
      } else if (node.nodeType===1 && !['SCRIPT','STYLE','MARK'].includes(node.tagName)) {
        [...node.childNodes].forEach(walk);
      }
    };
    targets.forEach(t => walk(t));
  },

  /* filters */
  toggleFilter(sid, fid, btn) {
    if (!this.state.activeFilters[sid]) this.state.activeFilters[sid] = new Set();
    const set = this.state.activeFilters[sid];
    if (set.has(fid)) {
      set.delete(fid); btn.classList.remove('active'); btn.style.cssText='';
    } else {
      set.add(fid); btn.classList.add('active');
      btn.style.background = `var(--c-${fid}-dim,var(--bg3))`; btn.style.color='var(--text)'; btn.style.borderColor='transparent';
    }
    this._applySearch(sid, (document.getElementById('search-input-'+sid)||{}).value?.trim().toLowerCase()||'');
  },

  clearFilters(sid) {
    this.state.activeFilters[sid] = new Set();
    document.querySelectorAll(`.filter-pill[data-section="${sid}"]`).forEach(p=>{ p.classList.remove('active'); p.style.cssText=''; });
    this._applySearch(sid, (document.getElementById('search-input-'+sid)||{}).value?.trim().toLowerCase()||'');
  },

  /* modal */
  _initModal() {
    const bd = document.createElement('div');
    bd.className='modal-backdrop'; bd.id='modal-backdrop';
    bd.onclick = e => { if(e.target===bd) APP.closeModal(); };
    const m = document.createElement('div');
    m.className='modal'; m.id='modal';
    m.innerHTML=`
      <div class="modal-header" id="modal-header">
        <div class="modal-header-color" id="modal-color-bar"></div>
        <div style="flex:1;min-width:0">
          <div class="modal-header-index" id="modal-index"></div>
          <div class="modal-header-title" id="modal-title"></div>
        </div>
        <div class="modal-controls">
          <button class="modal-btn" id="modal-max-btn" onclick="APP.toggleModalMax()" title="Maximise">⤢</button>
          <button class="modal-btn" onclick="APP.closeModal()" title="Close" aria-label="Close dialog">✕</button>
        </div>
      </div>
      <div class="modal-body" id="modal-body"></div>`;
    bd.appendChild(m);
    document.body.appendChild(bd);
    document.addEventListener('keydown', e => {
      if (!APP.state.modalOpen) return;
      if (e.key==='Escape') APP.closeModal();
      if (e.key==='ArrowRight'||e.key==='ArrowLeft') APP._navModal(e.key==='ArrowRight'?1:-1);
    });
  },

  openModal(type, id) {
    const bd    = document.getElementById('modal-backdrop');
    const body  = document.getElementById('modal-body');
    const title = document.getElementById('modal-title');
    const index = document.getElementById('modal-index');
    const cbar  = document.getElementById('modal-color-bar');
    let html='', t='', idx='', col='var(--text3)';

    if (type==='approach') {
      const a = DATA.approaches.find(x=>x.id===id); if(!a) return;
      html=RENDER.modalApproach(id); t=a.name.replace('\\n',' '); idx=`${a.index} — ${a.label}`; col=`var(--c-${a.id})`;
      bd.dataset.modalType='approach'; bd.dataset.modalId=id;
    } else if (type==='block') {
      let found=null; DATA.blocks.forEach(g=>{const b=g.items.find(x=>x.name===id);if(b)found=b;}); if(!found) return;
      html=RENDER.modalBlock(id); t=found.name; idx='Building Block'; col='var(--c-agent)';
    } else if (type==='principle') {
      const p=DATA.principles.find(x=>x.num===id); if(!p) return;
      html=RENDER.modalPrinciple(id); t=p.title; idx=`Principle ${p.num}`; col='var(--c-big)';
    }

    title.textContent=t; index.textContent=idx; cbar.style.background=col;
    body.innerHTML=html; body.scrollTop=0;
    bd.classList.add('open');
    document.getElementById('modal')?.classList.remove('maximized');
    document.getElementById('modal-max-btn').textContent='⤢';
    this.state.modalOpen=true;
    document.body.style.overflow='hidden';
  },

  closeModal() {
    document.getElementById('modal-backdrop')?.classList.remove('open');
    this.state.modalOpen=false;
    document.body.style.overflow='';
  },

  toggleModalMax() {
    const m=document.getElementById('modal');
    const btn=document.getElementById('modal-max-btn');
    const max=m?.classList.toggle('maximized');
    if(btn) btn.textContent=max?'⤡':'⤢';
  },

  _navModal(dir) {
    const bd=document.getElementById('modal-backdrop');
    if(bd?.dataset.modalType!=='approach') return;
    const ids=DATA.approaches.map(a=>a.id);
    const i=ids.indexOf(bd.dataset.modalId);
    this.openModal('approach', ids[(i+dir+ids.length)%ids.length]);
  },

  /* framework */
  answer(qNum, val, el) {
    document.querySelectorAll(`[onclick^="APP.answer(${qNum},"]`).forEach(o=>{o.classList.remove('selected');o.style.background='';});
    el.classList.add('selected');
    this.state.answers['q'+qNum]=val;
    document.getElementById('qcard-'+qNum)?.classList.add('answered');
    if(Object.keys(this.state.answers).length>=2) this._recommend();
  },

  _recommend() {
    const a=this.state.answers;
    const key=(DATA.framework.rules.find(r=>r.when(a))||{result:'hybrid'}).result;
    const cfg=DATA.framework.recommendations[key];
    const panel=document.getElementById('rec-panel');
    if(!panel||!cfg) return;
    panel.className='rec-panel visible';
    panel.style.background=cfg.color; panel.style.borderColor=cfg.border;
    document.getElementById('rec-label').textContent=cfg.label.toUpperCase();
    document.getElementById('rec-title').textContent=cfg.title;
    document.getElementById('rec-desc').textContent=cfg.desc;
    document.getElementById('rec-steps').innerHTML=cfg.steps.map((s,i)=>
      `<div class="rec-step"><span class="rec-step-n">0${i+1}</span><span>${s}</span></div>`).join('');
    setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
  },

  /* workflows */
  switchWf(id) {
    document.querySelectorAll('.wf-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.wf-body').forEach(b=>b.classList.remove('active'));
    document.getElementById('wftab-'+id)?.classList.add('active');
    document.getElementById('wfbody-'+id)?.classList.add('active');
  },

};

document.addEventListener('DOMContentLoaded', () => APP.init());

</script>
