<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Workflow Integration Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════ */
/* ── DARK THEME (default) ── */
:root {
  --bg:#0a0b0d;--bg1:#0f1114;--bg2:#141618;--bg3:#1a1d21;--bg4:#21252b;
  --line:rgba(255,255,255,0.07);--line2:rgba(255,255,255,0.12);--line3:rgba(255,255,255,0.22);
  --text:#e8e6e0;--text2:#9a9690;--text3:#5a5753;
  --shadow:rgba(0,0,0,.5);
  --noise-opacity:0.4;
  --serif:'DM Serif Display',Georgia,serif;--mono:'DM Mono',monospace;--sans:'Outfit',sans-serif;
  --topbar-h:44px;
  --sidebar-w:220px;
  --c-spec:#4a9eff;--c-spec-dim:rgba(74,158,255,.15);--c-tdd:#38bdf8;--c-tdd-dim:rgba(56,189,248,.15);
  --c-constraint:#63d3ff;--c-constraint-dim:rgba(99,211,255,.15);
  --c-big:#fb923c;--c-big-dim:rgba(251,146,60,.15);--c-std:#f472b6;--c-std-dim:rgba(244,114,182,.15);
  --c-rag:#fbbf24;--c-rag-dim:rgba(251,191,36,.15);--c-memory:#eab308;--c-memory-dim:rgba(234,179,8,.15);
  --c-agent:#a78bfa;--c-agent-dim:rgba(167,139,250,.15);--c-multi:#c084fc;--c-multi-dim:rgba(192,132,252,.15);
  --c-sim:#818cf8;--c-sim-dim:rgba(129,140,248,.15);
  --c-skill:#52d68a;--c-skill-dim:rgba(82,214,138,.15);--c-pipeline:#34d399;--c-pipeline-dim:rgba(52,211,153,.15);
  --c-micro:#22c55e;--c-micro-dim:rgba(34,197,94,.15);--c-hybrid:#10b981;--c-hybrid-dim:rgba(16,185,129,.15);
}

/* ── LIGHT THEME ── */
[data-theme="light"] {
  --bg:#f5f4f0;--bg1:#ffffff;--bg2:#f0eeea;--bg3:#e8e5df;--bg4:#dbd8d0;
  --line:rgba(0,0,0,0.08);--line2:rgba(0,0,0,0.14);--line3:rgba(0,0,0,0.24);
  --text:#1a1814;--text2:#5a564e;--text3:#9a9488;
  --shadow:rgba(0,0,0,.12);
  --noise-opacity:0.15;
  /* lighten approach dim backgrounds for readability on white */
  --c-spec-dim:rgba(74,158,255,.10);--c-tdd-dim:rgba(56,189,248,.10);
  --c-constraint-dim:rgba(99,211,255,.10);
  --c-big-dim:rgba(251,146,60,.10);--c-std-dim:rgba(244,114,182,.10);
  --c-rag-dim:rgba(251,191,36,.10);--c-memory-dim:rgba(234,179,8,.10);
  --c-agent-dim:rgba(167,139,250,.10);--c-multi-dim:rgba(192,132,252,.10);
  --c-sim-dim:rgba(129,140,248,.10);
  --c-skill-dim:rgba(82,214,138,.10);--c-pipeline-dim:rgba(52,211,153,.10);
  --c-micro-dim:rgba(34,197,94,.10);--c-hybrid-dim:rgba(16,185,129,.10);
}


/* ═══════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.6;
  height:100%;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  opacity:var(--noise-opacity);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* ═══════════════════════════════════════════════════════
   LAYOUT  —  topbar / sidebar / main grid
═══════════════════════════════════════════════════════ */

/* outer shell: topbar row + body row */
.shell{
  display:grid;
  grid-template-rows:var(--topbar-h) 1fr;
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-areas:
    "topbar topbar"
    "sidebar main";
  height:100vh;
  overflow:hidden;
  transition:grid-template-columns .28s cubic-bezier(.4,0,.2,1);
}
.shell.sidebar-hidden{
  grid-template-columns:0px 1fr;
}

/* ── TOPBAR ── */
.topbar{
  grid-area:topbar;
  display:flex;align-items:center;
  background:var(--bg1);
  border-bottom:1px solid var(--line);
  padding:0 16px;
  gap:10px;
  position:sticky;top:0;z-index:300;
  /* prevent topbar from collapsing with sidebar column */
  min-width:0;
}
.topbar-toggle{
  width:32px;height:32px;flex-shrink:0;
  background:var(--bg3);
  border:1px solid var(--line2);
  border-radius:8px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s,color .15s;
  color:var(--text2);
  font-size:15px;
  user-select:none;
}
.topbar-toggle:hover{background:var(--bg4);color:var(--text);border-color:var(--line3)}

.topbar-title{
  font-family:var(--serif);
  font-size:14px;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
  min-width:0;
}
.topbar-title em{font-style:italic;color:var(--text2)}

.topbar-right{
  display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;
}
/* theme toggle */
.theme-toggle{
  width:32px;height:32px;
  background:var(--bg3);
  border:1px solid var(--line2);
  border-radius:8px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s,color .15s;
  color:var(--text2);
  font-size:14px;
  user-select:none;
  flex-shrink:0;
}
.theme-toggle:hover{background:var(--bg4);color:var(--text);border-color:var(--line3)}

/* ── SIDEBAR ── */
aside{
  grid-area:sidebar;
  background:var(--bg1);
  border-right:1px solid var(--line);
  /* height = viewport minus topbar */
  height:calc(100vh - var(--topbar-h));
  position:sticky;
  top:var(--topbar-h);
  overflow:hidden;
  display:flex;flex-direction:column;
  z-index:200;
  width:var(--sidebar-w);
  transition:transform .28s cubic-bezier(.4,0,.2,1),
             box-shadow .28s ease,
             visibility .28s;
}
.shell.sidebar-hidden aside{
  transform:translateX(-100%);
  box-shadow:none;
  visibility:hidden;
}

/* ── MAIN ── */
main{
  grid-area:main;
  overflow-y:auto;
  min-width:0;
  height:100%;
}

section{display:none}
section.active{display:block}

/* ── sidebar backdrop (mobile only) ── */
.sidebar-backdrop{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.55);
  z-index:150;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  opacity:0;
  transition:opacity .28s ease;
  pointer-events:none;
}
.sidebar-backdrop.visible{opacity:1;pointer-events:auto;}

/* ─────────────────────────────────────────────────────
   SIDEBAR INNER ELEMENTS
───────────────────────────────────────────────────── */
.logo-block{padding:24px 20px 18px;border-bottom:1px solid var(--line)}
.logo-label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.logo-title{font-family:var(--serif);font-size:17px;line-height:1.25;color:var(--text)}
.logo-title em{font-style:italic;color:var(--text2)}
nav{padding:14px 0;flex:1;overflow-y:auto}
.nav-section{padding:0 20px;margin-bottom:4px}
.nav-section-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);padding:8px 0 5px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;
  cursor:pointer;transition:all .15s;color:var(--text2);font-size:13px;
  border:1px solid transparent;margin-bottom:1px;user-select:none;
}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--text);border-color:var(--line2);font-weight:500}
.nav-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:box-shadow .3s}
.nav-item.active .nav-dot{box-shadow:0 0 8px currentColor}
.nav-num{font-family:var(--mono);font-size:10px;color:var(--text3);margin-left:auto}
.sidebar-footer{
  padding:14px 20px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.8;flex-shrink:0;
}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE — MOBILE  (≤ 700px)
═══════════════════════════════════════════════════════ */
@media(max-width:700px){
  /* collapse to single content column; aside overlays as a drawer */
  .shell{grid-template-columns:1fr !important;grid-template-areas:"topbar" "main"}
  /* sidebar becomes a fixed-position drawer */
  aside{
    position:fixed;top:var(--topbar-h);left:0;
    height:calc(100vh - var(--topbar-h));
    transform:translateX(-100%);
    visibility:hidden;
    box-shadow:none;
  }
  .shell:not(.sidebar-hidden) aside{
    transform:translateX(0);
    visibility:visible;
    box-shadow:4px 0 32px var(--shadow);
  }
  .shell:not(.sidebar-hidden) .sidebar-backdrop{display:block}
  /* reduce content padding on mobile */
  .hero{padding:32px 20px 28px}
  .sec-header{padding:24px 20px 18px}
  .blocks-page,.principles-page,.framework-page{padding-left:16px;padding-right:16px}
  .wf-header,.wf-steps{padding-left:16px;padding-right:16px}
  .summary-table{margin-left:16px;margin-right:16px;width:calc(100% - 32px)}
  .map-section{padding:16px 16px 28px}
  .hero-title{font-size:30px}
  .detail-inner{padding:24px 20px}
  .detail-grid{grid-template-columns:1fr}
}

/* ═══════════════════════════════════════════════════════
   SHARED COMPONENTS
═══════════════════════════════════════════════════════ */
.hero{padding:60px 56px 48px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{
  content:'';position:absolute;top:-80px;right:-80px;width:400px;height:400px;
  background:radial-gradient(circle,rgba(74,158,255,.06) 0%,transparent 70%);
  pointer-events:none;
}
.hero-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:16px}
.hero-title{font-family:var(--serif);font-size:48px;line-height:1.1;margin-bottom:16px}
.hero-title em{font-style:italic;color:var(--text2)}
.hero-sub{font-size:15px;color:var(--text2);max-width:560px;line-height:1.7}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.hero-tag{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:4px;border:1px solid var(--line2);color:var(--text3);letter-spacing:.06em}

.sec-header{padding:40px 56px 32px;border-bottom:1px solid var(--line)}
.sec-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.sec-title{font-family:var(--serif);font-size:32px;line-height:1.2}
.sec-desc{font-size:14px;color:var(--text2);margin-top:8px;max-width:600px;line-height:1.7}

/* colour utility classes — 14 approaches, 4 groups */
.c-spec{color:var(--c-spec)}.bg-spec{background:var(--c-spec-dim)}.border-spec{border-color:rgba(74,158,255,.3)}.bar-spec{background:var(--c-spec)}
.c-tdd{color:var(--c-tdd)}.bg-tdd{background:var(--c-tdd-dim)}.border-tdd{border-color:rgba(56,189,248,.3)}.bar-tdd{background:var(--c-tdd)}
.c-constraint{color:var(--c-constraint)}.bg-constraint{background:var(--c-constraint-dim)}.border-constraint{border-color:rgba(99,211,255,.3)}.bar-constraint{background:var(--c-constraint)}
.c-big{color:var(--c-big)}.bg-big{background:var(--c-big-dim)}.border-big{border-color:rgba(251,146,60,.3)}.bar-big{background:var(--c-big)}
.c-std{color:var(--c-std)}.bg-std{background:var(--c-std-dim)}.border-std{border-color:rgba(244,114,182,.3)}.bar-std{background:var(--c-std)}
.c-rag{color:var(--c-rag)}.bg-rag{background:var(--c-rag-dim)}.border-rag{border-color:rgba(251,191,36,.3)}.bar-rag{background:var(--c-rag)}
.c-memory{color:var(--c-memory)}.bg-memory{background:var(--c-memory-dim)}.border-memory{border-color:rgba(234,179,8,.3)}.bar-memory{background:var(--c-memory)}
.c-agent{color:var(--c-agent)}.bg-agent{background:var(--c-agent-dim)}.border-agent{border-color:rgba(167,139,250,.3)}.bar-agent{background:var(--c-agent)}
.c-multi{color:var(--c-multi)}.bg-multi{background:var(--c-multi-dim)}.border-multi{border-color:rgba(192,132,252,.3)}.bar-multi{background:var(--c-multi)}
.c-sim{color:var(--c-sim)}.bg-sim{background:var(--c-sim-dim)}.border-sim{border-color:rgba(129,140,248,.3)}.bar-sim{background:var(--c-sim)}
.c-skill{color:var(--c-skill)}.bg-skill{background:var(--c-skill-dim)}.border-skill{border-color:rgba(82,214,138,.3)}.bar-skill{background:var(--c-skill)}
.c-pipeline{color:var(--c-pipeline)}.bg-pipeline{background:var(--c-pipeline-dim)}.border-pipeline{border-color:rgba(52,211,153,.3)}.bar-pipeline{background:var(--c-pipeline)}
.c-micro{color:var(--c-micro)}.bg-micro{background:var(--c-micro-dim)}.border-micro{border-color:rgba(34,197,94,.3)}.bar-micro{background:var(--c-micro)}
.c-hybrid{color:var(--c-hybrid)}.bg-hybrid{background:var(--c-hybrid-dim)}.border-hybrid{border-color:rgba(16,185,129,.3)}.bar-hybrid{background:var(--c-hybrid)}
.approach-group{border-bottom:1px solid var(--line)}.approach-group:last-child{border-bottom:none}
.group-header{padding:20px 28px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.group-header-num{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;flex-shrink:0}
.group-header-name{font-family:var(--serif);font-size:18px;color:var(--text)}
.group-color-bar{display:flex;gap:5px;margin-left:auto;align-items:center}
.group-color-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.group-header-desc{font-size:12px;color:var(--text2);width:100%;padding-top:4px;line-height:1.5;margin-top:-4px}

/* ── light theme: surface & component overrides ── */
[data-theme="light"] .approach-card:hover,
[data-theme="light"] .approach-card.expanded    { background:var(--bg2) }
[data-theme="light"] .approach-detail           { background:var(--bg2) }
[data-theme="light"] .detail-inner              { background:var(--bg2) }
[data-theme="light"] .tbar-track                { background:var(--bg4) }
[data-theme="light"] .detail-note               { background:var(--bg3) }
[data-theme="light"] .block-card                { background:var(--bg1);border-color:var(--line) }
[data-theme="light"] .block-card:hover          { background:var(--bg2);border-color:var(--line2) }
[data-theme="light"] .q-card                    { background:var(--bg1) }
[data-theme="light"] .q-opt                     { background:var(--bg2) }
[data-theme="light"] .step-tool                 { background:var(--bg2) }
[data-theme="light"] .matrix-cell.cell-hi       { background:rgba(74,158,255,.22) }
[data-theme="light"] .matrix-cell.cell-mid      { background:rgba(74,158,255,.10) }
[data-theme="light"] .matrix-cell.cell-lo       { background:var(--bg3);color:var(--text3) }
[data-theme="light"] .matrix-col-head           { background:var(--bg2) }
[data-theme="light"] .fit-pill                  { background:var(--bg3);border-color:var(--line2) }
[data-theme="light"] .hero::after               { background:radial-gradient(circle,rgba(74,158,255,.04) 0%,transparent 70%) }
[data-theme="light"] .summary-table th          { background:var(--bg2) }
[data-theme="light"] .summary-table tr:hover td { background:var(--bg2) }
[data-theme="light"] .wf-tab.active             { background:var(--bg2) }
[data-theme="light"] .wf-tab:hover              { background:var(--bg2) }
[data-theme="light"] aside                      { box-shadow:2px 0 12px rgba(0,0,0,.06) }

/* ═══════════════════════════════════════════════════════
   OVERVIEW
═══════════════════════════════════════════════════════ */
.overview-page{padding-bottom:48px}
.overview-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}
.overview-cell{padding:28px 28px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.overview-cell:nth-child(3n){border-right:none}
.overview-cell-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.overview-cell-val{font-family:var(--serif);font-size:22px;color:var(--text);margin-bottom:4px}
.overview-cell-sub{font-size:12px;color:var(--text2);line-height:1.55}

.summary-table{border-collapse:collapse;font-size:12px;margin:28px 56px 0;width:calc(100% - 112px)}
.summary-table th{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
  background:var(--bg2);font-weight:400;
}
.summary-table td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--text2);vertical-align:top}
.summary-table tr:hover td{background:var(--bg2)}
.summary-table td:first-child{color:var(--text);font-weight:500}
.dot-badge{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.fit-pills{display:flex;flex-wrap:wrap;gap:4px}
.fit-pill{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;background:var(--bg3);border:1px solid var(--line);color:var(--text3)}

.map-section{padding:28px 56px 40px;border-top:1px solid var(--line)}
.map-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:20px}
.matrix-grid{display:grid;grid-template-columns:80px repeat(5,1fr);gap:2px;font-size:11px;max-width:700px}
.matrix-corner{background:transparent}
.matrix-col-head{font-family:var(--mono);font-size:9px;color:var(--text3);text-align:center;padding:6px 4px;background:var(--bg2);border-radius:4px;letter-spacing:.04em;line-height:1.3}
.matrix-row-head{font-family:var(--mono);font-size:9px;color:var(--text3);display:flex;align-items:center;padding:0 4px;line-height:1.3}
.matrix-cell{height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--text);font-weight:500;transition:opacity .2s}
.matrix-cell:hover{opacity:.7}
.cell-hi{background:rgba(74,158,255,.35)}
.cell-mid{background:rgba(74,158,255,.15)}
.cell-lo{background:var(--bg3);color:var(--text3)}

/* ═══════════════════════════════════════════════════════
   APPROACHES
═══════════════════════════════════════════════════════ */
.approach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.approach-card{
  padding:28px 28px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .2s;position:relative;overflow:hidden;
}
.approach-card:nth-child(3n){border-right:none}
.approach-card:nth-last-child(-n+3){border-bottom:none}
.approach-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .3s}
.approach-card:hover,.approach-card.expanded{background:var(--bg2)}
.approach-card:hover::before,.approach-card.expanded::before{opacity:1}
.card-index{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--text3);margin-bottom:14px;text-transform:uppercase}
.card-badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;margin-bottom:12px;border:1px solid}
.card-name{font-family:var(--serif);font-size:20px;line-height:1.2;margin-bottom:8px}
.card-tagline{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.card-pills{display:flex;flex-wrap:wrap;gap:5px}
.cpill{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:3px;border:1px solid var(--line2);color:var(--text3);letter-spacing:.04em}
.card-expand-hint{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:14px;letter-spacing:.04em}

.approach-detail{display:none;grid-column:1/-1;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2);animation:slideDown .25s ease}
.approach-detail.visible{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.detail-inner{padding:32px 56px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;margin-bottom:24px}
.detail-col-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.detail-list{list-style:none}
.detail-list li{font-size:13px;color:var(--text2);padding:4px 0;display:flex;gap:8px;align-items:baseline}
.detail-list li::before{content:'–';color:var(--text3);flex-shrink:0;font-family:var(--mono)}
.tradeoff-section{margin-top:20px}
.tradeoff-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.tradeoff-lbl{font-family:var(--mono);font-size:10px;color:var(--text3);width:130px;flex-shrink:0;letter-spacing:.04em}
.tbar-track{flex:1;height:3px;background:var(--bg4);border-radius:2px;overflow:hidden}
.tbar-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.tbar-val{font-family:var(--mono);font-size:10px;color:var(--text3);width:28px;text-align:right}
.detail-note{margin-top:20px;padding:14px 18px;background:var(--bg3);border-radius:8px;border-left:2px solid;font-size:13px;color:var(--text2);line-height:1.6}
.detail-note strong{color:var(--text);font-weight:500}

/* ═══════════════════════════════════════════════════════
   BUILDING BLOCKS
═══════════════════════════════════════════════════════ */
.blocks-page{padding:0 56px 48px}
.blocks-section-title{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);padding:28px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.blocks-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.block-card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;transition:all .2s;cursor:default}
.block-card:hover{border-color:var(--line2);background:var(--bg3);transform:translateY(-1px)}
.block-icon{font-size:18px;margin-bottom:10px;opacity:.8}
.block-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.block-desc{font-size:12px;color:var(--text2);line-height:1.55}
.block-used{margin-top:10px;font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.04em}

/* ═══════════════════════════════════════════════════════
   PRINCIPLES
═══════════════════════════════════════════════════════ */
.principles-page{padding:0 56px 48px}
.principle-item{display:grid;grid-template-columns:64px 1fr;gap:0;border-bottom:1px solid var(--line);padding:28px 0;transition:background .2s}
.principle-item:hover{background:var(--bg2);margin:0 -56px;padding:28px 56px}
.principle-item:first-child{border-top:1px solid var(--line)}
.principle-num{font-family:var(--serif);font-size:36px;color:var(--text3);line-height:1;padding-top:3px;font-style:italic}
.principle-body h3{font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.3}
.principle-body p{font-size:13px;color:var(--text2);line-height:1.7;max-width:620px}
.principle-guideline{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--text3);border-left:2px solid var(--line2);padding-left:12px;line-height:1.6}

/* ═══════════════════════════════════════════════════════
   DECISION FRAMEWORK
═══════════════════════════════════════════════════════ */
.framework-page{padding:0 56px 56px}
.framework-intro{padding:28px 0 24px;font-size:13px;color:var(--text2);line-height:1.7;border-bottom:1px solid var(--line);max-width:600px}
.questions-col{padding:28px 0;display:flex;flex-direction:column;gap:12px}
.q-card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:20px 22px;transition:border-color .2s}
.q-card.answered{border-color:var(--line2)}
.q-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.q-text{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px}
.q-sub{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5}
.q-options{display:flex;gap:8px;flex-wrap:wrap}
.q-opt{font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid var(--line2);cursor:pointer;color:var(--text2);transition:all .15s;background:var(--bg3);font-family:var(--sans)}
.q-opt:hover{border-color:var(--line3);color:var(--text)}
.q-opt.selected{color:var(--text);font-weight:500;border-color:transparent}
.rec-panel{margin-top:28px;border-radius:12px;padding:28px;display:none;animation:fadeIn .4s ease;border:1px solid}
.rec-panel.visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rec-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.rec-title{font-family:var(--serif);font-size:26px;margin-bottom:10px}
.rec-desc{font-size:13px;line-height:1.7;margin-bottom:16px}
.rec-steps{display:flex;flex-direction:column;gap:6px}
.rec-step{display:flex;gap:10px;align-items:baseline;font-size:12px;font-family:var(--mono)}
.rec-step-n{color:var(--text3);flex-shrink:0}

/* ═══════════════════════════════════════════════════════
   WORKFLOWS
═══════════════════════════════════════════════════════ */
.workflows-page{padding:0}
.wf-picker{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.wf-tab{padding:18px 16px;cursor:pointer;border-right:1px solid var(--line);transition:background .15s;position:relative}
.wf-tab:last-child{border-right:none}
.wf-tab:hover,.wf-tab.active{background:var(--bg2)}
.wf-tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.wf-tab-num{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;margin-bottom:5px}
.wf-tab-name{font-size:12px;font-weight:500;color:var(--text2);line-height:1.3}
.wf-tab.active .wf-tab-name{color:var(--text)}
.wf-badge-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.wf-badge{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:3px;border:1px solid;letter-spacing:.04em}
.wf-body{display:none}
.wf-body.active{display:block}
.wf-header{padding:32px 56px 24px;border-bottom:1px solid var(--line)}
.wf-title{font-family:var(--serif);font-size:28px;margin-bottom:6px}
.wf-meta{font-size:13px;color:var(--text2)}
.wf-meta span{color:var(--text3);margin:0 6px}
.wf-steps{padding:0 56px 48px}
.step-row{display:grid;grid-template-columns:40px 1fr;gap:0;position:relative}
.step-spine{display:flex;flex-direction:column;align-items:center;padding-top:30px}
.step-dot-outer{width:12px;height:12px;border-radius:50%;border:2px solid;background:var(--bg);z-index:1;flex-shrink:0;transition:box-shadow .3s}
.step-row:hover .step-dot-outer{box-shadow:0 0 10px currentColor}
.step-line-seg{flex:1;width:1px;background:var(--line2);margin:4px 0}
.step-row:last-child .step-line-seg{display:none}
.step-content{padding:24px 0 24px 18px;border-bottom:1px solid var(--line)}
.step-row:last-child .step-content{border-bottom:none}
.step-meta{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.step-phase{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.step-type-badge{font-family:var(--mono);font-size:8px;padding:2px 7px;border-radius:3px;border:1px solid;letter-spacing:.06em}
.step-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.step-desc{font-size:13px;color:var(--text2);line-height:1.65;max-width:640px}
.step-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.step-tool{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:4px;background:var(--bg3);border:1px solid var(--line);color:var(--text3)}
/* ═══════════════════════════════════════════════════════
   SEARCH & FILTER BAR
═══════════════════════════════════════════════════════ */
.search-bar{
  position:sticky;top:0;z-index:250;
  background:var(--bg1);border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.search-wrap{
  position:relative;display:flex;align-items:center;flex:1;min-width:180px;
}
.search-input{
  width:100%;padding:7px 32px 7px 34px;
  background:var(--bg3);border:1px solid var(--line2);border-radius:8px;
  color:var(--text);font-family:var(--sans);font-size:13px;outline:none;
  transition:border-color .15s,background .15s;
}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--line3);background:var(--bg2)}
.search-icon{position:absolute;left:10px;color:var(--text3);font-size:13px;pointer-events:none}
.search-clear{
  position:absolute;right:8px;width:18px;height:18px;border-radius:50%;
  background:var(--bg4);border:none;cursor:pointer;color:var(--text2);
  font-size:11px;display:none;align-items:center;justify-content:center;
  transition:background .15s;line-height:1;
}
.search-clear.visible{display:flex}
.search-clear:hover{background:var(--text3);color:var(--text)}

.filter-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.filter-pill{
  font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:20px;
  border:1px solid var(--line2);cursor:pointer;color:var(--text2);
  background:transparent;transition:all .15s;white-space:nowrap;
}
.filter-pill:hover{border-color:var(--line3);color:var(--text)}
.filter-pill.active{color:var(--text);font-weight:500;border-color:transparent}

/* search highlight */
mark.sh{
  background:rgba(251,191,36,.35);color:inherit;border-radius:2px;
  padding:0 1px;
}
[data-theme="light"] mark.sh{background:rgba(234,179,8,.3)}

/* dimmed when search active but no match */
.search-dim{opacity:.28;transition:opacity .2s}

/* ═══════════════════════════════════════════════════════
   SCROLL-TO-TOP
═══════════════════════════════════════════════════════ */
.scroll-top{
  position:fixed;bottom:24px;right:24px;z-index:400;
  width:38px;height:38px;border-radius:50%;
  background:var(--bg3);border:1px solid var(--line2);
  cursor:pointer;color:var(--text2);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px var(--shadow);
  opacity:0;pointer-events:none;
  transition:opacity .25s,background .15s,border-color .15s;
}
.scroll-top.visible{opacity:1;pointer-events:auto}
.scroll-top:hover{background:var(--bg4);border-color:var(--line3);color:var(--text)}

/* ═══════════════════════════════════════════════════════
   MODAL / DIALOG
═══════════════════════════════════════════════════════ */
.modal-backdrop{
  position:fixed;inset:0;z-index:800;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.modal-backdrop.open{opacity:1;pointer-events:auto}
[data-theme="light"] .modal-backdrop{background:rgba(0,0,0,.35)}

.modal{
  background:var(--bg1);border:1px solid var(--line2);border-radius:14px;
  width:100%;max-width:760px;max-height:88vh;
  display:flex;flex-direction:column;
  transform:translateY(16px) scale(.98);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
  overflow:hidden;box-shadow:0 24px 64px var(--shadow);
}
.modal-backdrop.open .modal{transform:none}
.modal.maximized{max-width:100%;max-height:100%;border-radius:0;margin:0}
.modal-backdrop.open .modal.maximized{transform:none}

.modal-header{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0;
}
.modal-header-color{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.modal-header-title{font-family:var(--serif);font-size:20px;flex:1;min-width:0;line-height:1.25}
.modal-header-index{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.modal-controls{display:flex;gap:6px;flex-shrink:0}
.modal-btn{
  width:30px;height:30px;border-radius:7px;
  background:var(--bg3);border:1px solid var(--line2);
  cursor:pointer;color:var(--text2);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.modal-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--line3)}

.modal-body{
  overflow-y:auto;padding:24px 24px 28px;flex:1;
  scrollbar-width:thin;
}
.modal-section{margin-bottom:22px}
.modal-section:last-child{margin-bottom:0}
.modal-section-label{
  font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);
}
.modal-list{list-style:none}
.modal-list li{font-size:13px;color:var(--text2);padding:4px 0;display:flex;gap:8px;align-items:baseline}
.modal-list li::before{content:'–';color:var(--text3);font-family:var(--mono);flex-shrink:0}
.modal-tradeoffs{display:flex;flex-direction:column;gap:9px}
.modal-trow{display:flex;align-items:center;gap:12px}
.modal-tlbl{font-family:var(--mono);font-size:10px;color:var(--text3);width:140px;flex-shrink:0;letter-spacing:.04em}
.modal-ttrack{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.modal-tfill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.modal-tval{font-family:var(--mono);font-size:10px;width:28px;text-align:right}
.modal-note{margin-top:16px;padding:12px 16px;background:var(--bg2);border-radius:8px;border-left:3px solid;font-size:13px;color:var(--text2);line-height:1.6}
.modal-note strong{color:var(--text);font-weight:500}
.modal-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.modal-pill{font-family:var(--mono);font-size:9px;padding:3px 9px;border-radius:3px;border:1px solid var(--line2);color:var(--text3);letter-spacing:.04em}
.modal-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* block modal */
.block-modal-icon{font-size:32px;margin-bottom:12px}
.block-modal-used{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:12px;padding:8px 12px;background:var(--bg2);border-radius:6px}

/* ═══════════════════════════════════════════════════════
   ATTRIBUTION FOOTER
═══════════════════════════════════════════════════════ */
.attribution{
  padding:20px 56px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;color:var(--text3);
  line-height:1.8;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.attribution a{color:var(--text2);text-decoration:none;border-bottom:1px solid var(--line2)}
.attribution a:hover{color:var(--text);border-color:var(--line3)}
.attribution-badge{
  display:flex;align-items:center;gap:6px;
  background:var(--bg2);border:1px solid var(--line2);
  border-radius:6px;padding:4px 10px;
  font-size:10px;color:var(--text2);
}

/* ═══════════════════════════════════════════════════════
   SECTION ICONS  (in sec-header eyebrow area)
═══════════════════════════════════════════════════════ */
.sec-icon{font-size:20px;margin-bottom:6px;display:block;opacity:.75}

/* ═══════════════════════════════════════════════════════
   STICKY TABLE
═══════════════════════════════════════════════════════ */
.table-wrap{
  overflow-x:auto;margin:28px 56px 0;
  border:1px solid var(--line);border-radius:10px;
}
.table-wrap table{
  border-collapse:collapse;font-size:12px;width:100%;margin:0;
  border:none;
}
.table-wrap th{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);text-align:left;padding:8px 12px;
  background:var(--bg2);font-weight:400;
  position:sticky;top:0;z-index:2;
  border-bottom:1px solid var(--line);
}
.table-wrap td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--text2);vertical-align:top}
.table-wrap tr:last-child td{border-bottom:none}
.table-wrap tr:hover td{background:var(--bg2)}
/* sticky first column */
.table-wrap th:first-child,
.table-wrap td:first-child{
  position:sticky;left:0;z-index:1;
  background:var(--bg1);
}
.table-wrap th:first-child{z-index:3;background:var(--bg2)}
.table-wrap tr:hover td:first-child{background:var(--bg2)}
[data-theme="light"] .table-wrap th:first-child{background:var(--bg2)}
[data-theme="light"] .table-wrap td:first-child{background:var(--bg1)}
[data-theme="light"] .table-wrap tr:hover td:first-child{background:var(--bg2)}

/* remove old summary-table margin (now inside table-wrap) */
.summary-table{border-collapse:collapse;font-size:12px;width:100%;margin:0}
.summary-table th{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
  background:var(--bg2);font-weight:400;
}
.summary-table td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--text2);vertical-align:top}
.summary-table tr:hover td{background:var(--bg2)}
.summary-table td:first-child{color:var(--text);font-weight:500}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE IMPROVEMENTS
═══════════════════════════════════════════════════════ */
/* approach cards: 3-col → 2-col → 1-col */
@media(max-width:960px){
  .approach-grid{grid-template-columns:repeat(2,1fr)}
  .approach-card:nth-child(2n){border-right:none}
  .approach-card:nth-child(3n){border-right:1px solid var(--line)}
  .blocks-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:640px){
  .approach-grid{grid-template-columns:1fr}
  .approach-card{border-right:none!important}
  .blocks-grid{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:1fr}
  .overview-grid{grid-template-columns:1fr}
  .overview-cell{border-right:none}
  .wf-picker{grid-template-columns:repeat(2,1fr);overflow:hidden}
  .wf-tab:nth-child(2n){border-right:none}
}
/* workflow tab picker: scrollable on narrow screens */
@media(max-width:860px){
  .wf-picker{
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
    border-bottom:1px solid var(--line);
  }
  .wf-picker::-webkit-scrollbar{display:none}
  .wf-tab{
    flex:0 0 auto;min-width:130px;border-right:1px solid var(--line);
    border-bottom:none;
  }
  .wf-tab.active::after{bottom:0;height:2px;top:auto;position:absolute}
}
/* attribution on mobile */
@media(max-width:640px){
  .attribution{padding:16px 20px}
  .table-wrap{margin:16px}
  .search-bar{top:var(--topbar-h)}
}

</style>
</head>
<body>
<!-- sidebar backdrop (mobile overlay) -->
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="APP.toggleSidebar()"></div>

<div class="shell sidebar-hidden" id="shell">

  <!-- ── TOPBAR (spans full width, always visible) ── -->
  <header class="topbar">
    <button class="topbar-toggle" id="topbar-toggle" onclick="APP.toggleSidebar()" aria-label="Toggle sidebar">&#9776;</button>
    <div class="topbar-title">AI Workflow <em>Integration Atlas</em></div>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-toggle" onclick="APP.toggleTheme()" aria-label="Toggle theme" title="Switch to light theme">&#9788;</button>
    </div>
  </header>

  <!-- ── SIDEBAR ── -->
  <aside id="sidebar"></aside>

  <!-- ── MAIN CONTENT ── -->
  <main id="main">
    <div id="sections"></div>
  </main>

</div>

<script>

/* ╔══════════════════════════════════════════════════════════════════
   ║  LAYER 1 — DATA
   ║  Pure content. No HTML, no DOM references, no logic.
   ║  To add/edit content, only touch this object.
   ╚════════════════════════════════════════════════════════════ */

  principles:[
    {num:'01',title:'Human in the Loop at Risk Boundaries',      body:'Every AI workflow has points where errors compound — before irreversible actions, before production deployment, before touching shared financial state. Mandate human checkpoints at these exact boundaries regardless of how autonomous the rest of the workflow is. The question is not whether to checkpoint, but where.',guideline:'In banking: any write to account state, any compliance-affecting output, any change to a regulatory calculation.'},
    {num:'02',title:'Match Context Scope to Task Cohesion',      body:'Use the smallest context that preserves the coherence the task actually needs. A bug fix needs one module, not the full codebase. Over-loading context wastes compute and dilutes attention; under-loading breaks coherence and produces subtly wrong outputs.',guideline:'If the AI cannot see the interfaces it is implementing against, the context is too small. If it takes more than 5 minutes to construct, it is probably too large.'},
    {num:'03',title:'Specs Before Prompts',                      body:'A well-written specification is the most powerful AI prompt you can write. Invest in formalising requirements — OpenAPI, ADRs, data contracts — before optimising prompts. Specs are durable and serve as eval criteria. Prompts are ephemeral and drift as models change.',guideline:'In banking: specs double as compliance artifacts. Writing a good OpenAPI spec produces both the AI’s instructions and your audit evidence simultaneously.'},
    {num:'04',title:'Build Skills Before Agents',                body:'Agentic autonomy amplifies whatever competencies the agent has. If the underlying skills are unreliable, an autonomous agent will fail faster and more expensively than a manual process. Validate each skill in isolation before composing them into agent pipelines. A pipeline is only as reliable as its weakest skill.',guideline:'Practical standard: run each skill with 20 representative test cases. If pass rate <85%, fix the skill before connecting it to other skills or agent loops.'},
    {num:'05',title:'Evals Are the Product',                     body:'Without a way to measure output quality, you are guessing. Build eval suites before or alongside every AI workflow. Evals tell you when a workflow degrades after a model update, when it is safe to reduce human oversight, and which approach to choose for a given task type. The eval suite is your most valuable artifact.',guideline:'Minimum viable eval: 10 golden examples with expected outputs + one automated scorer. Ship evals with every new workflow, not as an afterthought.'},
    {num:'06',title:'Log Everything, Replay Anything',           body:'Every AI action — inputs, tool calls, intermediate outputs, final output — should be captured in a structured trace. This enables debugging when autonomous runs go wrong, compliance audits when regulators ask, and root-cause analysis when outputs drift unexpectedly.',guideline:'In regulated systems: trace logs are non-optional. Design the log schema before the workflow schema — the log is primary, the workflow is secondary.'},
    {num:'07',title:'Start Narrow, Expand Deliberately',         body:'Do not design the full agentic pipeline on day one. Pick one high-value, lower-risk task, instrument it with evals and logs, learn from it for 4–6 weeks, then expand. The shape of your AI workflow should evolve with your empirical understanding of where AI excels in your specific domain.',guideline:'Good first targets: documentation generation, test suite writing, migration script generation, audit log summarisation. High value, low blast radius if wrong.'},
    {num:'08',title:'Treat Approach Selection as Architecture',  body:'Choosing between spec-driven, agentic, or context-driven is an architectural decision — not a prompt engineering decision. It determines cost structure, risk profile, team workflow, and system boundaries. Make the choice deliberately and document the rationale. Revisit it annually as models and tooling evolve.',guideline:'Anti-pattern: picking an approach because it is trendy. The decision must follow from your specific task’s coherence requirements and risk profile.'},
    {num:'09',title:'Simulations Are Evals — Build Them First',body:'In simulation-driven development, the simulation is not a nice-to-have — it is the primary quality gate. The agent’s iteration loop depends entirely on simulation fidelity. A low-fidelity simulation produces confident wrong code; a high-fidelity simulation catches errors before any human review. Invest in simulation quality before running agents against it.',guideline:'For banking: a synthetic loan portfolio + regulatory rule engine is your simulation. Build it once, reuse across every calculation engine agent run. Its value compounds with every use.'},
    {num:'10',title:'Memory Requires Active Curation',           body:'Memory-augmented agents compound value only when their memory store is accurate and current. Stale memories — referencing deprecated APIs, superseded decisions, or outdated conventions — actively degrade output quality. Memory curation must be a first-class team practice, not an afterthought.',guideline:'Practical: assign a memory review checkpoint at the end of every sprint. Treat a stale memory correction the same way you treat a bug fix in production code.'},
    {num:'11',title:'Autonomy Is a Dial, Not a Switch',          body:'The spectrum from micro-approval to multi-agent autonomous runs is not a binary choice between AI helps and AI does it. It is a continuous dial you set deliberately based on task risk, team AI maturity, and the quality of your evals and checkpoints. Increasing autonomy should be backed by evidence — specifically, evidence that your evals catch the errors the human was previously catching.',guideline:'Graduation path: Micro-Approval → Std Context + human review → Agentic with checkpoints → Multi-Agent with review agent → Autonomous with eval gating. Move right only when the previous stage is stable.'},
  ],

  framework:{
    intro:'The six questions below are ordered by impact — requirement clarity is the single biggest predictor of approach fit. Answer all six for the most precise recommendation. The framework handles mixed signals by reasoning across the full answer profile.',
    questions:[
      {id:1,suffix:'Most decisive',text:'How well-defined are the requirements?',       sub:'The strongest single predictor of which approach will succeed.',                                    options:[{value:'formal',label:'Formal spec exists (OpenAPI, PRD, data contract)'},{value:'partial',label:'Partially defined, will evolve'},{value:'open',label:'Open-ended / exploratory'}]},
      {id:2,suffix:'',            text:'How large is the codebase involved?',           sub:'Determines whether a context window can hold the relevant code.',                                  options:[{value:'small',label:'Small (<50k tokens — fits comfortably)'},{value:'medium',label:'Medium (50k–500k — needs selective loading)'},{value:'large',label:'Large (>500k — requires RAG or tight scope)'}]},
      {id:3,suffix:'',            text:'How frequently do requirements change?',        sub:'Determines the cost of re-running agents or regenerating from scratch.',                          options:[{value:'stable',label:'Stable — months between changes'},{value:'moderate',label:'Moderate — weekly changes expected'},{value:'frequent',label:'Frequent — daily or continuous changes'}]},
      {id:4,suffix:'',            text:'What is the risk profile of errors?',           sub:'High-risk domains need more human oversight engineered into the workflow.',                        options:[{value:'high',label:'High — financial data, compliance, production'},{value:'medium',label:'Medium — internal tools, staging environments'},{value:'low',label:'Low — docs, scripts, non-critical automation'}]},
      {id:5,suffix:'',            text:'Does this task recur across projects?',         sub:'Recurring tasks justify the upfront investment of building a reusable, tested skill.',            options:[{value:'yes',label:'Yes — similar tasks appear across projects or teams'},{value:'no',label:'No — one-off or rarely recurring'}]},
      {id:6,suffix:'New',         text:'Does the task parallelise across workstreams?', sub:'Independent parallel tracks are the key signal for multi-agent over standard context.',          options:[{value:'yes',label:'Yes — clearly separable parallel workstreams'},{value:'no',label:'No — sequential or tightly interdependent'}]},
    ],
    rules:[
      {when:a=>a.q4==='high'  &&a.q1==='formal'&&a.q2==='small',            result:'constraint'},
      {when:a=>a.q1==='formal'&&a.q4==='high',                               result:'spec'},
      {when:a=>a.q1==='formal'&&a.q5==='yes'  &&a.q3!=='frequent',           result:'tdd'},
      {when:a=>a.q6==='yes'   &&a.q2!=='small'&&a.q4!=='high',               result:'multi'},
      {when:a=>a.q5==='yes'   &&a.q3==='frequent',                           result:'skill'},
      {when:a=>a.q5==='yes'   &&a.q3!=='frequent'&&a.q1==='partial',         result:'memory'},
      {when:a=>a.q1==='formal'&&a.q4==='medium'&&a.q3==='stable',            result:'sim'},
      {when:a=>a.q1==='open'  &&a.q4==='low',                                result:'micro'},
      {when:a=>a.q1==='open'  &&a.q4!=='high',                               result:'agent'},
      {when:a=>a.q2==='large' &&a.q3==='stable',                             result:'rag'},
      {when:a=>a.q2==='small' &&a.q3==='stable',                             result:'big'},
      {when:a=>a.q2==='large' ||a.q3==='frequent',                           result:'std'},
      {when:a=>a.q1==='formal'&&a.q5==='yes',                                result:'pipeline'},
      {when:a=>a.q1==='formal',                                               result:'spec'},
      {when:a=>a.q5==='yes',                                                  result:'skill'},
      {when:()=>true,                                                         result:'hybrid'},
    ],
    recommendations:{
      spec:      {color:'var(--c-spec-dim)',       border:'rgba(74,158,255,.3)',  label:'Recommended',title:'Spec-Driven Development',            desc:'Your formal spec and high risk profile are the ideal match. Let the spec serve as ground truth — AI generates from it, humans validate against it. Every output is traceable to a requirement, making compliance straightforward.',steps:['Finalise the formal spec before any code generation','Run AI generation strictly against spec assertions','Validate every output against spec — reject divergences','Use spec as eval criteria and compliance artifact simultaneously']},
      tdd:       {color:'var(--c-tdd-dim)',        border:'rgba(56,189,248,.3)',  label:'Recommended',title:'Test-Driven AI Development',          desc:'You have formal requirements, the task recurs, and changes are infrequent — an ideal TDAD scenario. Write the failing test suite first, then let the AI drive to green. The feedback loop is fully automated.',steps:['Write comprehensive failing tests before any implementation','Run AI generation targeting test passage only','Gate merges on all tests green — no exceptions','Evolve tests alongside requirements; implementation follows']},
      constraint:{color:'var(--c-constraint-dim)',border:'rgba(99,211,255,.3)',  label:'Recommended',title:'Constraint-Driven Development',       desc:'Your task involves logic that must be provably correct. The codebase is small and the risk is high. Formal constraint satisfaction is the right frame. Highest setup cost, highest assurance.',steps:['Define formal constraints: types, invariants, or logic specs','Select a constraint tool: SMT solver, theorem prover, or type checker','Run AI generation against constraint satisfaction','Treat constraint violations as hard blockers, not warnings']},
      multi:     {color:'var(--c-multi-dim)',      border:'rgba(192,132,252,.3)', label:'Recommended',title:'Multi-Agent Collaborative Development',desc:'Your task has clearly separable parallel workstreams and the risk is manageable. Multi-agent topology maximises throughput by running specialist agents concurrently. Invest in the coordinator infrastructure before the agents.',steps:['Map the task into independent parallel workstreams','Assign specialist roles: planner, coder(s), reviewer, tester, documenter','Build the coordinator before the agents — it is the hardest part','Gate on review-agent approval before the human sees any output']},
      skill:     {color:'var(--c-skill-dim)',      border:'rgba(82,214,138,.3)',  label:'Recommended',title:'Skill-Driven Development',            desc:'Recurring tasks + frequent changes = invest in a skill library. Each skill is tested once, reused many times. Changes trigger targeted re-runs, not full rebuilds. Your skill registry will be one of the highest-value AI assets your team owns.',steps:['Identify the 3–5 tasks that recur most across projects','Build and test each as a versioned, independent skill','Compose skills into lightweight pipelines for complex tasks','Grow the registry deliberately — one skill per sprint']},
      memory:    {color:'var(--c-memory-dim)',     border:'rgba(234,179,8,.3)',   label:'Recommended',title:'Memory-Augmented Development',        desc:'This task recurs and requirements evolve gradually — the ideal memory-augmented scenario. The agent improves with each session as it learns your codebase conventions, domain rules, and architectural decisions. Invest in memory curation from day one.',steps:['Start the agent running with basic memory enabled','Review and prune memories at the end of each sprint','Build a memory schema: decisions, conventions, domain rules, ADRs','Measure cold-start vs warm-start quality to quantify compound value']},
      sim:       {color:'var(--c-sim-dim)',        border:'rgba(129,140,248,.3)', label:'Recommended',title:'Simulation-Driven Development',       desc:'Your requirements are formal, the risk is medium, and requirements are stable — a strong simulation-driven candidate. Build the simulation first, then let agents iterate against it. Human review happens once, after simulation convergence.',steps:['Build or identify your simulation environment first (sandbox, digital twin, mock infra)','Define convergence criteria: what does simulation passed mean?','Run agent autonomously until convergence criteria are met','Human reviews only after simulation confirms correctness']},
      micro:     {color:'var(--c-micro-dim)',      border:'rgba(34,197,94,.3)',   label:'Recommended',title:'Micro-Approval Development',          desc:'Low-risk, open-ended tasks with a developer in the loop. Let AI suggest; you decide each step. Builds AI fluency without surrendering control. The best entry point for teams new to AI-assisted development.',steps:['Use Cursor, Copilot, or similar inline suggestion tool','Accept/reject at the function or block level','Let acceptance history calibrate AI’s subsequent suggestions','Graduate to higher autonomy as trust builds with evidence']},
      agent:     {color:'var(--c-agent-dim)',      border:'rgba(167,139,250,.3)', label:'Recommended',title:'Agentic-Driven Development',          desc:'Open-ended requirements with manageable risk and a sequential task structure. Define the goal and acceptance criteria clearly, review the decomposition plan, then let it execute with defined human checkpoints.',steps:['Define the goal with acceptance criteria, not implementation steps','Review agent task decomposition before execution begins','Gate every irreversible action behind a human checkpoint','Validate output against acceptance criteria, not implementation details']},
      rag:       {color:'var(--c-rag-dim)',        border:'rgba(251,191,36,.3)',  label:'Recommended',title:'RAG-Native Development',              desc:'Your codebase is large and requirements are stable — the classic RAG scenario. Index your codebase, docs, and institutional knowledge. Let the AI retrieve only what it needs per step. No context ceiling, no rebuild cost on change.',steps:['Build and index your knowledge base (code, docs, runbooks, ADRs)','Invest in retrieval quality — precision matters more than recall','Instrument retrieval to understand what the AI actually uses','Grow the index as institutional knowledge accumulates']},
      big:       {color:'var(--c-big-dim)',        border:'rgba(251,146,60,.3)',  label:'Recommended',title:'Big Context-Driven Development',      desc:'Small codebase + stable requirements justifies the compute cost of a full-context run. A single comprehensive pass produces higher internal coherence than any incremental approach.',steps:['Load full codebase + complete requirements into context','Run agent autonomously (plan for hours to days)','Review a single comprehensive PR with full coherence','Establish a requirements freeze window to minimise rebuild triggers']},
      std:       {color:'var(--c-std-dim)',        border:'rgba(244,114,182,.3)', label:'Recommended',title:'Standard Context-Driven Development',  desc:'Large codebase or frequent changes are the clearest signals for scoped, incremental agent runs. Each run produces one focused PR. Changes trigger only the passes that need extending, not full rebuilds.',steps:['Define scope boundaries before each agent run (module or feature)','Each run produces one focused, reviewable PR','On change: identify which scopes need extension — run only those','Invest in RAG or summaries for cross-run state handoff']},
      pipeline:  {color:'var(--c-pipeline-dim)',  border:'rgba(52,211,153,.3)',  label:'Recommended',title:'Pipeline / Prompt-Chained Development', desc:'You have formal, recurring requirements and the task is a well-understood multi-step process. A deterministic pipeline is more auditable and debuggable than an agent, and faster to build than a full skill library for complex multi-step work.',steps:['Map the task into a fixed DAG of prompt steps','Define input/output schemas for each step precisely','Build the pipeline with full logging — every step independently replayable','Add branching logic explicitly; never let the pipeline decide it implicitly']},
      hybrid:    {color:'var(--c-hybrid-dim)',    border:'rgba(16,185,129,.3)',  label:'Recommended',title:'Hybrid / Orchestrated Development',    desc:'Mixed signals mean no single approach dominates all your task types — the defining signal for a hybrid strategy. Route by task: spec-driven for compliance, agentic for exploration, skills for recurrence, pipeline for auditable multi-step work.',steps:['Map your task portfolio by risk, recurrence, and requirement clarity','Assign each task type to its best-fit approach','Build a skill library first — the shared primitive across all approaches','Graduate to an orchestrated hybrid pipeline as AI maturity compounds']},
    },
  },
