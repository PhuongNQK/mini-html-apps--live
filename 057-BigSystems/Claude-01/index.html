{id:'circuit-breaker',name:{en:'Circuit Breaker',vi:'Cầu dao Tự động (Circuit Breaker)'},category:'resilience',complexity:'O(1)',
origin:{en:'Michael Nygard\'s "Release It!" (2007) — named after the electrical circuit breaker that cuts power when a circuit overloads, preventing damage to the broader system.',vi:'Michael Nygard\'s "Release It!" (2007) — đặt tên theo cầu dao điện tự động cắt điện khi mạch quá tải, ngăn hư hại cho hệ thống rộng hơn.'},
what:{en:'Wrap remote calls in a state machine with three states: Closed (normal, requests pass through), Open (too many failures detected, requests fail fast without hitting the downstream service), Half-Open (probe state, a few requests allowed through to test if the downstream has recovered). The breaker trips to Open when the failure rate exceeds a threshold.',vi:'Bọc các cuộc gọi từ xa trong một máy trạng thái với ba trạng thái: Closed (bình thường, request đi qua), Open (phát hiện quá nhiều lỗi, request thất bại nhanh mà không chạm vào service downstream), Half-Open (trạng thái thăm dò, một vài request được phép đi qua để kiểm tra xem downstream đã phục hồi chưa). Cầu dao chuyển sang Open khi tỷ lệ lỗi vượt ngưỡng.'},
when:{en:'Any service-to-service call where a failing downstream service could cause the upstream to also fail (cascading failure). Use especially for: external payment gateway calls, credit bureau calls, notification service calls from a core banking system.',vi:'Bất kỳ cuộc gọi service-to-service nào mà service downstream lỗi có thể khiến upstream cũng lỗi (lỗi dây chuyền). Sử dụng đặc biệt cho: cuộc gọi payment gateway bên ngoài, cuộc gọi cục tín dụng, cuộc gọi notification service từ hệ thống core banking.'},
pros:{en:'Prevents cascading failures — a slow downstream service cannot overwhelm an upstream service with waiting threads. Fails fast (immediate error) instead of slow fail (timeout after 30 seconds), improving UX and freeing resources.',vi:'Ngăn lỗi dây chuyền — service downstream chậm không thể áp đảo service upstream với các luồng đang chờ. Thất bại nhanh (lỗi ngay lập tức) thay vì thất bại chậm (timeout sau 30 giây), cải thiện UX và giải phóng tài nguyên.'},
cons:{en:'Requires tuning of failure threshold and recovery probe interval — too sensitive and it trips on transient errors; too tolerant and it fails to prevent cascades. The Half-Open state must be carefully designed to prevent a recovering service from being overwhelmed by the first flood of requests.',vi:'Đòi hỏi điều chỉnh ngưỡng lỗi và khoảng thời gian thăm dò phục hồi — quá nhạy cảm và nó chuyển đổi theo lỗi thoáng qua; quá khoan nhượng và nó thất bại trong việc ngăn cascade. Trạng thái Half-Open phải được thiết kế cẩn thận để ngăn service đang phục hồi bị áp đảo bởi làn sóng request đầu tiên.'},
risk:{en:'A circuit breaker that is Open without anyone noticing is a silent risk — the service is returning cached or fallback responses, and the underlying issue may have been forgotten. Circuit breaker state (open/closed/half-open) and transition events MUST be monitored, alerted on, and reviewed in post-incident analysis. For a debt management system: if the circuit breaker to the credit bureau is open, loan application decisions may be made on stale credit data — this must be logged, flagged for review, and have a defined maximum acceptable window before the operation must be halted.',vi:'Cầu dao đang Open mà không ai chú ý là rủi ro thầm lặng — service đang trả về phản hồi cache hoặc dự phòng, và vấn đề cơ bản có thể đã bị lãng quên. Trạng thái cầu dao (open/closed/half-open) và các sự kiện chuyển đổi PHẢI được giám sát, cảnh báo, và xem xét trong phân tích sau sự cố. Cho hệ thống quản lý nợ: nếu cầu dao đến cục tín dụng đang open, quyết định đơn đăng ký khoản vay có thể được đưa ra trên dữ liệu tín dụng lỗi thời — điều này phải được ghi nhật ký, đánh dấu để xem xét, và có cửa sổ tối đa chấp nhận được được xác định trước khi thao tác phải bị tạm dừng.'},
diagram:`stateDiagram-v2
    [*] --> Closed
    Closed --> Open: failure_rate > threshold
    Open --> HalfOpen: timeout elapsed
    HalfOpen --> Closed: probe request succeeds
    HalfOpen --> Open: probe request fails`,
related_bigs:['netflix','alibaba','cme-globex']},

{id:'bulkhead',name:{en:'Bulkhead Pattern',vi:'Pattern Vách ngăn (Bulkhead)'},category:'resilience',complexity:'O(1)',
origin:{en:'Named after the watertight compartments in a ship\'s hull — if one compartment floods, the others remain sealed and the ship stays afloat. Applied to software by Michael Nygard in "Release It!" (2007).',vi:'Đặt tên theo các khoang kín nước trong thân tàu — nếu một khoang bị ngập nước, các khoang khác vẫn được niêm phong và con tàu vẫn nổi. Áp dụng cho phần mềm bởi Michael Nygard trong "Release It!" (2007).'},
what:{en:'Isolate components of a system into pools/compartments so that if one fails or becomes overwhelmed, the others are not affected. Common implementations: separate thread pools per downstream dependency (so a slow dependency exhausts only its own thread pool, not the entire service\'s), separate database connection pools per tenant, separate circuit breakers per downstream.',vi:'Cô lập các thành phần của một hệ thống vào các pool/khoang sao cho nếu một thành phần lỗi hoặc bị quá tải, các thành phần khác không bị ảnh hưởng. Các triển khai phổ biến: pool luồng riêng biệt cho mỗi dependency downstream (để dependency chậm chỉ làm cạn kiệt pool luồng của chính nó, không phải toàn bộ luồng của service), pool kết nối database riêng biệt cho mỗi tenant, cầu dao riêng biệt cho mỗi downstream.'},
when:{en:'Any service that has multiple independent downstream dependencies — isolate thread/connection pools so a failure in one dependency path cannot exhaust shared resources and take down the entire service.',vi:'Bất kỳ service nào có nhiều dependency downstream độc lập — cô lập pool luồng/kết nối để lỗi trong một đường dẫn dependency không thể cạn kiệt tài nguyên chung và làm sập toàn bộ service.'},
pros:{en:'Contains blast radius — a downstream failure or surge impacts only the bulkhead for that downstream, not the entire service. Enables graceful partial degradation rather than total failure.',vi:'Giới hạn blast radius — lỗi downstream hoặc đột biến chỉ ảnh hưởng đến bulkhead cho downstream đó, không phải toàn bộ service. Cho phép suy giảm một phần nhẹ nhàng thay vì lỗi toàn bộ.'},
cons:{en:'Requires explicit resource partitioning — more complex configuration, more resources consumed overall. Over-bulkheading can lead to under-utilization of resources (thread pools sitting idle in one bulkhead while another is saturated).',vi:'Đòi hỏi phân vùng tài nguyên tường minh — cấu hình phức tạp hơn, tiêu thụ tài nguyên tổng thể nhiều hơn. Bulkhead quá mức có thể dẫn đến sử dụng không hiệu quả tài nguyên (pool luồng nhàn rỗi trong một bulkhead trong khi bulkhead khác bão hòa).'},
risk:{en:'Tencent WeChat\'s isolation of the payment system from the messaging system is the large-scale proof of this pattern: a messaging incident cannot cascade into a payment incident. For a debt management system: the connection pool to the core banking system, the connection pool to the credit bureau, and the connection pool to the NAPAS payment rail should be separate bulkheads — a credit bureau outage should not exhaust connections to the core banking system.',vi:'Tencent WeChat cô lập hệ thống thanh toán khỏi hệ thống nhắn tin là bằng chứng quy mô lớn của pattern này: sự cố nhắn tin không thể lan thành sự cố thanh toán. Cho hệ thống quản lý nợ: pool kết nối đến hệ thống core banking, pool kết nối đến cục tín dụng, và pool kết nối đến hệ thống thanh toán NAPAS nên là các bulkhead riêng biệt — sự cố cục tín dụng không nên làm cạn kiệt kết nối đến hệ thống core banking.'},
diagram:`flowchart LR
    Service[Debt Management Service]
    subgraph Bulkheads
      B1[Thread Pool: Core Banking - 20 threads]
      B2[Thread Pool: Credit Bureau - 10 threads]
      B3[Thread Pool: NAPAS Rail - 15 threads]
    end
    Service-->B1 & B2 & B3
    B2-->|"Outage: exhausts only B2"|B2`,
related_bigs:['netflix','tencent','amazon-aws']},

{id:'graceful-degradation',name:{en:'Graceful Degradation',vi:'Suy giảm Nhẹ nhàng'},category:'resilience',complexity:'Design-time O(1)',
origin:{en:'Fault-tolerant computing principle predating distributed systems, extended to web-scale systems by Netflix (Chaos Engineering) and payment networks (offline authorization).',vi:'Nguyên tắc tính toán chịu lỗi có trước hệ thống phân tán, được mở rộng sang hệ thống web-scale bởi Netflix (Chaos Engineering) và mạng thanh toán (xác thực ngoại tuyến).'},
what:{en:'Design systems to continue operating at reduced functionality when a component fails, rather than failing completely. The system degrades to a predefined, lesser capability state rather than producing errors. Examples: serving cached results when the origin is down, approving low-risk transactions offline when connectivity is lost, showing "recommendations unavailable" rather than failing the entire page.',vi:'Thiết kế hệ thống để tiếp tục hoạt động ở chức năng giảm khi một thành phần lỗi, thay vì lỗi hoàn toàn. Hệ thống suy giảm về trạng thái khả năng thấp hơn được định nghĩa trước thay vì tạo ra lỗi. Ví dụ: phục vụ kết quả cache khi origin bị ngừng, phê duyệt giao dịch rủi ro thấp ngoại tuyến khi mất kết nối, hiển thị "đề xuất không khả dụng" thay vì lỗi toàn bộ trang.'},
when:{en:'Any system where total failure is worse than partial functionality. Almost all production systems should have defined degraded modes for their most critical paths.',vi:'Bất kỳ hệ thống nào mà lỗi hoàn toàn còn tệ hơn chức năng một phần. Hầu hết mọi hệ thống production nên có các chế độ suy giảm được định nghĩa cho các đường dẫn quan trọng nhất của chúng.'},
pros:{en:'Maintains partial availability rather than total failure. Users can still complete critical operations even during partial outages. Buys time for the engineering team to diagnose and fix the root cause without a full outage.',vi:'Duy trì tính sẵn sàng một phần thay vì lỗi hoàn toàn. Người dùng vẫn có thể hoàn thành các thao tác quan trọng ngay cả trong các sự cố một phần. Mua thêm thời gian cho đội kỹ thuật để chẩn đoán và sửa nguyên nhân gốc mà không có sự cố toàn bộ.'},
cons:{en:'Adds design complexity — every degraded mode must be explicitly designed, tested, and monitored. Poorly designed degraded modes can create data consistency problems (e.g. offline approvals that must be reconciled later).',vi:'Thêm độ phức tạp thiết kế — mọi chế độ suy giảm phải được thiết kế, kiểm thử, và giám sát tường minh. Các chế độ suy giảm được thiết kế kém có thể tạo ra vấn đề nhất quán dữ liệu (vd: phê duyệt ngoại tuyến phải được đối soát sau).'},
risk:{en:'Undefined or untested degraded modes are the most dangerous outcome: a system "gracefully degrades" in production in ways the team never anticipated, with no monitoring of what the degraded behavior actually is. Every degraded mode must be: (1) explicitly designed with defined limits, (2) tested under realistic load, (3) monitored with specific alerts, (4) documented in the risk register as "accepted degradation under condition X with defined limit Y".',vi:'Các chế độ suy giảm không được định nghĩa hoặc không được kiểm thử là kết quả nguy hiểm nhất: một hệ thống "suy giảm nhẹ nhàng" trong production theo những cách mà đội không bao giờ dự đoán, không có giám sát về hành vi suy giảm thực sự là gì. Mọi chế độ suy giảm phải: (1) được thiết kế tường minh với giới hạn xác định, (2) được kiểm thử dưới tải thực tế, (3) được giám sát với cảnh báo cụ thể, (4) được ghi nhận trong sổ đăng ký rủi ro là "suy giảm chấp nhận được dưới điều kiện X với giới hạn xác định Y".'},
diagram:`flowchart TD
    Normal[Normal Operation: Full features]-->|Component failure|Degrade1[Degraded Mode 1: Serve cached data]
    Degrade1-->|Additional failure|Degrade2[Degraded Mode 2: Read-only mode]
    Degrade2-->|Critical failure|Safe[Safe Mode: Reject all writes, serve static page]`,
related_bigs:['visa-mastercard','netflix','alibaba']},

{id:'chaos-engineering',name:{en:'Chaos Engineering',vi:'Kỹ thuật Hỗn loạn (Chaos Engineering)'},category:'resilience',complexity:'Organizational + tooling investment',
origin:{en:'Netflix (2011) — Chaos Monkey was the first tool. Formalized by Netflix into the Simian Army and eventually into "Principles of Chaos Engineering" (principlesofchaos.org, 2018).',vi:'Netflix (2011) — Chaos Monkey là công cụ đầu tiên. Được Netflix hình thức hóa thành Simian Army và cuối cùng thành "Nguyên tắc Kỹ thuật Hỗn loạn" (principlesofchaos.org, 2018).'},
what:{en:'Deliberately inject failures into a production (or production-like) system to discover weaknesses before they cause outages. The discipline: (1) define a steady state, (2) hypothesize that steady state holds in both control and experimental groups, (3) introduce variables simulating real-world events (server failure, network latency, disk full), (4) disprove the hypothesis by observing deviations.',vi:'Cố ý bơm lỗi vào hệ thống production (hoặc giống production) để khám phá điểm yếu trước khi chúng gây ra sự cố. Quy trình: (1) định nghĩa trạng thái ổn định, (2) giả thuyết rằng trạng thái ổn định giữ nguyên trong cả nhóm kiểm soát và nhóm thực nghiệm, (3) giới thiệu các biến mô phỏng sự kiện thực tế (lỗi máy chủ, độ trễ mạng, đĩa đầy), (4) bác bỏ giả thuyết bằng cách quan sát sai lệch.'},
when:{en:'Any system that claims high availability but has never had its failure modes validated in production. Mature chaos engineering is appropriate when: (1) the system is designed for resilience, (2) monitoring is in place, (3) teams understand how to safely run experiments, (4) there is organizational maturity to interpret and act on findings.',vi:'Bất kỳ hệ thống nào tuyên bố tính sẵn sàng cao nhưng chưa bao giờ có các chế độ lỗi được xác thực trong production. Chaos engineering trưởng thành phù hợp khi: (1) hệ thống được thiết kế để chịu lỗi, (2) giám sát đã được thiết lập, (3) các đội hiểu cách chạy thử nghiệm an toàn, (4) có mức độ trưởng thành tổ chức để diễn giải và hành động theo các phát hiện.'},
pros:{en:'Identifies hidden dependencies and failure modes that only emerge under real production load. Creates organizational confidence in system resilience that no amount of testing in isolation can provide.',vi:'Xác định các phụ thuộc ẩn và chế độ lỗi chỉ xuất hiện dưới tải production thực tế. Tạo ra sự tự tin tổ chức về khả năng phục hồi hệ thống mà không lượng kiểm thử nào trong môi trường cách ly có thể cung cấp.'},
cons:{en:'High organizational investment required before it pays off. Running chaos experiments on a system not designed for failure causes outages rather than insights. Requires strong monitoring to distinguish "this is the experiment" from "this is a real outage".',vi:'Đầu tư tổ chức cao cần thiết trước khi có lợi. Chạy thử nghiệm chaos trên hệ thống không được thiết kế để chịu lỗi gây ra sự cố thay vì hiểu biết. Đòi hỏi giám sát mạnh mẽ để phân biệt "đây là thử nghiệm" với "đây là sự cố thực sự".'},
risk:{en:'Any control in a risk register that has never been deliberately triggered in a realistic scenario is UNVERIFIED. Chaos engineering is the systematic program for verifying controls. For a bank technology risk function: define an annual program of controlled failure injection tests for critical system controls (kill switch, failover, circuit breaker, manual fallback), document results, and treat untested controls as higher-risk until tested.',vi:'Bất kỳ kiểm soát nào trong sổ đăng ký rủi ro chưa từng được kích hoạt có chủ đích trong một kịch bản thực tế là CHƯA ĐƯỢC XÁC MINH. Chaos engineering là chương trình hệ thống để xác minh kiểm soát. Cho bộ phận rủi ro công nghệ ngân hàng: định nghĩa chương trình hàng năm về các bài kiểm thử bơm lỗi có kiểm soát cho các kiểm soát hệ thống quan trọng (kill switch, failover, cầu dao, dự phòng thủ công), ghi nhận kết quả, và coi các kiểm soát chưa được kiểm thử là rủi ro cao hơn cho đến khi được kiểm thử.'},
diagram:`flowchart LR
    Hypothesis[Define steady state + hypothesis]-->Inject[Inject failure in production]
    Inject-->Observe[Observe: does steady state hold?]
    Observe-->|Yes: resilient|Document[Document as verified control]
    Observe-->|No: weakness found|Fix[Fix weakness + retest]`,
related_bigs:['netflix','nasa-jpl','atc-systems']},

// ── SCALABILITY & PERFORMANCE ─────────────────────────────────────
{id:'caching-strategies',name:{en:'Caching Strategies (Cache-Aside, Write-Through, Write-Behind)',vi:'Chiến lược Caching (Cache-Aside, Write-Through, Write-Behind)'},category:'scalability',complexity:'O(1) hit; O(n) on miss+populate',
origin:{en:'Cache concepts predate computers (CPU caches, memory hierarchy). Application-level caching patterns formalized through practice at large-scale web companies in the 2000s.',vi:'Khái niệm cache có trước máy tính (CPU cache, phân cấp bộ nhớ). Các pattern caching cấp ứng dụng được hình thức hóa qua thực tế tại các công ty web quy mô lớn trong thập niên 2000.'},
what:{en:'Cache-Aside (Lazy Loading): App checks cache first; on miss, loads from DB and populates cache. Write-Through: Every write goes to cache AND DB synchronously. Write-Behind (Write-Back): Writes go to cache immediately; DB is updated asynchronously in batches. Read-Through: Cache sits between app and DB, transparently populating on miss.',vi:'Cache-Aside (Lazy Loading): App kiểm tra cache trước; khi miss, tải từ DB và đưa vào cache. Write-Through: Mọi ghi đến cache VÀ DB đồng bộ. Write-Behind (Write-Back): Ghi vào cache ngay lập tức; DB được cập nhật bất đồng bộ theo lô. Read-Through: Cache nằm giữa app và DB, tự động đưa vào khi miss.'},
when:{en:'Any read-heavy workload where DB query latency is a bottleneck, and data changes infrequently enough that stale cache hits are acceptable for the use case.',vi:'Bất kỳ workload nặng về đọc nào mà độ trễ truy vấn DB là điểm nghẽn, và dữ liệu thay đổi đủ ít thường xuyên để cache hit lỗi thời là chấp nhận được cho use case.'},
pros:{en:'Dramatic latency reduction for read-heavy workloads (in-memory cache is 100-1000x faster than DB). Reduces DB load, freeing capacity for writes.',vi:'Giảm độ trễ đáng kể cho workload nặng về đọc (cache trong bộ nhớ nhanh hơn DB 100-1000 lần). Giảm tải DB, giải phóng năng lực cho ghi.'},
cons:{en:'Write-Behind introduces risk of data loss (data in cache not yet persisted). Cache-Aside introduces stale reads between write and cache invalidation. Cache stampede (thundering herd) when a popular key expires and many requests simultaneously miss and hit the DB.',vi:'Write-Behind giới thiệu rủi ro mất dữ liệu (dữ liệu trong cache chưa được persist). Cache-Aside giới thiệu đọc lỗi thời giữa ghi và vô hiệu hóa cache. Cache stampede (thundering herd) khi một key phổ biến hết hạn và nhiều request đồng thời miss và đến DB.'},
risk:{en:'For financial data: Write-Behind is DANGEROUS because data loss between cache and DB is a financial error. For financial systems: use Write-Through or Cache-Aside with strong consistency. Never cache balances or ledger entries with Write-Behind semantics. Cache invalidation strategy must be part of the design, not an afterthought — stale financial data in cache is a risk event.',vi:'Cho dữ liệu tài chính: Write-Behind là NGUY HIỂM vì mất dữ liệu giữa cache và DB là lỗi tài chính. Cho hệ thống tài chính: dùng Write-Through hoặc Cache-Aside với strong consistency. Không bao giờ cache số dư hoặc mục sổ cái với ngữ nghĩa Write-Behind. Chiến lược vô hiệu hóa cache phải là một phần của thiết kế, không phải suy nghĩ sau — dữ liệu tài chính lỗi thời trong cache là một sự kiện rủi ro.'},
diagram:`flowchart LR
    App[Application]-->|1. Read|Cache[(Redis Cache)]
    Cache-->|Hit|App
    Cache-->|Miss|DB[(Database)]
    DB-->|2. Populate cache|Cache
    DB-->App`,
related_bigs:['meta-facebook','alibaba','cloudflare']},

{id:'rate-limiting',name:{en:'Rate Limiting & Load Shedding',vi:'Giới hạn Tốc độ & Loại bỏ Tải'},category:'scalability',complexity:'O(1)',
origin:{en:'Network traffic shaping concepts applied to application-layer API management. Token bucket algorithm dates to 1970s network research. Applied to web APIs at scale by Stripe, Twilio, and cloud providers.',vi:'Các khái niệm định hình lưu lượng mạng áp dụng cho quản lý API tầng ứng dụng. Thuật toán token bucket có từ nghiên cứu mạng thập niên 1970. Được áp dụng cho API web ở quy mô lớn bởi Stripe, Twilio, và các nhà cung cấp cloud.'},
what:{en:'Rate Limiting: Enforce a maximum number of requests per time window per client/user/IP. Common algorithms: Token Bucket (smooth, allows bursts), Leaky Bucket (strict rate, queues excess), Fixed Window Counter (simple but allows 2x burst at window boundary), Sliding Window Log (accurate, memory-intensive). Load Shedding: When overall system capacity is exceeded, actively reject the least-critical portion of requests rather than letting all requests slow down together.',vi:'Giới hạn Tốc độ: Thực thi số lượng request tối đa mỗi cửa sổ thời gian cho mỗi client/người dùng/IP. Các thuật toán phổ biến: Token Bucket (mượt mà, cho phép burst), Leaky Bucket (tốc độ nghiêm ngặt, xếp hàng dư thừa), Fixed Window Counter (đơn giản nhưng cho phép burst 2x ở ranh giới cửa sổ), Sliding Window Log (chính xác, tiêu tốn bộ nhớ). Loại bỏ Tải: Khi năng lực hệ thống tổng thể bị vượt quá, chủ động từ chối phần ít quan trọng nhất của request thay vì để tất cả request cùng chậm lại.'},
when:{en:'Rate limiting: Any public-facing API, any endpoint where abuse or traffic spikes could degrade service for legitimate users. Load shedding: At the edge, before resource-intensive processing, when overall demand exceeds supply.',vi:'Giới hạn tốc độ: Bất kỳ API hướng công chúng nào, bất kỳ endpoint nào mà lạm dụng hoặc đột biến lưu lượng có thể làm suy giảm dịch vụ cho người dùng hợp lệ. Loại bỏ tải: Tại edge, trước khi xử lý tốn nhiều tài nguyên, khi tổng cầu vượt cung.'},
pros:{en:'Protects backend systems from traffic surges. Prevents a single abusive client from consuming all capacity. Load shedding ensures that the portion of traffic that CAN be served is served well, rather than all traffic being served poorly.',vi:'Bảo vệ hệ thống backend khỏi đột biến lưu lượng. Ngăn một client lạm dụng duy nhất tiêu thụ toàn bộ năng lực. Loại bỏ tải đảm bảo rằng phần lưu lượng CÓ THỂ được phục vụ được phục vụ tốt, thay vì tất cả lưu lượng được phục vụ kém.'},
cons:{en:'Rate limits must be set carefully — too tight and legitimate users are throttled; too loose and they provide no protection. Load shedding decisions (which requests to shed) are policy decisions that must be explicitly designed, not defaulted to "drop random requests".',vi:'Giới hạn tốc độ phải được đặt cẩn thận — quá chặt và người dùng hợp lệ bị throttle; quá lỏng và chúng không cung cấp bảo vệ. Quyết định loại bỏ tải (request nào cần loại bỏ) là quyết định chính sách phải được thiết kế tường minh, không mặc định là "loại bỏ request ngẫu nhiên".'},
risk:{en:'Alibaba Singles Day edge queuing is the large-scale proof: accept slightly worse UX at the edge (waiting room) to guarantee correct behavior at the core (payment processing). For a debt management system: if an API endpoint is unexpectedly overwhelmed, the correct response is to queue/shed at the entry point, not let unbounded requests hit the core ledger. Document rate limit policies as risk controls: what is the maximum acceptable response time before shedding begins? What is the minimum priority-class of requests that must be served even under load?',vi:'Hàng đợi edge Ngày Độc thân của Alibaba là bằng chứng quy mô lớn: chấp nhận UX hơi tệ hơn ở edge (phòng chờ) để đảm bảo hành vi đúng ở lõi (xử lý thanh toán). Cho hệ thống quản lý nợ: nếu một endpoint API bị áp đảo bất ngờ, phản hồi đúng là xếp hàng/loại bỏ tại điểm vào, không để request không giới hạn đến sổ cái lõi. Ghi nhận chính sách giới hạn tốc độ là kiểm soát rủi ro: thời gian phản hồi tối đa chấp nhận được trước khi bắt đầu loại bỏ là bao nhiêu? Lớp ưu tiên tối thiểu của request phải được phục vụ ngay cả dưới tải là gì?'},
diagram:`flowchart LR
    Req[Incoming Request]-->RL{Rate Limiter}
    RL-->|Under limit|Process[Process Request]
    RL-->|Over limit|Reject[429 Too Many Requests + Retry-After]
    Process-->|System overloaded|Shed{Load Shedder}
    Shed-->|High priority|Serve[Serve]
    Shed-->|Low priority|Drop[503 Service Unavailable]`,
related_bigs:['alibaba','cme-globex','cloudflare']},

{id:'queue-load-leveling',name:{en:'Queue-Based Load Leveling',vi:'Cân bằng Tải bằng Hàng đợi'},category:'scalability',complexity:'O(1) enqueue, throughput-limited dequeue',
origin:{en:'Classic queuing theory (Kendall 1953) applied to software architecture. Popularized by enterprise messaging middleware (MQ Series, MSMQ) and later by cloud-native message queues (SQS, Pub/Sub).',vi:'Lý thuyết hàng đợi cổ điển (Kendall 1953) áp dụng cho kiến trúc phần mềm. Được phổ biến bởi middleware nhắn tin doanh nghiệp (MQ Series, MSMQ) và sau đó bởi message queue cloud-native (SQS, Pub/Sub).'},
what:{en:'Place a durable message queue between a producer (that generates work at variable rates) and a consumer (that can process work at a maximum rate). The queue absorbs bursts, allowing consumers to process at a steady rate regardless of producer spikes.',vi:'Đặt một message queue bền vững giữa producer (tạo ra công việc ở tốc độ biến thiên) và consumer (có thể xử lý công việc ở tốc độ tối đa). Hàng đợi hấp thụ burst, cho phép consumer xử lý ở tốc độ ổn định bất kể đột biến producer.'},
when:{en:'Any asynchronous processing where the work generation rate can exceed the processing rate for short periods. Loan application processing, batch reconciliation, notification delivery, report generation, audit log ingestion.',vi:'Bất kỳ xử lý bất đồng bộ nào mà tốc độ tạo ra công việc có thể vượt quá tốc độ xử lý trong thời gian ngắn. Xử lý đơn đăng ký khoản vay, đối soát batch, phân phối thông báo, tạo báo cáo, nhận log kiểm toán.'},
pros:{en:'Decouples producers and consumers — neither needs to know about the other\'s capacity. Absorbs traffic bursts without dropping work. Provides natural retry semantics (message stays in queue until successfully processed).',vi:'Tách rời producer và consumer — cả hai không cần biết về năng lực của nhau. Hấp thụ đột biến lưu lượng mà không bỏ công việc. Cung cấp ngữ nghĩa thử lại tự nhiên (thông điệp nằm trong hàng đợi cho đến khi được xử lý thành công).'},
cons:{en:'Introduces latency — work is not processed immediately. Queue depth must be monitored — a growing queue indicates consumers cannot keep up and will eventually exhaust storage. Message ordering guarantees vary by queue implementation.',vi:'Giới thiệu độ trễ — công việc không được xử lý ngay lập tức. Độ sâu hàng đợi phải được giám sát — hàng đợi ngày càng tăng cho thấy consumer không thể theo kịp và cuối cùng sẽ cạn kiệt lưu trữ. Đảm bảo thứ tự thông điệp khác nhau tùy theo triển khai hàng đợi.'},
risk:{en:'Queue depth is a leading indicator of system health — a growing queue is a risk event that must be alerted on before the queue overflows or processing falls catastrophically behind. For financial systems: messages in a queue represent work in progress — if the queue is lost (e.g. non-durable queue, infrastructure failure), that work is lost. Use durable queues with explicit acknowledgment semantics for any financial work item.',vi:'Độ sâu hàng đợi là chỉ số hàng đầu về sức khỏe hệ thống — hàng đợi ngày càng tăng là sự kiện rủi ro phải được cảnh báo trước khi hàng đợi tràn hoặc xử lý tụt lùi thảm hại. Cho hệ thống tài chính: các thông điệp trong hàng đợi đại diện cho công việc đang thực hiện — nếu hàng đợi bị mất (vd: hàng đợi không bền vững, lỗi hạ tầng), công việc đó bị mất. Dùng hàng đợi bền vững với ngữ nghĩa xác nhận tường minh cho bất kỳ mục công việc tài chính nào.'},
diagram:`flowchart LR
    Producers[Loan Applications burst]-->|Enqueue|Q[(Durable Message Queue)]
    Q-->|Dequeue at steady rate|W1[Worker 1]
    Q-->W2[Worker 2]
    Q-->W3[Worker 3]
    W1 & W2 & W3-->DB[(Loan Processing DB)]`,
related_bigs:['amazon-aws','alibaba','linkedin-kafka']},

// ── DATA PATTERNS ─────────────────────────────────────────────────
{id:'event-sourcing',name:{en:'Event Sourcing',vi:'Event Sourcing (Lưu trữ Sự kiện)'},category:'data',complexity:'O(n) replay, O(1) append',
origin:{en:'Greg Young and Martin Fowler (2005-2010) in the context of Domain-Driven Design and CQRS. The idea that the current state is derived from a sequence of events rather than stored directly.',vi:'Greg Young và Martin Fowler (2005-2010) trong bối cảnh Domain-Driven Design và CQRS. Ý tưởng rằng trạng thái hiện tại được suy ra từ một chuỗi sự kiện thay vì được lưu trữ trực tiếp.'},
what:{en:'Instead of storing the current state of data, store the sequence of state-changing events. The current state is derived by replaying events from the beginning (or from a snapshot). Every change is recorded as an immutable event in an append-only log.',vi:'Thay vì lưu trữ trạng thái hiện tại của dữ liệu, lưu trữ chuỗi các sự kiện thay đổi trạng thái. Trạng thái hiện tại được suy ra bằng cách phát lại các sự kiện từ đầu (hoặc từ một snapshot). Mọi thay đổi được ghi lại như một sự kiện bất biến trong log chỉ append.'},
when:{en:'Financial transaction history (every transaction is an event, account balance is derived), audit logging requirements, systems that need to replay history to rebuild state, CQRS systems.',vi:'Lịch sử giao dịch tài chính (mọi giao dịch là một sự kiện, số dư tài khoản được suy ra), yêu cầu ghi nhật ký kiểm toán, hệ thống cần phát lại lịch sử để tái xây dựng trạng thái, hệ thống CQRS.'},
pros:{en:'Complete audit trail by design — every state change is recorded and cannot be deleted. Ability to reconstruct state at any point in time. Natural fit for event-driven architectures and Kafka-based pipelines.',vi:'Audit trail hoàn chỉnh theo thiết kế — mọi thay đổi trạng thái được ghi lại và không thể xóa. Khả năng tái xây dựng trạng thái tại bất kỳ thời điểm nào. Phù hợp tự nhiên cho kiến trúc event-driven và pipeline dựa trên Kafka.'},
cons:{en:'Eventual consistency between the event store and any derived read models. Replay of a long event stream can be slow — snapshots are required for performance at scale. Schema evolution of events is complex.',vi:'Eventual consistency giữa event store và bất kỳ mô hình đọc được suy ra nào. Phát lại luồng sự kiện dài có thể chậm — snapshot là cần thiết để hiệu năng ở quy mô. Tiến hóa schema của sự kiện phức tạp.'},
risk:{en:'Event sourcing in financial systems naturally satisfies many regulatory record-keeping requirements — the immutable event log IS the audit trail. For a debt management system: every disbursement, repayment, fee accrual, and status change should be an immutable event. The ledger balance is always derived from the sum of events, never mutated directly — this makes reconciliation trivially correct and makes regulatory examination straightforward.',vi:'Event sourcing trong hệ thống tài chính tự nhiên thỏa mãn nhiều yêu cầu lưu giữ hồ sơ quy định — log sự kiện bất biến LÀ audit trail. Cho hệ thống quản lý nợ: mọi khoản giải ngân, trả nợ, tích lũy phí, và thay đổi trạng thái phải là một sự kiện bất biến. Số dư sổ cái luôn được suy ra từ tổng các sự kiện, không bao giờ được biến đổi trực tiếp — điều này làm cho đối soát chính xác một cách đơn giản và làm cho kiểm tra quy định trở nên đơn giản.'},
diagram:`flowchart LR
    App[Loan Service]-->|LoanDisbursed{amount:1M}|ES[(Event Store append-only)]
    App-->|RepaymentReceived{amount:100K}|ES
    App-->|FeeAccrued{amount:5K}|ES
    ES-->|Replay events|Balance[Current Balance = 1M - 100K + 5K = 905K]`,
related_bigs:['linkedin-kafka','fedwire-chips','nasdaq-inet']},

{id:'cqrs',name:{en:'CQRS (Command Query Responsibility Segregation)',vi:'CQRS (Tách biệt Trách nhiệm Lệnh và Truy vấn)'},category:'data',complexity:'Increased system complexity',
origin:{en:'Bertrand Meyer\'s Command-Query Separation principle (1988) extended to architectural pattern by Greg Young and Udi Dahan (~2010) in the context of DDD and event sourcing.',vi:'Nguyên tắc Command-Query Separation của Bertrand Meyer (1988) được mở rộng thành pattern kiến trúc bởi Greg Young và Udi Dahan (~2010) trong bối cảnh DDD và event sourcing.'},
what:{en:'Separate the model for reading data (Query side) from the model for changing data (Command side). The write side processes commands and emits events; the read side maintains denormalized views optimized for queries. Often paired with event sourcing.',vi:'Tách biệt mô hình cho đọc dữ liệu (phía Query) khỏi mô hình cho thay đổi dữ liệu (phía Command). Phía ghi xử lý command và phát ra sự kiện; phía đọc duy trì các view được denormalize để tối ưu hóa truy vấn. Thường được ghép với event sourcing.'},
when:{en:'Systems with significantly different read vs write patterns; high-performance read models required alongside complex write operations; reporting requirements that need a different data shape than the operational write model.',vi:'Hệ thống với các pattern đọc vs ghi khác nhau đáng kể; mô hình đọc hiệu năng cao cần cùng với các thao tác ghi phức tạp; yêu cầu báo cáo cần hình dạng dữ liệu khác với mô hình ghi hoạt động.'},
pros:{en:'Read models can be optimized independently of write models. Enables separate scaling of read and write paths. Natural fit with event sourcing and event-driven architectures.',vi:'Mô hình đọc có thể được tối ưu hóa độc lập khỏi mô hình ghi. Cho phép mở rộng riêng biệt các đường dẫn đọc và ghi. Phù hợp tự nhiên với event sourcing và kiến trúc event-driven.'},
cons:{en:'Eventual consistency between write side and read side — the read model lags behind the write model. Increased system complexity — two models to maintain, synchronize, and test.',vi:'Eventual consistency giữa phía ghi và phía đọc — mô hình đọc tụt lùi sau mô hình ghi. Tăng độ phức tạp hệ thống — hai mô hình cần duy trì, đồng bộ, và kiểm thử.'},
risk:{en:'CQRS without careful read-model freshness monitoring creates invisible staleness risk. In a debt management context: if the read model for loan balance is stale by minutes, a customer service agent approving an additional drawdown may be working with incorrect current exposure data. Define and monitor read-model lag; set alerts when lag exceeds the acceptable business threshold.',vi:'CQRS không có giám sát độ tươi mô hình đọc cẩn thận tạo ra rủi ro lỗi thời vô hình. Trong bối cảnh quản lý nợ: nếu mô hình đọc cho số dư khoản vay lỗi thời vài phút, nhân viên dịch vụ khách hàng phê duyệt khoản rút thêm có thể đang làm việc với dữ liệu phơi nhiễm hiện tại không chính xác. Định nghĩa và giám sát độ trễ mô hình đọc; đặt cảnh báo khi độ trễ vượt quá ngưỡng nghiệp vụ chấp nhận được.'},
diagram:`flowchart LR
    Client-->|Command: DisburseLoad|WS[Write Side Command Handler]
    WS-->|Events|ES[(Event Store)]
    ES-->|Project events|RS[Read Side Projector]
    RS-->|Denormalized view|ReadDB[(Read DB: optimized for queries)]
    Client-->|Query: GetLoanBalance|ReadDB`,
related_bigs:['linkedin-kafka','amazon-aws','fedwire-chips']},

{id:'data-replication',name:{en:'Data Replication (Leader-Follower, Multi-Leader, Leaderless)',vi:'Nhân bản Dữ liệu (Leader-Follower, Multi-Leader, Leaderless)'},category:'data',complexity:'O(n) replicas × write latency',
origin:{en:'Database replication concepts predate distributed systems; formalized in modern context through papers like Dynamo (leaderless), MySQL/PostgreSQL replication practice (leader-follower), and Google Spanner (multi-region Paxos).',vi:'Các khái niệm nhân bản database có trước hệ thống phân tán; được hình thức hóa trong bối cảnh hiện đại qua các bài báo như Dynamo (leaderless), thực tế nhân bản MySQL/PostgreSQL (leader-follower), và Google Spanner (Paxos đa vùng).'},
what:{en:'Leader-Follower (Primary-Replica): All writes go to the leader; followers receive and apply the replication stream, serving read traffic. Multi-Leader: Multiple nodes accept writes; conflicts resolved asynchronously. Leaderless (Quorum-based): Writes and reads require quorum agreement across replicas — no single node has authority.',vi:'Leader-Follower (Primary-Replica): Tất cả ghi đến leader; follower nhận và áp dụng luồng nhân bản, phục vụ lưu lượng đọc. Multi-Leader: Nhiều node chấp nhận ghi; xung đột được giải quyết bất đồng bộ. Leaderless (dựa trên Quorum): Ghi và đọc yêu cầu đồng ý quorum xuyên các replica — không có node đơn nào có thẩm quyền.'},
when:{en:'Leader-Follower: when writes are centralized and reads can tolerate slight staleness. Multi-Leader: multi-region writes with acceptable eventual consistency for conflict resolution. Leaderless: maximum availability for write operations even during node failures.',vi:'Leader-Follower: khi ghi được tập trung và đọc có thể chấp nhận lỗi thời nhẹ. Multi-Leader: ghi đa vùng với eventual consistency chấp nhận được để giải quyết xung đột. Leaderless: tính sẵn sàng tối đa cho các thao tác ghi ngay cả trong các lỗi node.'},
pros:{en:'Replication provides fault tolerance (data survives node failures) and read scalability (followers serve read traffic). Multi-region replication reduces read latency globally.',vi:'Nhân bản cung cấp khả năng chịu lỗi (dữ liệu sống sót qua lỗi node) và khả năng mở rộng đọc (follower phục vụ lưu lượng đọc). Nhân bản đa vùng giảm độ trễ đọc trên toàn cầu.'},
cons:{en:'Replication lag — followers are always behind the leader by some amount. This creates stale reads if reads are served from followers. Conflict resolution in multi-leader and leaderless is complex and domain-specific.',vi:'Độ trễ nhân bản — follower luôn ở sau leader một khoảng nào đó. Điều này tạo ra đọc lỗi thời nếu đọc được phục vụ từ follower. Giải quyết xung đột trong multi-leader và leaderless phức tạp và đặc thù miền.'},
risk:{en:'Replication lag is invisible unless monitored. In a financial system, if the follower serving reads lags the leader by 30 seconds, a customer who just made a payment may not see it reflected — and a second approval decision based on the stale read may cause an overdraft. Monitor replication lag; route reads that require strong consistency to the leader, not followers.',vi:'Độ trễ nhân bản là vô hình trừ khi được giám sát. Trong hệ thống tài chính, nếu follower phục vụ đọc tụt lùi sau leader 30 giây, khách hàng vừa thực hiện thanh toán có thể không thấy nó được phản ánh — và quyết định phê duyệt thứ hai dựa trên đọc lỗi thời có thể gây ra thấu chi. Giám sát độ trễ nhân bản; định tuyến đọc yêu cầu strong consistency đến leader, không phải follower.'},
diagram:`flowchart LR
    App[Application]-->|Writes|Leader[(Primary DB)]
    Leader-->|Async replicate|F1[(Follower 1)]
    Leader-->F2[(Follower 2)]
    App-->|Reads ok with slight staleness|F1
    App-->|Reads requiring strong consistency|Leader`,
related_bigs:['google','amazon-aws','meta-facebook']},

{id:'audit-trail',name:{en:'Audit Trail & Immutable Logging',vi:'Audit Trail & Ghi nhật ký Bất biến'},category:'ops',complexity:'O(1) append, O(log n) query',
origin:{en:'Accounting concept (paper ledger) translated to digital systems. Regulatory requirement formalized in IT controls frameworks (SOX, PCI-DSS, ISO 27001).',vi:'Khái niệm kế toán (sổ cái giấy) được chuyển thành hệ thống số. Yêu cầu quy định được hình thức hóa trong các khung kiểm soát IT (SOX, PCI-DSS, ISO 27001).'},
what:{en:'Every significant event or state change in a system is recorded in an append-only, tamper-evident log. Records must include: who performed the action, what was changed, when it occurred, the before and after state. The log must be immutable — neither the user who performed the action nor a system administrator can delete or alter entries.',vi:'Mọi sự kiện hoặc thay đổi trạng thái quan trọng trong hệ thống được ghi lại trong log chỉ append, chống giả mạo. Bản ghi phải bao gồm: ai thực hiện hành động, điều gì đã thay đổi, khi nào xảy ra, trạng thái trước và sau. Log phải là bất biến — người dùng thực hiện hành động hay quản trị viên hệ thống đều không thể xóa hoặc thay đổi mục nhập.'},
when:{en:'Every financial system — this is not optional. Required for regulatory compliance (banking regulations globally), fraud investigation, dispute resolution, and operational debugging.',vi:'Mọi hệ thống tài chính — đây không phải là tùy chọn. Bắt buộc để tuân thủ quy định (quy định ngân hàng toàn cầu), điều tra gian lận, giải quyết tranh chấp, và gỡ lỗi vận hành.'},
pros:{en:'Enables regulatory examination, fraud forensics, and dispute resolution. Creates accountability — every action is traceable to a person or system. Can serve as the source of truth for system state reconstruction.',vi:'Cho phép kiểm tra quy định, điều tra gian lận pháp y, và giải quyết tranh chấp. Tạo ra trách nhiệm — mọi hành động có thể truy nguyên đến một người hoặc hệ thống. Có thể phục vụ như nguồn chân lý để tái xây dựng trạng thái hệ thống.'},
cons:{en:'Storage cost grows unboundedly without a retention and archival policy. Query performance on large audit logs requires proper indexing strategy. Sensitive data in audit logs requires access control and may itself be subject to privacy regulations.',vi:'Chi phí lưu trữ tăng trưởng không giới hạn mà không có chính sách lưu giữ và lưu trữ. Hiệu năng truy vấn trên log kiểm toán lớn đòi hỏi chiến lược chỉ mục hóa phù hợp. Dữ liệu nhạy cảm trong log kiểm toán đòi hỏi kiểm soát truy cập và bản thân có thể phải tuân theo quy định về quyền riêng tư.'},
risk:{en:'For a debt management system: every state transition of a loan (application, approval, disbursement, each repayment, restructuring, write-off) must be in the audit trail. The audit trail must be: (1) immutable — not modifiable by application users or administrators; (2) complete — no state changes should bypass the audit mechanism; (3) reliable — loss of audit records is itself a risk event requiring escalation. Audit trail completeness should be verified by automated reconciliation, not just assumed.',vi:'Cho hệ thống quản lý nợ: mọi chuyển đổi trạng thái của khoản vay (đơn đăng ký, phê duyệt, giải ngân, mỗi khoản trả nợ, tái cơ cấu, xóa nợ) phải có trong audit trail. Audit trail phải: (1) BẤT BIẾN — không thể sửa đổi bởi người dùng ứng dụng hay quản trị viên; (2) ĐẦY ĐỦ — không có thay đổi trạng thái nào nên bỏ qua cơ chế kiểm toán; (3) ĐÁng TIN CẬY — mất bản ghi kiểm toán tự nó là sự kiện rủi ro cần leo thang. Tính đầy đủ của audit trail phải được xác minh bằng đối soát tự động, không chỉ giả định.'},
diagram:`flowchart LR
    Action[Loan Approval by User X]-->AL[(Append-Only Audit Log)]
    AL-->|Record: who, what, when, before/after state|AL
    AL-->|Query for regulatory exam|Reg[Regulator]
    AL-->|Forensic query|Investigate[Fraud Investigation]
    App[Application]-.cannot delete.->AL`,
related_bigs:['swift','linkedin-kafka','fedwire-chips']},

{id:'disaster-recovery',name:{en:'Disaster Recovery & Business Continuity (RTO/RPO)',vi:'Khôi phục Thảm họa & Duy trì Nghiệp vụ (RTO/RPO)'},category:'ops',complexity:'Cost function of RTO and RPO targets',
origin:{en:'Business continuity planning predates computing. Formalized in IT context through standards like ISO 22301, NIST SP 800-34, and banking-specific guidance from Basel Committee and local central banks.',vi:'Lập kế hoạch liên tục nghiệp vụ có trước tính toán. Được hình thức hóa trong bối cảnh IT qua các tiêu chuẩn như ISO 22301, NIST SP 800-34, và hướng dẫn đặc thù ngân hàng từ Ủy ban Basel và ngân hàng trung ương địa phương.'},
what:{en:'RTO (Recovery Time Objective): Maximum acceptable downtime — how quickly must the system be restored after a failure. RPO (Recovery Point Objective): Maximum acceptable data loss — how much data can be lost in a failure (measured in time). Lower RTO/RPO = more expensive infrastructure. The DR strategy (backup only, warm standby, hot standby, active-active) must match these objectives.',vi:'RTO (Mục tiêu Thời gian Phục hồi): Thời gian ngừng hoạt động tối đa chấp nhận được — hệ thống phải được khôi phục nhanh như thế nào sau khi lỗi. RPO (Mục tiêu Điểm Phục hồi): Mất dữ liệu tối đa chấp nhận được — bao nhiêu dữ liệu có thể bị mất trong lỗi (đo bằng thời gian). RTO/RPO thấp hơn = hạ tầng đắt tiền hơn. Chiến lược DR (chỉ sao lưu, warm standby, hot standby, active-active) phải khớp với các mục tiêu này.'},
when:{en:'Every production financial system requires documented RTO/RPO targets, a DR strategy matched to those targets, and regular DR tests to verify the strategy works.',vi:'Mọi hệ thống tài chính production đòi hỏi các mục tiêu RTO/RPO được ghi nhận, chiến lược DR khớp với các mục tiêu đó, và các bài kiểm thử DR thường xuyên để xác minh chiến lược hoạt động.'},
pros:{en:'Explicit RTO/RPO forces the business to make a concrete risk appetite decision: "how much downtime and data loss are we willing to accept?" This makes implicit risk choices explicit and auditable.',vi:'RTO/RPO tường minh buộc nghiệp vụ phải đưa ra quyết định khẩu vị rủi ro cụ thể: "chúng ta sẵn sàng chấp nhận bao nhiêu thời gian ngừng hoạt động và mất dữ liệu?" Điều này làm cho các lựa chọn rủi ro ngầm trở nên tường minh và có thể kiểm toán.'},
cons:{en:'Meeting aggressive RTO/RPO (e.g. RTO < 1 hour, RPO = 0) requires expensive infrastructure (hot standby, synchronous replication to a second DC). Most organizations under-invest in DR testing — the DR plan works until it is needed and fails in ways that were never tested.',vi:'Đáp ứng RTO/RPO tích cực (vd: RTO < 1 giờ, RPO = 0) đòi hỏi hạ tầng đắt tiền (hot standby, nhân bản đồng bộ đến DC thứ hai). Hầu hết tổ chức đầu tư không đủ vào kiểm thử DR — kế hoạch DR hoạt động cho đến khi cần và lỗi theo những cách chưa bao giờ được kiểm thử.'},
risk:{en:'Untested DR is not DR. The most common DR failure is discovering during an actual disaster that: (1) the backup was never tested for restorability; (2) the failover process takes 5x longer than the documented RTO; (3) the DR site has been silently failing for months. Annual DR tests are required by most banking regulators (SBV included) — treat them as chaos engineering experiments, not compliance checkbox exercises.',vi:'DR chưa được kiểm thử không phải là DR. Lỗi DR phổ biến nhất là khám phá ra trong thảm họa thực tế rằng: (1) sao lưu chưa bao giờ được kiểm thử về khả năng khôi phục; (2) quá trình failover mất 5 lần lâu hơn RTO được ghi nhận; (3) site DR đã thất bại trong im lặng trong nhiều tháng. Các bài kiểm thử DR hàng năm được yêu cầu bởi hầu hết các cơ quan quản lý ngân hàng (bao gồm SBV) — xem chúng như các thử nghiệm chaos engineering, không phải bài tập đánh dấu tuân thủ.'},
diagram:`flowchart LR
    Primary[(Primary DC)]-->|Synchronous replication RPO=0|Hot[(Hot Standby DC)]
    Primary-->|Async replication RPO=minutes|Warm[(Warm Standby DC)]
    Primary-->|Daily backup RPO=24h|Cold[(Cold Backup Storage)]
    subgraph RTO comparison
      Hot-->|Failover: seconds|Up1[RTO seconds]
      Warm-->|Failover: minutes|Up2[RTO minutes]
      Cold-->|Restore from backup|Up3[RTO hours]
    end`,
related_bigs:['fedwire-chips','nasa-jpl','cern-lhc']},

{id:'shadow-deployment',name:{en:'Shadow Deployment / Parallel Run',vi:'Triển khai Shadow / Chạy Song song'},category:'ops',complexity:'2x resource cost during shadow period',
origin:{en:'Pre-digital practice of running two systems simultaneously to compare outputs before cutover. Formalized in software deployment contexts as "shadow mode" or "dark launch" in the 2000s.',vi:'Thực hành tiền số hóa của việc chạy hai hệ thống đồng thời để so sánh kết quả trước khi chuyển đổi. Được hình thức hóa trong bối cảnh triển khai phần mềm như "chế độ shadow" hoặc "dark launch" trong thập niên 2000.'},
what:{en:'Route real production traffic to a new system in parallel with the existing system. The new system processes the same requests but its responses are discarded (or compared, not returned to users). Differences between old and new system outputs are logged and analyzed. When the new system matches the old reliably, traffic is switched over.',vi:'Định tuyến lưu lượng production thực đến hệ thống mới song song với hệ thống hiện có. Hệ thống mới xử lý cùng request nhưng phản hồi của nó bị loại bỏ (hoặc so sánh, không trả về cho người dùng). Sự khác biệt giữa kết quả hệ thống cũ và mới được ghi nhật ký và phân tích. Khi hệ thống mới khớp với hệ thống cũ một cách đáng tin cậy, lưu lượng được chuyển đổi.'},
when:{en:'Any major system replacement or migration (core banking, debt management system, payment processing) where correctness of the new system cannot be fully verified in a test environment. NYSE Pillar migration used exactly this pattern across multiple markets over years.',vi:'Bất kỳ thay thế hoặc di trú hệ thống lớn nào (core banking, hệ thống quản lý nợ, xử lý thanh toán) mà tính đúng đắn của hệ thống mới không thể được xác minh đầy đủ trong môi trường kiểm thử. Di trú NYSE Pillar đã sử dụng chính xác pattern này xuyên nhiều thị trường trong nhiều năm.'},
pros:{en:'Real production traffic validates correctness in ways that test environments cannot. Discrepancies are found before users are impacted. Enables gradual confidence building before committing to cutover.',vi:'Lưu lượng production thực xác thực tính đúng đắn theo những cách mà môi trường kiểm thử không thể. Sự khác biệt được tìm thấy trước khi người dùng bị ảnh hưởng. Cho phép xây dựng sự tự tin dần dần trước khi cam kết chuyển đổi.'},
cons:{en:'Requires 2x resources during shadow period. New system must be designed to handle the shadow traffic without side effects (if the new system also writes to a DB, those writes must not contaminate production). Complex to implement cleanly.',vi:'Đòi hỏi 2 lần tài nguyên trong giai đoạn shadow. Hệ thống mới phải được thiết kế để xử lý lưu lượng shadow mà không có tác dụng phụ (nếu hệ thống mới cũng ghi vào DB, những ghi đó không được làm ô nhiễm production). Phức tạp để triển khai sạch sẽ.'},
risk:{en:'For a debt management system migration from one cloud provider to another (e.g. from on-prem to AWS/Azure): never trust correctness of the new system from integration tests alone. Run both systems in parallel for a defined period, reconcile outputs daily, and only commit to cutover when the discrepancy rate is within an explicitly defined acceptable threshold. The cutover must also have a tested rollback procedure — shadow deployment without rollback is not a complete risk mitigation.',vi:'Cho di trú hệ thống quản lý nợ từ một nhà cung cấp cloud sang nhà cung cấp khác (vd: từ on-prem sang AWS/Azure): không bao giờ tin vào tính đúng đắn của hệ thống mới chỉ từ các bài kiểm thử tích hợp. Chạy cả hai hệ thống song song trong một giai đoạn xác định, đối soát kết quả hàng ngày, và chỉ cam kết chuyển đổi khi tỷ lệ sự khác biệt nằm trong ngưỡng chấp nhận được được xác định tường minh. Việc chuyển đổi cũng phải có thủ tục rollback đã được kiểm thử — triển khai shadow không có rollback không phải là giảm thiểu rủi ro hoàn chỉnh.'},
diagram:`flowchart LR
    Traffic[Production Traffic]-->Old[Old System - returns response]
    Traffic-->|Shadow copy|New[New System - response discarded]
    Old-->|Response|User[User]
    New-->|Compare|Diff[Discrepancy Log]
    Diff-->|Review until acceptable|Cutover[Commit to Cutover]`,
related_bigs:['nyse-pillar','nasdaq-inet','atc-systems']},

{id:'strangler-fig',name:{en:'Strangler Fig Pattern',vi:'Pattern Strangler Fig (Cây Đa Siết)'},category:'ops',complexity:'Incremental migration cost',
origin:{en:'Martin Fowler (2004) — named after the strangler fig tree that grows around a host tree and gradually replaces it. Applied to incremental migration of legacy systems without a "big bang" replacement.',vi:'Martin Fowler (2004) — đặt tên theo cây đa siết lớn xung quanh cây chủ và dần dần thay thế nó. Áp dụng cho di trú dần dần của hệ thống legacy mà không cần thay thế "big bang".'},
what:{en:'Gradually migrate a legacy system by building new functionality alongside the old one. A facade/proxy intercepts all requests: new functionality is served by the new system; everything else still goes to the legacy system. Over time, more and more functionality migrates to the new system until the legacy system handles nothing and can be decommissioned.',vi:'Di trú dần dần một hệ thống legacy bằng cách xây dựng chức năng mới cùng với hệ thống cũ. Một facade/proxy chặn tất cả request: chức năng mới được phục vụ bởi hệ thống mới; mọi thứ khác vẫn đến hệ thống legacy. Theo thời gian, ngày càng nhiều chức năng di trú sang hệ thống mới cho đến khi hệ thống legacy không xử lý gì và có thể bị ngừng hoạt động.'},
when:{en:'Replacing a large monolithic legacy system that cannot be safely replaced in one operation. Debt management system modernization, core banking replacement, any system where a "big bang" cutover is unacceptably risky.',vi:'Thay thế một hệ thống legacy nguyên khối lớn không thể được thay thế an toàn trong một thao tác. Hiện đại hóa hệ thống quản lý nợ, thay thế core banking, bất kỳ hệ thống nào mà chuyển đổi "big bang" là rủi ro không thể chấp nhận được.'},
pros:{en:'Risk is distributed across many small migrations rather than concentrated in one big cutover. Each incremental migration can be tested and validated before the next one begins. The legacy system remains the fallback at every step.',vi:'Rủi ro được phân tán xuyên nhiều di trú nhỏ thay vì tập trung trong một lần chuyển đổi lớn. Mỗi di trú dần dần có thể được kiểm thử và xác thực trước khi bước tiếp theo bắt đầu. Hệ thống legacy vẫn là dự phòng ở mọi bước.'},
cons:{en:'Takes much longer than a big-bang replacement. Running two systems simultaneously costs more. The facade layer adds complexity. Teams may lose motivation to complete the migration (the "90% complete" problem where the last 10% never gets done).',vi:'Mất nhiều thời gian hơn nhiều so với thay thế big-bang. Chạy hai hệ thống đồng thời tốn kém hơn. Tầng facade thêm độ phức tạp. Các đội có thể mất động lực để hoàn thành di trú (vấn đề "hoàn thành 90%" nơi 10% cuối cùng không bao giờ được thực hiện).'},
risk:{en:'The biggest risk in a Strangler Fig migration is that the facade layer becomes a permanent architectural fixture rather than a temporary migration mechanism. Define explicit decommission dates for each migrated module. Track migration completeness as a risk metric: the longer the legacy system handles production traffic alongside the new system, the longer the window for inconsistencies between them to accumulate.',vi:'Rủi ro lớn nhất trong di trú Strangler Fig là tầng facade trở thành một bộ phận kiến trúc vĩnh viễn thay vì là một cơ chế di trú tạm thời. Định nghĩa ngày ngừng hoạt động tường minh cho mỗi module đã di trú. Theo dõi mức độ hoàn thành di trú như một chỉ số rủi ro: hệ thống legacy xử lý lưu lượng production cùng với hệ thống mới càng lâu, cửa sổ để sự không nhất quán giữa chúng tích lũy càng dài.'},
diagram:`flowchart LR
    Client[All Traffic]-->Proxy[Facade Proxy]
    Proxy-->|New features|New[New System]
    Proxy-->|Everything else|Legacy[Legacy System]
    New-.gradually claims more.->Proxy
    Legacy-.shrinks.->Legacy`,
related_bigs:['nyse-pillar','atc-systems','amazon-aws']},

{id:'zero-trust',name:{en:'Zero Trust Architecture',vi:'Kiến trúc Zero Trust'},category:'ops',complexity:'Higher authentication overhead',
origin:{en:'John Kindervag at Forrester Research (2010) coined the term. Gained mainstream adoption through Google BeyondCorp (2014 paper) which implemented it at scale.',vi:'John Kindervag tại Forrester Research (2010) đặt ra thuật ngữ này. Được áp dụng rộng rãi thông qua Google BeyondCorp (bài báo 2014) triển khai nó ở quy mô lớn.'},
what:{en:'"Never trust, always verify." Assume no implicit trust based on network location — even requests from inside the corporate network must be authenticated and authorized. Every request is authenticated, authorized, and encrypted, regardless of whether it comes from inside or outside the perimeter. Replaces the castle-and-moat perimeter model with continuous verification.',vi:'"Không bao giờ tin tưởng, luôn luôn xác minh." Giả định không có niềm tin ngầm dựa trên vị trí mạng — ngay cả các request từ bên trong mạng doanh nghiệp cũng phải được xác thực và ủy quyền. Mọi request được xác thực, ủy quyền, và mã hóa, bất kể nó đến từ bên trong hay bên ngoài chu vi. Thay thế mô hình chu vi lâu đài-và-moat bằng xác minh liên tục.'},
when:{en:'Any organization with remote workers, cloud workloads, or hybrid on-prem/cloud deployments where the concept of a trusted network perimeter is no longer meaningful. This is effectively all modern organizations.',vi:'Bất kỳ tổ chức nào với người lao động từ xa, workload cloud, hoặc triển khai hybrid on-prem/cloud nơi khái niệm chu vi mạng đáng tin cậy không còn có ý nghĩa. Điều này thực sự là tất cả các tổ chức hiện đại.'},
pros:{en:'Reduces the blast radius of a compromised account — an attacker who gains access to one service cannot move laterally without re-authenticating to each downstream service. Better alignment with modern infrastructure (cloud, remote work, microservices).',vi:'Giảm blast radius của một tài khoản bị xâm phạm — kẻ tấn công giành được quyền truy cập vào một service không thể di chuyển ngang mà không phải xác thực lại với mỗi service downstream. Phù hợp tốt hơn với hạ tầng hiện đại (cloud, làm việc từ xa, microservices).'},
cons:{en:'Higher authentication overhead on every request. More complex to implement than perimeter-based security. Requires strong identity infrastructure (Entra ID, Okta, etc.) as the foundation.',vi:'Chi phí xác thực cao hơn trên mọi request. Phức tạp hơn để triển khai so với bảo mật dựa trên chu vi. Đòi hỏi hạ tầng identity mạnh mẽ (Entra ID, Okta, v.v.) làm nền tảng.'},
risk:{en:'For a Vietnamese bank with hybrid on-prem and cloud infrastructure: the traditional perimeter model (trust everything inside the corporate network) fails when cloud workloads are involved — an AWS-hosted component is not "inside" the corporate perimeter. Implement Zero Trust controls between the on-prem debt management system and its cloud components: mutual TLS between services, least-privilege service accounts, and network policies that deny all traffic not explicitly permitted.',vi:'Cho một ngân hàng Việt Nam với hạ tầng hybrid on-prem và cloud: mô hình chu vi truyền thống (tin tưởng mọi thứ bên trong mạng doanh nghiệp) thất bại khi có liên quan workload cloud — một thành phần được lưu trữ trên AWS không phải là "bên trong" chu vi doanh nghiệp. Triển khai kiểm soát Zero Trust giữa hệ thống quản lý nợ on-prem và các thành phần cloud của nó: mutual TLS giữa các service, tài khoản service với ít đặc quyền nhất, và chính sách mạng từ chối tất cả lưu lượng không được phép tường minh.'},
diagram:`flowchart LR
    User[Remote User]-->|Verify identity|IDP[Identity Provider]
    IDP-->|Verified token|Proxy[Policy Enforcement Point]
    Proxy-->|Authorize every request|SvcA[Service A]
    SvcA-->|Re-authenticate for each call|SvcB[Service B]
    SvcA-->|Re-authenticate|DB[(Database)]
    Note[No implicit trust based on network location]`,
related_bigs:['azure','google','tencent']},

{id:'reconciliation',name:{en:'Reconciliation Pattern',vi:'Pattern Đối soát (Reconciliation)'},category:'ops',complexity:'O(n) per reconciliation cycle',
origin:{en:'Accounting practice (double-entry bookkeeping, Luca Pacioli 1494) translated to distributed systems. Critical in financial systems where multiple systems maintain copies of the same financial truth.',vi:'Thực hành kế toán (kế toán kép, Luca Pacioli 1494) được chuyển thành hệ thống phân tán. Quan trọng trong hệ thống tài chính nơi nhiều hệ thống duy trì các bản sao của cùng sự thật tài chính.'},
what:{en:'Periodically compare the state held in two or more systems that should agree, identify discrepancies, and resolve them. In financial systems: reconcile the internal ledger with external settlement confirmations, reconcile the transaction log with the database balance, reconcile the bank\'s records with the central bank\'s RTGS records.',vi:'Định kỳ so sánh trạng thái được giữ trong hai hoặc nhiều hệ thống phải đồng ý, xác định sự khác biệt, và giải quyết chúng. Trong hệ thống tài chính: đối soát sổ cái nội bộ với xác nhận quyết toán bên ngoài, đối soát log giao dịch với số dư database, đối soát bản ghi của ngân hàng với bản ghi RTGS của ngân hàng trung ương.'},
when:{en:'Any financial system where multiple records of the same transaction exist across multiple systems, or where external settlement confirmations are received asynchronously from internal processing.',vi:'Bất kỳ hệ thống tài chính nào mà nhiều bản ghi của cùng giao dịch tồn tại xuyên nhiều hệ thống, hoặc nơi xác nhận quyết toán bên ngoài được nhận bất đồng bộ từ xử lý nội bộ.'},
pros:{en:'Detects data inconsistencies before they compound. Provides a systematic check on the integrity of distributed financial data. Required by most banking regulations as a core internal control.',vi:'Phát hiện sự không nhất quán dữ liệu trước khi chúng tích lũy. Cung cấp kiểm tra hệ thống về tính toàn vẹn của dữ liệu tài chính phân tán. Được yêu cầu bởi hầu hết các quy định ngân hàng như một kiểm soát nội bộ cốt lõi.'},
cons:{en:'Batch reconciliation only catches issues at reconciliation time — not in real-time. Resolution of discrepancies requires human investigation and judgment. At scale, reconciling billions of transactions requires significant compute and careful design.',vi:'Đối soát batch chỉ bắt được vấn đề vào thời điểm đối soát — không phải thời gian thực. Giải quyết sự khác biệt đòi hỏi điều tra và phán đoán của con người. Ở quy mô, đối soát hàng tỷ giao dịch đòi hỏi tính toán đáng kể và thiết kế cẩn thận.'},
risk:{en:'Missing reconciliation = undetected fraud, data corruption, or operational error accumulating silently. For a debt management system: reconcile the loan ledger against payment rail confirmations at minimum daily; reconcile the sum of individual loan balances against the portfolio-level balance; reconcile internal disbursement records against bank account statements. Any discrepancy must trigger an immediate investigation workflow, not just a log entry.',vi:'Thiếu đối soát = gian lận không được phát hiện, hỏng dữ liệu, hoặc lỗi vận hành tích lũy trong im lặng. Cho hệ thống quản lý nợ: đối soát sổ cái khoản vay với xác nhận hệ thống thanh toán tối thiểu hàng ngày; đối soát tổng số dư khoản vay cá nhân với số dư cấp danh mục đầu tư; đối soát bản ghi giải ngân nội bộ với sao kê tài khoản ngân hàng. Bất kỳ sự khác biệt nào phải kích hoạt quy trình điều tra ngay lập tức, không chỉ là một mục nhật ký.'},
diagram:`flowchart LR
    LedgerA[(Internal Loan Ledger)]-->Compare{Daily Reconciliation}
    Settlement[(NAPAS Settlement Confirmations)]-->Compare
    Compare-->|Match|OK[No action needed]
    Compare-->|Discrepancy|Alert[Alert + Investigation Workflow]
    Alert-->Resolve[Root cause + correction + audit entry]`,
related_bigs:['rtgs-systems','fedwire-chips','visa-mastercard']}
];

{id:'redis',name:'Redis',desc:{en:'In-memory data structure store — used for caching, session storage, pub/sub, rate limiting, leaderboards, and distributed locks. Sub-millisecond latency. Persistence optional.',vi:'Kho cấu trúc dữ liệu trong bộ nhớ — dùng cho caching, lưu session, pub/sub, giới hạn tốc độ, bảng xếp hạng, và khóa phân tán. Độ trễ dưới mili-giây.'},tags:['cache','pubsub','lock','session']},
{id:'postgresql',name:'PostgreSQL',desc:{en:'ACID-compliant relational database — strong consistency, rich SQL, JSONB, full-text search, extensible. The default choice for financial transaction data requiring strong consistency.',vi:'Database quan hệ tuân thủ ACID — nhất quán mạnh, SQL phong phú, JSONB, tìm kiếm toàn văn, mở rộng được. Lựa chọn mặc định cho dữ liệu giao dịch tài chính yêu cầu nhất quán mạnh.'},tags:['relational','acid','strong-consistency','financial']},

{id:'elasticsearch',name:'Elasticsearch',desc:{en:'Distributed search and analytics engine — inverted index for full-text search, real-time indexing, aggregations. Used for log analysis, application search, and monitoring dashboards.',vi:'Công cụ tìm kiếm và phân tích phân tán — chỉ mục đảo cho tìm kiếm toàn văn, chỉ mục thời gian thực, tổng hợp. Dùng cho phân tích log, tìm kiếm ứng dụng, và bảng điều khiển giám sát.'},tags:['search','analytics','logging','full-text']},
{id:'cassandra',name:'Apache Cassandra',desc:{en:'Wide-column AP database — high write throughput, linear horizontal scalability, tunable consistency, multi-DC replication. Best for time-series, IoT, and write-heavy workloads. No joins.',vi:'Database wide-column AP — thông lượng ghi cao, khả năng mở rộng ngang tuyến tính, consistency có thể điều chỉnh, nhân bản đa DC. Tốt nhất cho time-series, IoT, và workload nặng về ghi. Không có join.'},tags:['wide-column','ap','time-series','write-heavy']},
{id:'grpc',name:'gRPC / Protocol Buffers',desc:{en:'High-performance RPC framework using HTTP/2 and binary Protocol Buffer serialization. ~5-10x smaller payloads than REST/JSON, strongly typed contracts, streaming support.',vi:'Framework RPC hiệu năng cao dùng HTTP/2 và serialization Protocol Buffer nhị phân. Payload nhỏ hơn ~5-10x so với REST/JSON, hợp đồng được đánh máy mạnh, hỗ trợ streaming.'},tags:['rpc','serialization','microservices','contract']},
{id:'istio',name:'Istio / Service Mesh',desc:{en:'Service mesh providing mutual TLS between services, circuit breaking, retries, observability (distributed tracing, metrics) without application code changes. Infrastructure-layer Zero Trust.',vi:'Service mesh cung cấp mutual TLS giữa các service, ngắt mạch, thử lại, khả năng quan sát (theo dõi phân tán, metric) mà không cần thay đổi code ứng dụng. Zero Trust tầng hạ tầng.'},tags:['service-mesh','mtls','observability','zero-trust']},
{id:'prometheus-grafana',name:'Prometheus + Grafana',desc:{en:'Time-series metrics collection (Prometheus scrapes endpoints) + visualization (Grafana dashboards). The de facto open-source monitoring stack for Kubernetes environments.',vi:'Thu thập metric time-series (Prometheus scrape endpoint) + trực quan hóa (Grafana dashboard). Stack giám sát mã nguồn mở thực tế cho môi trường Kubernetes.'},tags:['monitoring','metrics','alerting','observability']},
{id:'vault',name:'HashiCorp Vault',desc:{en:'Secrets management — securely store and tightly control access to tokens, passwords, certificates, API keys. Dynamic secrets (generated on-demand, auto-expire), audit logging of all access.',vi:'Quản lý bí mật — lưu trữ và kiểm soát chặt chẽ quyền truy cập vào token, mật khẩu, chứng chỉ, khóa API. Bí mật động (được tạo theo yêu cầu, tự hết hạn), ghi nhật ký kiểm toán tất cả truy cập.'},tags:['secrets','security','encryption','compliance']},
{id:'terraform',name:'Terraform / IaC',desc:{en:'Infrastructure as Code — define cloud resources declaratively, version-controlled, reproducible. Enables policy-as-code (Sentinel), drift detection, and auditable infrastructure changes.',vi:'Hạ tầng như Code — định nghĩa tài nguyên cloud một cách khai báo, kiểm soát phiên bản, có thể tái tạo. Cho phép policy-as-code (Sentinel), phát hiện drift, và thay đổi hạ tầng có thể kiểm toán.'},tags:['iac','cloud','automation','policy-as-code']},
{id:'docker',name:'Docker / OCI Containers',desc:{en:'Container runtime — packages application and dependencies into portable, immutable image. Enables consistent environments across dev/staging/prod and fast deployment.',vi:'Container runtime — đóng gói ứng dụng và các phụ thuộc vào image không thể thay đổi, có thể mang theo. Cho phép môi trường nhất quán xuyên dev/staging/prod và triển khai nhanh.'},tags:['containers','packaging','portability','immutable']},
{id:'zookeeper-etcd',name:'ZooKeeper / etcd',desc:{en:'Distributed coordination services — strongly consistent key-value store for configuration, service discovery, leader election, and distributed locks. etcd is Kubernetes\' configuration backbone.',vi:'Dịch vụ điều phối phân tán — kho key-value nhất quán mạnh cho cấu hình, khám phá dịch vụ, bầu chọn leader, và khóa phân tán. etcd là xương sống cấu hình của Kubernetes.'},tags:['coordination','leader-election','configuration','strong-consistency']},
{id:'cdc-debezium',name:'Change Data Capture (Debezium)',desc:{en:'Captures row-level changes from database transaction logs (binlog/WAL) and streams them as events. Enables real-time data synchronization, event sourcing from existing databases, and audit without polling.',vi:'Chụp các thay đổi cấp hàng từ log giao dịch database (binlog/WAL) và stream chúng như sự kiện. Cho phép đồng bộ dữ liệu thời gian thực, event sourcing từ database hiện có, và kiểm toán không cần polling.'},tags:['cdc','streaming','sync','audit-trail']},
{id:'opentelemetry',name:'OpenTelemetry',desc:{en:'Vendor-neutral observability framework — distributed tracing, metrics, logs. Instruments applications once; exports to any backend (Jaeger, Grafana, Datadog). The emerging standard for financial system observability.',vi:'Framework khả năng quan sát trung lập nhà cung cấp — theo dõi phân tán, metric, log. Tích hợp ứng dụng một lần; xuất ra bất kỳ backend nào (Jaeger, Grafana, Datadog). Tiêu chuẩn mới nổi cho khả năng quan sát hệ thống tài chính.'},tags:['observability','tracing','metrics','vendor-neutral']},
{id:'emv-chip',name:'EMV Chip / Payment Hardware',desc:{en:'International smart card standard (Europay, Mastercard, Visa). Hardware-enforced cryptographic proof of card presence. Offline authorization via pre-loaded risk parameters. Foundation of modern card payment security.',vi:'Tiêu chuẩn thẻ thông minh quốc tế (Europay, Mastercard, Visa). Bằng chứng mật mã về sự hiện diện của thẻ được thực thi phần cứng. Xác thực ngoại tuyến qua thông số rủi ro được tải trước. Nền tảng bảo mật thanh toán thẻ hiện đại.'},tags:['hardware','payment','cryptography','offline-auth']},
{id:'fpga',name:'FPGA (Field-Programmable Gate Array)',desc:{en:'Reconfigurable hardware that can be programmed to implement custom logic circuits. Used in HFT for order-book parsing and signal generation at nanosecond latency. Also used in network packet processing and cryptographic acceleration.',vi:'Phần cứng có thể lập trình lại có thể được cấu hình để triển khai mạch logic tùy chỉnh. Được dùng trong HFT để phân tích sổ lệnh và tạo tín hiệu ở độ trễ nano-giây.'},tags:['hardware','hft','low-latency','custom-logic']},
{id:'object-storage',name:'Object Storage (S3 / Azure Blob)',desc:{en:'Infinitely scalable flat storage for unstructured data — documents, images, audit logs, backups. Eleven-nines durability via erasure coding. Immutable object locking for compliance use cases.',vi:'Lưu trữ phẳng có thể mở rộng vô hạn cho dữ liệu phi cấu trúc — tài liệu, hình ảnh, log kiểm toán, sao lưu. Độ bền mười một số 9 qua erasure coding. Khóa object bất biến cho các use case tuân thủ.'},tags:['storage','immutable','durability','compliance']},

// STATE

let lang = 'vi';
let theme = 'dark';
let currentTab = 'bigs';
let searchTimeout = null;
let activeFilters = new Set(['all']);

function t(obj){ return (typeof obj==='string') ? obj : (obj&&(obj[lang]||obj.en)||''); }

// ═══════════════════════════════════════════════
// LANG / THEME
// ═══════════════════════════════════════════════
function toggleLang(){
  lang = lang==='vi'?'en':'vi';
  document.getElementById('lang-label').textContent = lang.toUpperCase();
  renderFilters();
  renderAll(document.getElementById('search-box').value.trim().toLowerCase());
}
function toggleTheme(){
  theme = theme==='dark'?'light':'dark';
  document.body.classList.toggle('light-mode', theme==='light');
  document.getElementById('theme-label').textContent = theme==='dark'?'Light':'Dark';
  reinitMermaid();
}

// ═══════════════════════════════════════════════
// SEARCH & FILTER
// ═══════════════════════════════════════════════
function onSearch(val){
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(()=>{ renderAll(val.trim().toLowerCase()); }, 500);
}
function setFilter(f){
  if(f==='all'){ activeFilters.clear(); activeFilters.add('all'); }
  else{
    activeFilters.delete('all');
    if(activeFilters.has(f)) activeFilters.delete(f);
    else activeFilters.add(f);
    if(activeFilters.size===0) activeFilters.add('all');
  }
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', activeFilters.has(b.dataset.f));
  });
  renderAll(document.getElementById('search-box').value.trim().toLowerCase());
}

// ═══════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════
function showTab(tab){
  currentTab = tab;
  const names = ['bigs','patterns','blocks'];
  document.querySelectorAll('.nav-tab').forEach((b,i)=>{
    b.classList.toggle('active', names[i]===tab);
  });
  names.forEach(n=>{
    document.getElementById('tab-'+n).style.display = n===tab?'':'none';
  });
  activeFilters.clear(); activeFilters.add('all');
  renderFilters();
  renderAll(document.getElementById('search-box').value.trim().toLowerCase());
}

function renderFilters(){
  const fg = document.getElementById('filter-group');
  fg.innerHTML = '';
  let filters = [];
  if(currentTab==='bigs'){
    filters = [{f:'all',l:{en:'All',vi:'Tất cả'}}, ...Object.entries(CATS).map(([k,v])=>({f:k,l:v.label}))];
  } else if(currentTab==='patterns'){
    filters = [{f:'all',l:{en:'All',vi:'Tất cả'}}, ...Object.entries(PCAT).map(([k,v])=>({f:k,l:v.label}))];
  } else {
    filters = [{f:'all',l:{en:'All',vi:'Tất cả'}}];
  }
  filters.forEach(({f,l})=>{
    const b = document.createElement('button');
    b.className = 'filter-btn' + (activeFilters.has(f)?' active':'');
    b.dataset.f = f;
    b.textContent = t(l);
    b.onclick = ()=>setFilter(f);
    fg.appendChild(b);
  });
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function tierDots(n){
  let h='';
  for(let i=0;i<5;i++) h+=`<span class="tier-dot${i<n?'':' empty'}"></span>`;
  return h;
}
function hl(text, q){
  if(!q||!text) return text||'';
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return String(text).replace(re, '<span class="hl">$1</span>');
}
function matchBIGS(b, q){
  const catOk = activeFilters.has('all') || activeFilters.has(b.category);
  if(!catOk) return false;
  if(!q) return true;
  return [t(b.name), t(b.summary), ...(b.tags||[])].join(' ').toLowerCase().includes(q);
}
function matchPattern(p, q){
  const catOk = activeFilters.has('all') || activeFilters.has(p.category);
  if(!catOk) return false;
  if(!q) return true;
  return [t(p.name), t(p.what||''), ...(p.tags||[])].join(' ').toLowerCase().includes(q);
}

// RENDER — BIGS
// ═══════════════════════════════════════════════
function renderBIGS(q=''){
  const catOrder = ['hyperscale','internetscale','specialized','ai','paymentrails','exchanges'];
  const grouped = {};
  catOrder.forEach(c=>{ grouped[c]=[]; });
  BIGS.forEach(b=>{ if(matchBIGS(b,q)) grouped[b.category].push(b); });

  let html = `<div class="section-title">&#127959; BIGS &mdash; 25 Big Intelligent Global Systems</div>
  <div class="section-sub">${lang==='vi'
    ?'Click vào bất kỳ hệ thống nào để xem chi tiết đầy đủ &mdash; tech stack, tradeoffs, risk controls, và sơ đồ Mermaid'
    :'Click any system for full details &mdash; tech stack, tradeoffs, risk controls, and Mermaid diagrams'}</div>`;

  let found = false;
  catOrder.forEach(cat=>{
    const items = grouped[cat]||[];
    if(!items.length) return;
    found = true;
    const cfg = CATS[cat];
    html += `<div class="cat-section">
      <div class="cat-title">
        <span class="cat-title-dot" style="background:${cfg.color}"></span>
        ${t(cfg.label)} (${items.length})
      </div><div class="cards-grid">`;
    items.forEach(b=>{
      html += `<div class="card" style="--card-color:${cfg.color}" onclick="openBIGS('${b.id}')">
        <div class="card-header">
          <div class="card-name">${hl(t(b.name),q)}</div>
          <div class="card-tier">${tierDots(b.tier)}</div>
        </div>
        <div class="card-summary">${hl(t(b.summary),q)}</div>
        <div class="card-tags">${(b.tags||[]).map(tg=>`<span class="tag">${tg}</span>`).join('')}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  if(!found) html += `<div class="empty-state"><div class="e-icon">&#128269;</div>${lang==='vi'?'Không tìm thấy kết quả':'No results found'}</div>`;
  document.getElementById('tab-bigs').innerHTML = html;
}

function renderPatterns(q=''){
  const catOrder = ['foundation','consistency','resilience','scalability','data','ops'];

  let html = `<div class="section-title">&#128311; Distributed Systems Patterns (24)</div>
  <div class="section-sub">${lang==='vi'

    :'Click any pattern for full details &mdash; origin, principles, pros/cons, and risk controls'}</div>`;

  let found = false;
  catOrder.forEach(cat=>{
    const items = grouped[cat]||[];
    if(!items.length) return;
    found = true;
    const cfg = PCAT[cat];
    html += `<div class="cat-section">
      <div class="cat-title">
        <span class="cat-title-dot" style="background:${cfg.color}"></span>
        ${t(cfg.label)} (${items.length})

          <th>${lang==='vi'?'Phức tạp':'Complexity'}</th>
          <th>Tags</th>

    items.forEach(p=>{

      html += `<tr onclick="openPattern('${p.id}')">
        <td><strong>${hl(t(p.name),q)}</strong></td>

  document.getElementById('tab-patterns').innerHTML = html;
