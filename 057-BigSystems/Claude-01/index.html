<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BIGS Atlas &mdash; Big Intelligent Global Systems</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#181c26;--bg3:#1e2334;--border:#2a3050;
  --accent:#5b8af0;--accent2:#7ed4c0;--accent3:#f0a050;--accent4:#e06070;
  --text:#d0d8f0;--text2:#8898c0;--text3:#5567a0;--radius:10px;
  --shadow:0 4px 24px rgba(0,0,0,.45);
}
.light-mode{
  --bg:#f4f6fb;--bg2:#fff;--bg3:#e8ecf5;--border:#cdd5e8;
  --text:#1a2040;--text2:#4a5580;--text3:#8898c0;
  --shadow:0 4px 24px rgba(80,100,180,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.6;min-height:100vh;font-size:14px}
button{cursor:pointer;border:none;font:inherit}
/* Control Bar */
#ctrl-bar{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow)}
.logo{font-weight:800;font-size:17px;color:var(--accent);letter-spacing:-.5px;white-space:nowrap}
.logo span{color:var(--accent2)}
#search-box{flex:1;min-width:160px;max-width:300px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 13px;color:var(--text);font-size:13px;outline:none}
#search-box:focus{border-color:var(--accent)}
#search-box::placeholder{color:var(--text3)}
.filter-group{display:flex;gap:5px;flex-wrap:wrap}
.filter-btn{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2);border:1px solid var(--border);transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrl-spacer{flex:1}
.icon-btn{padding:4px 10px;border-radius:7px;font-size:12px;font-weight:600;background:var(--bg3);color:var(--text2);border:1px solid var(--border);transition:all .2s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.icon-btn:hover{background:var(--accent);color:#fff}
#nav-tabs{display:flex;gap:2px}
.nav-tab{padding:5px 13px;font-size:12px;font-weight:600;border-radius:7px 7px 0 0;background:transparent;color:var(--text3);border:1px solid transparent;transition:all .2s}
.nav-tab.active{background:var(--bg);color:var(--accent);border-color:var(--border);border-bottom-color:var(--bg)}
/* Main */
#main{max-width:1400px;margin:0 auto;padding:18px}
.section-title{font-size:20px;font-weight:800;margin:20px 0 8px;color:var(--accent2);display:flex;align-items:center;gap:8px}
.section-sub{color:var(--text2);font-size:12px;margin-bottom:14px}
/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-color,var(--accent))}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px}
.card-name{font-weight:700;font-size:13px}
.card-tier{display:flex;gap:2px;padding-top:2px}
.tier-dot{width:7px;height:7px;border-radius:50%;background:var(--accent3)}
.tier-dot.empty{background:var(--bg3)}
.card-summary{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:8px}
.card-tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 6px;border-radius:10px;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
/* Cat sections */
.cat-section{margin-bottom:26px}
.cat-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:5px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.cat-title-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
/* Modal */
#modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
#modal-overlay.open{display:flex}
#modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:860px;width:100%;padding:26px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto}
#modal-close{position:absolute;top:12px;right:12px;background:var(--bg3);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center}
#modal-close:hover{background:var(--accent);color:#fff}
.modal-title{font-size:20px;font-weight:800;margin-bottom:3px}
.modal-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;opacity:.8}
.modal-body{display:flex;flex-direction:column;gap:14px}
.detail-block{background:var(--bg3);border-radius:8px;padding:13px;border-left:3px solid var(--accent)}
.detail-block.why{border-color:var(--accent3)}
.detail-block.stack{border-color:var(--accent2)}
.detail-block.tradeoff{border-color:var(--accent4)}
.detail-block.risk{border-color:#7ed47e}
.detail-block.improve{border-color:#c07ef0}
.detail-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:7px}
.detail-text{font-size:13px;color:var(--text2);line-height:1.7}
.stack-item{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.stack-item:last-child{border:none;margin:0;padding:0}
.stack-layer{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.stack-choice{font-size:13px;font-weight:700;color:var(--text);margin:2px 0}
.stack-reason{font-size:12px;color:var(--text2);line-height:1.6}
.diagram-wrap{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto}
.related-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.related-chip{font-size:11px;padding:2px 9px;border-radius:12px;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--accent);transition:all .15s}
.related-chip:hover{background:var(--accent);color:#fff}
/* Patterns table */
.patterns-table-wrap{overflow-x:auto;border-radius:9px;border:1px solid var(--border)}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th{background:var(--bg3);padding:9px 13px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
table.pt td{padding:9px 13px;border-bottom:1px solid var(--border);vertical-align:top}
table.pt tr:last-child td{border-bottom:none}
table.pt tr{cursor:pointer;transition:background .15s}
table.pt tr:hover td{background:var(--bg3)}
/* Building blocks */
.bb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.bb-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;cursor:pointer;transition:all .15s}
.bb-card:hover{border-color:var(--accent);background:var(--bg3)}
.bb-name{font-weight:700;font-size:13px;color:var(--accent);margin-bottom:4px}
.bb-desc{font-size:11px;color:var(--text2);line-height:1.5}
/* Scroll top */
#scroll-top{position:fixed;bottom:22px;right:22px;z-index:150;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;transition:all .2s}
#scroll-top:hover{background:var(--accent2);transform:scale(1.1)}
#scroll-top.visible{display:flex}
.hl{background:rgba(91,138,240,.3);border-radius:2px}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3)}
.empty-state .e-icon{font-size:44px;margin-bottom:10px}
.mermaid svg{max-width:100%;height:auto}
@media(max-width:640px){
  #ctrl-bar{padding:7px 10px}
  #main{padding:10px}
  .cards-grid{grid-template-columns:1fr}
  #modal{padding:14px}
}

#modal-back{position:absolute;top:12px;left:12px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;height:30px;padding:0 10px;font-size:12px;font-weight:600;color:var(--text2);display:none;align-items:center;gap:5px;}
#modal-back:hover{background:var(--accent);color:#fff}

.ai-attr{margin-top:36px;padding:13px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text3)}
.ai-attr .ai-icon{font-size:22px;flex-shrink:0}
.ai-attr a{color:var(--accent);text-decoration:none}
.ai-attr a:hover{text-decoration:underline}

/* ── Modal maximize ─────────────────────────────── */
#modal.maximized{
  max-width:100vw !important;width:100vw !important;
  min-height:100vh;margin:0 !important;border-radius:0 !important;
  padding:52px 28px 28px !important;
}
#modal-overlay.maximized{
  padding:0 !important;align-items:flex-start !important;
  overflow-y:auto;
}
#modal-maximize{
  position:absolute;top:12px;right:48px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:50%;width:30px;height:30px;font-size:14px;
  color:var(--text2);display:flex;align-items:center;justify-content:center;
}
#modal-maximize:hover{background:var(--accent);color:#fff}

/* ── Diagram wrap + zoom/maximize ───────────────── */
.diagram-wrap{
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:12px;overflow:auto;
  position:relative;
}
.diagram-toolbar{
  display:flex;align-items:center;gap:6px;
  margin-bottom:8px;
}
.diagram-toolbar .dtb-label{
  font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.8px;color:var(--text3);flex:1;
}
.dtb-btn{
  padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700;
  background:var(--bg3);color:var(--text2);border:1px solid var(--border);
  cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:3px;
}
.dtb-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.diagram-inner{
  overflow:auto;
  transition:transform .0s; /* instant — smooth feels sluggish on large diagrams */
}
.diagram-inner svg{
  max-width:none !important; /* allow zoom to grow it */
  display:block;
}

/* ── Diagram fullscreen overlay ─────────────────── */
#diag-fs-overlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:var(--bg);
  flex-direction:column;
}
#diag-fs-overlay.open{display:flex}
#diag-fs-toolbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;background:var(--bg2);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
#diag-fs-title{font-size:13px;font-weight:700;color:var(--text2);flex:1}
#diag-fs-body{
  flex:1;overflow:auto;padding:20px;
  display:flex;align-items:flex-start;justify-content:flex-start;
}
#diag-fs-body svg{
  max-width:none !important;
  transform-origin:top left;
  transition:transform .1s;
}

/* ── Mermaid light-mode theme fix ───────────────── */
.light-mode .diagram-wrap{
  background:#f8f9fc;
  border-color:#cdd5e8;
}
.light-mode .mermaid svg{
  background:transparent !important;
}
/* Force mermaid SVG text/element colours in light mode */
.light-mode .mermaid .label,
.light-mode .mermaid text,
.light-mode .mermaid .nodeLabel,
.light-mode .mermaid .edgeLabel{
  color:#1a2040 !important;fill:#1a2040 !important;
}
.light-mode .mermaid .node rect,
.light-mode .mermaid .node circle,
.light-mode .mermaid .node polygon,
.light-mode .mermaid .node path{
  fill:#e8ecf5 !important;stroke:#4a5580 !important;
}
.light-mode .mermaid .edgePath .path{
  stroke:#4a5580 !important;
}
.light-mode .mermaid .actor{
  fill:#e8ecf5 !important;stroke:#4a5580 !important;
}
.light-mode .mermaid .messageText{
  fill:#1a2040 !important;stroke:none !important;
}
.light-mode .mermaid .loopText{
  fill:#1a2040 !important;
}
.light-mode .mermaid .labelBox{
  fill:#e8ecf5 !important;stroke:#4a5580 !important;
}
.light-mode .mermaid .cluster rect{
  fill:#edf0f8 !important;stroke:#cdd5e8 !important;
}
.light-mode .mermaid .titleText,
.light-mode .mermaid .sectionTitle{
  fill:#1a2040 !important;
}
</style>
</head>
<body>

<div id="ctrl-bar">
  <div class="logo">BIGS <span>Atlas</span></div>
  <div id="nav-tabs">
    <button class="nav-tab active" onclick="showTab('bigs')">&#127959; BIGS (25)</button>

  <button class="icon-btn" onclick="toggleLang()">&#127760; <span id="lang-label">VI</span></button>

</div>

<div id="main">
  <div id="tab-bigs"></div>

    <button id="modal-back" onclick="goBack()">&#8592; Back</button>

  </div>
</div>


<!-- Permanent scratch container for mermaid.render() -->
<div id="diag-scratch" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;pointer-events:none"></div>

<!-- Diagram fullscreen overlay -->
<div id="diag-fs-overlay">

    <span id="diag-fs-title">Diagram</span>

    <button class="dtb-btn" onclick="diagFsZoom(0.2)">&#43; Zoom in</button>

  </div>
  <div id="diag-fs-body"></div>
</div>
<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

<script>







const BIGS = [
{id:'google',name:{en:'Google (Search, Spanner, Borg/Kubernetes)',vi:'Google (Search, Spanner, Borg/Kubernetes)'},category:'hyperscale',tier:5,
tags:['distributed-db','orchestration','consensus','global-scale','clock-sync'],
summary:{en:'Globally distributed, strongly consistent infrastructure at planet scale — Spanner proved external consistency achievable across continents via TrueTime; Borg became the lineage of Kubernetes.',vi:'Hạ tầng phân tán toàn cầu với tính nhất quán mạnh — Spanner chứng minh external consistency đạt được xuyên lục địa qua TrueTime; Borg là tiền thân Kubernetes.'},
why:{en:'Strict serializability across data centers thousands of km apart while keeping latency low requires solving clock uncertainty — a problem most distributed systems avoid by relaxing consistency.',vi:'Strict serializability giữa các DC cách nhau hàng nghìn km trong khi giữ độ trễ thấp đòi hỏi giải quyết clock uncertainty — bài toán hầu hết hệ phân tán né tránh bằng cách nới lỏng consistency.'},
stack:[
{layer:'Compute Orchestration',choice:'Borg → Kubernetes',reason:{en:'Borg manages hundreds of thousands of jobs across cells, bin-packing for utilization while honoring priority/preemption. Kubernetes is its public open-source descendant that became the industry standard.',vi:'Borg quản lý hàng trăm nghìn job trên các cell, bin-packing tối ưu sử dụng. Kubernetes là con cháu mã nguồn mở trở thành chuẩn ngành.'}},
{layer:'Global Database',choice:'Spanner + TrueTime API (atomic clocks + GPS)',reason:{en:'Needed a DB both globally distributed AND externally consistent. TrueTime exposes clock uncertainty explicitly — commits wait out the uncertainty window instead of pretending perfect sync.',vi:'Cần DB vừa phân tán toàn cầu vừa externally consistent. TrueTime công khai khoảng bất định — commit chờ hết cửa sổ bất định thay vì giả vờ đồng bộ hoàn hảo.'}},
{layer:'Storage',choice:'Colossus (GFS successor)',reason:{en:'Distributed FS underlying Spanner tablets, providing replication and recovery below the DB layer.',vi:'FS phân tán bên dưới các tablet Spanner, cung cấp replication và recovery dưới tầng DB.'}},
{layer:'Consensus',choice:'Paxos per shard group',reason:{en:'Each Spanner shard runs its own Paxos group to agree on write order — no global bottleneck forms.',vi:'Mỗi shard của Spanner chạy nhóm Paxos riêng để thống nhất thứ tự ghi — không có điểm nghẽn toàn cục.'}}
],
tradeoffs:{en:'Every commit waits out the TrueTime uncertainty window (a few ms) — write latency is bounded by clock hardware quality, not network speed. Atomic clock + GPS hardware in every DC is a capital cost most companies cannot replicate.',vi:'Mỗi commit chờ hết khoảng TrueTime (vài ms) — độ trễ ghi bị giới hạn bởi chất lượng phần cứng đồng hồ. Phần cứng đồng hồ nguyên tử + GPS ở mỗi DC là chi phí đầu tư mà hầu hết công ty không thể tái tạo.'},
improve:{en:'Direction: reduce TrueTime uncertainty with chip-scale atomic clocks; push transaction coordination into hardware-accelerated paths to cut multi-region tail latency.',vi:'Hướng đi: giảm thêm khoảng bất định TrueTime bằng chip-scale atomic clock; đẩy điều phối transaction vào đường dẫn tăng tốc phần cứng để giảm tail latency đa vùng.'},
risk:{en:'Strict consistency eliminates reconciliation risk from eventual consistency. Borg priority/preemption is a capacity risk control — critical jobs always get resources by evicting lower-priority ones, directly analogous to capacity risk management in banking infrastructure.',vi:'Tính nhất quán nghiêm ngặt loại bỏ rủi ro reconciliation. Cơ chế priority/preemption của Borg là kiểm soát rủi ro năng lực — job quan trọng luôn có tài nguyên bằng cách loại job ưu tiên thấp, tương đồng trực tiếp với quản lý rủi ro năng lực trong hạ tầng ngân hàng.'},
diagram:`sequenceDiagram
    participant Client
    participant Spanner
    participant TT as TrueTime
    participant Paxos
    Client->>Spanner: Write txn
    Spanner->>TT: Get TS+uncertainty ε
    Spanner->>Paxos: Propose commit
    Paxos-->>Spanner: Quorum ack
    Spanner->>Spanner: commit-wait sleep(ε)
    Spanner-->>Client: Committed`,
diagram2:`flowchart TB
    subgraph Internet["Internet / User Clients"]
      Users["2B+ daily active users
Search · Gmail · YouTube · Maps"]
    end
    subgraph Edge["Edge Layer — 200+ PoPs globally"]
      GFE["Google Front End (GFE)
AnyCast IP · TLS termination
HTTP/2 · QUIC / HTTP3
~150 PoPs worldwide"]
    end
    subgraph BorgCluster["Borg Compute Clusters — each cell = 10K–50K machines"]
      direction LR
      Borg["Borg Scheduler
Manages 10B+ tasks/week
Bin-pack: CPU+RAM+disk
Priority 0–11 + preemption"]
      FE_Servers["Frontend Servers
C++ / Go / Java
Stateless — scale horizontally
Deploy via Borg jobs"]
      Backend["Backend Services
1000s of microservices
Spanner · Bigtable · Memorystore
Pub/Sub · Dataflow"]
    end
    subgraph SpannerLayer["Spanner — Globally Distributed Database"]
      direction LR
      TrueTime["TrueTime API
Atomic clock (Cesium)
+ GPS receiver
Uncertainty ε = 1–7ms
In every Google DC"]
      SpannerZone1["Spanner Zone — Americas
Tablet servers: 1000s
Paxos group per shard
Paxos leader elected
Commit-wait: sleep(ε)"]
      SpannerZone2["Spanner Zone — Europe
Paxos follower
Async catchup
Serves local reads"]
      SpannerZone3["Spanner Zone — APAC
Paxos follower
Min quorum = 2 of 3
~50ms cross-DC RTT"]
    end
    subgraph Storage["Storage Layer"]
      Colossus["Colossus (GFS successor)
Erasure coded 3-of-6
Auto-rebalancing
PB-scale per cluster"]
      Bigtable["Bigtable
Wide-column · NoSQL
Search index serving
Petabyte-scale"]
      Memorystore["Memorystore (Redis)
In-memory cache tier
Sub-ms reads"]
    end
    subgraph Network["Jupiter Network Fabric"]
      Jupiter["Jupiter switching fabric
1.3 Pbps bisection bandwidth
Custom ASICs
Full-mesh within DC"]
    end

    Users -->|DNS anycast| GFE
    GFE -->|Internal RPC gRPC| FE_Servers
    Borg -->|Schedules + monitors| FE_Servers & Backend
    FE_Servers --> Backend
    Backend -->|Reads/writes| SpannerZone1
    SpannerZone1 <-->|Paxos replication
TrueTime bounded| SpannerZone2 & SpannerZone3
    TrueTime -.used by.-> SpannerZone1
    Backend --> Colossus & Bigtable & Memorystore
    Jupiter -.connects all.-> Borg & SpannerZone1 & Colossus`,
related_patterns:['paxos-raft-consensus','strong-consistency','sharding','distributed-clocks'],

{id:'amazon-aws',name:{en:'Amazon / AWS (Dynamo, EC2, S3)',vi:'Amazon / AWS (Dynamo, EC2, S3)'},category:'hyperscale',tier:5,
tags:['eventual-consistency','microservices','key-value','object-storage'],
summary:{en:'Two systems: the e-commerce platform that pioneered eventual consistency (Dynamo paper 2007), and AWS cloud underpinning a huge share of the internet.',vi:'Hai hệ thống: nền tảng thương mại điện tử tiên phong về eventual consistency (bài báo Dynamo 2007), và AWS là nền tảng cloud cho phần lớn internet.'},
why:{en:'Amazon needed a shopping cart always writable even during network partitions — a customer unable to add an item is worse than seeing a stale cart, inverting conventional consistency-first wisdom.',vi:'Amazon cần giỏ hàng luôn ghi được kể cả khi mạng bị phân vùng — khách không thêm được sản phẩm tệ hơn thấy giỏ cũ, đảo ngược quan niệm consistency-trước-tiên.'},
stack:[
{layer:'Key-Value Store',choice:'Dynamo → DynamoDB',reason:{en:'Always-writable, eventually consistent; consistent hashing for partitioning, vector clocks for conflict detection. Tunable consistency (strong reads) added later.',vi:'Luôn ghi được, eventually consistent; consistent hashing để phân vùng, vector clock để phát hiện xung đột. Tunable consistency được thêm sau.'}},
{layer:'Object Storage',choice:'S3 (eleven nines durability)',reason:{en:'Erasure coding + replication across AZs. Durability, not availability, is the primary guarantee.',vi:'Erasure coding + replication xuyên AZ. Durability, không phải availability, là đảm bảo chính.'}},
{layer:'Messaging',choice:'SQS / SNS / EventBridge',reason:{en:'Decouples producers from consumers — an order spike cannot cascade into downstream failure. Queue-based load leveling.',vi:'Tách rời producer khỏi consumer — đột biến đơn hàng không lan thành lỗi dây chuyền. Queue-based load leveling.'}},
{layer:'Service Architecture',choice:'Microservices (two-pizza team model)',reason:{en:'Internal mandate: every team exposes functionality only through service interfaces. Produced microservices architecture years before the term existed.',vi:'Chỉ thị nội bộ: mọi team chỉ lộ chức năng qua service interface. Tạo ra kiến trúc microservices nhiều năm trước khi thuật ngữ này ra đời.'}}
],
tradeoffs:{en:'Eventual consistency pushes conflict-handling complexity into application code. AWS 200+ services create configuration sprawl and a massive attack surface.',vi:'Eventual consistency đẩy độ phức tạp xử lý xung đột vào code ứng dụng. 200+ dịch vụ AWS tạo ra cấu hình dàn trải và bề mặt tấn công khổng lồ.'},
improve:{en:'DynamoDB now offers strongly consistent reads — Amazon learned "eventual everywhere" was right for carts but wrong for many other workloads.',vi:'DynamoDB hiện cung cấp tùy chọn đọc nhất quán mạnh — Amazon rút ra "eventual ở mọi nơi" đúng cho giỏ hàng nhưng sai cho nhiều workload khác.'},
risk:{en:'AWS AZ/Region model is a blast-radius containment pattern. Shared Responsibility Model draws an explicit contractual line between what AWS secures vs. what customers must secure — directly applicable to cloud risk governance in regulated industries.',vi:'Mô hình AZ/Region của AWS là pattern giới hạn blast-radius. Mô hình Shared Responsibility vẽ ranh giới hợp đồng rõ ràng giữa AWS bảo mật gì vs. khách hàng phải tự bảo mật — áp dụng trực tiếp cho quản trị rủi ro cloud trong ngành quy định.'},

{id:'azure',name:{en:'Microsoft Azure',vi:'Microsoft Azure'},category:'hyperscale',tier:4,
tags:['cloud','hybrid','identity','governance','compliance'],
summary:{en:'The cloud platform most deeply integrated with enterprise identity and hybrid on-prem/cloud — directly relevant for multi-cloud deployments spanning AWS and Azure, as in typical bank debt management system architectures.',vi:'Nền tảng cloud tích hợp sâu nhất với enterprise identity và hybrid on-prem/cloud — liên quan trực tiếp cho triển khai đa cloud trên cả AWS và Azure, như trong kiến trúc hệ thống quản lý nợ ngân hàng điển hình.'},
why:{en:'Azure hardest problem: consistent identity and policy enforcement across a hybrid estate (on-prem AD + cloud workloads + multi-cloud) without creating a single point of failure in the identity layer itself.',vi:'Bài toán khó nhất của Azure: thực thi identity và chính sách nhất quán xuyên hạ tầng hybrid mà không tạo điểm lỗi đơn trong chính tầng identity.'},
stack:[
{layer:'Identity',choice:'Microsoft Entra ID (Azure AD)',reason:{en:'Bridges on-prem Active Directory with cloud identity via Azure AD Connect — adopt cloud without re-architecting decades of identity infrastructure.',vi:'Kết nối Active Directory tại chỗ với cloud identity qua Azure AD Connect — dùng cloud mà không tái kiến trúc hạ tầng identity hàng chục năm.'}},
{layer:'Database',choice:'Cosmos DB (5-level tunable consistency)',reason:{en:'Strong → Bounded Staleness → Session → Consistent Prefix → Eventual. Each service picks its CAP tradeoff as a first-class API choice.',vi:'Strong → Bounded Staleness → Session → Consistent Prefix → Eventual. Mỗi service tự chọn đánh đổi CAP như lựa chọn API hạng nhất.'}},
{layer:'Hybrid Connectivity',choice:'ExpressRoute + Azure Arc',reason:{en:'ExpressRoute = private dedicated links bypassing public internet — critical for regulated industries that cannot route sensitive data over the open internet.',vi:'ExpressRoute = liên kết riêng tư chuyên dụng bỏ qua internet công cộng — quan trọng cho ngành quy định (ngân hàng) không được truyền dữ liệu nhạy cảm qua internet mở.'}},
{layer:'Governance',choice:'Azure Policy + Management Groups',reason:{en:'Centralized enforcement of compliance rules across thousands of subscriptions — cloud-native analog of a centralized risk control framework.',vi:'Thực thi tập trung các quy tắc tuân thủ xuyên hàng nghìn subscription — tương đương cloud-native của khung kiểm soát rủi ro tập trung.'}}
],
tradeoffs:{en:'Cosmos DB tunable consistency shifts the burden of choosing correctly onto the application team — picking "eventual" for a balance field would be a real operational risk.',vi:'Consistency tùy chỉnh của Cosmos DB đẩy gánh nặng lựa chọn đúng sang team ứng dụng — chọn "eventual" cho trường số dư là rủi ro vận hành thực sự.'},
improve:{en:'Microsoft direction: Zero Trust architecture — verify every request regardless of network origin — rather than relying on network perimeter trust.',vi:'Hướng đi Microsoft: kiến trúc Zero Trust — xác minh mọi request bất kể nguồn gốc mạng — thay vì dựa vào niềm tin chu vi mạng.'},
risk:{en:'For a debt system spanning AWS and Azure: identity federation must be the single source of truth across both clouds, or you create reconciliation risk identical to having two ledgers that can drift. Azure Policy deny/audit/append effects map directly onto preventive vs. detective controls.',vi:'Với hệ thống nợ trên AWS và Azure: identity federation phải là nguồn chân lý duy nhất xuyên cả hai cloud, nếu không tạo ra rủi ro reconciliation giống hai sổ cái có thể lệch. Hiệu ứng deny/audit/append của Azure Policy ánh xạ trực tiếp vào kiểm soát phòng ngừa vs. phát hiện.'},

{id:'meta-facebook',name:{en:'Meta / Facebook (TAO, Memcache, Social Graph)',vi:'Meta / Facebook (TAO, Memcache, Đồ thị Xã hội)'},category:'hyperscale',tier:5,
tags:['graph-db','caching','fan-out','read-heavy','thundering-herd'],
summary:{en:'Solved serving a social graph at ~500:1 read:write ratio where a traditional join-heavy relational approach would collapse under query load.',vi:'Giải quyết bài toán phục vụ đồ thị xã hội ở tỉ lệ đọc:ghi ~500:1 nơi cách tiếp cận quan hệ truyền thống nặng join sẽ sụp đổ dưới tải truy vấn.'},
why:{en:'A query "show friends-of-friends who liked this post" requires multi-hop traversal across billions of nodes and edges, returning in milliseconds while staying fresh enough that users do not see stale likes or comments.',vi:'Truy vấn "bạn của bạn nào đã thích bài này" đòi hỏi duyệt đa bước trên hàng tỷ node/edge, trả về trong vài ms trong khi đủ mới để người dùng không thấy like/comment cũ.'},
stack:[
{layer:'Graph Cache/Store',choice:'TAO (The Associations and Objects)',reason:{en:'Graph-aware caching layer for objects (posts, users) and associations (likes, friendships). Unlike a generic key-value cache, TAO understands graph semantics.',vi:'Tầng cache nhận biết đồ thị cho object (bài đăng, người dùng) và association (like, kết bạn). Khác với cache key-value thông thường, TAO hiểu ngữ nghĩa đồ thị.'}},
{layer:'Caching Layer',choice:'Memcache (lease-based invalidation)',reason:{en:'Facebook Memcache paper introduced lease-based invalidation to prevent thundering herd and stale-set problems at thousands-of-servers scale.',vi:'Bài báo Memcache của Facebook giới thiệu lease-based invalidation để ngăn thundering herd và stale-set ở quy mô hàng nghìn máy chủ.'}},
{layer:'Persistent Storage',choice:'MySQL (sharded)',reason:{en:'TAO sits in front of sharded MySQL as source of truth — deliberate choice to keep durable storage boring and well-understood while innovation happens in the caching layer.',vi:'TAO nằm trước MySQL đã sharded như nguồn chân lý — lựa chọn có chủ đích để giữ lưu trữ bền vững đơn giản, còn đổi mới ở tầng cache.'}}
],
tradeoffs:{en:'TAO eventual consistency means briefly stale like counts — acceptable for social content. This tradeoff is UNACCEPTABLE in a financial ledger context where any stale balance is a risk.',vi:'Eventual consistency của TAO nghĩa là số like tạm thời lỗi thời — chấp nhận được cho nội dung xã hội. Đánh đổi này KHÔNG CHẤP NHẬN ĐƯỢC trong bối cảnh sổ cái tài chính nơi số dư lỗi thời là rủi ro.'},
improve:{en:'Meta evolution: smarter cache invalidation (reducing lease window) and regionalizing the graph further so most queries do not cross regions.',vi:'Tiến hóa Meta: vô hiệu hóa cache thông minh hơn (giảm cửa sổ lease) và phân vùng đồ thị theo khu vực nhiều hơn để hầu hết truy vấn không vượt vùng.'},
risk:{en:'Lease-based invalidation is a concurrency risk control preventing thundering herd where a cache miss on a hot key causes thousands of simultaneous DB hits. Directly reusable in any cache-stampede mitigation framework for financial systems.',vi:'Vô hiệu hóa dựa trên lease là kiểm soát rủi ro concurrency ngăn thundering herd khi cache miss trên key nóng gây hàng nghìn truy vấn DB đồng thời. Tái sử dụng trực tiếp trong bất kỳ framework giảm thiểu cache-stampede nào cho hệ thống tài chính.'},

{id:'netflix',name:{en:'Netflix',vi:'Netflix'},category:'hyperscale',tier:4,
tags:['chaos-engineering','microservices','cdn','adaptive-streaming'],
summary:{en:'Pioneered chaos engineering and early microservices; built custom CDN (Open Connect); at peak served approximately 35% of North American internet downstream traffic.',vi:'Tiên phong chaos engineering và microservices sớm; tự xây CDN (Open Connect); ở đỉnh điểm phục vụ khoảng 35% lưu lượng downstream internet Bắc Mỹ.'},
why:{en:'Netflix bet that the only reliable way to know a distributed system survives failure is to inject failure into production continuously — inverting the industry norm of avoiding production risk at all costs.',vi:'Netflix đặt cược rằng cách duy nhất đáng tin để biết hệ phân tán sống sót qua lỗi là liên tục bơm lỗi vào production — đảo ngược chuẩn mực ngành là tránh rủi ro production bằng mọi giá.'},
stack:[
{layer:'Resilience Testing',choice:'Chaos Monkey / Simian Army',reason:{en:'Randomly terminates production instances during business hours, forcing every team to build services that tolerate instance failure as a baseline assumption, not an edge case.',vi:'Ngẫu nhiên tắt instance production trong giờ làm việc, buộc mọi team xây service chịu được lỗi instance như giả định cơ bản, không phải trường hợp ngoại lệ.'}},
{layer:'CDN',choice:'Open Connect (custom-built, appliances in ISP networks)',reason:{en:'At Netflix scale, third-party CDN cost/control tradeoffs no longer made sense — dedicated appliances inside ISP networks amortize capital cost across enormous volume.',vi:'Ở quy mô Netflix, chi phí/quyền kiểm soát CDN bên thứ ba không còn hợp lý — thiết bị chuyên dụng trong mạng ISP khấu hao chi phí đầu tư trên khối lượng khổng lồ.'}},
{layer:'Streaming',choice:'Adaptive bitrate (ABR) streaming',reason:{en:'Continuously measures bandwidth and switches video quality mid-stream, prioritizing playback continuity over consistent resolution — graceful degradation applied to UX itself.',vi:'Liên tục đo băng thông và chuyển chất lượng video giữa luồng, ưu tiên tính liên tục thay vì độ phân giải cố định — graceful degradation áp dụng vào chính UX.'}}
],
tradeoffs:{en:'Chaos engineering requires significant organizational maturity before it pays off — running Chaos Monkey on a system not designed for failure causes outages, not insight.',vi:'Chaos engineering đòi hỏi mức độ trưởng thành tổ chức đáng kể trước khi có lợi — chạy Chaos Monkey trên hệ thống chưa thiết kế để chịu lỗi chỉ gây sự cố, không tạo ra hiểu biết.'},
improve:{en:'Netflix evolved from random chaos (Chaos Monkey) to hypothesis-driven experiments (ChAP, Failure Injection Testing) — mature chaos engineering tests specific steady-state hypotheses.',vi:'Netflix tiến hóa từ chaos ngẫu nhiên (Chaos Monkey) sang thử nghiệm dựa trên giả thuyết (ChAP, Failure Injection Testing) — chaos engineering trưởng thành kiểm tra giả thuyết trạng thái ổn định cụ thể.'},
risk:{en:'Chaos engineering is structurally a continuous control-testing program — exactly what technology risk frameworks demand. Any control in a risk register that has never been deliberately triggered in a realistic scenario is an UNVERIFIED control. This principle generalizes to all financial system controls including kill switches and manual fallback procedures.',vi:'Chaos engineering về cấu trúc là chương trình kiểm thử kiểm soát liên tục — đúng những gì khung quản lý rủi ro công nghệ yêu cầu. Bất kỳ kiểm soát nào trong sổ đăng ký rủi ro chưa từng được kích hoạt có chủ đích = kiểm soát CHƯA ĐƯỢC XÁC MINH.'},

{id:'alibaba',name:{en:'Alibaba Cloud (Singles Day scale)',vi:'Alibaba Cloud (quy mô Ngày Độc thân)'},category:'hyperscale',tier:4,
tags:['burst-capacity','e-commerce','pre-warming','active-active'],
summary:{en:'Operates at extreme burst scale during Singles Day (11/11) — peak volumes far exceeding Black Friday traffic, with the advantage of a known date enabling pre-warming strategies.',vi:'Vận hành ở quy mô bùng nổ cực độ vào Ngày Độc thân (11/11) — khối lượng đỉnh vượt xa Black Friday, với lợi thế ngày biết trước cho phép chiến lược làm nóng trước.'},
why:{en:'The challenge: provisioning for a predictable but extreme spike without paying for that capacity the other 364 days, while guaranteeing payment correctness under 50x+ normal traffic.',vi:'Thách thức: chuẩn bị năng lực cho đợt tăng đột biến có thể dự đoán nhưng cực đoan mà không phải trả tiền 364 ngày còn lại, trong khi đảm bảo tính đúng đắn thanh toán dưới tải gấp 50x+ bình thường.'},
stack:[
{layer:'Elasticity',choice:'ECS with pre-warmed auto-scaling pools',reason:{en:'Unlike reactive auto-scaling, Alibaba pre-provisions and warms capacity ahead of known events — cold-start scaling is too slow for a spike that begins at midnight precisely.',vi:'Khác với auto-scaling phản ứng, Alibaba chuẩn bị và làm nóng năng lực trước sự kiện đã biết — scale từ trạng thái nguội quá chậm cho đợt tăng bắt đầu chính xác lúc nửa đêm.'}},
{layer:'Database',choice:'OceanBase (distributed relational, Alibaba-built)',reason:{en:'Built specifically for financial-grade consistency at Singles Day scale with built-in multi-region DR.',vi:'Xây riêng cho nhất quán cấp độ tài chính ở quy mô Ngày Độc thân với DR đa vùng tích hợp sẵn.'}},
{layer:'Traffic Shaping',choice:'Virtual waiting rooms at edge',reason:{en:'Excess traffic queued at edge with visible position indicator — converts uncontrolled thundering herd into controlled, predictable inflow rate.',vi:'Lưu lượng dư thừa được xếp hàng ở edge với chỉ báo vị trí hiển thị — biến thundering herd thành luồng vào có kiểm soát.'}},
{layer:'DR',choice:'Multi-active data centers (active-active)',reason:{en:'All DCs serve live traffic simultaneously — maximizes utilization of DR capacity instead of letting standby capacity sit unused.',vi:'Mọi DC đều phục vụ lưu lượng sống đồng thời — tối đa hóa sử dụng năng lực DR thay vì để dự phòng nằm không.'}}
],
tradeoffs:{en:'Pre-warming is operationally expensive and requires accurate demand forecasting months in advance. Get the forecast wrong: either waste enormous capital or fail during the event with no second chance.',vi:'Làm nóng trước tốn kém về vận hành và đòi hỏi dự báo nhu cầu chính xác từ nhiều tháng trước. Dự báo sai: hoặc lãng phí vốn khổng lồ hoặc thất bại ngay trong sự kiện không có cơ hội thứ hai.'},
improve:{en:'Direction: increase burst capacity from spot/preemptible compute reclaimable immediately after the event, reducing over-provisioning cost for a single day.',vi:'Hướng đi: tăng tỷ trọng năng lực burst từ compute spot/preemptible có thể thu hồi ngay sau sự kiện, giảm chi phí dự phòng cho một ngày duy nhất.'},
risk:{en:'Virtual waiting rooms / edge queueing is textbook rate-limiting and load-shedding: protects core transaction system by deliberately sacrificing some UX (wait time) at the edge. This accepted degradation under stress must be explicitly documented in a risk framework with defined limits and rollback criteria.',vi:'Phòng chờ ảo / hàng đợi edge là rate-limiting và load-shedding kinh điển: bảo vệ lõi giao dịch bằng cách hy sinh UX (thời gian chờ) ở edge. Suy giảm chấp nhận được dưới áp lực này phải được ghi nhận tường minh trong khung rủi ro với giới hạn xác định và tiêu chí rollback.'},

{id:'tencent',name:{en:'Tencent (WeChat infrastructure)',vi:'Tencent (Hạ tầng WeChat)'},category:'hyperscale',tier:4,
tags:['super-app','messaging','payments','sandboxing','data-residency'],
summary:{en:'WeChat underlies messaging, payments, mini-programs, and social feeds for 1B+ users in one integrated app — a super-app architecture combining multiple domain-critical systems under one platform.',vi:'WeChat làm nền cho nhắn tin, thanh toán, mini-program, bảng tin xã hội cho 1 tỷ+ người dùng trong một ứng dụng tích hợp — kiến trúc super-app kết hợp nhiều hệ thống quan trọng theo miền trong một nền tảng.'},
why:{en:'Must guarantee message-delivery reliability AND payment-grade correctness AND social-feed throughput within one platform for a user base larger than most countries populations.',vi:'Phải đảm bảo độ tin cậy nhắn tin VÀ tính đúng đắn cấp thanh toán VÀ thông lượng bảng tin xã hội trong một nền tảng cho lượng người dùng lớn hơn dân số hầu hết quốc gia.'},
stack:[
{layer:'Messaging',choice:'Custom long-connection TCP protocol',reason:{en:'Purpose-built protocol minimizes per-message overhead and battery drain at billion-device scale. Standard XMPP/MQTT overhead multiplied by 1B devices becomes enormous.',vi:'Giao thức xây riêng giảm thiểu chi phí mỗi tin nhắn và hao pin ở quy mô tỷ thiết bị. Chi phí XMPP/MQTT chuẩn nhân với 1 tỷ thiết bị là khổng lồ.'}},
{layer:'Payments (WeChat Pay)',choice:'Separate strictly-consistent transaction ledger, isolated from social/messaging',reason:{en:'Deliberately separate system with own consistency guarantees — a messaging-layer incident cannot cascade into a payment-correctness incident. Strong domain bulkhead between messaging and money.',vi:'Hệ thống riêng biệt có chủ đích với đảm bảo nhất quán riêng — sự cố tầng nhắn tin không thể lan thành sự cố đúng đắn thanh toán. Bulkhead miền mạnh giữa nhắn tin và tiền.'}},
{layer:'Mini-Programs',choice:'Sandboxed runtime with limited API access',reason:{en:'Third-party mini-programs run in constrained execution — blast radius of a buggy or malicious mini-program is contained to its own sandbox, cannot access payment ledger directly.',vi:'Mini-program bên thứ ba chạy trong môi trường thực thi giới hạn — blast radius của mini-program lỗi hoặc độc hại bị giới hạn trong sandbox, không thể truy cập sổ cái thanh toán trực tiếp.'}}
],
tradeoffs:{en:'The super-app model concentrates enormous systemic risk — a WeChat outage stops messaging, payments, and essential services for 1B+ people simultaneously. This is why regulators scrutinize super-apps more heavily than single-purpose apps.',vi:'Mô hình super-app tập trung rủi ro hệ thống khổng lồ — WeChat ngừng hoạt động dừng nhắn tin, thanh toán, và dịch vụ thiết yếu cho 1 tỷ+ người cùng lúc. Đó là lý do nhà quản lý giám sát super-app chặt hơn.'},
improve:{en:'Continue decomposing shared-fate domains so failure in one vertical cannot structurally threaten another. The payments/messaging isolation was the right first step.',vi:'Tiếp tục phân rã các miền cùng chung số phận để lỗi ở một mảng không thể đe dọa mảng khác. Tách biệt thanh toán/nhắn tin là bước đúng đắn đầu tiên.'},
risk:{en:'Vietnamese fintech super-app aspirations (banking + e-wallet + lifestyle) should study this isolation boundary: domain isolation (bulkhead) is the single most important architectural risk control at super-app scale. Vietnam data residency regulations parallel China: architecture must encode regulatory geography.',vi:'Tham vọng super-app fintech Việt Nam (ngân hàng + ví điện tử + đời sống) nên nghiên cứu ranh giới cô lập này: cô lập miền (bulkhead) là kiểm soát rủi ro kiến trúc quan trọng nhất ở quy mô super-app. Quy định lưu trú dữ liệu Việt Nam song song với Trung Quốc: kiến trúc phải mã hóa địa lý quy định.'},

{id:'cloudflare',name:{en:'Cloudflare',vi:'Cloudflare'},category:'internetscale',tier:4,
tags:['cdn','ddos','anycast','edge-compute','third-party-concentration'],
summary:{en:'One of the largest global edge networks with 300+ PoPs in 100+ countries — CDN, DDoS mitigation, and DNS at internet scale. Handles approximately 10% of all HTTP requests globally.',vi:'Một trong những mạng edge toàn cầu lớn nhất với 300+ PoP ở 100+ quốc gia — CDN, giảm thiểu DDoS, và DNS ở quy mô internet. Xử lý khoảng 10% tổng yêu cầu HTTP toàn cầu.'},
why:{en:'DDoS mitigation at internet scale requires absorbing volumetric attacks measured in terabits per second — more bandwidth than most targets could ever have. Defense must be at network scale, not application scale.',vi:'Giảm thiểu DDoS ở quy mô internet đòi hỏi hấp thụ các cuộc tấn công thể tích đo bằng terabit mỗi giây — nhiều băng thông hơn hầu hết mục tiêu có thể có. Phòng thủ phải ở quy mô mạng, không phải quy mô ứng dụng.'},
stack:[
{layer:'Anycast routing',choice:'Single anycast IP served from every PoP',reason:{en:'DNS resolves to one IP; BGP routes to the nearest PoP — traffic absorbed closest to origin, keeping attack traffic off the backbone while minimizing latency for legitimate users.',vi:'DNS phân giải ra một IP; BGP định tuyến đến PoP gần nhất — lưu lượng được hấp thụ gần nguồn nhất, giữ lưu lượng tấn công ra khỏi backbone và giảm độ trễ cho người dùng hợp lệ.'}},
{layer:'DDoS mitigation',choice:'Inline traffic scrubbing at every PoP (not scrubbing center model)',reason:{en:'Traditional scrubbing centers redirect traffic, adding latency for clean traffic. Cloudflare runs filtering inline at every PoP — clean traffic is never detoured.',vi:'Scrubbing center truyền thống chuyển hướng lưu lượng, thêm độ trễ cho lưu lượng sạch. Cloudflare chạy lọc inline ở mọi PoP — lưu lượng sạch không bao giờ bị chuyển hướng.'}},
{layer:'Edge compute',choice:'Cloudflare Workers (V8 isolates, under 1ms cold start)',reason:{en:'Rather than a full container per request, V8 isolates start in under 1ms with near-zero overhead — true serverless execution at CDN edge without cold-start latency.',vi:'Thay vì container đầy đủ mỗi request, V8 isolate khởi động trong dưới 1ms — thực thi serverless thực sự ở CDN edge mà không có độ trễ cold-start.'}}
],
tradeoffs:{en:'Anycast means no default session affinity — stateful applications must externalize state. The 2022 Cloudflare incident took down thousands of sites simultaneously, illustrating that CDN centralization creates systemic dependency risk.',vi:'Anycast nghĩa là không có session affinity mặc định — ứng dụng stateful phải externalize state. Sự cố Cloudflare 2022 làm ngừng hàng nghìn trang web đồng thời, minh họa tập trung CDN tạo ra rủi ro phụ thuộc hệ thống.'},
improve:{en:'Cloudflare direction: extend the Workers edge compute model into a full application platform (databases, queues, object storage at edge) — reducing round trips to origin.',vi:'Hướng đi Cloudflare: mở rộng mô hình edge compute Workers thành nền tảng ứng dụng đầy đủ — giảm vòng lặp đến origin cho nhiều workload hơn.'},
risk:{en:'Single CDN/network provider dependency is a third-party concentration risk directly analogous to a bank single cloud provider dependency. Technology risk frameworks should require diversification analysis for any internet infrastructure dependency.',vi:'Phụ thuộc một nhà cung cấp CDN/mạng duy nhất là rủi ro tập trung bên thứ ba tương đồng trực tiếp với phụ thuộc ngân hàng vào một nhà cung cấp cloud duy nhất. Khung rủi ro công nghệ nên yêu cầu phân tích đa dạng hóa cho bất kỳ phụ thuộc hạ tầng internet nào.'},

{id:'akamai',name:{en:'Akamai',vi:'Akamai'},category:'internetscale',tier:3,
tags:['cdn','original-cdn','edge','web-performance'],
summary:{en:'One of the original CDN architects (founded 1998, commercializing MIT research) — invented patterns that became CDN industry standards, including the insight that geographic proximity does not equal network proximity.',vi:'Một trong những kiến trúc sư CDN gốc (thành lập 1998, thương mại hóa nghiên cứu MIT) — phát minh các pattern trở thành chuẩn ngành CDN.'},
why:{en:'The original CDN insight: a popular website cannot scale by adding more servers at one origin — the bottleneck is physical distance (speed of light). Solution is moving copies of content closer to users at network edge nodes.',vi:'Cái nhìn sâu sắc CDN gốc: trang web phổ biến không thể mở rộng bằng cách thêm máy chủ ở một origin — điểm nghẽn là khoảng cách vật lý (tốc độ ánh sáng). Giải pháp là di chuyển bản sao nội dung gần người dùng hơn.'},
stack:[
{layer:'Edge delivery',choice:'Distributed edge nodes with SureRoute intelligent routing',reason:{en:'Content served from nearest edge node; dynamic requests use SureRoute to find fastest path through internet to origin — not just geographically nearest but network-fastest.',vi:'Nội dung từ edge node gần nhất; request động dùng SureRoute để tìm đường nhanh nhất qua internet đến origin — không chỉ gần nhất về địa lý mà nhanh nhất về mạng.'}},
{layer:'Cache invalidation',choice:'Tag-based invalidation at scale',reason:{en:'A single tag can purge thousands of related URLs simultaneously — critical for news sites or e-commerce with complex content relationships.',vi:'Một tag có thể xóa hàng nghìn URL liên quan đồng thời — quan trọng cho trang tin tức hay thương mại điện tử với quan hệ nội dung phức tạp.'}}
],
tradeoffs:{en:'Cache invalidation latency is measured in seconds to minutes globally — for truly real-time content (stock prices, live scores), CDN caching is inappropriate and requires direct origin delivery or WebSockets.',vi:'Độ trễ vô hiệu hóa cache được tính bằng giây đến phút trên toàn cầu — cho nội dung thực sự thời gian thực (giá cổ phiếu, tỷ số trực tiếp), CDN caching không phù hợp và đòi hỏi phân phối trực tiếp từ origin hoặc WebSocket.'},
improve:{en:'Akamai direction mirrors the industry toward edge compute (EdgeWorkers) — moving logic, not just content, to the edge for personalization and API acceleration.',vi:'Hướng đi Akamai phản ánh ngành hướng tới edge compute (EdgeWorkers) — di chuyển logic, không chỉ nội dung, đến edge cho cá nhân hóa và tăng tốc API.'},
risk:{en:'CDN layer is the first line of availability defense for any public-facing service — but also a single vendor dependency. Technology risk assessments must include: CDN failover tested? Origin capable of handling 100% traffic if CDN fails? SLA contractually defined?',vi:'Tầng CDN là tuyến phòng thủ khả dụng đầu tiên cho bất kỳ dịch vụ hướng công chúng nào — nhưng cũng là điểm phụ thuộc nhà cung cấp duy nhất. Đánh giá rủi ro công nghệ phải bao gồm: CDN failover đã được kiểm thử? Origin có thể xử lý 100% lưu lượng nếu CDN lỗi? SLA có hợp đồng?'},

{id:'uber',name:{en:'Uber',vi:'Uber'},category:'internetscale',tier:4,
tags:['geospatial','real-time-matching','dispatch','geohash'],
summary:{en:'Real-time geospatial matching at scale — matching millions of riders and drivers worldwide with sub-second dispatch decisions on location, ETA, surge pricing, and routing simultaneously.',vi:'Khớp địa không gian thời gian thực ở quy mô — khớp hàng triệu hành khách và tài xế trên toàn thế giới với quyết định dispatch dưới giây về vị trí, ETA, giá tăng, và định tuyến đồng thời.'},
why:{en:'A globally distributed, continuously moving dataset (millions of driver GPS positions updating every few seconds) must be queried with low latency while simultaneously running pricing and demand forecasting. Standard DB geospatial queries cannot scale to this update rate.',vi:'Một tập dữ liệu phân tán toàn cầu, liên tục di chuyển (hàng triệu vị trí GPS tài xế cập nhật mỗi vài giây) phải được truy vấn với độ trễ thấp trong khi đồng thời chạy định giá và dự báo nhu cầu. Truy vấn địa không gian DB chuẩn không thể mở rộng đến tốc độ cập nhật này.'},
stack:[
{layer:'Geospatial indexing',choice:'Geohash-based spatial indexing + custom location service',reason:{en:'Geohash divides the earth into a hierarchical grid — prefix-matching for find drivers in this cell and neighboring cells is O(1) lookup rather than a full spatial scan.',vi:'Geohash chia trái đất thành lưới phân cấp — prefix-matching cho tìm tài xế trong cell này và cell lân cận là tra cứu O(1) thay vì quét địa không gian đầy đủ.'}},
{layer:'Dispatch',choice:'Ringpop (consistent hashing for stateful in-memory dispatch)',reason:{en:'Routes each dispatch request to the node responsible for a geographic region — consistent hashing ensures driver state is concentrated on predictable nodes.',vi:'Định tuyến mỗi request dispatch đến node chịu trách nhiệm cho một vùng địa lý — consistent hashing đảm bảo trạng thái tài xế tập trung trên các node có thể dự đoán.'}},
{layer:'ETA and routing',choice:'Pre-computed routing graphs + real-time traffic overlay',reason:{en:'Base routing graph pre-computed and cached; real-time traffic data overlays on top for ETA adjustments — separating stable (road network) from dynamic (traffic state).',vi:'Đồ thị định tuyến cơ sở được tính trước và cache; dữ liệu giao thông thời gian thực phủ lên cho điều chỉnh ETA — tách biệt phần ổn định (mạng đường) khỏi phần động (trạng thái giao thông).'}}
],
tradeoffs:{en:'Geohash-based partitioning creates hot cells in dense urban areas (Manhattan geohash cell has far more events than a rural one) — the system must handle geographic skew without hot-cell nodes becoming bottlenecks.',vi:'Phân vùng dựa trên geohash tạo ra cell nóng ở các khu đô thị dày đặc (cell geohash Manhattan có nhiều sự kiện hơn cell nông thôn nhiều) — hệ thống phải xử lý sự lệch địa lý này mà không để các node cell nóng trở thành điểm nghẽn.'},
improve:{en:'Uber direction: more sophisticated demand forecasting (predicting where rides will be needed minutes ahead, pre-positioning drivers) to reduce the matching radius.',vi:'Hướng đi Uber: dự báo nhu cầu tinh vi hơn (dự đoán nơi sẽ cần xe vài phút trước, định vị trước tài xế) để giảm bán kính khớp lệnh.'},
risk:{en:'Geospatial matching lessons for financial services (ATM/branch network optimization, fraud geo-velocity checks): partition by geography EARLY in the design — geographic skew is predictable and should be engineered for proactively.',vi:'Bài học khớp địa không gian cho dịch vụ tài chính (tối ưu mạng lưới ATM/chi nhánh, kiểm tra geo-velocity gian lận): phân vùng theo địa lý SỚM trong thiết kế — sự lệch địa lý có thể dự đoán và phải được thiết kế chủ động.'},

{id:'linkedin-kafka',name:{en:'LinkedIn (Apache Kafka)',vi:'LinkedIn (Apache Kafka)'},category:'internetscale',tier:5,
tags:['event-streaming','commit-log','pub-sub','exactly-once','audit-trail'],
summary:{en:'Kafka originated at LinkedIn (open-sourced 2011) — now foundational to much of the industry as the dominant distributed event streaming platform, underpinning real-time data pipelines across thousands of companies.',vi:'Kafka ra đời tại LinkedIn (mã nguồn mở 2011) — nay là nền tảng streaming sự kiện phân tán thống trị, làm nền cho pipeline dữ liệu thời gian thực tại hàng nghìn công ty.'},
why:{en:'LinkedIn had dozens of independent data pipelines carrying the same data between different systems — each a custom point-to-point integration. The complexity was O(N squared). Kafka was designed as a universal commit log as a service to replace that with O(N) fan-out.',vi:'LinkedIn có hàng chục pipeline dữ liệu độc lập mang cùng dữ liệu giữa các hệ thống khác nhau — mỗi cái là tích hợp point-to-point tùy chỉnh. Độ phức tạp là O(N bình phương). Kafka được thiết kế như commit log phổ quát để thay thế bằng fan-out O(N).'},
stack:[
{layer:'Core abstraction',choice:'Distributed commit log (append-only, ordered, replicated)',reason:{en:'A log is the most general data structure — every state change is an append, replay from any offset gives any past state. Enables time-travel, reprocessing, and multiple independent consumers reading at their own pace.',vi:'Log là cấu trúc dữ liệu tổng quát nhất — mọi thay đổi trạng thái là một append, phát lại từ bất kỳ offset nào cho trạng thái quá khứ bất kỳ. Cho phép time-travel, xử lý lại, và nhiều consumer độc lập đọc theo tốc độ riêng.'}},
{layer:'Partitioning',choice:'Topic partitions with ordered consumption per partition',reason:{en:'A topic splits into ordered partitions; each partition consumed by exactly one consumer per consumer group — enabling parallelism without losing ordering within a partition.',vi:'Topic được chia thành các partition có thứ tự; mỗi partition được tiêu thụ bởi đúng một consumer trên mỗi consumer group — cho phép song song hóa mà không mất thứ tự trong partition.'}},
{layer:'Retention',choice:'Time-based or size-based log retention (not delete-on-consume)',reason:{en:'Unlike traditional MQ (delete on ack), Kafka retains messages for a configurable period — consumers can re-read, replay, and catch up independently. Makes Kafka a source of truth, not just a pipe.',vi:'Khác với MQ truyền thống (xóa khi ack), Kafka giữ lại tin nhắn trong thời gian cấu hình được — consumer có thể đọc lại, phát lại, đuổi kịp độc lập. Biến Kafka thành nguồn chân lý, không chỉ là đường ống.'}}
],
tradeoffs:{en:'Kafkas ordering guarantee is per-partition, not per-topic — if you need global ordering across all events (needed for some financial use cases), you must use a single partition, which is single-threaded and cannot scale horizontally.',vi:'Đảm bảo thứ tự của Kafka là theo partition, không phải theo topic — nếu cần thứ tự toàn cục (cần cho một số use case tài chính), bạn buộc phải dùng một partition duy nhất, là đơn-luồng và không thể mở rộng ngang.'},
improve:{en:'Kafka KRaft (KIP-500) replaces ZooKeeper with a self-managed Raft-based metadata quorum, removing a complex external dependency. KIP-932 adds Queues for Kafka for traditional MQ semantics alongside streaming.',vi:'Kafka KRaft (KIP-500) thay thế ZooKeeper bằng quorum metadata tự quản dựa trên Raft, loại bỏ phụ thuộc bên ngoài phức tạp. KIP-932 thêm Queues for Kafka cho ngữ nghĩa MQ truyền thống bên cạnh streaming.'},
risk:{en:'For technology risk: Kafkas immutable log is itself an audit trail — a key compliance control for financial systems requiring event sequence reconstruction. Any Kafka-based financial system must define: retention period (regulatory minimum?), partition key (guarantees ordering for events that must be ordered?), exactly-once semantics enabled?',vi:'Về rủi ro công nghệ: log bất biến của Kafka tự nó là audit trail — kiểm soát tuân thủ then chốt cho hệ thống tài chính cần tái tạo chuỗi sự kiện. Bất kỳ hệ thống tài chính dựa trên Kafka nào phải định nghĩa: thời gian lưu giữ (tối thiểu theo quy định?), partition key (đảm bảo thứ tự cho các sự kiện phải có thứ tự?), exactly-once semantics được bật chưa?'},

{id:'spotify',name:{en:'Spotify',vi:'Spotify'},category:'internetscale',tier:3,
tags:['audio-streaming','recommendation','collaborative-filtering','hybrid-ml'],
summary:{en:'Audio streaming and recommendation at scale — notable for early extensive microservices adoption, public Squad team model documentation, and Discover Weekly as a case study in hybrid batch/real-time ML pipelines.',vi:'Streaming âm thanh và đề xuất ở quy mô — đáng chú ý cho việc áp dụng sớm và rộng rãi microservices, tài liệu mô hình đội nhóm Squad công khai, và Discover Weekly như case study trong pipeline ML kết hợp batch/real-time.'},
why:{en:'Serving audio streaming for 600M+ users while running Discover Weekly-style recommendation models that must process enormous behavioral data (play events, skips, saves) to produce personalized recommendations within a weekly refresh window.',vi:'Phục vụ streaming âm thanh cho 600M+ người dùng trong khi chạy các mô hình đề xuất kiểu Discover Weekly phải xử lý dữ liệu hành vi khổng lồ (phát, bỏ qua, lưu) để tạo đề xuất cá nhân hóa trong cửa sổ làm mới hàng tuần.'},
stack:[
{layer:'Recommendation',choice:'Collaborative filtering + NLP + audio signal analysis (3 complementary signals)',reason:{en:'Behavioral signal (what similar users listened to) + content signal (audio features from tracks) + contextual signal (playlist names via NLP). No single signal alone is sufficient.',vi:'Tín hiệu hành vi (người dùng tương tự nghe gì) + tín hiệu nội dung (đặc trưng âm thanh từ bài hát) + tín hiệu ngữ cảnh (tên playlist qua NLP). Không tín hiệu đơn lẻ nào đủ.'}},
{layer:'Data pipeline',choice:'Weekly batch training + near-real-time feature updates',reason:{en:'Heavy model training weekly; feature updates (new plays, skips) hourly — separating retraining from feature freshness avoids re-training for every user event while keeping recommendations reasonably current.',vi:'Huấn luyện mô hình nặng hàng tuần; cập nhật đặc trưng (phát mới, bỏ qua) hàng giờ — tách biệt tái huấn luyện khỏi độ tươi của đặc trưng tránh tái huấn luyện cho mỗi sự kiện người dùng.'}}
],
tradeoffs:{en:'Weekly batch retraining means Discover Weekly cannot adapt to a taste shift within the same week. Accepted because weekly freshness is good enough for music discovery.',vi:'Tái huấn luyện hàng tuần nghĩa là Discover Weekly không thể thích ứng với sự thay đổi khẩu vị trong cùng tuần. Được chấp nhận vì độ tươi hàng tuần đủ tốt cho khám phá âm nhạc.'},
improve:{en:'Direction: more real-time adaptation using session-level context layered on top of the weekly model, without discarding weekly training entirely.',vi:'Hướng đi: thích ứng thời gian thực hơn bằng ngữ cảnh cấp phiên xếp lên trên mô hình hàng tuần, không loại bỏ hoàn toàn huấn luyện hàng tuần.'},
risk:{en:'Recommendation system bias amplification is an emerging tech risk category: a system that over-indexes on recent popular content can create feedback loops that homogenize consumption. Technology risk frameworks for AI-driven product systems should include recommendation diversity metrics, not just accuracy metrics.',vi:'Khuếch đại thiên lệch hệ thống đề xuất là danh mục rủi ro công nghệ mới nổi: hệ thống quá tập trung vào nội dung phổ biến gần đây có thể tạo vòng lặp phản hồi đồng nhất hóa tiêu thụ. Khung rủi ro công nghệ nên bao gồm chỉ số đa dạng đề xuất, không chỉ độ chính xác.'},
diagram:`flowchart LR

{id:'cern-lhc',name:{en:'CERN LHC Computing Grid',vi:'Lưới Tính toán LHC CERN'},category:'specialized',tier:5,
tags:['hpc','grid-computing','petabytes','scientific','reproducibility'],
summary:{en:'Distributes and processes petabytes from particle collision events globally — the LHC produces approximately 15 petabytes of raw data annually, requiring a worldwide grid of 170+ institutions across 40+ countries.',vi:'Phân phối và xử lý petabyte từ các sự kiện va chạm hạt trên toàn cầu — LHC tạo ra khoảng 15 petabyte dữ liệu thô hàng năm, đòi hỏi một lưới toàn thế giới gồm 170+ tổ chức ở 40+ quốc gia.'},
why:{en:'LHC detectors produce approximately 40 TB per second of raw collision data. Hardware triggers reduce this to approximately 1 TB per second; software triggers further reduce to approximately 10 GB per second for permanent storage — but even 10 GB per second requires global grid distribution.',vi:'Bộ phát hiện LHC tạo ra khoảng 40 TB mỗi giây dữ liệu va chạm thô. Bộ kích hoạt phần cứng giảm xuống khoảng 1 TB mỗi giây; bộ kích hoạt phần mềm giảm thêm xuống khoảng 10 GB mỗi giây — nhưng ngay cả 10 GB mỗi giây đòi hỏi phân phối lưới toàn cầu.'},
stack:[
{layer:'Grid architecture',choice:'WLCG tiered model (Tier-0/1/2/3)',reason:{en:'Tier-0 CERN stores raw data. Tier-1: 13 major national centers store a second full copy and run permanent reconstruction. Tier-2: 160+ university centers for simulation and analysis. Tier-3: individual researchers. Hierarchical distribution matches data locality needs and governance boundaries.',vi:'Tier-0 CERN lưu dữ liệu thô. Tier-1: 13 trung tâm quốc gia lớn lưu bản sao đầy đủ thứ hai và chạy tái xây dựng thường xuyên. Tier-2: 160+ trung tâm đại học để mô phỏng và phân tích. Tier-3: nhà nghiên cứu cá nhân.'}},
{layer:'Data management',choice:'Rucio (data placement rules) + FTS (file transfer scheduling)',reason:{en:'Rucio manages placement rules across sites — e.g. keep 2 copies, one at CERN, one at US Tier-1. FTS handles actual transfer scheduling. Separates data policy from mechanics.',vi:'Rucio quản lý quy tắc đặt dữ liệu xuyên các site — vd: giữ 2 bản sao, một ở CERN, một ở Tier-1 Mỹ. FTS xử lý lập lịch chuyển thực tế. Tách biệt chính sách dữ liệu khỏi cơ chế.'}}
],
tradeoffs:{en:'Tiered grid trades data locality for cost and governance distribution — a physicist at a Tier-3 institution accesses data reconstructed at Tier-2, not raw Tier-0 data directly. This adds processing latency but makes it feasible to distribute storage/compute cost across 40+ countries.',vi:'Lưới phân tầng đánh đổi cục bộ dữ liệu để phân phối chi phí và quản trị — nhà vật lý tại tổ chức Tier-3 truy cập dữ liệu được tái xây dựng ở Tier-2, không phải dữ liệu thô Tier-0 trực tiếp. Thêm độ trễ nhưng khả thi để phân phối chi phí xuyên 40+ quốc gia.'},
improve:{en:'CERN direction: migrate analysis workloads to commercial cloud for burst capacity (AWS/Azure/GCP for physics analysis during run periods) while keeping raw data storage on-site — a hybrid model directly analogous to on-prem/cloud hybrid architecture in banking.',vi:'Hướng đi CERN: di chuyển workload phân tích sang cloud thương mại để có năng lực burst trong khi giữ lưu trữ dữ liệu thô tại chỗ — mô hình hybrid tương đồng trực tiếp với kiến trúc hybrid on-prem/cloud trong ngân hàng.'},
risk:{en:'CERNs strict scientific reproducibility requirement (every analysis must be reproducible years later) maps directly onto regulatory record-keeping in banking: immutable, versioned, replicated data with complete provenance chain. The grid data placement policies (minimum N copies, geographic distribution) are the scientific computing equivalent of a financial backup and recovery policy.',vi:'Yêu cầu tái tạo khoa học nghiêm ngặt của CERN (mọi phân tích phải tái tạo được nhiều năm sau) ánh xạ trực tiếp vào lưu giữ hồ sơ quy định trong ngân hàng: dữ liệu bất biến, có phiên bản, được replicated với chuỗi provenance đầy đủ. Chính sách đặt dữ liệu của lưới tương đương với chính sách sao lưu và phục hồi tài chính.'},

{id:'nasa-jpl',name:{en:'NASA/JPL Mission Control (Mars Rovers)',vi:'Điều khiển Nhiệm vụ NASA/JPL (Xe Sao Hỏa)'},category:'specialized',tier:5,
tags:['fault-tolerance','no-ota-patch','space','safe-state','deterministic'],
summary:{en:'Extreme reliability with no ability to patch quickly — a Mars rover cannot be rebooted by a technician, and the speed-of-light communication delay (4 to 24 minutes one-way) means all fault handling must be autonomous and pre-programmed.',vi:'Độ tin cậy cực độ mà không có khả năng vá lỗi nhanh — xe sao Hỏa không thể được kỹ thuật viên khởi động lại, và độ trễ liên lạc tốc độ ánh sáng (4 đến 24 phút một chiều) có nghĩa là mọi xử lý lỗi phải tự trị và được lập trình trước.'},
why:{en:'The system must make correct decisions autonomously, operating on hardware that received its last software update potentially years ago, in a radiation environment that causes bit-flips, with no possibility of human intervention within a 48-minute round-trip window.',vi:'Hệ thống phải đưa ra quyết định đúng một cách tự trị, vận hành trên phần cứng nhận bản cập nhật phần mềm cuối cùng có thể nhiều năm trước, trong môi trường bức xạ gây bit-flip, không có khả năng can thiệp của con người trong cửa sổ liên lạc 48 phút khứ hồi.'},
stack:[
{layer:'Onboard software',choice:'VxWorks RTOS + rad-hardened processors + Triple Modular Redundancy',reason:{en:'Real-time OS with deterministic scheduling. Radiation-hardened hardware reduces bit-flip rate. TMR: all three memory copies must agree for an action to proceed — single-event upsets are caught and corrected.',vi:'RTOS với lập lịch tất định. Phần cứng chống bức xạ giảm tỷ lệ bit-flip. TMR: cả ba bản sao bộ nhớ phải đồng ý để một hành động tiến hành — single-event upset được phát hiện và sửa chữa.'}},
{layer:'Fault management',choice:'Fault Protection system with predefined safe states',reason:{en:'Each subsystem has a defined safe state (point solar panels at sun, stop wheels, enter standby). When anomaly detected, autonomously transition to safe state before any human can know there is a problem — safety before diagnosis.',vi:'Mỗi hệ thống con có trạng thái an toàn được định nghĩa (hướng tấm pin mặt trời vào mặt trời, dừng bánh, vào chế độ chờ). Khi phát hiện bất thường, chuyển tự trị sang trạng thái an toàn trước khi bất kỳ con người nào có thể biết có vấn đề — an toàn trước chẩn đoán.'}}
],
tradeoffs:{en:'Pre-defining safe states means the system can only respond to faults the designers anticipated — a truly novel failure mode not matching any defined fault pattern may result in doing nothing (safe but mission-inefficient) rather than something risky.',vi:'Định nghĩa trước các trạng thái an toàn nghĩa là hệ thống chỉ có thể phản ứng với các lỗi mà nhà thiết kế đã dự đoán — một chế độ lỗi thực sự mới không khớp bất kỳ pattern lỗi được định nghĩa nào có thể dẫn đến không làm gì (an toàn nhưng kém hiệu quả nhiệm vụ).'},
improve:{en:'NASA Perseverance and future missions direction: more onboard autonomy for navigation decisions, reducing dependency on Earth-in-the-loop for routine decisions that currently require uplink of a new drive plan every Martian sol.',vi:'Hướng đi NASA Perseverance và các nhiệm vụ tương lai: tự trị trên bo mạch nhiều hơn cho các quyết định điều hướng, giảm phụ thuộc vào vòng lặp Trái Đất cho các quyết định thường lệ.'},
risk:{en:'Mars rover is the extreme end of the cost-of-patching spectrum. Rover: patch cost = mission risk, change window = years. Banking core system: patch cost = significant testing cycle, change window = months. The architectural response is the same in both cases: invest heavily in correctness and fault tolerance BEFORE deployment, define safe states, verify controls before launch rather than relying on patching after.',vi:'Xe sao Hỏa là đầu cực của phổ chi phí vá lỗi. Xe sao Hỏa: chi phí vá = rủi ro nhiệm vụ, cửa sổ thay đổi = nhiều năm. Hệ thống core ngân hàng: chi phí vá = chu kỳ kiểm thử đáng kể, cửa sổ thay đổi = tháng. Phản ứng kiến trúc giống nhau trong cả hai trường hợp: đầu tư nhiều vào tính đúng đắn và chịu lỗi TRƯỚC khi triển khai.'},

{id:'atc-systems',name:{en:'Air Traffic Control (FAA, Eurocontrol)',vi:'Hệ thống Kiểm soát Không lưu (FAA, Eurocontrol)'},category:'specialized',tier:5,
tags:['safety-critical','life-critical','alert-calibration','hot-standby','legacy-modernization'],
summary:{en:'Life-critical, decades-old, constantly evolving — ATC systems must be available 24/7/365 with zero tolerance for incorrect output, while being modernized (NEXTGEN in US, SESAR in Europe) without ever taking the system down.',vi:'Sinh mạng-quan trọng, hàng chục năm tuổi, không ngừng phát triển — hệ thống ATC phải sẵn sàng 24/7/365 với độ dung sai bằng không cho kết quả không chính xác, đồng thời được hiện đại hóa (NEXTGEN ở Mỹ, SESAR ở châu Âu) mà không bao giờ tắt hệ thống.'},
why:{en:'ATC combines real-time decision support (aircraft position with under 2 second latency), safety-critical correctness (missed conflict alert can mean a midair collision), decades of legacy integration (radar systems from different eras), and continuous modernization while the system is live.',vi:'ATC kết hợp hỗ trợ quyết định thời gian thực (vị trí máy bay với độ trễ dưới 2 giây), tính đúng đắn quan trọng về an toàn (cảnh báo xung đột bị bỏ sót có thể là va chạm trên không), tích hợp legacy hàng chục năm, và hiện đại hóa liên tục trong khi hệ thống đang sống.'},
stack:[
{layer:'Radar processing',choice:'Multi-Radar Tracking (MRT) with correlation and fusion',reason:{en:'Multiple radars with overlapping airspace; MRT fuses tracks from different sources into a single synthetic track per aircraft, resolving duplicates and filling coverage gaps — a real-time sensor fusion problem.',vi:'Nhiều radar với không phận chồng chéo; MRT hợp nhất track từ các nguồn khác nhau thành một track tổng hợp duy nhất mỗi máy bay, giải quyết trùng lặp và lấp đầy khoảng trống bao phủ — bài toán hợp nhất cảm biến thời gian thực.'}},
{layer:'Conflict detection',choice:'Short-Term Conflict Alert (STCA) with deterministic geometric prediction',reason:{en:'Projects current trajectory forward to detect conflicts within a configurable window — must run every few seconds for every pair of aircraft in proximity. False-positive rate must be low enough that controllers do not start ignoring alerts (alert fatigue risk).',vi:'Chiếu quỹ đạo hiện tại để phát hiện xung đột trong cửa sổ cấu hình được — phải chạy mỗi vài giây cho mỗi cặp máy bay ở gần nhau. Tỷ lệ false-positive phải đủ thấp để kiểm soát viên không bắt đầu bỏ qua cảnh báo (rủi ro mệt mỏi cảnh báo).'}},
{layer:'Redundancy',choice:'Hot standby with continuous state sync, certified manual fallback',reason:{en:'Primary and standby run simultaneously; state continuously synchronized; if primary fails, standby takes over in seconds with full current traffic state. Manual fallback (strip-based, voice-only) also maintained and certified.',vi:'Hệ thống chính và dự phòng chạy đồng thời; trạng thái được đồng bộ liên tục; nếu hệ thống chính lỗi, dự phòng tiếp quản trong vài giây. Dự phòng thủ công (dựa trên dải giấy, chỉ giọng nói) cũng được duy trì và chứng nhận.'}}
],
tradeoffs:{en:'Alert fatigue is a real risk — a system generating too many false-positive conflict alerts will be ignored by operators, converting a safety control into noise. The tradeoff between sensitivity (catch all real conflicts) and specificity (do not generate false alerts) is tuned conservatively.',vi:'Mệt mỏi cảnh báo là rủi ro thực sự — hệ thống tạo ra quá nhiều cảnh báo xung đột false-positive sẽ bị kiểm soát viên bỏ qua, biến kiểm soát an toàn thành tiếng ồn. Đánh đổi giữa độ nhạy (bắt mọi xung đột thực) và độ đặc hiệu được điều chỉnh thận trọng.'},
improve:{en:'NEXTGEN/SESAR direction: ADS-B (aircraft broadcasting their own GPS position) supplementing or replacing radar, enabling more precise 4D trajectory management.',vi:'Hướng đi NEXTGEN/SESAR: ADS-B (máy bay tự phát vị trí GPS) bổ sung hoặc thay thế radar, cho phép quản lý quỹ đạo 4D chính xác hơn.'},
risk:{en:'Alert fatigue (too many false positives degrading a safety control into ignored noise) applies directly to financial system monitoring: a SIEM or fraud detection system generating too many false-positive alerts trains operators to ignore them, nullifying the control. Calibrating alert thresholds is not just a technical tuning problem — it is a risk control EFFECTIVENESS problem.',vi:'Mệt mỏi cảnh báo (quá nhiều false positive làm suy giảm kiểm soát an toàn thành tiếng ồn bị bỏ qua) áp dụng trực tiếp cho giám sát hệ thống tài chính: SIEM hoặc hệ thống phát hiện gian lận tạo ra quá nhiều cảnh báo false-positive huấn luyện vận hành viên bỏ qua chúng, vô hiệu hóa kiểm soát. Hiệu chỉnh ngưỡng cảnh báo là vấn đề HIỆU QUẢ kiểm soát rủi ro.'},

{id:'ai-infra',name:{en:'AI Training Infrastructure (OpenAI/Anthropic/DeepMind)',vi:'Hạ tầng Huấn luyện AI (OpenAI/Anthropic/DeepMind)'},category:'ai',tier:4,
tags:['gpu-clusters','distributed-training','llm','inference-serving','checkpointing'],
summary:{en:'Massive distributed training clusters for LLMs — one of the fastest-evolving infrastructure areas. Training runs require thousands of GPUs synchronized with minimal idle time; inference serving requires low-latency responses at massive scale.',vi:'Cụm huấn luyện phân tán khổng lồ cho LLM — một trong những lĩnh vực hạ tầng phát triển nhanh nhất. Các lần chạy huấn luyện đòi hỏi hàng nghìn GPU được đồng bộ với thời gian nhàn rỗi tối thiểu; phục vụ suy luận đòi hỏi phản hồi độ trễ thấp ở quy mô lớn.'},
why:{en:'Training a frontier LLM requires running trillions of floating-point operations across thousands of GPUs for weeks. A single slow GPU in a pipeline-parallel run stalls the entire batch (the stragglers problem). Any hardware failure during a multi-week run can waste days of compute unless checkpointing is handled correctly.',vi:'Huấn luyện LLM biên giới đòi hỏi chạy hàng nghìn tỷ phép tính dấu phẩy động xuyên hàng nghìn GPU trong nhiều tuần. Một GPU chậm duy nhất trong pipeline-parallel làm trì hoãn toàn bộ batch (bài toán straggler). Bất kỳ lỗi phần cứng nào trong lần chạy nhiều tuần có thể lãng phí nhiều ngày tính toán nếu checkpointing không được xử lý đúng.'},
stack:[
{layer:'Parallelism',choice:'3D parallelism: data + tensor + pipeline parallel',reason:{en:'Data parallel: each GPU processes different data. Tensor parallel: splits a single layer across GPUs. Pipeline parallel: different layers on different GPUs. All three combined because no single strategy alone is sufficient for 100B+ parameter models.',vi:'Data parallel: mỗi GPU xử lý dữ liệu khác nhau. Tensor parallel: chia một layer đơn xuyên các GPU. Pipeline parallel: các layer khác nhau trên các GPU khác nhau. Cả ba kết hợp vì không chiến lược đơn lẻ nào đủ cho mô hình 100B+ tham số.'}},
{layer:'Communication',choice:'NVLink (within node) + InfiniBand (across nodes) + NCCL',reason:{en:'GPU-to-GPU within server: NVLink (640 GB/s vs PCIe 64 GB/s). Cross-server: InfiniBand at 400+ Gbps. NCCL implements collective operations (all-reduce, all-gather) that synchronize gradients.',vi:'GPU-GPU trong server: NVLink (640 GB/s so với PCIe 64 GB/s). Xuyên server: InfiniBand ở 400+ Gbps. NCCL triển khai các phép toán tập thể (all-reduce, all-gather) đồng bộ gradient.'}},
{layer:'Fault tolerance',choice:'Frequent checkpointing + fast resume + spare GPU pools',reason:{en:'A 1000-GPU cluster with 0.1% daily hardware failure rate sees approximately 1 failure per day. Without checkpointing, any failure restarts from scratch. With frequent checkpoints, failure costs only the work since the last checkpoint.',vi:'Cụm 1000 GPU với tỷ lệ lỗi phần cứng hàng ngày 0.1% sẽ thấy khoảng 1 lỗi mỗi ngày. Không có checkpointing, bất kỳ lỗi nào khởi động lại từ đầu. Với checkpoint thường xuyên, lỗi chỉ tốn công việc kể từ checkpoint cuối.'}}
],
tradeoffs:{en:'Larger checkpointing frequency costs throughput (time saving state, not training). Larger batch sizes (for efficiency) can degrade model convergence quality. Tensor parallelism requires fast interconnect — any network bottleneck within a tensor-parallel group becomes a training bottleneck.',vi:'Tần suất checkpoint lớn hơn tốn thông lượng (thời gian lưu trạng thái, không phải huấn luyện). Kích thước batch lớn hơn có thể làm suy giảm chất lượng hội tụ mô hình. Tensor parallelism đòi hỏi kết nối nhanh — điểm nghẽn mạng trong nhóm tensor-parallel trở thành điểm nghẽn huấn luyện.'},
improve:{en:'Industry direction: disaggregated prefill/decode serving, speculative decoding (small draft model predicts tokens, verified by large model), and elastic training (continue despite subset of failures).',vi:'Hướng đi ngành: phục vụ prefill/decode tách rời, speculative decoding (mô hình nháp nhỏ dự đoán token, được xác minh bởi mô hình lớn), và huấn luyện đàn hồi (có thể tiếp tục mặc dù một tập hợp con bị lỗi).'},
risk:{en:'AI infrastructure introduces new risk categories: model training audit trails (what data, what hyperparameters, what compute cluster configuration) are the AI equivalent of software build provenance — critical for AI model governance and regulatory compliance as AI systems are deployed in regulated financial contexts. This is an emerging gap in most bank technology risk frameworks.',vi:'Hạ tầng AI giới thiệu các danh mục rủi ro mới: audit trail huấn luyện mô hình (dữ liệu nào, siêu tham số nào, cấu hình cụm tính toán nào) là tương đương AI của provenance build phần mềm — quan trọng cho quản trị mô hình AI và tuân thủ quy định khi hệ thống AI được triển khai trong bối cảnh tài chính quy định.'},
