{id:'swift',name:{en:'SWIFT / Global Payment Rails',vi:'SWIFT / Hệ thống Thanh toán Toàn cầu'},category:'paymentrails',tier:4,
tags:['messaging','cross-border','sanctions','iso20022','aml'],
summary:{en:'Global messaging network banks use to instruct cross-border payments. Does not move money itself, only standardized messages. Post-2022 sanctions events made SWIFT a live case study in geopolitical risk for technology risk teams.',vi:'Mạng nhắn tin toàn cầu mà ngân hàng dùng để chỉ thị thanh toán xuyên biên giới. Bản thân không di chuyển tiền, chỉ thông điệp chuẩn hóa. Sự kiện trừng phạt sau 2022 biến SWIFT thành case study sống về rủi ro địa chính trị cho các team rủi ro công nghệ.'},
why:{en:'SWIFT must provide a trusted messaging layer across thousands of independent financial institutions with different legacy core banking systems, different regulatory regimes, and zero shared infrastructure.',vi:'SWIFT phải cung cấp tầng nhắn tin đáng tin cậy xuyên hàng nghìn tổ chức tài chính độc lập với hệ thống core banking legacy khác nhau, chế độ quản lý khác nhau, không có hạ tầng chung.'},
stack:[
{layer:'Messaging standard',choice:'MT (legacy) → ISO 20022/MX (ongoing migration)',reason:{en:'MT is compact but carries limited structured data. ISO 20022 carries richer structured remittance info and better sanctions-screening data. The industry-wide migration is itself a multi-year case study in coordinated legacy modernization across thousands of independent institutions.',vi:'MT gọn nhẹ nhưng hạn chế về dữ liệu có cấu trúc. ISO 20022 mang thông tin remittance có cấu trúc phong phú hơn và dữ liệu sàng lọc trừng phạt tốt hơn. Di trú toàn ngành là case study nhiều năm về hiện đại hóa legacy phối hợp xuyên hàng nghìn tổ chức độc lập.'}},
{layer:'Network',choice:'SWIFTNet — closed private network, not the public internet',reason:{en:'Member institutions connect via dedicated, authenticated infrastructure. The messaging layer for trillions of dollars in payment instructions cannot rely on the public internet trust model.',vi:'Thành viên kết nối qua hạ tầng chuyên dụng, có xác thực. Tầng nhắn tin cho hàng nghìn tỷ đô-la lệnh thanh toán không thể dựa vào mô hình tin cậy internet công cộng.'}},
{layer:'Sanctions screening',choice:'Inline screening as explicit, auditable step in message processing',reason:{en:'Cutting a country off from SWIFT is now a recognized financial sanction — the messaging layer has become a tool of foreign policy. Screening must be inline, auditable, and resilient to false-positive overload.',vi:'Cắt một quốc gia khỏi SWIFT giờ là hình thức trừng phạt tài chính được công nhận — tầng nhắn tin đã trở thành công cụ chính sách đối ngoại. Sàng lọc phải nội tuyến, có thể kiểm toán, và chống chịu quá tải false-positive.'}}
],
tradeoffs:{en:'SWIFTs universal, neutral interoperability is also its systemic vulnerability — concentrating cross-border payment messaging in one network makes it a single point of geopolitical leverage and operational failure risk that no individual bank can mitigate alone.',vi:'Khả năng tương tác phổ quát, trung lập của SWIFT cũng là điểm yếu hệ thống của nó — tập trung nhắn tin thanh toán xuyên biên giới vào một mạng khiến nó trở thành điểm đòn bẩy địa chính trị và điểm rủi ro lỗi vận hành mà không ngân hàng nào có thể tự giảm thiểu.'},
improve:{en:'ISO 20022 migration is the concrete multi-year improvement underway — richer structured data improves automated sanctions screening and straight-through processing, reducing manual intervention and error/fraud risk industry-wide.',vi:'Di trú ISO 20022 là cải tiến cụ thể nhiều năm đang diễn ra — dữ liệu có cấu trúc phong phú hơn cải thiện sàng lọc trừng phạt tự động và xử lý thẳng, giảm can thiệp thủ công và rủi ro lỗi/gian lận.'},
risk:{en:'For Vietnamese bank compliance: SWIFT is the most directly relevant system. Sanctions-screening integration must be: (1) INLINE before message release, never post-hoc; (2) AUDITABLE with full trail of what screened against what list at what timestamp; (3) RESILIENT — a system that blocks too aggressively on false positives creates its own operational risk. These three requirements apply identically to any financial messaging AML/CFT integration.',vi:'Với tuân thủ ngân hàng Việt Nam: SWIFT là hệ thống liên quan trực tiếp nhất. Tích hợp sàng lọc trừng phạt vào đường dẫn nhắn tin phải: (1) NỘI TUYẾN trước khi giải phóng thông điệp, không bao giờ sau; (2) CÓ THỂ KIỂM TOÁN với dấu vết đầy đủ; (3) CHỊU LỖI — hệ thống chặn quá nhiều false positive tự nó tạo ra rủi ro vận hành. Ba yêu cầu này áp dụng giống hệt cho bất kỳ tích hợp AML/CFT hệ thống nhắn tin tài chính nào.'},
diagram:`sequenceDiagram
    participant BankA
    participant SWIFTNet
    participant Screen as Sanctions Screen
    participant BankB
    BankA->>SWIFTNet: pacs.008 instruction
    SWIFTNet->>Screen: Screen vs sanctions lists
    Screen-->>SWIFTNet: Pass / Flag
    alt Pass
        SWIFTNet->>BankB: Deliver instruction
    else Flag
        SWIFTNet->>BankA: Hold for compliance review
    end`,
diagram2:`sequenceDiagram
    participant CorpNet as Corporate Network<br/>(Bank A internal)
    participant CoreBanking as Core Banking System<br/>(Temenos / Finacle / custom)
    participant HSM as Hardware Security Module<br/>(Thales Luna / nCipher)
    participant Alliance as SWIFT Alliance Gateway<br/>(SAG — Bank A's SWIFT node)
    participant SWIFTNet as SWIFTNet<br/>(Private MPLS, not internet<br/>Operated by SWIFT co-op)
    participant AckSvc as SWIFT Acknowledgment<br/>Service
    participant Compliance as Sanctions Screening<br/>(Fircosoft / Actimize / NICE)
    participant Alliance2 as SWIFT Alliance Gateway<br/>(Bank B)
    participant CoreBanking2 as Core Banking System<br/>(Bank B)

    CoreBanking->>Alliance: Payment instruction<br/>ISO 20022 pacs.008 XML<br/>or legacy MT103 FIN
    Note over Alliance: Validate: BIC · IBAN · amount · currency<br/>Enrich: LEI · UETR (Unique End-to-End<br/>Transaction Reference UUID)
    Alliance->>HSM: Sign message<br/>with Bank A private key<br/>(HSM never exports private key)
    HSM-->>Alliance: Digital signature<br/>+ timestamp
    Alliance->>SWIFTNet: Encrypted SFTP<br/>over SWIFTNet MPLS circuit<br/>Not public internet<br/>MX or FIN format
    SWIFTNet->>AckSvc: Send ACK<br/>(delivery confirmation)
    AckSvc-->>Alliance: ACK001 (accepted)<br/>or NAK (rejected + reason)
    SWIFTNet->>Compliance: Screen payload:<br/>Originator · Beneficiary · Purpose<br/>vs OFAC SDN · EU · UN · local lists
    alt Clean — no match
        Compliance-->>SWIFTNet: PASS — release message
        SWIFTNet->>Alliance2: Deliver pacs.008<br/>to Bank B SWIFT node
        Alliance2->>CoreBanking2: Credit instruction<br/>+ UETR for tracking
        CoreBanking2-->>Alliance2: Credited confirmation
        Alliance2->>SWIFTNet: gpi Tracker update<br/>(ISO 20022 camt.054)
        SWIFTNet-->>Alliance: gpi status: ACSC<br/>(settled + confirmed)
    else Potential match — false positive review
        Compliance-->>SWIFTNet: HOLD — manual review
        SWIFTNet-->>Alliance: FIN notification: U003<br/>(message under review)
        Note over Compliance: Compliance officer reviews<br/>typically 4hr SLA<br/>Reject or release decision
    else Confirmed match — blocked
        Compliance-->>SWIFTNet: REJECT
        SWIFTNet-->>Alliance: FIN notification: U006<br/>(message rejected)
        Note over Alliance: Mandatory SAR filing<br/>to financial intelligence unit
    end`,
related_patterns:['message-queue','idempotency','audit-trail','inline-validation'],
related_bigs:['fedwire-chips','rtgs-systems','visa-mastercard']},

{id:'fedwire-chips',name:{en:'Fedwire / CHIPS (US)',vi:'Fedwire / CHIPS (Hoa Kỳ)'},category:'paymentrails',tier:4,
tags:['rtgs','net-settlement','central-bank','liquidity-tradeoff'],
summary:{en:'Fedwire is the Federal Reserve RTGS system: every payment settles individually, immediately in central bank money. CHIPS is privately-run net settlement for large-value USD. Together they move trillions daily with zero tolerance for downtime.',vi:'Fedwire là hệ thống RTGS của Fed: mỗi khoản thanh toán quyết toán riêng lẻ, ngay lập tức bằng tiền ngân hàng trung ương. CHIPS là thanh toán ròng tư nhân cho USD giá trị lớn. Cùng nhau di chuyển hàng nghìn tỷ mỗi ngày với độ dung sai ngừng hoạt động bằng không.'},
why:{en:'The two systems illustrate the fundamental tension: gross settlement (every transaction settles immediately — simple, certain, expensive in liquidity) vs. net settlement (netted in batches — efficient, but carries intraday settlement risk until the netting cycle completes).',vi:'Hai hệ thống minh họa căng thẳng cơ bản: thanh toán tổng (mỗi giao dịch quyết toán ngay — đơn giản, chắc chắn, tốn thanh khoản) so với thanh toán ròng (bù trừ theo lô — hiệu quả, nhưng mang rủi ro thanh toán trong ngày đến khi chu kỳ hoàn tất).'},
stack:[
{layer:'Fedwire model',choice:'Real-Time Gross Settlement in central bank money',reason:{en:'Each payment settles across accounts at the Fed itself — settlement in central bank money is the highest form of finality, eliminating counterparty risk between paying and receiving institutions.',vi:'Mỗi khoản thanh toán quyết toán qua tài khoản tại chính Fed — quyết toán bằng tiền ngân hàng trung ương là hình thức chung cuộc cao nhất, loại bỏ rủi ro đối tác giữa tổ chức trả và nhận.'}},
{layer:'CHIPS model',choice:'Continuous net settlement with loss-sharing and collateral rules',reason:{en:'CHIPS nets offsetting payments throughout the day; loss-sharing and collateral rules manage the unwind if a major participant fails mid-cycle. Decades of regulatory evolution produced these rules.',vi:'CHIPS bù trừ các khoản thanh toán đối ứng suốt ngày; quy tắc chia sẻ tổn thất và thế chấp quản lý việc tháo gỡ nếu bên tham gia lớn thất bại giữa chu kỳ. Nhiều thập niên tiến hóa quy định tạo ra các quy tắc này.'}},
{layer:'Resilience',choice:'Geographically redundant hot failover, tested through regular drills',reason:{en:'Redundancy that has never been tested is not redundancy — both systems run regular failover drills because zero downtime tolerance demands verified, not theoretical, resilience.',vi:'Dự phòng chưa từng được kiểm thử không phải là dự phòng — cả hai hệ thống chạy diễn tập failover thường xuyên vì độ dung sai ngừng hoạt động bằng không đòi hỏi khả năng phục hồi đã được xác minh, không phải lý thuyết.'}}
],
tradeoffs:{en:'RTGS trades liquidity efficiency for settlement certainty. Net settlement trades certainty for efficiency. No free lunch — only a documented, deliberate choice between them with explicit rules for the failure case.',vi:'RTGS đánh đổi hiệu quả thanh khoản để lấy sự chắc chắn quyết toán. Thanh toán ròng đánh đổi sự chắc chắn để lấy hiệu quả. Không có bữa trưa miễn phí — chỉ có lựa chọn có ghi nhận, có chủ đích giữa hai bên với quy tắc tường minh cho trường hợp thất bại.'},
improve:{en:'Industry direction: extend RTGS hours toward 24/7 (FedNow in US launched 2023) and integrate ISO 20022 richer messaging for better straight-through processing and fraud detection.',vi:'Hướng đi ngành: mở rộng giờ RTGS về phía 24/7 (FedNow ở Mỹ ra mắt 2023) và tích hợp nhắn tin ISO 20022 phong phú hơn để xử lý thẳng và phát hiện gian lận tốt hơn.'},
risk:{en:'The Fedwire/CHIPS contrast is the clearest illustration of the consistency-vs-liquidity tradeoff. A debt management system must NEVER mark a repayment as final based solely on an internal status update — only on settlement confirmation from the actual payment rail (NAPAS/SBV in Vietnam). Internal status is not the same as settled. Any gap between these two views is operational risk.',vi:'Sự đối lập Fedwire/CHIPS là minh họa rõ ràng nhất về đánh đổi consistency-liquidity. Hệ thống quản lý nợ KHÔNG BAO GIỜ nên đánh dấu khoản trả nợ là chung cuộc chỉ dựa trên cập nhật trạng thái nội bộ — chỉ khi có xác nhận quyết toán từ hệ thống thanh toán thực tế (NAPAS/SBV ở Việt Nam). Trạng thái nội bộ không bằng đã quyết toán.'},

summary:{en:'Most central banks run their own RTGS — architecturally closest to what a Vietnamese bank debt management system interacts with indirectly through SBV interbank system and NAPAS.',vi:'Hầu hết ngân hàng trung ương vận hành RTGS riêng — về kiến trúc gần nhất với những gì hệ thống quản lý nợ ngân hàng Việt Nam tương tác gián tiếp qua hệ thống liên ngân hàng SBV và NAPAS.'},
why:{en:'A national RTGS is simultaneously critical national infrastructure, a regulatory enforcement point, and a real-time system — three roles pulling design priorities in different directions.',vi:'RTGS quốc gia đồng thời là hạ tầng quốc gia trọng yếu, điểm thực thi quy định, và hệ thống thời gian thực — ba vai trò kéo các ưu tiên thiết kế theo hướng khác nhau.'},
stack:[
{layer:'Settlement',choice:'RTGS in central bank money + fast-payment complement (NAPAS)',reason:{en:'RTGS handles large-value, time-critical transfers. NAPAS handles high-volume, lower-value retail. Split workload by value and urgency rather than forcing one system to serve both profiles.',vi:'RTGS xử lý chuyển khoản giá trị lớn, nhạy cảm thời gian. NAPAS xử lý bán lẻ khối lượng lớn, giá trị thấp hơn. Chia khối lượng theo giá trị và độ khẩn cấp thay vì buộc một hệ thống phục vụ cả hai hồ sơ.'}},
{layer:'Oversight',choice:'Real-time transaction visibility for central bank',reason:{en:'Unlike private networks, RTGS is operated by the regulator itself — direct visibility into systemic liquidity flows for macroprudential oversight that private rails cannot offer.',vi:'Khác với mạng tư nhân, RTGS được vận hành bởi chính cơ quan quản lý — khả năng quan sát trực tiếp các dòng chảy thanh khoản hệ thống cho giám sát vĩ mô thận trọng mà các hệ thống tư nhân không thể cung cấp.'}}
],
tradeoffs:{en:'Central bank as both operator and regulator of its own RTGS creates inherent governance tension: the institution responsible for uptime is also judging whether it performed adequately. Most jurisdictions address this with independent audit and published SLA reporting.',vi:'Ngân hàng trung ương vừa là người vận hành vừa là cơ quan quản lý RTGS tạo ra căng thẳng quản trị nội tại: tổ chức chịu trách nhiệm về thời gian hoạt động cũng đánh giá hệ thống có hoạt động đầy đủ hay không. Hầu hết khu vực pháp lý giải quyết bằng kiểm toán độc lập và báo cáo SLA được công bố.'},
improve:{en:'Global direction: extend RTGS hours toward 24/7, improve interoperability between domestic RTGS and cross-border rails, reduce friction and cost of moving from domestic fast-payment to international settlement.',vi:'Hướng đi toàn cầu: mở rộng giờ RTGS về phía 24/7, cải thiện khả năng tương tác giữa RTGS trong nước và hệ thống thanh toán xuyên biên giới, giảm ma sát và chi phí.'},
risk:{en:'For Vietnamese banks specifically: a debt management system touching loan disbursement and repayment ultimately settles through NAPAS/SBV. Reconciliation between internal ledger (loan repaid internal status) and external settlement confirmation (NAPAS transfer settled) is a CRITICAL control point. Any lag, gap, or mismatch between these two views is the exact operational risk technology risk frameworks are built to detect.',vi:'Cụ thể cho ngân hàng Việt Nam: hệ thống quản lý nợ chạm vào giải ngân và thu hồi khoản vay cuối cùng quyết toán qua NAPAS/SBV. Đối soát giữa sổ cái nội bộ (trạng thái đã trả nợ nội bộ) và xác nhận quyết toán bên ngoài (NAPAS chuyển đã quyết toán) là ĐIỂM KIỂM SOÁT THEN CHỐT. Bất kỳ độ trễ, khoảng cách, hay sai lệch nào = đúng loại rủi ro vận hành khung rủi ro công nghệ được xây để phát hiện.'},

{id:'visa-mastercard',name:{en:'Visa / Mastercard Transaction Networks',vi:'Mạng lưới Giao dịch Visa / Mastercard'},category:'paymentrails',tier:5,
tags:['card-networks','offline-auth','fraud-detection','sub-second','decoupled-settlement'],
summary:{en:'Handle tens of thousands of transactions per second globally with sub-second authorization, real-time fraud detection, AND offline authorization logic for connectivity loss — three requirements that normally trade off against each other.',vi:'Xử lý hàng chục nghìn giao dịch mỗi giây toàn cầu với xác thực dưới một giây, phát hiện gian lận thời gian thực, VÀ logic xác thực ngoại tuyến khi mất kết nối — ba yêu cầu thường đánh đổi lẫn nhau.'},
why:{en:'Authorize a payment in under 1 second globally while running real-time fraud scoring AND degrade gracefully to offline-capable logic when connectivity fails.',vi:'Xác thực thanh toán trong dưới 1 giây toàn cầu trong khi chạy điểm gian lận thời gian thực VÀ suy giảm nhẹ nhàng về logic ngoại tuyến khi kết nối lỗi.'},
stack:[
{layer:'Authorization routing',choice:'Global network of switches routing acquirer to issuer and back',reason:{en:'Visa/Mastercard operate the switch, not the accounts. Merchant bank (acquirer) sends auth request; switch routes to cardholder bank (issuer); response returns in under 1 second.',vi:'Visa/Mastercard vận hành công tắc, không phải tài khoản. Ngân hàng người bán (acquirer) gửi yêu cầu xác thực; công tắc định tuyến đến ngân hàng chủ thẻ (issuer); phản hồi trả về trong dưới 1 giây.'}},
{layer:'Offline authorization',choice:'EMV chip cryptograms with pre-loaded offline risk parameters',reason:{en:'The chip carries cryptographic logic and risk thresholds (max consecutive offline transactions, max cumulative offline amount). A terminal with no connectivity can conditionally approve within bounded risk exposure. The limit IS the explicit risk appetite, encoded in hardware.',vi:'Con chip mang logic mã hóa và ngưỡng rủi ro (số giao dịch ngoại tuyến liên tiếp tối đa, số tiền tối đa). Thiết bị đầu cuối không có kết nối có thể phê duyệt có điều kiện trong giới hạn rủi ro phơi nhiễm có giới hạn. Giới hạn LÀ khẩu vị rủi ro tường minh, được mã hóa trong phần cứng.'}},
{layer:'Fraud detection',choice:'Real-time scoring models within the authorization window',reason:{en:'Fraud score computed and factored into approve/decline within the same sub-second window as authorization. Forces fraud models to be optimized for inference LATENCY, not just accuracy.',vi:'Điểm gian lận được tính và đưa vào quyết định duyệt/từ chối trong cùng cửa sổ dưới một giây. Buộc mô hình gian lận được tối ưu cho ĐỘ TRỄ suy luận, không chỉ độ chính xác.'}},
{layer:'Settlement',choice:'Batch net settlement, decoupled from real-time authorization',reason:{en:'Authorization (instant approved moment) and settlement (actual fund movement) are deliberately decoupled — authorization must be instant, settlement can batch overnight. Different risks managed at different times.',vi:'Xác thực (khoảnh khắc được duyệt tức thời) và quyết toán (di chuyển tiền thực sự) được chủ đích tách rời về thời gian — xác thực phải tức thời, quyết toán có thể theo lô qua đêm. Rủi ro khác nhau được quản lý vào các thời điểm khác nhau.'}}
],
tradeoffs:{en:'Offline authorization is deliberate, bounded risk acceptance — the network accepts some transactions approved against stale rules in exchange for not blocking commerce when connectivity fails. The bound (max offline amount/count) is the explicit risk appetite encoded in hardware.',vi:'Xác thực ngoại tuyến là chấp nhận rủi ro có chủ đích, có giới hạn — mạng chấp nhận một số giao dịch được duyệt theo quy tắc lỗi thời để đổi lấy việc không chặn thương mại khi kết nối lỗi. Giới hạn (số tiền/số lượng ngoại tuyến tối đa) là khẩu vị rủi ro tường minh được mã hóa vào phần cứng.'},
improve:{en:'Direction: tighten offline risk parameters as connectivity improves globally; push more fraud model sophistication to network-level shared intelligence (patterns across issuers) since fraud patterns span multiple institutions.',vi:'Hướng đi: thắt chặt thông số rủi ro ngoại tuyến khi kết nối toàn cầu cải thiện; đẩy mạnh sự tinh vi của mô hình gian lận sang trí tuệ chia sẻ cấp mạng lưới (mẫu hình xuyên các issuer).'},
risk:{en:'The authorization/settlement decoupling is a generally applicable pattern: separate the fast, bounded-risk decision (approve this action now, within known limits) from the slow, full-reconciliation process (confirm and finalize later). Applicable to loan disbursement approval (fast, bounded) vs. full compliance/credit reconciliation (slower, thorough). Offline-authorization risk bounds are a template for graceful degradation with explicit limits.',vi:'Tách rời xác thực/quyết toán là pattern áp dụng tổng quát: tách quyết định nhanh, rủi ro có giới hạn (duyệt hành động này ngay, trong giới hạn đã biết) khỏi quy trình đối soát đầy đủ, chậm hơn. Áp dụng cho phê duyệt giải ngân khoản vay (nhanh, giới hạn) vs. đối soát tuân thủ/tín dụng đầy đủ (chậm hơn, kỹ lưỡng).'},

{id:'upi-india',name:{en:'UPI (India)',vi:'UPI (Ấn Độ)'},category:'paymentrails',tier:3,
tags:['fast-payments','public-infrastructure','vpa','emerging-market','governance'],
summary:{en:'Public-sector-led real-time payments system that scaled to billions of monthly transactions — studied as a model for digital payment infrastructure in emerging markets, directly relevant to Vietnam fintech trajectory.',vi:'Hệ thống thanh toán thời gian thực do khu vực công dẫn dắt, mở rộng đến hàng tỷ giao dịch hàng tháng — được nghiên cứu như mô hình cho hạ tầng thanh toán số ở thị trường mới nổi, liên quan trực tiếp đến quỹ đạo fintech Việt Nam.'},
why:{en:'UPI had to solve interoperability across hundreds of banks of vastly different technical maturity, design for near-zero transaction costs, and do this as public infrastructure — governance and standard-setting had to come before any single institution technology.',vi:'UPI phải giải quyết khả năng tương tác xuyên hàng trăm ngân hàng mức độ trưởng thành kỹ thuật rất khác nhau, thiết kế cho chi phí giao dịch gần như bằng không, và làm điều này như hạ tầng công — quản trị và thiết lập tiêu chuẩn phải đến trước công nghệ của bất kỳ tổ chức đơn lẻ nào.'},
stack:[
{layer:'Governance',choice:'NPCI (not-for-profit, central standard-setter)',reason:{en:'Single neutral body defines the standard API every participating bank must implement — centralized standardization dramatically lowers integration cost for the entire ecosystem. Prevents race to incompatible proprietary APIs.',vi:'Cơ quan trung lập duy nhất định nghĩa API chuẩn mà mọi ngân hàng tham gia phải triển khai — chuẩn hóa tập trung làm giảm đáng kể chi phí tích hợp. Ngăn cuộc đua API độc quyền không tương thích.'}},
{layer:'Addressing',choice:'Virtual Payment Address (name@bank)',reason:{en:'Abstracts payee identifier from actual account number — reduces account-number fraud, lets users switch banks without breaking payment relationships.',vi:'Trừu tượng hóa định danh người nhận khỏi số tài khoản thực — giảm gian lận số tài khoản, cho phép người dùng chuyển ngân hàng mà không phá vỡ quan hệ thanh toán.'}},
{layer:'Settlement',choice:'Near-real-time settlement via RTGS-adjacent infrastructure',reason:{en:'Unlike card networks that decouple auth from settlement, UPI settles near-real-time directly between bank accounts — eliminates merchant fees and settlement lag. Designed for near-zero cost for small transactions.',vi:'Khác với mạng thẻ tách rời xác thực khỏi quyết toán, UPI quyết toán gần thời gian thực trực tiếp giữa các tài khoản ngân hàng — loại bỏ phí người bán và độ trễ quyết toán. Thiết kế để chi phí gần như bằng không cho giao dịch nhỏ.'}}
],
tradeoffs:{en:'UPI near-zero transaction cost model (which drove explosive adoption) generates very little direct revenue per transaction for participating banks — ongoing debate about long-term infrastructure investment sustainability vs. public-good value.',vi:'Mô hình chi phí giao dịch gần như bằng không của UPI (thúc đẩy áp dụng bùng nổ) tạo ra rất ít doanh thu trực tiếp mỗi giao dịch cho các ngân hàng tham gia — tranh luận liên tục về tính bền vững đầu tư hạ tầng dài hạn vs. giá trị hàng hóa công.'},
improve:{en:'NPCI direction: expand UPI internationally (cross-border acceptance partnerships with Singapore, UAE, France) and add credit-line-on-UPI, extending the rail beyond simple debit transfers.',vi:'Hướng đi NPCI: mở rộng UPI ra quốc tế (đối tác chấp nhận xuyên biên giới với Singapore, UAE, Pháp) và thêm hạn mức tín dụng trên UPI, mở rộng hệ thống vượt ra ngoài chuyển khoản ghi nợ đơn giản.'},
risk:{en:'The single-standard-setter governance model (NPCI) is the most transferable lesson for Vietnam NAPAS: fragmentation risk (each bank/fintech building incompatible payment APIs) is best controlled at the GOVERNANCE LAYER before it becomes a technical problem. A regulator-mandated common standard prevents a much larger and harder-to-fix interoperability risk accumulating across dozens of independent institutions.',vi:'Mô hình quản trị một-chuẩn-duy-nhất (NPCI) là bài học có thể chuyển giao nhất cho NAPAS Việt Nam: rủi ro phân mảnh (mỗi ngân hàng/fintech xây API thanh toán không tương thích) được kiểm soát tốt nhất ở TẦNG QUẢN TRỊ trước khi trở thành vấn đề kỹ thuật.'},

{id:'nasdaq-inet',name:{en:'NASDAQ INET (Matching Engine)',vi:'NASDAQ INET (Bộ máy Khớp lệnh)'},category:'exchanges',tier:5,
tags:['matching-engine','sub-100us','determinism','single-threaded','order-book'],
summary:{en:'Rebuilt from scratch in the 2000s for ultra-low latency — one of the few exchanges to publish architectural details. Processes 1M+ messages per second with sub-100 microsecond tail latency. The de-facto reference architecture for matching engines.',vi:'Được xây lại từ đầu thập niên 2000 cho độ trễ siêu thấp — một trong số ít sàn công bố chi tiết kiến trúc. Xử lý 1M+ thông điệp mỗi giây với tail latency dưới 100 microsecond. Kiến trúc tham chiếu mặc định cho bộ máy khớp lệnh.'},
why:{en:'Must produce a single, deterministic, strictly-ordered sequence of trades from concurrent incoming orders, with zero tolerance for two participants disagreeing on which order arrived first, at 1M+ messages per second with sub-100 microsecond tail latency.',vi:'Phải tạo ra một chuỗi giao dịch duy nhất, tất định, có thứ tự nghiêm ngặt từ các lệnh đến đồng thời, với độ dung sai bằng không cho việc hai bên bất đồng về lệnh nào đến trước, ở 1M+ thông điệp mỗi giây với tail latency dưới 100 microsecond.'},
stack:[
{layer:'Matching core',choice:'Single-threaded, event-driven per symbol',reason:{en:'Counter-intuitively, single-threading the matching logic eliminates lock contention entirely. Determinism comes from sequential processing. Fastest implementations achieve approximately 14 microsecond door-to-door latency.',vi:'Ngược với trực giác, đơn-luồng hóa logic khớp lệnh loại bỏ hoàn toàn tranh chấp khóa. Tính tất định đến từ xử lý tuần tự. Các triển khai nhanh nhất đạt khoảng 14 microsecond độ trễ đầu-đến-đầu.'}},
{layer:'Order book',choice:'In-memory price-indexed structures (zero disk access)',reason:{en:'Entire order book in RAM; data structure chosen so hot operation (insert/match at best price) is O(1) or O(log N). Zero disk access during matching is non-negotiable at this latency budget.',vi:'Toàn bộ sổ lệnh trong RAM; cấu trúc dữ liệu chọn để thao tác nóng nhất là O(1) hoặc O(log N). Không truy cập đĩa trong lúc khớp lệnh là không thể đàm phán.'}},
{layer:'Protocol',choice:'OUCH (order entry) / ITCH (market data) — binary, fixed-format',reason:{en:'Custom binary protocols far leaner than text-based FIX for the hot path. Every byte saved is nanoseconds saved. ITCH publishes market data as a feed, not a request-response.',vi:'Giao thức nhị phân tùy chỉnh gọn nhẹ hơn nhiều so với FIX văn bản cho đường dẫn nóng. Mỗi byte tiết kiệm là nano-giây tiết kiệm. ITCH phát dữ liệu thị trường như luồng.'}},
{layer:'Inline ack',choice:'Emit OrderAck at ingress, before matching completes',reason:{en:'Acknowledging receipt before match result is known shaves microseconds off perceived round-trip. Actual match proceeds through the deterministic sequence afterward.',vi:'Xác nhận đã nhận trước khi biết kết quả khớp lệnh cắt giảm micro-giây khỏi vòng lặp cảm nhận. Khớp thực tế diễn ra qua chuỗi tất định sau đó.'}}
],
tradeoffs:{en:'Single-threading per symbol bounds throughput by single-core performance — scaling happens by sharding across symbols, not parallelizing within a symbol. Deliberate sacrifice of horizontal scalability for determinism.',vi:'Đơn-luồng hóa theo mã giới hạn thông lượng bởi hiệu năng đơn nhân — mở rộng diễn ra bằng sharding theo mã, không song song hóa trong một mã. Hy sinh có chủ đích khả năng mở rộng ngang để lấy tính tất định.'},
improve:{en:'Modern research focuses on micro-burst resilience — handling short, extreme spikes that can saturate even a well-optimized single-threaded core, through better queue management and admission control during burst windows.',vi:'Nghiên cứu hiện đại tập trung vào khả năng chống chịu micro-burst — xử lý các đợt tăng ngắn, cực mạnh có thể bão hòa ngay cả nhân đơn-luồng đã tối ưu, qua quản lý hàng đợi và kiểm soát admission tốt hơn trong cửa sổ burst.'},
risk:{en:'Price bands, max order size checks, and self-trade prevention run INLINE within the matching path as constant-time validations — the exchange-grade example of risk controls that must execute in the hot path, not as out-of-band checks bypassed under load. Also embodies strict consistency over availability: if the sequencer cannot guarantee order, the system halts rather than risk an ambiguous trade record.',vi:'Băng giá, kiểm tra kích thước lệnh tối đa, và ngăn tự giao dịch chạy NỘI TUYẾN trong đường dẫn khớp lệnh như xác thực thời gian hằng số — ví dụ cấp sàn giao dịch của kiểm soát rủi ro phải thực thi trên đường dẫn nóng, không phải kiểm tra ngoài luồng bị bỏ qua dưới tải. Cũng hiện thân: tính nhất quán nghiêm ngặt hơn tính sẵn sàng.'},

{id:'nyse-pillar',name:{en:'NYSE Pillar',vi:'NYSE Pillar'},category:'exchanges',tier:4,
tags:['unified-platform','multi-asset','shadow-deployment','migration','parallel-run'],
summary:{en:'NYSE unified trading platform handling multiple asset classes (equities, options) on shared low-latency infrastructure — rather than maintaining separate systems per asset class.',vi:'Nền tảng giao dịch hợp nhất của NYSE xử lý nhiều loại tài sản (cổ phiếu, quyền chọn) trên hạ tầng độ trễ thấp chung — thay vì duy trì hệ thống riêng cho mỗi loại tài sản.'},
why:{en:'Consolidating previously separate trading platforms (NYSE, NYSE Arca, NYSE American each had distinct technology) onto one shared core without disrupting live trading is an immense migration challenge layered on top of the raw matching-engine problem.',vi:'Hợp nhất các nền tảng giao dịch trước đây tách biệt (NYSE, NYSE Arca, NYSE American mỗi cái có công nghệ riêng) thành lõi chung mà không gián đoạn giao dịch sống là thách thức di trú khổng lồ chồng lên trên bài toán bộ máy khớp lệnh thô.'},
stack:[
{layer:'Architecture',choice:'Shared matching core with asset-class-specific configuration',reason:{en:'Core matching logic shared; business rules (tick sizes, trading hours, order types) configured per market. Separates the invariant "how matching works" from the variable "what rules apply here".',vi:'Logic khớp lệnh lõi được chia sẻ; quy tắc nghiệp vụ (bước giá, giờ giao dịch, loại lệnh) được cấu hình theo từng thị trường. Tách biệt phần bất biến "cách khớp lệnh hoạt động" khỏi phần biến đổi "quy tắc nào áp dụng ở đây".'}},
{layer:'Migration',choice:'Phased cutover, market by market, with parallel-run validation',reason:{en:'NYSE migrated markets onto Pillar one at a time over years — each validated by running old and new systems in parallel and comparing outputs before fully switching.',vi:'NYSE di trú các thị trường sang Pillar từng cái một trong nhiều năm — mỗi lần xác thực bằng cách chạy song song hệ thống cũ và mới rồi so sánh kết quả trước khi chuyển hẳn.'}}
],
tradeoffs:{en:'Consolidating onto a shared core concentrates risk — a bug in the common matching layer can now potentially affect every asset class simultaneously, whereas previously failures were contained to siloed systems.',vi:'Hợp nhất vào lõi chung tập trung rủi ro — một lỗi trong tầng khớp lệnh chung giờ có thể tiềm năng ảnh hưởng mọi loại tài sản đồng thời, trong khi trước đây lỗi bị giới hạn trong hệ thống cô lập.'},
improve:{en:'The phased cutover with parallel-run validation migration pattern is itself the improvement path. NYSE multi-year timeline shows that rushing a core trading system migration is itself a major risk to avoid.',vi:'Bản thân pattern di trú chuyển đổi theo giai đoạn với xác thực chạy song song chính là con đường cải tiến. Lộ trình nhiều năm của NYSE cho thấy vội vàng di trú hệ thống giao dịch lõi tự nó là rủi ro lớn cần tránh.'},
risk:{en:'Parallel-run validation before cutover is one of the most directly applicable risk controls for any bank modernizing core systems (including a debt management system migrating between platforms): never trust a new system correctness from code review alone — run it in shadow mode against the old system and reconcile outputs before it becomes the system of record.',vi:'Xác thực chạy song song trước khi chuyển đổi là một trong những kiểm soát rủi ro áp dụng trực tiếp nhất cho bất kỳ ngân hàng nào hiện đại hóa hệ thống lõi: không bao giờ tin tính đúng đắn của hệ thống mới chỉ từ code review — chạy ở chế độ shadow song song với hệ thống cũ và đối soát kết quả trước khi nó trở thành hệ thống ghi nhận chính thức.'},

{id:'cme-globex',name:{en:'CME Globex',vi:'CME Globex'},category:'exchanges',tier:5,
tags:['derivatives','futures','circuit-breaker','unscheduled-burst','over-provisioning'],
summary:{en:'Handles futures and derivatives matching with extreme throughput during volatile market events — a strong case study in burst-capacity engineering for UNSCHEDULED spikes, unlike Alibaba predictable Singles Day.',vi:'Xử lý khớp lệnh phái sinh và tương lai với thông lượng cực cao trong các sự kiện thị trường biến động — case study mạnh về kỹ thuật năng lực bùng nổ cho các đợt tăng KHÔNG LÊN LỊCH, khác với Ngày Độc thân có thể dự đoán của Alibaba.'},
why:{en:'Derivatives volume spikes are unscheduled — a surprise central bank statement or geopolitical event can trigger a burst with zero warning. The system must sustain peak-load behavior as a permanent baseline, not something pre-warmed for a known date.',vi:'Các đợt tăng vọt khối lượng phái sinh không được lên lịch — một tuyên bố bất ngờ của ngân hàng trung ương hay sự kiện địa chính trị có thể kích hoạt bùng nổ với gần như không có cảnh báo. Hệ thống phải duy trì hành vi tải đỉnh như năng lực cơ bản thường trực.'},
stack:[
{layer:'Matching engine',choice:'Globex matching with message-rate throttling per participant',reason:{en:'Native support for complex order types (spreads, implied orders) that equity engines do not need. Message-rate throttling prevents a single participant from overwhelming the system during a volatile burst.',vi:'Hỗ trợ sẵn các loại lệnh phức tạp (spread, lệnh ngầm định) mà bộ máy cổ phiếu không cần. Điều tiết tốc độ thông điệp ngăn một bên áp đảo hệ thống trong đợt biến động bùng nổ.'}},
{layer:'Circuit breakers',choice:'Stop Logic + velocity logic — multi-tier price-limit and trading halt',reason:{en:'Automated halts when price moves exceed defined bands within a short window — gives market a forced pause to absorb information rather than letting automated trading feedback loops cause runaway moves.',vi:'Tạm dừng tự động khi biến động giá vượt băng định nghĩa trong cửa sổ ngắn — cho thị trường khoảng dừng bắt buộc để hấp thụ thông tin thay vì để vòng lặp phản hồi giao dịch tự động gây biến động mất kiểm soát.'}},
{layer:'Capacity',choice:'Permanent over-provisioning for unscheduled bursts',reason:{en:'Unlike Alibaba which pre-warms for a known date, CME cannot rely on pre-warming — capacity headroom must exist at all times as standing infrastructure. Higher steady-state cost accepted for burst readiness.',vi:'Khác với Alibaba làm nóng trước cho ngày đã biết, CME không thể dựa vào làm nóng trước — năng lực dự phòng phải tồn tại mọi lúc như hạ tầng thường trực. Chi phí trạng thái ổn định cao hơn được chấp nhận để sẵn sàng cho bùng nổ.'}}
],
tradeoffs:{en:'Permanent over-provisioning for unscheduled bursts is expensive — CME pays for peak capacity year-round, unlike Alibaba which only pays around a known event. This is the direct cost of operating where timing of stress is unpredictable.',vi:'Dự phòng năng lực thường trực cho các đợt bùng nổ không lên lịch tốn kém — CME trả phí cho năng lực đỉnh quanh năm, khác với Alibaba chỉ trả phí quanh sự kiện đã biết. Đây là chi phí trực tiếp của việc vận hành nơi thời điểm áp lực không thể dự đoán.'},
improve:{en:'Industry research on micro-burst resilience: better queue management and admission control during saturation, aiming for graceful degradation (wider but bounded latency) rather than crashing or halting entirely.',vi:'Nghiên cứu ngành về chống chịu micro-burst: quản lý hàng đợi và kiểm soát admission tốt hơn khi bão hòa, hướng tới suy giảm nhẹ nhàng (độ trễ rộng hơn nhưng có giới hạn) thay vì sụp đổ hoặc tạm dừng hoàn toàn.'},
risk:{en:'Stop Logic and velocity-based circuit breakers are the clearest real-world example of "better to halt than process incorrectly" — CME deliberately sacrifices availability to preserve the integrity of price discovery. Exactly the priority ordering technology risk frameworks recommend for financial-grade systems. Alert calibration lesson: circuit breakers triggered too often on noise train participants to ignore them — calibration is a risk control effectiveness problem.',vi:'Stop Logic và circuit breaker dựa trên vận tốc giá là ví dụ thực tế rõ ràng nhất của "thà tạm dừng còn hơn xử lý sai" — CME chủ đích hy sinh tính sẵn sàng để bảo toàn tính toàn vẹn khám phá giá. Đúng thứ tự ưu tiên mà khung rủi ro công nghệ khuyến nghị. Bài học hiệu chỉnh: circuit breaker kích hoạt quá thường xuyên theo tiếng ồn huấn luyện bên tham gia bỏ qua chúng — hiệu chỉnh là vấn đề hiệu quả kiểm soát rủi ro.'},

{id:'hft-systems',name:{en:'HFT Systems (Citadel Securities, Jane Street, Jump Trading)',vi:'Hệ thống HFT (Citadel Securities, Jane Street, Jump Trading)'},category:'exchanges',tier:5,
tags:['microsecond','fpga','kernel-bypass','pre-trade-risk','co-location'],
summary:{en:'Microsecond-level engineering where being a few microseconds slower than a competitor directly means lost profit — mostly proprietary, but general architecture patterns well known from academic research and industry publications.',vi:'Kỹ thuật ở cấp độ micro-giây, chậm hơn đối thủ vài micro-giây trực tiếp đồng nghĩa mất lợi nhuận — phần lớn độc quyền, nhưng các pattern kiến trúc tổng quát được biết rõ từ nghiên cứu học thuật và ấn phẩm ngành.'},
why:{en:'The entire system must be re-engineered around the physical limits of light speed and silicon switching time — software running in an OS with normal scheduling is simply too slow, forcing kernel-bypass networking, FPGA hardware, and physical co-location at exchange data centers.',vi:'Toàn bộ hệ thống phải được tái thiết kế xoay quanh giới hạn vật lý của tốc độ ánh sáng và thời gian chuyển mạch silicon — phần mềm chạy trong OS với lập lịch thông thường đơn giản là quá chậm, buộc phải dùng kernel-bypass networking, phần cứng FPGA, và co-location vật lý tại DC sàn giao dịch.'},
stack:[
{layer:'Networking',choice:'Kernel-bypass (DPDK, Solarflare OpenOnload) + co-location',reason:{en:'OS network stack introduces context-switch overhead measured in microseconds. Kernel-bypass lets the application talk to NIC directly. Co-location eliminates speed-of-light delay by physically sitting in the same DC as the exchange.',vi:'Network stack OS gây chi phí context-switch tính bằng micro-giây. Kernel-bypass cho ứng dụng nói chuyện trực tiếp với NIC. Co-location loại bỏ độ trễ tốc độ ánh sáng bằng cách đặt vật lý cùng DC với sàn giao dịch.'}},
{layer:'Hardware',choice:'FPGAs for order-book parsing and signal generation',reason:{en:'FPGAs process market data feeds and generate trading signals in hardware logic, bypassing software entirely for the most latency-critical path — trading nanoseconds of flexibility for microseconds of speed.',vi:'FPGA xử lý luồng dữ liệu thị trường và tạo tín hiệu giao dịch bằng logic phần cứng, bỏ qua phần mềm hoàn toàn cho đường dẫn nhạy cảm độ trễ nhất — đánh đổi linh hoạt nano-giây để lấy tốc độ micro-giây.'}},
{layer:'Pre-trade risk gates',choice:'Hardware-embedded risk checks in FPGA logic',reason:{en:'Risk limits (max order size, max position) must be checked before an order leaves the firm even at this speed. These checks are baked into FPGA logic so they add negligible latency — risk controls in the hot path, not the slow path.',vi:'Giới hạn rủi ro (kích thước lệnh tối đa, vị thế tối đa) phải được kiểm tra trước khi lệnh rời công ty ngay cả ở tốc độ này. Các kiểm tra này được nhúng vào logic FPGA để gần như không thêm độ trễ — kiểm soát rủi ro trên đường dẫn nóng, không phải đường dẫn chậm.'}},
{layer:'Code',choice:'Statically compiled, allocation-free C++ with custom memory pools',reason:{en:'No garbage collection, no dynamic memory allocation on the hot path. Every microsecond of unpredictability (like a GC pause) is unacceptable — memory pre-allocated and reused.',vi:'Không garbage collection, không cấp phát bộ nhớ động trên đường dẫn nóng. Mọi micro-giây không thể dự đoán (như lần dừng GC) đều không thể chấp nhận — bộ nhớ được cấp phát trước và tái sử dụng.'}}
],
tradeoffs:{en:'Extreme latency optimization sacrifices almost all flexibility — even a minor logic change can shift latency by nanoseconds that matter competitively. Hardware/co-location investment is a massive fixed cost only firms with sufficient trading volume can justify.',vi:'Tối ưu độ trễ cực đoan hy sinh gần như toàn bộ tính linh hoạt — ngay cả thay đổi logic nhỏ cũng có thể dịch chuyển độ trễ vài nano-giây có ý nghĩa cạnh tranh. Đầu tư phần cứng/co-location là chi phí cố định khổng lồ chỉ các công ty có đủ khối lượng giao dịch mới hợp lý hóa được.'},
improve:{en:'Industry direction: deeper hardware integration (smart NICs, in-network computing) and more sophisticated pre-trade risk hardware that adds zero perceptible latency — the arms race is now as much about risk-check speed as about trading signal speed.',vi:'Hướng đi ngành: tích hợp phần cứng sâu hơn (smart NIC, in-network computing) và phần cứng kiểm tra rủi ro trước giao dịch tinh vi hơn mà gần như không thêm độ trễ — cuộc đua vũ trang giờ cũng nhiều về tốc độ kiểm tra rủi ro như về tốc độ tín hiệu giao dịch.'},
risk:{en:'Pre-trade risk gates embedded in hardware are the canonical "kill switches that are tested, not theoretical" — must trigger correctly even under maximum throughput (the exact stress condition where naive software risk checks would be skipped under load). THE most transferable lesson: RISK CONTROLS CANNOT BE AN AFTERTHOUGHT ON THE SLOW PATH. This applies identically to any latency-sensitive financial system — debt management systems included.',vi:'Cổng kiểm tra rủi ro trước giao dịch được nhúng vào phần cứng là ví dụ kinh điển của kill switch được kiểm thử, không chỉ tồn tại trên giấy — phải kích hoạt đúng ngay cả ở thông lượng tối đa. BÀI HỌC CÓ THỂ CHUYỂN GIAO NHẤT: KIỂM SOÁT RỦI RO KHÔNG THỂ LÀ SAU CÙNG TRÊN ĐƯỜNG DẪN CHẬM.'},

{id:'cap-theorem',name:{en:'CAP Theorem',vi:'Định lý CAP'},category:'foundation',complexity:'conceptual',
origin:{en:'Eric Brewer (2000 PODC keynote), formally proved by Gilbert & Lynch (2002). The most influential theorem in distributed systems design.',vi:'Eric Brewer (keynote PODC 2000), chứng minh chính thức bởi Gilbert & Lynch (2002). Định lý ảnh hưởng nhất trong thiết kế hệ thống phân tán.'},
what:{en:'A distributed system can guarantee at most 2 of 3: Consistency (every read sees the latest write), Availability (every request gets a response), Partition Tolerance (system continues operating if network partitions occur). Since network partitions are unavoidable in practice, the real choice is C vs A during a partition.',vi:'Hệ thống phân tán chỉ có thể đảm bảo tối đa 2 trong 3: Consistency (mọi đọc thấy ghi mới nhất), Availability (mọi request được phản hồi), Partition Tolerance (hệ thống tiếp tục hoạt động khi mạng bị phân vùng). Vì partition mạng không thể tránh khỏi trong thực tế, lựa chọn thực sự là C vs A trong khi có partition.'},
when:{en:'When designing any distributed storage or data service — the choice between CP (e.g. HBase, Zookeeper) and AP (e.g. Cassandra, DynamoDB in default mode) must be made explicitly based on whether data correctness or availability is the higher priority for a given use case.',vi:'Khi thiết kế bất kỳ lưu trữ phân tán hay dịch vụ dữ liệu nào — lựa chọn giữa CP (vd: HBase, Zookeeper) và AP (vd: Cassandra, DynamoDB mặc định) phải được thực hiện tường minh dựa trên việc tính đúng đắn dữ liệu hay tính sẵn sàng là ưu tiên cao hơn cho use case cụ thể.'},
pros:{en:'Forces explicit, documented tradeoff decisions rather than implicit drift toward whichever property is easiest to implement.',vi:'Buộc các quyết định đánh đổi tường minh, có ghi nhận thay vì trôi dạt ngầm về phía thuộc tính nào dễ triển khai nhất.'},
cons:{en:'The theorem is often misapplied — real systems offer a spectrum, not a binary choice. PACELC model (Abadi 2012) extends CAP to also capture the latency/consistency tradeoff even when no partition exists.',vi:'Định lý thường bị áp dụng sai — hệ thống thực tế cung cấp một phổ liên tục, không phải lựa chọn nhị phân. Mô hình PACELC (Abadi 2012) mở rộng CAP để nắm bắt đánh đổi độ trễ/nhất quán ngay cả khi không có partition.'},
risk:{en:'For financial systems: the default should be CP. A bank balance or loan ledger that returns an available but stale response is worse than returning an error. Explicitly document which data stores are CP vs AP and ensure AP stores are only used for genuinely availability-tolerant data (logs, metrics, audit trails where eventual arrival is acceptable).',vi:'Cho hệ thống tài chính: mặc định nên là CP. Số dư ngân hàng hay sổ cái khoản vay trả về phản hồi sẵn có nhưng lỗi thời còn tệ hơn trả về lỗi. Ghi nhận tường minh các data store nào là CP vs AP và đảm bảo store AP chỉ được dùng cho dữ liệu thực sự chịu được eventually-available (log, metric, audit trail nơi đến muộn vẫn chấp nhận được).'},
diagram:`flowchart LR
    subgraph CAP Triangle
      C[Consistency]
      A[Availability]
      P[Partition Tolerance]
    end
    C---A
    A---P
    P---C
    CP["CP examples:\nSpanner, HBase,\nZookeeper, etcd"]
    AP["AP examples:\nDynamoDB, Cassandra,\nCouchDB"]`,
related_bigs:['google','amazon-aws','fedwire-chips']},

{id:'consistent-hashing',name:{en:'Consistent Hashing',vi:'Băm nhất quán'},category:'foundation',complexity:'O(log N)',
origin:{en:'Karger et al. (1997). Designed to solve the problem of remapping data when nodes are added or removed from a distributed hash table.',vi:'Karger et al. (1997). Được thiết kế để giải quyết vấn đề remap dữ liệu khi node được thêm vào hoặc xóa khỏi bảng hash phân tán.'},
what:{en:'Maps both data keys and server nodes onto a circular hash ring. Each key is assigned to the nearest node clockwise on the ring. When a node is added or removed, only the keys on the adjacent arc need to be remapped — O(K/N) keys instead of all K keys.',vi:'Ánh xạ cả khóa dữ liệu và node máy chủ lên một vòng hash tròn. Mỗi khóa được gán cho node gần nhất theo chiều kim đồng hồ trên vòng. Khi node được thêm hoặc xóa, chỉ các khóa trên cung lân cận cần được remap — O(K/N) khóa thay vì toàn bộ K khóa.'},
when:{en:'Any distributed cache or key-value store where nodes can be added/removed dynamically without a full re-partition. Used in: Dynamo, Cassandra, Memcached clusters, Uber Ringpop, CDN edge routing.',vi:'Bất kỳ cache phân tán hay key-value store nào mà node có thể được thêm/xóa động mà không cần phân vùng lại toàn bộ. Được dùng trong: Dynamo, Cassandra, Memcached cluster, Uber Ringpop, định tuyến edge CDN.'},
pros:{en:'Minimal disruption when topology changes — only a fraction of keys migrate. Naturally load-balances across nodes (with virtual nodes to correct for uneven distribution).',vi:'Gián đoạn tối thiểu khi topology thay đổi — chỉ một phần nhỏ khóa di chuyển. Tự nhiên cân bằng tải xuyên các node (với virtual node để sửa cho phân phối không đều).'},
cons:{en:'Without virtual nodes, the key distribution can be skewed — a node with a large arc on the ring will hold disproportionate data. Virtual nodes (multiple ring positions per physical node) fix this but add complexity.',vi:'Không có virtual node, phân phối khóa có thể bị lệch — một node với cung lớn trên vòng sẽ giữ dữ liệu không cân xứng. Virtual node (nhiều vị trí vòng mỗi node vật lý) sửa điều này nhưng thêm độ phức tạp.'},
risk:{en:'Hot spots on the ring (a node receiving a disproportionate share of requests due to key distribution skew) are an operational risk. Monitor key distribution, not just node count, and add virtual nodes to even out load.',vi:'Điểm nóng trên vòng (một node nhận tỷ lệ request không cân xứng do lệch phân phối khóa) là rủi ro vận hành. Giám sát phân phối khóa, không chỉ số node, và thêm virtual node để cân đều tải.'},
diagram:`flowchart LR
    Ring[" Hash Ring 0–2³² "]
    N1[Node A @ 100]
    N2[Node B @ 200]
    N3[Node C @ 300]
    K1["Key 'user:1' hash=150 → Node B"]
    K2["Key 'user:2' hash=250 → Node C"]`,
related_bigs:['amazon-aws','meta-facebook','uber']},

{id:'sharding',name:{en:'Sharding (Horizontal Partitioning)',vi:'Sharding (Phân vùng ngang)'},category:'foundation',complexity:'O(1) per shard',
origin:{en:'Predates modern distributed systems — the concept of partitioning data across multiple storage nodes has existed since early database systems. Named "sharding" popularized by large-scale web systems in the 2000s.',vi:'Có trước các hệ thống phân tán hiện đại — khái niệm phân vùng dữ liệu xuyên nhiều node lưu trữ đã tồn tại từ các hệ thống database đầu tiên. Tên "sharding" được phổ biến bởi các hệ thống web quy mô lớn trong thập niên 2000.'},
what:{en:'Partition a dataset across multiple independent databases/nodes (shards) such that each shard holds a subset of the data and can be queried independently. Common strategies: range sharding (by ID range), hash sharding (by hash of key), directory sharding (lookup table maps keys to shards).',vi:'Phân vùng tập dữ liệu xuyên nhiều database/node độc lập (shard) sao cho mỗi shard giữ một tập con của dữ liệu và có thể được truy vấn độc lập. Các chiến lược phổ biến: range sharding (theo phạm vi ID), hash sharding (theo hash của khóa), directory sharding (bảng tra cứu ánh xạ khóa đến shard).'},
when:{en:'When a single database instance cannot hold all the data or serve all the query load, and vertical scaling (bigger machine) is no longer cost-effective or available.',vi:'Khi một instance database đơn không thể giữ tất cả dữ liệu hoặc phục vụ tất cả tải truy vấn, và mở rộng dọc (máy lớn hơn) không còn tiết kiệm chi phí hoặc khả thi.'},
pros:{en:'Near-linear horizontal scalability for both storage and read/write throughput. Failure isolation — a shard failure affects only that shard\'s data, not the entire dataset.',vi:'Khả năng mở rộng ngang gần tuyến tính cho cả lưu trữ và thông lượng đọc/ghi. Cô lập lỗi — lỗi shard chỉ ảnh hưởng dữ liệu của shard đó, không phải toàn bộ tập dữ liệu.'},
cons:{en:'Cross-shard queries (JOINs, aggregations across shards) are expensive or impossible — must be done at the application layer. Resharding (rebalancing when adding shards) is operationally complex and risky.',vi:'Truy vấn xuyên shard (JOIN, tổng hợp xuyên shard) tốn kém hoặc không thể — phải thực hiện ở tầng ứng dụng. Resharding (cân bằng lại khi thêm shard) phức tạp về vận hành và rủi ro.'},
risk:{en:'Hot shards (one shard receiving disproportionate traffic due to non-uniform key distribution or business logic) are a common production incident pattern. Design shard keys to distribute load uniformly — a shard key that correlates with time (e.g. created_at) will create a hot shard at the recent end. For financial systems, sharding by account range risks hot shards if high-value accounts cluster.',vi:'Shard nóng (một shard nhận lưu lượng không cân xứng do phân phối khóa không đều hoặc logic nghiệp vụ) là pattern sự cố production phổ biến. Thiết kế khóa shard để phân phối tải đều — khóa shard tương quan với thời gian (vd: created_at) sẽ tạo ra shard nóng ở đầu gần đây. Cho hệ thống tài chính, sharding theo phạm vi tài khoản có nguy cơ shard nóng nếu tài khoản giá trị cao tập trung.',},
diagram:`flowchart LR
    App[Application]-->Router[Shard Router]
    Router-->|"hash(user_id) % 4 = 0"|S0[(Shard 0)]
    Router-->|"hash(user_id) % 4 = 1"|S1[(Shard 1)]
    Router-->|"hash(user_id) % 4 = 2"|S2[(Shard 2)]
    Router-->|"hash(user_id) % 4 = 3"|S3[(Shard 3)]`,
related_bigs:['amazon-aws','meta-facebook','nasdaq-inet']},

{id:'paxos-raft-consensus',name:{en:'Paxos / Raft Consensus',vi:'Đồng thuận Paxos / Raft'},category:'consistency',complexity:'O(n) messages per round',
origin:{en:'Paxos: Leslie Lamport (1989, published 1998 "The Part-Time Parliament"). Raft: Ongaro & Ousterhout (2014), explicitly designed to be more understandable than Paxos while providing the same guarantees.',vi:'Paxos: Leslie Lamport (1989, xuất bản 1998 "The Part-Time Parliament"). Raft: Ongaro & Ousterhout (2014), được thiết kế tường minh để dễ hiểu hơn Paxos trong khi cung cấp cùng đảm bảo.'},
what:{en:'Distributed consensus algorithms that allow a cluster of nodes to agree on a single value (or sequence of values) even if some nodes fail. Raft decomposes the problem into leader election, log replication, and safety. A quorum (majority) of nodes must agree for any decision to commit.',vi:'Thuật toán đồng thuận phân tán cho phép một cluster các node thống nhất về một giá trị đơn (hoặc chuỗi giá trị) ngay cả khi một số node lỗi. Raft phân tách bài toán thành bầu chọn leader, replication log, và an toàn. Quorum (đa số) các node phải đồng ý để bất kỳ quyết định nào được commit.'},
when:{en:'Any system needing a distributed source of truth: distributed locks (ZooKeeper, etcd), replicated state machines, distributed databases (CockroachDB, TiKV, Spanner\'s Paxos groups), leader election for HA systems.',vi:'Bất kỳ hệ thống nào cần nguồn chân lý phân tán: khóa phân tán (ZooKeeper, etcd), máy trạng thái được replicated, database phân tán (CockroachDB, TiKV, nhóm Paxos của Spanner), bầu chọn leader cho hệ thống HA.'},
pros:{en:'Provides safety (never returns wrong result) and liveness (always makes progress if a majority are available) under node failures and message delays.',vi:'Cung cấp an toàn (không bao giờ trả về kết quả sai) và hoạt động (luôn tiến triển nếu đa số sẵn sàng) dưới các lỗi node và độ trễ thông điệp.'},
cons:{en:'Requires a quorum (majority) of nodes, so tolerates at most floor((n-1)/2) failures. A 3-node cluster tolerates 1 failure; a 5-node cluster tolerates 2. Write latency is at least one round-trip to a quorum.',vi:'Đòi hỏi quorum (đa số) các node, do đó chịu được tối đa floor((n-1)/2) lỗi. Cluster 3 node chịu được 1 lỗi; cluster 5 node chịu được 2. Độ trễ ghi ít nhất là một vòng khứ hồi đến quorum.'},
risk:{en:'Network partitions that isolate the leader can cause a new leader to be elected — the old leader may briefly believe it is still leader ("split brain" risk). Raft\'s design prevents this by requiring the new leader to have the most up-to-date log, but implementations must handle the transition window carefully. For financial systems: consensus-based metadata (e.g. which node is the current primary) should NEVER be stored in the consensus system itself — circular dependency.',vi:'Partition mạng cô lập leader có thể gây ra bầu chọn leader mới — leader cũ có thể tạm thời tin rằng nó vẫn là leader (rủi ro "split brain"). Thiết kế của Raft ngăn điều này bằng cách yêu cầu leader mới phải có log cập nhật nhất, nhưng các triển khai phải xử lý cửa sổ chuyển tiếp cẩn thận. Cho hệ thống tài chính: metadata dựa trên đồng thuận (vd: node nào là primary hiện tại) KHÔNG BAO GIỜ nên được lưu trong chính hệ thống đồng thuận — phụ thuộc vòng.'},
diagram:`sequenceDiagram
    participant C as Client
    participant L as Leader
    participant F1 as Follower 1
    participant F2 as Follower 2
    C->>L: Write request
    L->>F1: AppendEntries (log replication)
    L->>F2: AppendEntries
    F1-->>L: Ack
    F2-->>L: Ack
    Note over L: Quorum reached (2 of 3)
    L-->>C: Committed`,
related_bigs:['google','linkedin-kafka','fedwire-chips']},

{id:'strong-consistency',name:{en:'Strong / Linearizable Consistency',vi:'Nhất quán Mạnh / Tuyến tính'},category:'consistency',complexity:'Higher latency, lower availability',
origin:{en:'Herlihy & Wing (1990) "Linearizability: A Correctness Condition for Concurrent Objects" — the gold standard definition of what "consistent" means for concurrent systems.',vi:'Herlihy & Wing (1990) "Linearizability: A Correctness Condition for Concurrent Objects" — định nghĩa tiêu chuẩn vàng về "nhất quán" có nghĩa là gì cho các hệ thống đồng thời.'},
what:{en:'Every operation appears to take effect instantaneously at a single point in time between its start and end, as if executed on a single machine. Any read after a write completes must return that write or a later one. The strongest consistency model — the easiest to reason about, the hardest to provide at scale.',vi:'Mọi thao tác có vẻ như có hiệu lực tức thời tại một thời điểm đơn giữa lúc bắt đầu và kết thúc, như thể được thực thi trên một máy đơn. Bất kỳ đọc nào sau khi ghi hoàn tất phải trả về ghi đó hoặc một ghi sau đó. Mô hình nhất quán mạnh nhất — dễ suy luận nhất, khó cung cấp nhất ở quy mô lớn.'},
when:{en:'Financial balances, inventory counts, distributed locks, any state where reading a stale value would cause incorrect behavior (double-spending, overselling, incorrect loan balance).',vi:'Số dư tài chính, số lượng hàng tồn kho, khóa phân tán, bất kỳ trạng thái nào mà đọc giá trị lỗi thời sẽ gây ra hành vi không chính xác (chi tiêu kép, bán quá hàng, số dư khoản vay không chính xác).'},
pros:{en:'Eliminates an entire class of bugs that arise from reading stale state. Dramatically simplifies application code — developers can reason about the system as if it were a single machine.',vi:'Loại bỏ một lớp lỗi phát sinh từ việc đọc trạng thái lỗi thời. Đơn giản hóa đáng kể code ứng dụng — developer có thể suy luận về hệ thống như thể nó là một máy đơn.'},
cons:{en:'Higher write latency (must wait for quorum acknowledgment). Lower availability during network partitions (the CP choice in CAP). At global scale, the speed-of-light round-trip time to a quorum sets a floor on latency.',vi:'Độ trễ ghi cao hơn (phải chờ xác nhận quorum). Tính sẵn sàng thấp hơn trong partition mạng (lựa chọn CP trong CAP). Ở quy mô toàn cầu, thời gian khứ hồi tốc độ ánh sáng đến quorum đặt ra sàn cho độ trễ.'},
risk:{en:'The most common risk is accidentally using an eventually-consistent store where strong consistency is required. Audit your data store choices against data classification: "would a stale read of this data cause incorrect business behavior?" If yes, the store must provide strong consistency for that data.',vi:'Rủi ro phổ biến nhất là vô tình sử dụng store eventually-consistent nơi cần strong consistency. Kiểm tra lựa chọn data store của bạn theo phân loại dữ liệu: "đọc lỗi thời dữ liệu này có gây ra hành vi nghiệp vụ không chính xác không?" Nếu có, store phải cung cấp strong consistency cho dữ liệu đó.'},
diagram:`sequenceDiagram
    participant Client1
    participant Client2
    participant DB as Linearizable DB
    Client1->>DB: Write X=5
    DB-->>Client1: Ack (committed)
    Client2->>DB: Read X
    DB-->>Client2: X=5 (guaranteed, never stale)`,
related_bigs:['google','fedwire-chips','nasdaq-inet']},

{id:'eventual-consistency',name:{en:'Eventual Consistency',vi:'Nhất quán Cuối cùng'},category:'consistency',complexity:'Lower latency, higher availability',
origin:{en:'Werner Vogels (Amazon CTO) popularized the term in 2008 "Eventually Consistent" article in ACM Queue, formalizing what the Dynamo paper had demonstrated in practice.',vi:'Werner Vogels (Amazon CTO) phổ biến thuật ngữ này trong bài báo 2008 "Eventually Consistent" trên ACM Queue, hình thức hóa những gì bài báo Dynamo đã chứng minh trong thực tế.'},
what:{en:'If no new writes are made to a data item, all replicas will eventually converge to the same value. Reads may return stale data during the convergence window. Accepts temporary inconsistency in exchange for higher availability and lower latency.',vi:'Nếu không có ghi mới nào được thực hiện lên một mục dữ liệu, tất cả các replica cuối cùng sẽ hội tụ về cùng giá trị. Đọc có thể trả về dữ liệu lỗi thời trong cửa sổ hội tụ. Chấp nhận nhất quán tạm thời không đồng bộ để đổi lấy tính sẵn sàng cao hơn và độ trễ thấp hơn.'},
when:{en:'DNS propagation, social media likes/view counts, shopping cart (merge semantics), CDN cache invalidation, recommendation systems, analytics dashboards — any case where brief staleness is acceptable and availability is paramount.',vi:'Truyền bá DNS, số lượt like/xem mạng xã hội, giỏ hàng (ngữ nghĩa gộp), vô hiệu hóa cache CDN, hệ thống đề xuất, bảng điều khiển phân tích — bất kỳ trường hợp nào mà lỗi thời ngắn là chấp nhận được và tính sẵn sàng là tối quan trọng.'},
pros:{en:'Higher availability during partitions. Lower write latency (no wait for quorum). Better geographic distribution of writes.',vi:'Tính sẵn sàng cao hơn trong partition. Độ trễ ghi thấp hơn (không chờ quorum). Phân phối ghi theo địa lý tốt hơn.'},
cons:{en:'Application code must handle conflict resolution. Users may see stale data. Debugging production issues involving stale reads is significantly harder than in a strongly-consistent system.',vi:'Code ứng dụng phải xử lý giải quyết xung đột. Người dùng có thể thấy dữ liệu lỗi thời. Gỡ lỗi sự cố production liên quan đến đọc lỗi thời khó hơn đáng kể so với hệ thống nhất quán mạnh.'},
risk:{en:'The most dangerous mistake is applying eventual consistency to data that must be strongly consistent (financial balances, idempotency records, deduplication keys). Classify data explicitly: "is temporary staleness for this field safe?" Document the answer, and enforce the consistency model in infrastructure, not just application conventions.',vi:'Lỗi nguy hiểm nhất là áp dụng eventual consistency cho dữ liệu phải nhất quán mạnh (số dư tài chính, bản ghi idempotency, khóa loại trừ trùng lặp). Phân loại dữ liệu tường minh: "lỗi thời tạm thời cho trường này có an toàn không?" Ghi nhận câu trả lời, và thực thi mô hình nhất quán trong hạ tầng, không chỉ trong quy ước ứng dụng.'},
diagram:`sequenceDiagram
    participant Client1
    participant ReplicaA
    participant ReplicaB
    Client1->>ReplicaA: Write X=5
    ReplicaA-->>Client1: Ack (local)
    Note over ReplicaA,ReplicaB: Async replication in progress
    Client1->>ReplicaB: Read X
    ReplicaB-->>Client1: X=3 (stale, not yet converged)
    Note over ReplicaA,ReplicaB: Eventually: both replicas = 5`,
related_bigs:['amazon-aws','meta-facebook','cloudflare']},

{id:'saga-2pc',name:{en:'Saga Pattern vs 2-Phase Commit (2PC)',vi:'Saga Pattern vs Commit 2 Giai đoạn (2PC)'},category:'consistency',complexity:'Saga: O(n) messages; 2PC: O(n) messages + blocking',
origin:{en:'2PC: Jim Gray (1978). Saga: Hector Garcia-Molina & Kenneth Salem (1987). Both address distributed transactions but with fundamentally different failure semantics.',vi:'2PC: Jim Gray (1978). Saga: Hector Garcia-Molina & Kenneth Salem (1987). Cả hai giải quyết giao dịch phân tán nhưng với ngữ nghĩa lỗi cơ bản khác nhau.'},
what:{en:'2PC: A coordinator asks all participants to "prepare" (lock resources and guarantee they can commit), then sends "commit" or "abort". Provides ACID guarantees across distributed systems but blocks if the coordinator fails after prepare. Saga: Breaks a long-running transaction into a sequence of local transactions, each with a compensating transaction that can undo its effect if a later step fails. No distributed locks.',vi:'2PC: Một coordinator yêu cầu tất cả participant "chuẩn bị" (khóa tài nguyên và đảm bảo họ có thể commit), sau đó gửi "commit" hoặc "abort". Cung cấp đảm bảo ACID xuyên hệ thống phân tán nhưng bị chặn nếu coordinator lỗi sau khi chuẩn bị. Saga: Chia một giao dịch dài thành một chuỗi giao dịch cục bộ, mỗi cái với một giao dịch bù trừ có thể hoàn tác hiệu ứng của nó nếu một bước sau thất bại. Không có khóa phân tán.'},
when:{en:'2PC: When you need strict atomicity across a small number of services/databases that are tightly coupled and have low failure rates. Saga: Microservices architectures where long-running business processes span multiple services with independent databases — e.g. a loan disbursement that must debit the bank account, update the loan ledger, notify the borrower, and update credit bureau.',vi:'2PC: Khi bạn cần tính nguyên tử nghiêm ngặt xuyên một số lượng nhỏ service/database được kết hợp chặt chẽ và có tỷ lệ lỗi thấp. Saga: Kiến trúc microservices nơi các quy trình nghiệp vụ dài hạn trải dài nhiều service với database độc lập — vd: một khoản giải ngân phải ghi nợ tài khoản ngân hàng, cập nhật sổ cái khoản vay, thông báo người vay, và cập nhật cục tín dụng.'},
pros:{en:'2PC: Strong atomicity guarantee. Saga: No distributed locks, no coordinator single point of failure, services remain independent, handles long-running transactions that span minutes/hours.',vi:'2PC: Đảm bảo nguyên tử mạnh. Saga: Không có khóa phân tán, không có điểm lỗi đơn coordinator, các service vẫn độc lập, xử lý giao dịch dài hạn trải dài nhiều phút/giờ.'},
cons:{en:'2PC: Coordinator is a single point of failure; participants block until coordinator recovers. Saga: Eventually consistent (not immediately atomic); compensating transactions add complexity; must handle partial failures explicitly.',vi:'2PC: Coordinator là điểm lỗi đơn; participant bị chặn cho đến khi coordinator phục hồi. Saga: Eventually consistent (không ngay lập tức là nguyên tử); giao dịch bù trừ thêm độ phức tạp; phải xử lý lỗi một phần tường minh.'},
risk:{en:'For financial systems: Saga compensating transactions must themselves be idempotent and must not create "phantom" reversal records that confuse the audit trail. Every saga step must be logged before execution (write-ahead log pattern) so recovery can determine which steps completed. A failed saga without a compensating transaction leaves data in an inconsistent intermediate state — the most common Saga implementation bug.',vi:'Cho hệ thống tài chính: Giao dịch bù trừ Saga tự thân phải là idempotent và không được tạo ra các bản ghi đảo ngược "ảo" làm nhầm lẫn audit trail. Mỗi bước saga phải được ghi nhật ký trước khi thực thi (pattern write-ahead log) để phục hồi có thể xác định các bước nào đã hoàn thành. Một saga thất bại không có giao dịch bù trừ để lại dữ liệu trong trạng thái trung gian không nhất quán — lỗi triển khai Saga phổ biến nhất.'},
diagram:`flowchart LR
    subgraph Saga["Loan Disbursement Saga"]
      S1[Debit Bank Account]-->S2[Update Loan Ledger]
      S2-->S3[Notify Borrower]
      S3-->S4[Update Credit Bureau]
      S2-->|"Failure: compensate"|C1[Re-credit Bank Account]
    end`,
related_bigs:['fedwire-chips','visa-mastercard','rtgs-systems']},

{id:'idempotency',name:{en:'Idempotency',vi:'Tính Bất biến (Idempotency)'},category:'consistency',complexity:'O(1) key lookup for deduplication',
origin:{en:'Mathematical concept applied to distributed systems — an operation is idempotent if applying it multiple times has the same effect as applying it once. Critical in distributed systems where exactly-once delivery is impossible.',vi:'Khái niệm toán học áp dụng cho hệ thống phân tán — một thao tác là idempotent nếu áp dụng nó nhiều lần có cùng hiệu ứng như áp dụng nó một lần. Quan trọng trong hệ thống phân tán nơi phân phối exactly-once là không thể.'},
what:{en:'Design operations so that retrying them multiple times produces the same result as executing them once. Implementation: assign each request a unique idempotency key (client-generated or request-ID); the server stores the result of the first execution and returns it for any duplicate request with the same key.',vi:'Thiết kế các thao tác sao cho việc thử lại chúng nhiều lần tạo ra cùng kết quả như thực thi chúng một lần. Triển khai: gán mỗi request một khóa idempotency duy nhất (do client tạo hoặc request-ID); máy chủ lưu kết quả của lần thực thi đầu tiên và trả về kết quả đó cho bất kỳ request trùng lặp nào với cùng khóa.'},
when:{en:'Any financial mutation operation: payment processing, loan disbursement, balance adjustment, fee charging. Any operation where a network failure could result in the client not knowing whether the operation succeeded — and where retry without idempotency would cause a duplicate.',vi:'Bất kỳ thao tác biến đổi tài chính nào: xử lý thanh toán, giải ngân khoản vay, điều chỉnh số dư, tính phí. Bất kỳ thao tác nào mà lỗi mạng có thể khiến client không biết liệu thao tác có thành công hay không — và nơi thử lại mà không có idempotency sẽ gây ra bản sao.'},
pros:{en:'Makes distributed systems safe to retry — the client can always resend a failed request without fear of double-charging or double-processing.',vi:'Làm cho hệ thống phân tán an toàn để thử lại — client luôn có thể gửi lại request thất bại mà không lo lắng về việc tính phí kép hoặc xử lý kép.'},
cons:{en:'Requires storing idempotency keys and their results — adds storage overhead and a lookup on every request. Keys must expire eventually to avoid unbounded storage growth.',vi:'Yêu cầu lưu trữ khóa idempotency và kết quả của chúng — thêm chi phí lưu trữ và một lần tra cứu trên mọi request. Các khóa phải hết hạn cuối cùng để tránh tăng trưởng lưu trữ không giới hạn.'},
risk:{en:'A payment system without idempotency is not safe for production. The most common failure mode: a payment request is sent, network times out before the response, client retries — without idempotency this creates a duplicate charge. Stripe, Braintree, and every major payment processor exposes idempotency keys specifically because this is a safety requirement, not a nice-to-have. Every financial mutation endpoint in a debt management system must support idempotency keys.',vi:'Hệ thống thanh toán không có idempotency không an toàn cho production. Chế độ lỗi phổ biến nhất: request thanh toán được gửi, mạng timeout trước khi có phản hồi, client thử lại — không có idempotency điều này tạo ra khoản tính phí kép. Stripe, Braintree, và mọi bộ xử lý thanh toán lớn đều cung cấp khóa idempotency đặc biệt vì đây là yêu cầu an toàn, không phải tính năng tùy chọn. Mọi endpoint biến đổi tài chính trong hệ thống quản lý nợ phải hỗ trợ khóa idempotency.'},
diagram:`sequenceDiagram
    participant Client
    participant API
    participant DB
    Client->>API: POST /payments {idempotency_key: "pay_abc123"}
    API->>DB: Check key "pay_abc123"
    DB-->>API: Not found
    API->>DB: Execute payment + store result
    DB-->>API: Success
    API-->>Client: 200 OK {payment_id: "p_1"}
    Note over Client: Network failure, client retries
    Client->>API: POST /payments {idempotency_key: "pay_abc123"}
    API->>DB: Check key "pay_abc123"
    DB-->>API: Found! Return cached result
    API-->>Client: 200 OK {payment_id: "p_1"} (same result, no duplicate)`,
related_bigs:['visa-mastercard','swift','nasdaq-inet']},
