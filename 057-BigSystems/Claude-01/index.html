// ── Navigation Stack (Back button) ──────────────────────────────
const navStack = [];

function pushNav(type, id){
  // Truncate stack if navigating to an item already in history (avoids loops)
  const existingIdx = navStack.findIndex(e => e.type===type && e.id===id);
  if(existingIdx !== -1) navStack.splice(existingIdx);
  navStack.push({type, id});
}

function goBack(){
  if(navStack.length < 2) return;
  navStack.pop(); // discard current
  const prev = navStack.pop(); // take previous (open* will re-push it)
  if(prev.type==='bigs') openBIGS(prev.id);
  else if(prev.type==='pattern') openPattern(prev.id);
  else openBlock(prev.id);
}

function updateBackBtn(){
  const btn = document.getElementById('modal-back');
  if(!btn) return;
  if(navStack.length > 1){
    const prev = navStack[navStack.length - 2];
    let label = '&#8592; Back';
    if(prev.type==='bigs'){
      const b = BIGS.find(x=>x.id===prev.id);
      if(b) label = '&#8592; ' + t(b.name).substring(0,26) + (t(b.name).length>26?'&hellip;':'');
    } else if(prev.type==='pattern'){
      const p = PATTERNS.find(x=>x.id===prev.id);
      if(p) label = '&#8592; ' + t(p.name).substring(0,26) + (t(p.name).length>26?'&hellip;':'');
    }
    btn.innerHTML = label;
    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';
  }
}

function showModal(){
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  updateBackBtn();
  setTimeout(()=>{
    if(window.mermaid){
      try{
        mermaid.run({querySelector:'#modal .mermaid'});
        // After render, store original SVG dimensions for zoom
        setTimeout(()=>{
          document.querySelectorAll('#modal .diagram-inner').forEach(el=>{
            const svg = el.querySelector('svg');
            if(svg && !svg.getAttribute('data-orig-w')){
              svg.setAttribute('data-orig-w', svg.viewBox.baseVal.width || svg.getBoundingClientRect().width || 800);
            }
          });
        }, 300);
      }catch(e){}
    }
  }, 80);
}
function closeModal(e){
  if(e.target===document.getElementById('modal-overlay')) closeModalDirect();
}
function closeModalDirect(){
  navStack.length = 0;
  // Reset maximize state
  if(modalMaximized){
    document.getElementById('modal').classList.remove('maximized');
    document.getElementById('modal-overlay').classList.remove('maximized');
    const btn = document.getElementById('modal-maximize');
    if(btn){ btn.innerHTML='&#9974;&#65039;'; btn.title='Maximize'; }
    modalMaximized = false;
  }
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModalDirect(); });

// ═══════════════════════════════════════════════
// DIAGRAM HELPERS — zoom, fullscreen, toolbar
// ═══════════════════════════════════════════════
const diagZoom = {}; // id → current scale

function diagWrap(label, source, diagId){
  // Store source as data-src so fullscreen can re-render fresh
  const safeSource = source.replace(/`/g,"'");
  return `<div class="diagram-toolbar">
    <span class="dtb-label">${label}</span>
    <button class="dtb-btn" onclick="dZoom('${diagId}',-0.2)">&#8722;</button>
    <button class="dtb-btn" onclick="dZoom('${diagId}',0)">&#8635;</button>
    <button class="dtb-btn" onclick="dZoom('${diagId}',0.2)">&#43;</button>
    <button class="dtb-btn" onclick="dFullscreen('${diagId}','${label}')" title="Fullscreen">&#9974;&#65039;</button>
  </div>
  <div class="diagram-wrap" id="wrap-${diagId}">
    <div class="diagram-inner" id="${diagId}" data-src="${safeSource.replace(/"/g,'&quot;')}">
      <div class="mermaid">${source}</div>
    </div>
  </div>`;
}

function dZoom(diagId, delta){
  const el = document.getElementById(diagId);
  if(!el) return;
  const svg = el.querySelector('svg');
  if(!svg) return;
  if(delta === 0){
    diagZoom[diagId] = 1;
  } else {
    diagZoom[diagId] = Math.min(4, Math.max(0.2, (diagZoom[diagId]||1) + delta));
  }
  const s = diagZoom[diagId];
  svg.style.width  = (svg.getAttribute('data-orig-w') || svg.viewBox.baseVal.width  || 800) * s + 'px';
  svg.style.height = 'auto';
}

function dFullscreen(diagId, label){
  const el = document.getElementById(diagId);
  if(!el) return;

  const overlay = document.getElementById('diag-fs-overlay');
  const fsBody  = document.getElementById('diag-fs-body');
  const fsTitle = document.getElementById('diag-fs-title');
  const scratch = document.getElementById('diag-scratch');

  if(!overlay || !fsBody || !fsTitle || !scratch) return;

  // Get mermaid source
  let src = (el.getAttribute('data-src') || '').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
  if(!src){
    const mDiv = el.querySelector('.mermaid');
    if(!mDiv) return;
    src = mDiv.textContent;
  }

  // Prepare overlay
  fsBody.innerHTML = '<div style="padding:40px;font-size:14px;color:var(--text2)">Rendering\u2026</div>';
  fsTitle.textContent = label.replace(/[<>]/g,'').replace(/&#?\w+;/g,'').replace(/\s+/g,' ').trim() || 'Diagram';
  window._diagFsScale = 1;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Re-init mermaid with current theme so render picks it up
  reinitMermaid();

  // Render into the MOUNTED scratch element — this is required for
  // Mermaid v10 to correctly scope <marker> IDs and keep <defs> intact
  scratch.innerHTML = '';
  const renderId = 'mrender' + Date.now();

  mermaid.render(renderId, src, scratch).then(function(result){
    if(!result || !result.svg){
      fsBody.innerHTML = '<pre style="color:var(--accent4);padding:20px">No SVG returned</pre>';
      return;
    }

    // Parse as SVG/XML to preserve namespace (crucial for <defs>/<marker>)
    const parser = new DOMParser();
    const svgDoc = parser.parseFromString(result.svg, 'image/svg+xml');
    const svgEl  = svgDoc.documentElement;

    if(svgEl.nodeName === 'parsererror'){
      fsBody.innerHTML = '<pre style="color:var(--accent4);padding:20px">SVG parse error</pre>';
      return;
    }

    svgEl.removeAttribute('width');
    svgEl.removeAttribute('height');
    svgEl.style.cssText = '';
    svgEl.style.maxWidth  = 'none';
    svgEl.style.display   = 'block';
    svgEl.id = 'diag-fs-svg';

    // Theme background
    const isLight = document.body.classList.contains('light-mode');
    svgEl.style.background = isLight ? '#f8f9fc' : '#0f1117';

    // importNode into document (preserves SVG namespace + all defs)
    const live = document.importNode(svgEl, true);
    fsBody.innerHTML = '';
    fsBody.appendChild(live);

    // Clean scratch
    scratch.innerHTML = '';
    window._diagFsScale = 1;

  }).catch(function(err){
    scratch.innerHTML = '';
    fsBody.innerHTML = '<pre style="color:var(--accent4);padding:20px;font-size:12px">Error: ' + err + '</pre>';
  });
}

function closeDiagFs(){
  const overlay = document.getElementById('diag-fs-overlay');
  const fsBody  = document.getElementById('diag-fs-body');
  const scratch = document.getElementById('diag-scratch');
  if(overlay) overlay.classList.remove('open');
  if(fsBody){ fsBody.innerHTML = ''; fsBody.style.minWidth=''; fsBody.style.minHeight=''; }
  if(scratch) scratch.innerHTML = '';
  document.body.style.overflow = '';
}

function diagFsZoom(delta){
  const svg = document.getElementById('diag-fs-svg');
  if(!svg) return;
  if(delta === 0){
    window._diagFsScale = 1;
  } else {
    window._diagFsScale = Math.min(5, Math.max(0.2, (window._diagFsScale||1) + delta));
  }
  const s = window._diagFsScale;
  svg.style.transform = 'scale(' + s + ')';
  svg.style.transformOrigin = 'top left';
  // Update wrapper so scrollbars appear correctly when zoomed
  const body = document.getElementById('diag-fs-body');
  if(body){
    const rect = svg.getBoundingClientRect();
    body.style.minWidth  = (rect.width  / s * s) + 'px';
    body.style.minHeight = (rect.height / s * s) + 'px';
  }
}

// Mouse wheel zoom in diagram fullscreen
document.addEventListener('wheel', function(e){
  if(!document.getElementById('diag-fs-overlay').classList.contains('open')) return;
  e.preventDefault();
  diagFsZoom(e.deltaY < 0 ? 0.15 : -0.15);
}, {passive:false});

// Close diagram fullscreen on Escape (before modal Escape)
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && document.getElementById('diag-fs-overlay').classList.contains('open')){
    e.stopImmediatePropagation();
    closeDiagFs();
  }
});

// MODAL MAXIMIZE
// ═══════════════════════════════════════════════
let modalMaximized = false;
function toggleModalMaximize(){
  const modal   = document.getElementById('modal');
  const overlay = document.getElementById('modal-overlay');
  const btn     = document.getElementById('modal-maximize');
  modalMaximized = !modalMaximized;
  modal.classList.toggle('maximized', modalMaximized);
  overlay.classList.toggle('maximized', modalMaximized);
  btn.innerHTML = modalMaximized ? '&#10696;' : '&#9974;&#65039;';
  btn.title     = modalMaximized ? 'Restore' : 'Maximize';
}

  const isLight = document.body.classList.contains('light-mode');
  if(!window.mermaid) return;
  mermaid.initialize({
    startOnLoad: false,
    theme: isLight ? 'default' : 'dark',
    themeVariables: isLight ? {
      primaryColor:'#e8ecf5',
      primaryTextColor:'#1a2040',
      primaryBorderColor:'#4a5580',
      lineColor:'#5b8af0',
      secondaryColor:'#f4f6fb',
      tertiaryColor:'#edf0f8',
      edgeLabelBackground:'#f4f6fb',
      clusterBkg:'#edf0f8',
      titleColor:'#1a2040',
      actorBorder:'#4a5580',
      actorBkg:'#e8ecf5',
      actorTextColor:'#1a2040',
      actorLineColor:'#4a5580',
      signalColor:'#1a2040',
      signalTextColor:'#1a2040',
      labelBoxBkgColor:'#e8ecf5',
      labelBoxBorderColor:'#4a5580',
      labelTextColor:'#1a2040',
      loopTextColor:'#1a2040',
      noteBorderColor:'#4a5580',
      noteBkgColor:'#f4f6fb',
      noteTextColor:'#1a2040'
    } : {
      primaryColor:'#1e2334',
      primaryTextColor:'#d0d8f0',
      primaryBorderColor:'#2a3050',
      lineColor:'#5b8af0',
      secondaryColor:'#181c26',
      tertiaryColor:'#0f1117',
      edgeLabelBackground:'#181c26',
      clusterBkg:'#1e2334',
      titleColor:'#d0d8f0',
      actorBorder:'#2a3050',
      actorBkg:'#1e2334',
      actorTextColor:'#d0d8f0',
      actorLineColor:'#5b8af0',
      signalColor:'#d0d8f0',
      signalTextColor:'#d0d8f0',
      labelBoxBkgColor:'#1e2334',
      labelBoxBorderColor:'#2a3050',
      labelTextColor:'#d0d8f0',
      loopTextColor:'#d0d8f0',
      noteBorderColor:'#2a3050',
      noteBkgColor:'#181c26',
      noteTextColor:'#d0d8f0'
    },
    securityLevel:'loose'
  });
}

(function init(){
  reinitMermaid();
  renderFilters();
  renderAll();
})();
